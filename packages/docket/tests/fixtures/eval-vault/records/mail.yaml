- rid: mail:<orbex-1@orbex.example>
  container: mail:orbex-terms
  ts: "2026-10-02T11:00:00Z"
  author: Orbex Distribution <trade@orbex.example>
  title: Distribution terms for the autumn titles
  text: |-
    Dear Ada,

    Following our talk, here are our terms for the autumn titles. We take a discount of 35 percent of the cover price, and pay sixty days after the end of the month of sale.

    Unsold copies can come back to you for six months after publication. We collect your share from your storeroom the week the stock arrives.

    We are glad to split the fair stand with you, half each.

    Best regards,
    Trade team, Orbex Distribution

