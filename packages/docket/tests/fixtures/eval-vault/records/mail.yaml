- rid: mail:<quote-1@szelmalom.example>
  container: mail:szelmalom-quote
  ts: "2026-09-10T09:15:00Z"
  author: Szélmalom Nyomda <ajanlat@szelmalom.example>
  title: "Árajánlat: A sóút, 3000 példány"
  text: |-
    Kedves Ada!

    Köszönjük a megkeresést. A sóút keménytáblás kiadására, 3000 példányra az ajánlatunk 2 100 000 Ft, amely tartalmazza a védőborítót és a kiszállítást a raktárukba.

    Belívnek 90 grammos, krémszínű ofszetpapírt javaslunk. A cérnafűzött kötés a ragasztotthoz képest 15 százalékkal drágább, de jóval tartósabb.

    A gyártási idő a végleges fájlok beérkezésétől számítva nagyjából három hét.

    Üdvözlettel:
    Szélmalom Nyomda, ajánlati osztály

- rid: mail:<quote-2@kestrel.example>
