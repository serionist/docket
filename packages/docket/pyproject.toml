[project]
name = "docket"
version = "0.0.0"
description = "A personal memory and task manager that Claude works in: raw and processed, in your own git repo, local first."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Soma Osvay" }]
dependencies = [
  "fastapi>=0.142.4",
  "filelock>=4.0.7",
  "jinja2>=3.1.6",
  "keyring>=25.7.0",
  # The SDK's API moved between 2.0 and 2.3; a new version comes in by its own reviewed bump.
  "mcp==2.3.0",
  "platformdirs>=4.12.2",
  "pydantic>=2.13.5",
  "PyYAML>=6.0.3",
  "snowballstemmer>=3.1.1",
  "typer>=0.27.2",
  "tzdata>=2026.4",
  "tzlocal>=5.4.4",
  "uvicorn>=0.54.0",
]

[project.scripts]
docket = "docket.entry:main"

[project.urls]
Repository = "https://github.com/serionist/docket"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
