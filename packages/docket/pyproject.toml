[project]
name = "docket"
version = "0.0.0"
description = "A personal memory and task manager that Claude works in: raw and processed, in your own git repo, local first."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Soma Osvay" }]
dependencies = [
  # Cutting a recording's audio (DR-0559): FFmpeg through PyAV's wheels, in a child with limits, where media runs. A new
  # version comes in by its own reviewed bump. The wheels bundle libx264 and libx265 (GPL): fine for a dependency
  # installed from PyPI, not for an installer that ships it.
  "av==18.1.0; (sys_platform == 'win32' and platform_machine == 'AMD64') or sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
  # Documents' text (DR-0484): XML parts through defusedxml, workbooks through openpyxl, which uses defusedxml once
  # it is installed, and pdfs through pypdf, its crypto extra for AES; all read in a child with limits (DR-0485).
  "defusedxml>=0.7.1",
  "fastapi>=0.143.0",
  "filelock>=4.0.7",
  "jinja2>=3.1.6",
  "keyring>=25.7.0",
  # The SDK's API moved between 2.0 and 2.3; a new version comes in by its own reviewed bump.
  "mcp==2.3.0",
  "openpyxl>=3.1.5",
  "platformdirs>=4.12.2",
  "pydantic>=2.13.5",
  "pypdf[crypto]>=6.19.0",
  # Media's encryption (DR-0549): age, one key per file, through the Rust implementation; a new version comes in by its
  # own reviewed bump. Only where it ships wheels, as sqlite-vec: elsewhere media is off and says so.
  "pyrage==1.4.0; (sys_platform == 'win32' and platform_machine == 'AMD64') or sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
  "PyYAML>=6.0.3",
  # The OS prompt on macOS (DR-0573): LocalAuthentication through libobjc, pure Python with no dependencies of its own.
  # A new version comes in by its own reviewed bump.
  "rubicon-objc==0.5.7; sys_platform == 'darwin'",
  "snowballstemmer>=3.1.1",
  # The vector stage's distance (DR-0337), only where it ships wheels: none for Windows on Arm or musl, and no sdist.
  "sqlite-vec>=0.1.9; (sys_platform == 'win32' and platform_machine == 'AMD64') or sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
  "typer>=0.27.2",
  "tzdata>=2026.4",
  "tzlocal>=5.4.4",
  "uvicorn>=0.54.0",
]

[project.scripts]
docket = "docket.entry:main"

[project.urls]
Repository = "https://github.com/serionist/docket"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
