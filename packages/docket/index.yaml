      - Temp files, staging's included, are written in the private folder's tmp/, never under raw/ or staging/.
    not_chosen:
      - "A -2 suffix: ambiguous with machine names that end in a number."
      - "Private files in an ignored folder of the vault: a host's git clean -x deletes them, and editors list them."
  - id: DR-0142
    title: A vault's git attributes are in its own .gitattributes, in both modes
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#34"]
    description: "Refines DR-0102's bind on the media lines, which stays as decided: a folder vault's LFS lines are in its own .gitattributes, not the host's. Git reads a nested .gitattributes for the paths below it, a deeper file wins over the host's root, and the file moves with the folder. Its first line, * !filter !diff !merge !working-tree-encoding, stops the host's rules at the vault; the lines after it set the vault's own: LF, merge=union for JSONL and for the hold lists, media in LFS."
    binds:
      - "The reset line stays first: appended last it would cancel the vault's own lines."
      - Init, convert and vault check read the resolved attributes with git check-attr and report a mismatch; only .git/info/attributes can override the vault's file.
      - Init writes nothing into the host's .gitattributes.
    not_chosen:
      - "The host's root .gitattributes: a line there goes stale when the folder moves, and it is a host path Docket would have to commit."
  - id: DR-0143
    title: In a host, Docket's commits skip the host's hooks and leave its locks alone
    status: superseded
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#34"]
