    cost: cheap
    sources: ["#59"]
    description: "The word check that orders titles' leads and the any-word stage (DR-0231, DR-0232) reads a text's words and its hyphenated compounds joined, in the index's own pass (DR-0280), each joined word at its parts' positions; a query word is held through its forms, its joined words' forms, or one of its splits as a phrase (DR-0281), and the check says which words a text holds only through a split. In the any-word stage, a chunk holding a query word only through a split goes after the chunks holding as many of the query's terms and above those holding fewer; in the all-words and prefix stages, after all the others, lifted ones included, each part keeping its order. A title's lead doesn't count a word it holds only through a split. In a probe of 40 rows saying editor and 3 saying edit or delete, the three ranked first without this. When the query has a split, the check runs on the all-words stage's candidates too. A split is scanned for only in a text holding a term of each half, from the terms the first-letter screen already computes, and any other text costs one set test: on 200 candidates of 350 words, six query words each with a split took 129 ms, against 556 ms scanning every text. So the title \"Orbex kick-off with Dana\" holds every word of orbex kickoff dana, orbex kick-off dana and orbex kick off dana. A test holds the check to FTS5: on the compound test vault and a sample of the perf index, the chunks it says hold every word are exactly the all-words stage's. Snippets are cut from the chunk's text as written; a hit's snippet starts at a query word, or at two words in a row that are a hyphenated pair joining into one or one of its admitted splits. The Search page, which can't see the vocabulary, marks both words of a hyphenated pair whose joined form is a query word, and of a spaced one when its halves have three and two letters."
    binds: [The index and the word check read a text's compounds through one function.]
    not_chosen:
      - "The word check as it was: the title Orbex kick-off with Dana would not lift orbex kickoff dana."
      - "Marking whole words only: kick off and kick-off go unmarked for kickoff."
      - "A split's match ranked like the word's: three edit or delete rows ranked above 40 editor rows."
      - "Scanning every candidate for every split: 556 ms on 200 candidates for six splits."
      - "A snippet or mark at any two words joining into a query word: a snippet for were starts at we're."
      - "Every chunk holding a word only through a split after every other in the any-word stage: a chunk holding two of three words fell below every chunk holding one."
  - id: DR-0290
    title: "Questions for docket eval are a YAML file of schema 1: each question's words, the locators a good answer cites, its kind and its language"
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#66"]
    description: "A question file holds schema_version (1), asked (when the questions were asked: a date, or a time with its offset; search's now, so time words read the same on every run) and questions, each with q (the words search gets, as typed), want (one or more locators a good answer cites), kind (exact-name, paraphrase, inflection, typo or time-bound), lang (the question's language code, such as en or hu), and optionally its own asked and a note. A wanted locator is r:<rid> with an optional time, stretch or paragraphs in the anchor grammar (DR-0198); a doc id with an optional #L<line> or #L<first>-<last>; or thread:<rid> for a thread or a recording with everything grouped under it. The file is read with YAML's base loader, so every value is text; an unknown key, a missing field, another schema or a locator that doesn't parse is refused, naming the question's number. Users keep their own files outside the Docket repo and run them with docket eval, so the format is a one-way door."
    binds:
      - A later schema reads every earlier version.
      - The invented question set in the repo is written in this format.
    not_chosen:
      - "JSON: users write these files by hand, and want comments."
      - "Unknown keys ignored: a mistyped want would score its question zero, unseen."
      - "Bare rids, as read takes them: a record, a doc and a thread would read alike."
      - "Any kind name: a mistyped kind would make a row of its own."
      - "The run's time when asked is missing: last week would move every week."
  - id: DR-0291
    title: A hit answers a wanted locator when it is on the same record, doc or thread with positions that overlap, or holds or cites it
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#66"]
    description: A hit's locators are its own and those collapsed under it, all at its rank; rids compare exactly, so rec-0100 never answers for rec-0100-second. A hit answers r:<rid> when it is on that record; a time, a stretch or paragraphs of it when it is the whole record or its window or part overlaps them, ends included, a moment being a stretch of no length; a doc when it is one of its sections, and the doc's lines when the section's lines overlap them; thread:<rid> when its group is that one. A thread window also answers each message it holds, read from the index's chunks, and a doc's section each raw stretch its lines' anchors point into, since verify takes the reader from that line to the raw.
    binds: ["A change to what answers moves every user's numbers, so the changelog says so."]
    not_chosen:
      - "Containment only: windows share one utterance, so a cited stretch that crosses a window's end would match no window."
      - "Hits on the record itself only: a question would miss whenever its minutes outrank its raw, though verify reaches the raw from the minutes' line."
      - "A prefix match on locators: rec-0100 would answer for rec-0100-second."
  - id: DR-0292
    title: docket eval scores recall at k as the share of a question's wanted locators found, and MRR from the first hit that answers any
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#66"]
    description: Each question runs through search with k (10 by default, 1 to 100) and its asked as now. Its recall at k is the share of its wanted locators a hit answers; its reciprocal rank is one over the rank of the first hit that answers any of them, else 0. A kind's, a language's and the whole set's numbers are the means over their questions, each weighing the same. A question whose search is refused scores 0 and is listed with the reason; a wanted locator naming no record, doc or thread in the index counts as missed and is listed.
    not_chosen:
      - "A question found when any wanted locator is: an answer of two facts that finds one would score as whole."
      - "Means over wanted locators: a question with five would weigh five times one with one."
  - id: DR-0293
    title: docket eval reads the index as it is, writes nothing, and prints a table per kind and per language, the misses, or JSON
