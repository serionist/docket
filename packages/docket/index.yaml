    not_chosen: ["A merge driver or hook in the host: Docket doesn't run the user's merges."]
  - id: DR-0146
    title: Setup checks the host before a folder vault goes there
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#34"]
    description: Init and the convert check every fetch and push URL from git remote get-url (insteadOf and pushInsteadOf expanded). An SSH URL is probed as https on the same host, with an anonymous ls-remote run outside any repo and with the user's git config shut out. A public remote refuses folder mode; one that can't be checked needs the user's word that it is private. Other committers in HEAD's last 1000 commits make a warning and a repo of its own the default. A host ignore rule that hides a vault path refuses folder mode, and git-lfs's filter and pre-push hook are set up in the host after the user's yes.
    binds: ["Under --yes, folder mode in a host that looks shared needs --allow-shared."]
    not_chosen:
      - Trusting SSH remotes as private.
      - Probing with the user's config, which can rewrite the URL or add credentials.
      - Only a warning under --yes for a shared host.
  - id: DR-0147
    title: A vault becomes a folder by rewriting its history under its path and one host merge
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#34"]
    description: docket vault convert fetches the vault's branch into the host, rewrites it under the vault's path with one git fast-import (each tree the original at the vault's path, author, committer, dates and message kept), ends it with an ordinary commit that makes the vault a folder, and merges that into the host's branch in one commit that adds nothing of its own, so a pull --rebase keeps everything. The vault's own .git moves to Docket's private folder as the backup. A dry run comes first and nothing changes before the user's yes; each step is recorded before it runs, so a second run finishes what a crash stopped, and --abort undoes a convert stopped before the host merge.
    binds:
      - "A vault with any remote is refused: another machine's clone of it would be overwritten by that machine's next pull of the host."
      - "The host merge is made the way git commit makes one: under the host's index.lock, the index written with the vault's entries before the lock is renamed over it."
      - "Every Doc: line and rev keeps its commit, under the vault's new path (DR-0112)."
