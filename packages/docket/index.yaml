  - id: DR-0140
    title: "vault.yaml says where git keeps the vault: a folder of the repo around it, or a repo of its own"
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#34"]
    description: "vault.yaml has storage: folder or repo; no key means repo, the only kind there was before, so schema_version stays 1. Docket checks the disk agrees before it writes: a repo of its own has its own .git, a folder vault has none and sits strictly inside a host repo. A folder vault is found only by Docket's own vault.yaml, never by another tool's."
    binds:
      - "Open refuses storage: folder with a .git of its own, storage: repo without one, a folder vault inside another vault, and a folder vault reached through a linked worktree of its host."
      - Open first looks for a convert that stopped part way and points at `docket vault convert` and --abort.
      - In a repo of its own git runs with GIT_CEILING_DIRECTORIES at the vault's parent, so a vault whose .git went missing never commits into a repo above it.
    not_chosen:
      - "Detecting it from the disk alone: a copied vault, or one whose .git went missing, would commit into whatever repo holds it."
  - id: DR-0141
    title: The vault's layout and run-file names are fixed, and Docket's own files live in the git dir
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#34"]
    supersedes: [DR-0019]
    description: Restates DR-0019 and adds where Docket's private files live in each mode. A vault holds vault.yaml, raw/, media/, processed/, entities/, ledger/ops/ and state/; staging/ and index/ are never committed. A raw run file is raw/<source>/<yyyy>/<mm>/<yyyy-mm-dd>T<hhmm>-<machine>.jsonl in UTC, and a second run in the same minute gets .2, .3 before .jsonl. A machine name is lowercase letters, digits and inner hyphens and never ends in -<digits>. Docket's lock, machine file, temp files and markers are in .git/docket/ (the lock .git/docket.lock) for a repo of its own, and in <host git dir>/docket/<vault path>/ for a folder vault, so nothing of Docket's shows in the user's tree. A folder vault also has its own .ignore (/*, !/processed/), so search tools see its processed docs and nothing else in it. This refines DR-0024's temp-file bind for both modes; DR-0024 stays as decided.
    binds:
