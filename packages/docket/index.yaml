      - "A column of joined words: one more per language, weighed apart from the words by BM25."
      - "Only a run's whole: email would miss e-mail-cím. Every stretch of any run: a UUID adds ten words."
  - id: DR-0281
    title: "Spaced compounds are found at query time: a word also as two words in a row, and two words in a row also as one"
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#59", "#97"]
    description: "Whether two words make a compound depends on the whole vault, so search reads it from the index's vocabulary at query time. A query word also matches two words in a row, split where the first half has three letters or more and the second two, each half holds a letter, both halves are words the index holds (as written or through a stem), and not both are in half the chunks or more; the split matches as a phrase in every column, as a quoted phrase does. Two query words in a row each also match their joined word, so the all-words stage reads (kick AND off) OR kickoff and the stages and term counts of DR-0231 and DR-0232 don't change; a joined word in half the chunks or more is left out, as a split of two such words is. A hyphenated query word stays its parts, each also matching the joined stretches it is in, as the index joins them (DR-0280). Only forms the index holds enter the expression (DR-0230); a word stays in the query however its other spellings fare, and only a split or a joined word can be left out. A word no form of which the index holds is in no chunk (DR-0230) unless a chunk says one of its splits, one lookup each: both halves being words doesn't make the phrase one. The halves' lengths keep contractions, function words and times out (we're for were, in to for into, 1000 for 10:00) and keep up, in and on as second halves (follow up, log in); a letter in each half keeps numbers whole (12345 would meet 123.45). Two halves in most chunks would cost BM25 a pass over most chunks (187 ms against 47 ms on the perf test's 100,000 chunks), and such pairs are function words (may be, can not). A joined word in most chunks costs the same pass for no weight, and BM25 put the chunks saying only it after those holding the pair's words: two words joining into a word in 99.6% of the perf test's chunks took 219 ms with it and 75 ms without on the maintainer's desktop, and 1,015 ms with it on CI's Windows runner. A split can still find another word (edit or delete for editor); DR-0282 ranks such chunks after the word itself."
    binds:
      - Whether two words make a compound is read from the index when someone searches, never written into chunks.
      - "A word is never left out of a query for its splits or its joined words: only they are."
    not_chosen:
      - "Every pair of words in a row indexed joined: the perf index 69% larger and its rebuild nine times slower; real prose holds 9.8 distinct pairs per word of its vocabulary."
      - "Pairs whose joined form is a word elsewhere, or whose hyphenated form is somewhere, indexed joined: a rebuild reads the vault twice, and an update that meets a new follow-up re-indexes every older chunk saying follow up to stay equal to a rebuild; in real prose the first are mostly a string, a list, may be."
      - "Halves of two letters and two: we're finds were, we'll finds well."
      - "Halves of three letters and three: follow up and set up are lost."
      - "A hyphenated query word as a phrase of its parts: it changes what kick-off finds today and how many terms a title's lead is judged by."
      - "Numbers split like words: 12345 would meet 123.45."
      - "The joined word however common: two words joining into a word in 99.6% of the chunks scored every chunk saying it, for no weight, and took 1,015 ms on CI's Windows runner."
