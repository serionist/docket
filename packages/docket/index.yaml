  - id: DR-0150
    title: The service's phase 0 MCP tools are search, read, verify and doc_put, with fixed parameters
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#8"]
    description: "Served at /mcp: search(query, people, entities, sources, since, until, k), read(locator, view, around, rev), verify(doc, lines, window) and doc_put(text). people, entities and sources are lists of text; since and until are text, a date (the owner's whole day) or a time, with its offset or else in the owner's time zone; k is 1 to 100, 20 by default; view is summary, raw or both; around is 0 or more; rev and lines are optional; window is seconds, 60 by default. Each returns the result model of #6 or #7 as structured content beside a compact text. packages/docket/tests/fixtures/mcp-tools.json holds the names, parameters and annotations, and a test fails on any change to them."
    binds:
      - Parameters only gain optional ones whose default keeps today's behaviour, and enums only gain values; nothing is renamed, retyped or removed without a superseding decision.
      - "Results only gain fields: ReadResult, VerifyResult, PutResult and SearchResult keep every field they have."
    not_chosen:
      - "Names of our own, such as docket_search: Claude Code already prefixes a server's tools with its name."
      - "since and until as JSON dates: a date alone isn't a date-time, and a union of the two is ambiguous."
  - id: DR-0151
    title: One service per user on 127.0.0.1 serves /mcp, /api and the pages on one port
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#8"]
    description: The service binds 127.0.0.1 only, with no option for another address, on --port, else service.port in the user's config, else 8741, and never moves to another port, since clients' configs name it. serve binds the socket itself and builds its allowed hosts from the port it got; on Windows the socket is exclusive. MCP is the SDK's streamable HTTP at exactly /mcp, stateless, with JSON responses. The REST API under /api is Docket's own (the CLI, the plugin's hooks, the pages) and not a door until the first release. A lock in the state folder keeps one service per user, and service.json records its pid and port.
    not_chosen:
