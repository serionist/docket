# What binds `packages/docket`: reading list, decisions, conventions. Entries change only through `uv run docs`;
# docs/docs-regime.md explains the schema.

reading:
  - { path: docs/design.md, role: design, note: "the data layer section: the vault, raw records, processed docs, the index" }
  - { path: packages/docket/src/docket/vault/records.py, role: contract, note: "the raw record and its version: a one-way door" }
  - { path: packages/docket/src/docket/vault/staging.py, role: contract, note: "staging's format, a one-way door: one file per staged version, its two states, the hand-decision memory" }
  - { path: packages/docket/src/docket/vault/anchors.py, role: contract, note: "the anchor grammar and how lines and paragraphs are counted: a one-way door" }
  - { path: packages/docket/src/docket/vault/segments.py, role: contract, note: "a transcript's segments in time order and the time range an anchor resolves in: a one-way door" }
  - { path: packages/docket/src/docket/vault/entities.py, role: contract, note: "the entity file format: a one-way door" }
  - { path: packages/docket/src/docket/vault/legacy.py, role: contract, note: "how an old path finds its legacy note: a one-way door" }
  - { path: packages/docket/src/docket/sources/contract.py, role: contract, note: "the mapper interface, contract 1, and the core's checks on what a mapper returns: a one-way door" }
  - { path: packages/docket/src/docket/vault/holds.py, role: contract, note: "hold lists, a one-way door: the file, how it reads and fails closed, what a hold covers" }
  - { path: packages/docket/src/docket/service/tools.py, role: contract, note: "the MCP tools' names and parameters, a one-way door (DR-0150)" }
  - { path: packages/docket/src/docket/service/security.py, role: contract, note: "what every request passes before a route: hosts, origins, the token and the session (DR-0152)" }
  - { path: packages/docket/src/docket/web/state.py, role: contract, note: "the Search page's URL: the search tool's parameters and the panel's, in one canonical form" }
  - { path: packages/docket/src/docket/web/templates/macros.html, role: guide, note: "the web app's components, one macro each, for every page to reuse" }
  - { path: packages/docket/src/docket/vault/releaselog.py, role: contract, note: "the release log, a one-way door: the file, its lines, how several fold into one and how it fails closed" }
decisions:
  - id: DR-0019
    title: The vault's layout and run-file names are fixed
    status: superseded
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#4"]
    superseded_by: [DR-0141]
    description: A vault holds vault.yaml, raw/, media/, processed/, entities/, ledger/ops/ and state/; staging/ and index/ are never committed. A raw run file is raw/<source>/<yyyy>/<mm>/<yyyy-mm-dd>T<hhmm>-<machine>.jsonl in UTC, and a second run in the same minute gets .2, .3 before .jsonl. A machine name is lowercase letters, digits and inner hyphens and never ends in -<digits>.
    binds:
      - Every record's run field is its run file's stem.
      - Temp files are written in .git/docket/tmp/, never under raw/.
    not_chosen: ["A -2 suffix: ambiguous with machine names that end in a number."]
  - id: DR-0020
    title: A raw record's version hashes an explicit allow-list of its fields, as Docket's own canonical JSON
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#4"]
    description: "v is sha256 of kind, container, thread, ts in whole UTC seconds, author, to, title, text, the attachments (name, kind, ref) sorted, and a transcript's segments (start_ms, end_ms, speaker, text) in their order, with empty and absent values left out, written as JSON by Docket's own function (sorted keys, no spaces, UTF-8). A new optional field, a library upgrade, attachment order or the milliseconds of ts never change a version; a golden test pins the hash. The projection is the same for every source: no source or mapper can register its own (DR-0108); records.register_projection goes with #10."
    binds: [Changing the projection or the JSON writer needs a migration of every vault.]
    not_chosen:
      - "Hashing every field except a few: any new field would change every version."
      - "A library's JSON dump: an upgrade could change every version."
  - id: DR-0021
    title: vault.yaml is a typed schema that refuses unknown keys, versioned from 1
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#4"]
    description: vault.yaml holds schema_version, the owner (name, emails, languages, an IANA time zone), the primary machine, the sources with their sensitivity (work, mixed, private), the never-store lists and the redaction rules. An unknown key is refused, because a mistyped never_store would otherwise store what the user listed never to store.
    binds: [A later schema reads every earlier version and migrates it.]
  - id: DR-0022
    title: Committing to the vault is local; syncing with a remote is a separate step
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#4"]
    description: A commit never touches the network, so an empty, offline or conflicting remote can never lose or block a raw run. sync fetches and rebases with autostash when the remote branch exists, and on a conflict aborts and keeps the local commits.
  - id: DR-0023
    title: The command line is Typer
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#4"]
    description: Typed options and generated help suit the many commands to come. Typer 0.27 carries its own copy of click and brings rich, shellingham, colorama and annotated-doc, all under permissive licences.
    not_chosen: ["argparse: hand-written help and parsing for every command."]
  - id: DR-0024
    title: Staging holds one file per staged version, pending or ready, and a hash-only memory of hand decisions
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: ["#5"]
    description: staging/<source>/<key>.json holds one staged version of a record; the key is the first 32 hex characters of sha256 of the rid, a newline and v, taken over the record as redacted at intake. The file holds schema_version 1, state (pending waits for a classification, ready goes to raw at the next promotion), staged_at, classified_by (user, claude, or null when the source's rule made it ready), cuts, problem (why a promotion held it back) and the record. staging/_decided.jsonl holds a line of hashes (the rid's and the key) for every version classified private or promoted with cuts, so a re-pull isn't asked again. Staging holds the only copy of a waiting record, so a later Docket reads every earlier schema_version or migrates it.
    binds:
      - Every staging file is written through a temp file in .git/docket/tmp/ and a rename.
      - _decided.jsonl never holds content; a never-store or private-source drop writes no line.
    not_chosen:
      - "A folder per state: a classification becomes a write and a delete, and a crash leaves two copies."
      - "File names from the rid: colons and slashes aren't valid on Windows."
      - "A dropped state kept in staging: a trace of what was dropped."
      - "No memory: each lookback re-asks every recording, and a cut work record comes back uncut."
  - id: DR-0025
    title: The gate drops at intake in memory, redacts at intake, and cuts then redacts again at promotion
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#5"]
    description: "Intake refuses a whole batch that has an unknown or disabled source, drops private-source and never-store records in memory before anything is written, redacts the rest, skips a version already in raw, already staged or in _decided.jsonl, and stages work as ready and mixed as pending. A record decided by hand (its rid in _decided.jsonl, a [cut] in its raw version, or another staged version holding cuts) waits as pending whatever its source. Every call re-reads vault.yaml, refuses to run while it doesn't load, and sweeps staging against it: drops what it now forbids, deletes keys in _decided.jsonl, and sends back to pending a ready record nobody classified when its source became mixed or it was decided by hand. Promotion cuts the staged text, redacts with the current rules, writes one run per source and commits before it deletes the staged files."
    binds:
      - Only the gate calls write_run inside the docket package; a test scans for it.
      - Logs and errors never name a dropped record; only counts leave the gate.
    not_chosen:
      - "Stage everything and drop later: a crash in between leaves the file."
      - "Redact only at promotion: staging, temp files and Claude would hold credentials."
      - "Redact then cut: a rule added after the classification shifts the cut's offsets."
      - "Re-read vault.yaml only when its modification time changes: misses fast edits."
  - id: DR-0026
    title: "Never-store lists match failing closed: folded, wherever a record names someone or says something"
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#5"]
    description: "Matching fails closed: too broad drops a work record, too narrow stores a private one. people match, case-folded, the author, any to, a transcript segment's speaker, or any string in native, and an address inside Name <addr> on either side matches by itself; containers match container or thread, case-folded, with or without the <source>: prefix. keywords match whole tokens in title, text, attachment names, a transcript's segments (speaker and text) and every string in native: case and accents are folded, curly apostrophes and typographic dashes read as plain ones, HTML entities as what they stand for, and every run of characters that aren't letters or digits is one space, so a hyphen in a keyword also matches a space (check-up drops check up). A keyword of two or more words also matches them split at a lower-to-upper case change and run together, so dora example matches dora-example, dora_example, DoraExample and doraexample; a one-word keyword never splits a word, so art never matches inside start and Max never inside maxRetries. A name behind an encoding is decoded and held to the same rule too: percent encoding, once or wrapped again as an Outlook Safe Link does (Dora%2520Example), behind HTML entities (Dora&#37;20Example), in Latin-1 (Kov%E1cs), and as %uXXXX or \\uXXXX escapes; every round's form counts, at most four rounds. Decoding can make a word out of what wasn't one (%ADMIN% reads as MIN); such a false drop is accepted, as matching fails closed. matches_text holds a plain string (a path, a slug, an id) to the same rule. A match drops the whole record, and the gate reports only which list matched, never the entry."
    not_chosen:
      - "Keywords in text and title only: a recording's transcript lives in its segments and in native."
      - "Keywords as substrings: art would drop every start."
      - "Containers with their prefix only: a bare id the user wrote would store what they listed."
  - id: DR-0027
    title: Redaction marks each match in place as [redacted:<rule>] and never keeps the secret
    status: superseded
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#5"]
    superseded_by: [DR-0190]
    description: "The built-in rules (password, api-key, private-key, phone) and the user's patterns run over text, title, attachment names and refs, a transcript's segments, and every key and value in native. A segment's speaker is redacted on its own; the segments' texts are redacted joined by line breaks, so a label at the end of one utterance and its value at the start of the next still match, and a match that runs over a boundary turns each segment it touches into its marker whole. A label counts quoted, inside an identifier in any case style (DB_PASSWORD, client-secret, clientSecret, refresh_token), wrapped in emphasis or table marks (*Password:*, | Password: |), or with line breaks, HTML tags (long ones and ones wrapped over lines too) and entities before its value; an unquoted value needs a letter or a digit, and the filler is read possessively so a long run can't make matching slow. A native key that is a label has its value redacted whole. A phone number needs a + or a phone label, and a + number followed by a currency or a percent is an amount, not a phone number. Ids (rid, container, thread, author, to) are never redacted. A match becomes [redacted:<rule>]; text inside a marker is never matched again, so redacting twice is once; a run reports how many markers of each rule it holds. A user pattern replaces its match, or only its secret group."
    binds: [The raw record gains no field for redactions; the markers are the record of them.]
    not_chosen:
      - "A redactions field on the raw record: changes the model DR-0020 fixes."
      - "Any long run of digits as a phone number: it redacts amounts, tickets and timestamps."
      - "Each segment on its own: a label in one utterance and its value in the next would reach the raw log."
  - id: DR-0028
    title: Cuts are character or time ranges, applied by the core
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#5"]
    description: "A Cut is a start, an end and a unit, char or ms. Character cuts are offsets in the staged text and are made at promotion, before redaction; the cutter replaces each with [cut] and clears native, because a copy of the stretch there may be HTML or escaped. Time cuts apply to a transcript's segments field (DR-0108): the core drops every segment that overlaps the range, writes [cut] in its place, rebuilds the text and clears native; no source registers a cutter, and register_cutter goes with #10. Every cut leaves [cut] in text: that is how another machine knows the record was cut by hand."
    binds:
      - "A record with segments takes time cuts only: its text is rendered from them, so a character cut is refused at classify and at promotion."
    not_chosen:
      - "Cutting silently: joins two sentences nobody said together."
      - "Replacing the stretch in native: misses HTML or escaped copies."
  - id: DR-0109
    title: A processed doc is markdown with YAML frontmatter in one fixed form
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#6"]
    description: A processed doc is markdown with YAML frontmatter, readable in any editor. The frontmatter holds id (<type>:<slug>), type (recording-note, thread-summary, digest, minutes, brief, correction or legacy-note, the same as the id's prefix), rev, covers (the rids it summarizes, at least one except in a legacy note), by (<who>[, <run>]), supersedes and entities. A doc lives at processed/<type>/<yyyy>/<mm>/<slug>.md when its slug starts with a date, else processed/<type>/<slug>.md, so its path follows from its id. The frontmatter is read with YAML's base loader, so every value is text, and written by Docket's own renderer in that order, a value double-quoted when a standard YAML reader wouldn't give it back unchanged. Writing refuses unknown keys and types; reading keeps them with a warning, so an older machine still reads a newer machine's docs.
    binds:
      - A slug is lowercase letters, digits and inner hyphens, at most 80 characters, never a Windows device name.
      - "There is no schema field yet: absent means 1, and a breaking change writes schema: 2."
    not_chosen:
      - "Short id prefixes per type (note:): a mapping to keep forever."
      - "YAML's safe loader: no becomes false and 2026 a number."
      - "Strict reads: an older machine couldn't rebuild from a newer machine's docs."
  - id: DR-0110
    title: Every content line of a doc ends with anchors in one grammar
    status: superseded
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#6"]
    superseded_by: [DR-0198]
    description: "Every content line of a doc ends with its anchors: @mm:ss, @h:mm:ss or @a-b for the one record the doc covers; [r:<rid>@mm:ss] for any covered record; [r:<rid>#n] or #n-m for paragraphs of a record's text; [r:<rid>] for the whole record. Times are whole seconds from the record's start. In an anchor a rid writes % as %25 and ] as %5D, and its last @ or # as %40 or %23 only when its tail would read as a position; the parser splits at the last @ or # whose rest is a whole position. Blank lines, headings, thematic breaks, fenced code, HTML comments and a table's header and separator rows need no anchor, and a legacy note's body isn't read for them. An anchor's rid is in covers and resolves against the record's latest version: a time inside its range, a paragraph that exists, or the record. A locator, what read takes, is a doc's id or path, r: and a record part (or the same in brackets), or a bare rid."
    binds:
      - Lines split on LF only, after CRLF and CR become LF; a blank line holds only spaces, tabs and no-break spaces; a paragraph is a run of non-blank lines.
      - A record's time range runs from its smallest segment start rounded down to its greatest end rounded up; gaps count.
      - "[<letters>:...] other than r is kept for later anchor kinds and refused at the end of a line."
    not_chosen:
      - "Anchors anywhere in a line: prose like 'meet at @10:00' would read as one."
      - "Encoding every @ in a rid: every mail anchor would be unreadable."
      - "#n as a segment index: it shifts when a transcript is segmented again."
  - id: DR-0111
    title: A transcript's segments are a field of its raw record, in the core's shape
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#6"]
    description: A transcript's segments are a field of its raw record, in the core's shape; nothing reads them from native. A segment is start_ms and end_ms (whole milliseconds from the record's start, the start not after the end), speaker (text or null) and text, and the record refuses one in any other shape. The source's mapper fills the field (DR-0108), so the core keeps no code per source, and anchors, verify and the index read every source's transcript the same way.
    binds:
      - Segments are read in time order, overlaps kept; the record keeps them in the mapper's order, and its version hashes them in that order (DR-0020).
      - A record without the field has no segments, whatever its native holds.
    not_chosen:
      - "A reader per source registered in the core, with a default reading native[\"segments\"]: code per source in the core, which DR-0108 moves to the consuming project."
      - "Seconds or a vendor's own shape in the record: the mapper turns them into milliseconds once."
  - id: DR-0112
    title: A doc's revisions are the commits that wrote them
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#6"]
    description: "A changed doc is the next rev of the same file, and git history keeps every earlier one; this is the design's \"a correction is a new version of the doc\". A rev is the commit whose message has the line Doc: <id> rev <n>, in its subject or its body, so one import commit can carry many docs. A put carries the rev it read and is refused at any other; that check runs under the vault's lock, after its recovery check. A hand edit, committed or not, is committed as the next rev before a put is checked, one past both the stored rev and its own rev line, so a put made before it never overwrites it. supersedes names another doc this one replaces, never a doc's own earlier rev."
    binds:
      - read(rev=n) returns the doc as the commit that wrote rev n left it.
      - "An id with Doc: lines in its history exists even when its file is gone; a rebuilt doc goes on from its last rev."
      - "sync doesn't rebase when this machine and the remote both wrote the same Doc: <id> rev <n> line; it stops and reports it like a conflict."
    not_chosen:
      - "A new file per version: briefs and digests rebuilt after every sync would fill their folders with stale copies."
      - "Last write wins: two sessions would overwrite each other silently."
  - id: DR-0113
    title: Entities are YAML files, one per entity, read leniently
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#7"]
    description: "An entity is entities/<type>/<id>.yaml: id (the file's name, a slug unique across all types), type (the folder's name, one of person, org, customer, project, site, device, product, topic, stream, meeting-series, document, repo, place, term), name (a map from a language code to the name), aliases (a list of {text, kind, needs}, kind absent or asr), related (a type to entity ids), ids (a key of lowercase letters, digits, ., _ or -, so a source's name can be one, to text or a list of it, kept as written and matched ignoring case), status (active or archived), role, note, and schema (absent or 1). Files are read with YAML's base loader, so every value is text. An unknown key or type, a key given twice (the last is read), or an id that names no entity, is a problem and the rest of the file loads; an alias whose needs can't be read is left out with a problem, since without its condition it would match everywhere; a file that can't be an entity, or has another schema, is skipped with a problem. Names starting with _ or . are not entities."
    binds:
      - "A breaking change writes schema: 2, which an older Docket skips rather than misreads."
      - "The ids keys Docket matches: a source's name (the author on that source), email and email_domain."
    not_chosen:
      - "Strict reading: one typo in one file would stop the index."
      - "YAML's safe loader: no becomes false and 2026 a number."
      - "Ids per type: needs and a doc's entities name bare ids."
  - id: DR-0115
    title: The index is a per-machine SQLite cache, rebuilt from the vault's working tree
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#7"]
    description: "index/docket.sqlite is built from raw/, processed/ and entities/ as they are on disk, never staging/ or git objects. A rebuild writes a new file with every insert sorted and replaces the old one, after letting SQLite roll back a hot journal an interrupted update left, so two rebuilds give the same database; it removes the temp files a killed rebuild left. An update follows new run files, changed docs and entity files and ends with the same rows as a rebuild; it rebuilds when it can't follow (a run file gone or changed in size or modification time, another schema, stemmer version or set of languages). Readers open the file by its path with query_only, so a hot journal is rolled back and a vault on a network share opens. Raw lines are read leniently: one that doesn't load is a problem, a field this Docket doesn't know (at the top or in an attachment) is left out and reported, and the rest is indexed."
    binds:
      - "The FTS5 table is contentless: a chunk's text lives once, in chunks."
      - A chunk keeps a hash of its text, so later vectors survive a rebuild.
    not_chosen:
      - "Rebuilding in place in one transaction: the file doubles until a VACUUM."
      - "WAL: a crashed reader's -wal file would be replayed into the replaced file."
  - id: DR-0116
    title: Chunks are cut per kind, and aliases match as written and through the stems of languages that inflect names
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#7"]
    description: "Transcripts are cut into windows that grow to 60 s and stop before 90 s or 350 words, sharing one utterance; a message is a chunk alone and its thread gets windows of the parent and up to 10 replies, sharing one; other records carry their title on top and split above 500 words between paragraphs; processed docs split per section, their anchors cut from the text and kept. An alias matches its words as written, or its stem forms (its stem, its dative's stem, itself) in the stemmed columns of languages that allow it: Hungarian, not English. A stem form under three letters, in over ten times as many chunks as the alias as written, or in over a fifth of all chunks and over 100, is dropped. An asr alias also matches vocabulary words within one edit of a word of 5 to 7 letters, two of 8 or more; an alias with needs counts only beside an unconditional mention. Speakers, authors (by ids) and a doc's entities are mentions too."
    binds: ["No entity name enters chunk text, so editing an entity never re-chunks."]
    not_chosen:
      - "English stems for aliases: Mark would match every marking."
      - "A minimum alias length instead of judging stem forms: Kata would lose Katának."
  - id: DR-0117
    title: Search reads the query, ranks by BM25 with boosts fused by rank, and groups hits by recording or thread
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#7"]
    description: A query is quoted phrases and words, never FTS5 syntax; time words become a filter; names in it expand to their aliases, and are searched as typed first. Filters run inside every candidate query. FTS candidates take all words, then any, then prefixes, by BM25 weighted 1.0 as written and 0.6 per stemmed column; entity candidates come from mentions; the two lists fuse by reciprocal rank, so a boost lifts a chunk and never drops one. Hits of two transcripts on the same stretch collapse. A group is a record's thread, else the record, with the current minutes, recording note or thread summary covering it.
    binds:
      - A transcript or vendor summary of a recording sets thread to the recording's rid.
      - The result (the query as read, groups, hits with locators, facets) is what the MCP search tool returns (#8).
    not_chosen:
      - "Multiplying BM25 by a boost: a chunk with no word match could never surface."
      - "Dropping a time filter that empties the result: the user asked for that time."
  - id: DR-0118
    title: Stemming uses snowballstemmer's pure-Python classes
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#7"]
    description: snowballstemmer (BSD-3-Clause, pure Python, 36 stemmers for 34 languages) stems every language. Docket imports its classes directly, because its stemmer() switches to PyStemmer when that is installed, which can stem differently; the index records the package's version and rebuilds when it changes.
    not_chosen:
      - "The package's stemmer(): PyStemmer would change stems under an index."
      - "Hunspell: a dictionary per language and a C library."
  - id: DR-0130
    title: A legacy note keeps its old paths and the hash of the body the import wrote
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#11"]
    description: "A legacy-note doc's frontmatter adds old_paths, a block list of the paths other files cite it by, and import_hash, sha256: and 64 hex of the body the import last wrote. An old path is relative to the notes folder's repo root, with / separators, in NFC, with no empty, . or .. part, no ':', and no control character or line break. The hash is of the body as a doc gives it back after Docket's render and parse. Both are refused on other doc types and written after entities, only when set. This extends DR-0109."
    binds:
      - An old path is kept as other files wrote it, never resolved against a disk.
      - import_hash is over the body as written, so a note ending in a blank line never looks edited.
    not_chosen:
      - "A crosswalk file in the vault: a second place to keep in step, and a grep for an old path wouldn't land on the doc."
      - "One old path as a string: a later rename or a second prefix would change the format."
  - id: DR-0131
    title: An old path is a locator, with an optional time
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#11"]
    description: "read takes path [@times], the path ending in .md or .markdown in any case. r: is always raw, a doc id stays a doc, and a bare <source>:<id> that is a rid in the raw log stays a rid. Otherwise the path is a doc under processed/ when one is there, else a legacy note's old path, matched in steps that stop at the first with exactly one match: exact, case-folded, the longest suffix (after a ':' any old path, after a '/' only one of two parts or more), then a bare file name. Normalizing makes \\ a /, drops a leading ./ and repeated /, composes to NFC and refuses a .. part; a drive or a leading / takes part in the suffix step only, and nothing touches the file system. A time is placed in the one covered record with segments; none or several is a problem in the result. This extends DR-0110."
    binds:
      - Nothing, or several equally good matches, is an error naming the candidates, never a guess.
      - A one-part old path that ends a longer locator after a / is never resolved, only named as a candidate.
    not_chosen:
