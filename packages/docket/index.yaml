    not_chosen:
      - "hold.txt read only by the import: a live run or a second import stages held recordings whole."
      - "A top-level holds/ folder: it changes the vault's layout (DR-0019)."
  - id: DR-0122
    title: The gate honours hold lists on stage, classify and promote
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#10"]
    description: The gate's sweep reads every hold list on every call, as it reads vault.yaml, and a list that doesn't read stops the call. A record on hold is never staged and only counted as on_hold; classify refuses it, work or private, writing nothing; promote leaves it waiting. So a record staged on another clone before its hold arrived can't reach raw, whether or not an ingest runs first.
    binds: [The count is on_hold; held stays the name for records a promotion can't take.]
    not_chosen:
      - "The ingest's check alone: a record staged before its hold arrived could be classified and promoted with no ingest between."
      - "Allowing classify private: it records a decision releasing the hold would have to undo."
  - id: DR-0123
    title: A mapper runs in its own process, from its skill folder, with limits
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#10"]
    description: "The consuming repo is the git repo that holds the vault's folder; a vault outside any git repo runs no mapper. A mapper's real path, after links, must sit under the real path of .claude/skills/sources/<source>/ built from the checked name, and outside the vault. The core starts it with its own interpreter in isolated mode (python -I -X utf8 -m docket.sources.child), an environment holding only what Python needs to start, 300 seconds and 256 MiB of output. A timeout, a crash, output that isn't JSON or any refused record fails the whole run: nothing is staged and the captures are fetched again. Errors name a record's position and field, never a value; the mapper's stderr is never logged and is printed only by docket ingest --mapper-errors."
    binds: [The service runs only the consuming repo's mappers (DR-0108).]
    not_chosen:
      - "The service's own process: a hung or crashing mapper takes it down."
      - "Skipping a refused record and staging the rest: the mark moves past it for good."
      - "A project path in vault.yaml: one more setting, for the layout the setup already makes."
  - id: DR-0124
    title: vault.yaml's sources name their mapper, tools and media hosts
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#10"]
