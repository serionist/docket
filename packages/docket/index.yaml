    not_chosen:
      - "Checking only where each path is built: one missed place lets .. widen the mapper's folder or move a hold list out of the vault."
  - id: DR-0126
    title: A cut record keeps no native, and a verbatim one becomes fidelity cut
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#10"]
    description: "Every cut record loses its native, which would still hold the stretch. fidelity: cut replaces verbatim only: a derived record (its id built from its content) stays derived, and is known as cut by [cut] in its text and its empty native. A mapper can't set cut. This refines DR-0108's bind that every cut record is marked fidelity: cut, so the derived-id mark is never lost."
    not_chosen:
      - "cut on every cut record: a derived record would lose the mark that says its id came from its content."
  - id: DR-0127
    title: A record with segments is cut only by time, one without only by characters
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#10"]
    description: "A time cut on a record without segments is refused: cut its transcript, or classify it whole. A character cut on a record with segments is refused (DR-0028), since its text is rendered from them. Each segment overlapping a time cut goes whole, one [cut] segment spans the cut widened to what it removed, cuts that touch after widening become one, and a cut that starts after the transcript ends is refused."
    not_chosen: ["Trimming a segment at the cut: its words have no times."]
  - id: DR-0128
