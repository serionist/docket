    description: "A folder vault's commits run with core.hooksPath pointed at an empty folder in Docket's private folder. The host's index.lock is the user's: a fresh one is waited for a few seconds, a stale one is reported with its age, and Docket never deletes it. A commit that fails after its add unstages Docket's paths, and a run file a crash left staged counts as uncommitted and goes in with the next commit."
