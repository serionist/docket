  - id: DR-0152
    title: The service refuses other hosts, other origins, and callers without its token
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#8"]
    description: "Every request's Host is 127.0.0.1:<port> or localhost:<port>, and the MCP SDK checks it again on /mcp. A write whose Origin or Sec-Fetch-Site is from elsewhere is refused, and a write made with the session cookie needs one of the two. /mcp takes only the bearer token, /api the token or the session cookie, the pages the cookie; no CORS header is ever sent. The token is 32 random bytes. Install chooses its store once and records it as service.token_store: the keychain through keyring when a write reads back (on Linux only when the user manager has a session bus), else a file only the user can read, 0600 or an owner-only DACL on Windows. Only install and token --rotate make a token, and both choose again when the recorded store is gone. The browser gets in through a one-time code, good once for 60 seconds, that docket open writes into an owner-only redirect page and prints; it becomes a SameSite=Strict, HttpOnly cookie through a page that moves on, and sessions live in memory for 12 hours at most."
    binds:
      - The token is never on a command line, in service.json, in a log or in an environment variable.
      - "Accepted: any process running as the user can get the token from either store, and another user of the machine can reach the port and, while the service is down, bind it."
    not_chosen:
