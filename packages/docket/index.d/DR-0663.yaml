decisions:
  - id: DR-0663
    title: A day page reloads itself when an op file changes, Today when a cursor file does too, checked every 5 seconds
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#203", "#204"]
    description: "Each day page carries the version it read: a hash of every file in ledger/ops/ by name, size and modification time, taken before the read; Today's adds the cursor files, since only Today shows the last sync per source. An element polls GET /ledger/changed with it every 5 seconds: unchanged answers 204, which htmx doesn't swap; changed answers HX-Refresh, and the page reloads at its URL, its panel and filters with it. docket.js keeps the selected row and the panel's scroll in sessionStorage across the reload and puts them back, so the owner stays where they were. It holds the poll back while a form holds unsaved text, a field has the focus, rows are ticked, a dialog is open or the tab is hidden, so a reload never loses what the owner is doing. A save on change answers with the version after it, so the page's own write brings no reload (DR-0661), and a refusal's page carries no poll. A write by the page, the CLI, Claude's ledger_batch or the sync, and a pull from another clone, each change a file; the check takes no index lock and reads no file's content."
    not_chosen:
      - "The index's ledger_files or its highest op id: each poll would bring the index up to date under its lock."
      - "A banner asking for a reload: the old tasks app reloaded by itself, and the hold keeps a reload from losing work."
      - "A push from the server: a second kind of connection for one bit."
      - "The selection in the URL, reloading with at: the poll would have to learn it, and the panel's scroll needs the session's storage anyway."
      - "The cursor files on every page: only Today shows a sync, and the others would reload on every run for nothing."
