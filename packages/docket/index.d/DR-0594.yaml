decisions:
  - id: DR-0594
    title: A forget writes the history rewrite for a fresh clone, by each line's own rid field or token and each removed doc's blobs, and never runs it
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "The forget ends by saying the text stays in the host repo's history and that Docket never rewrites it (DR-0102). It writes its files to <private>/forget/<stamp>/, never the tree, the stamp a UTC time with no colon (20261018T091402Z) so the folder is valid on Windows, none holding text from the family. lines.txt holds git filter-repo --replace-text expressions, each blanking one line and keeping its newline, for a rid forgotten whole alone, since that rid never comes back: a raw run file's line matched by its leading {\"rid\":\"<rid>\" field, the rid and the rids under it, so a kept reply whose thread names the rid, curate locators and cursor ids never match; and a doc line by its own [r: token on that rid. Every other line is blanked only in the blobs that held it: scoped.txt lists blob ids, each with the sha256 of each line to blank, and scoped.py is the --blob-callback that reads it. That covers every other dropped doc line, a version forget's (a held rid, a folder file), a time anchor on a kept recording whose transcript went, and a line dropped for what it cites, by every blob of each rev of the doc; and a version forget's raw lines, by every blob their run file has had, read before the apply, since a release can keep that very version and write its line again just as it was. So a note written after a release on the cut version at the same utterance times, and a kept version's line written again, are other blobs and stay. blobs.txt holds, for --strip-blobs-with-ids, the blob of every rev of each removed doc and each removed media file's pointer, not their paths, so a doc rebuilt later at a removed path survives. The blob ids name the history before any rewrite, so each forget's folder holds every earlier forget's lines, rows and blobs on that clone too, and the printed lines say to run only the newest. When the files are written, HEAD's tree holds no line they match. The printed lines say, in order: run docket forget --check-rewrite on the folder, read-only, which applies the files to HEAD's tree, the expressions as filter-repo's Python reads them, and refuses, naming each path and line number it would change, unless HEAD stays as it is; back the repo up; clone it with git clone --no-local into a fresh folder and run git filter-repo there, never in the working repo, which filter-repo refuses as not fresh and whose --force would risk the owner's uncommitted work; force-push its branches from the fresh clone, then re-clone every machine, this one too; the remote keeps commits a force-push left behind, reachable by their ids, on GitHub until its support purges them, and in forks and pull request refs; other branches keep the text, with no list line to keep it out of their trees; and git filter-repo isn't Docket's dependency. A repo of its own gets the same until #58."
    binds:
      - Docket never runs the history rewrite.
      - The rewrite's files hold no text from the family, and leave HEAD's tree as it is when written.
      - Only a rid forgotten whole is matched by its rid field or its token; every other line is blanked only in the blobs that held it.
      - The printed lines start with the read-only check, which refuses unless HEAD stays as it is.
    not_chosen:
      - "An expression on the rid anywhere in a blob: it blanks a kept reply whose thread names the rid, curate locators, cursor ids, a held rid's released cut version and lines outside the vault."
      - "Removing docs by path with --invert-paths: a doc rebuilt later at that path goes from history too."
      - "Running filter-repo on the working repo: it refuses a clone that isn't fresh, and --force there risks the owner's uncommitted work."
      - "Matching a dropped doc line by its whole text: the file would hold the text the forget took out."
      - "A version forget's doc lines matched by their token: a note written later on the released cut version at the same utterance times holds the same token, and HEAD would lose it."
      - "A version forget's raw lines matched by their rid and v: a release that keeps that very version writes the same line again, and HEAD would lose it."
      - "A folder per forget, each run on its own: once one rewrite runs, the blob ids the next names are gone."
