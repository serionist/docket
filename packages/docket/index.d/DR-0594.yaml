decisions:
  - id: DR-0594
    title: A forget writes the history rewrite for a fresh clone, by each raw line's rid field and each blob's lines, and never runs it
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "The forget ends by saying the text stays in the host repo's history and that Docket never rewrites it (DR-0102). It writes its files to <private>/forget/<stamp>/, never the tree, the stamp a UTC time with no colon (20261018T091402Z) so the folder is valid on Windows, none holding text from the family. It writes them whatever stops the list's commit or the apply, since once the line is in force nothing writes them later, and the error says the line is in force and where they are. lines.txt holds git filter-repo --replace-text expressions, each blanking one line and keeping its newline, for a rid forgotten whole alone, since that rid never comes back: a raw run file's line matched by its leading {\"rid\":\"<rid>\" field, the rid and the rids under it, so a kept reply whose thread names the rid, curate locators and cursor ids never match. Every other line is blanked only in the blobs that held it: scoped.txt lists blob ids, each with the sha256 of each line to blank, and scoped.py is the --blob-callback that reads it. That covers each doc line the docs' rule drops in any blob the doc's file has had, in any commit on any ref, HEAD's before the apply included, each blob judged on its own rev with its refs read through older revs, so a line in a wording only an earlier rev gave it, or one only an earlier rev held, goes too: a version forget's (a held rid, a folder file), a time anchor, a short anchor, and a line dropped for what it cites; a doc line holding its own [r: token on a rid forgotten whole, in the vault's doc blobs alone (DR-0598); and a version forget's raw lines, by every blob their run file has had, read before the apply, since a release can keep that very version and write its line again just as it was. So a note written after a release on the cut version at the same utterance times, and a kept version's line written again, are other blobs and stay. blobs.txt holds, for --strip-blobs-with-ids, every blob of each removed doc and each removed media file's pointer, not their paths, so a doc rebuilt later at a removed path survives. The blob ids name the history before any rewrite, so each forget's folder holds every earlier forget's lines, rows and blobs on that clone too, and the printed lines say to run only the newest. Once the apply's commit lands, no branch tip that holds the forget holds a line they match; a doc left for its owner keeps HEAD's blob in them, so the check refuses until its rev lands. The printed lines say, in order: run docket forget --check-rewrite on the folder, read-only, which applies the files to HEAD's tree and each branch tip's, the expressions as filter-repo's Python reads them, and refuses, naming each branch, path and line number it would change, unless every branch stays as it is now (DR-0598); back the repo up; clone it with git clone --no-local into a fresh folder and run git filter-repo there, never in the working repo, which filter-repo refuses as not fresh and whose --force would risk the owner's uncommitted work; it rewrites every branch and tag the clone has and removes origin, so add origin back, force-push every branch and tag, then re-clone every machine, this one too; a branch only the remote has isn't in the clone and keeps the text; the remote keeps commits a force-push left behind, reachable by their ids, on GitHub until its support purges them, and in forks and pull request refs; and git filter-repo isn't Docket's dependency, only its tests', which run it in CI. A repo of its own gets the same until #58."
    binds:
      - Docket never runs the history rewrite.
      - The rewrite's files hold no text from the family, and leave every branch tip that holds the forget as it is once the apply's commit lands.
      - Only a rid forgotten whole's raw lines are matched by an expression; every other line is blanked only in the blobs that held it.
      - The printed lines start with the read-only check, which refuses unless every branch stays as it is now.
    not_chosen:
      - "An expression on the rid anywhere in a blob: it blanks a kept reply whose thread names the rid, curate locators, cursor ids, a held rid's released cut version and lines outside the vault."
      - "Removing docs by path with --invert-paths: a doc rebuilt later at that path goes from history too."
      - "Running filter-repo on the working repo: it refuses a clone that isn't fresh, and --force there risks the owner's uncommitted work."
      - "Matching a dropped doc line by its whole text: the file would hold the text the forget took out."
      - "A version forget's doc lines matched by their token: a note written later on the released cut version at the same utterance times holds the same token, and HEAD would lose it."
      - "A version forget's raw lines matched by their rid and v: a release that keeps that very version writes the same line again, and HEAD would lose it."
      - "A folder per forget, each run on its own: once one rewrite runs, the blob ids the next names are gone."
      - "A dropped doc line matched by its current wording alone: an earlier wording, and a line only an earlier rev held, stay in history while the check passes."
