decisions:
  - id: DR-0594
    title: A forget writes the history rewrite for a fresh clone, by each line's own rid field or token and each removed doc's blobs, and never runs it
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "The forget ends by saying the text stays in the host repo's history and that Docket never rewrites it (DR-0102). It writes its files to <private>/forget/<stamp>/, never the tree, the stamp a UTC time with no colon (20261018T091402Z) so the folder is valid on Windows, none holding text from the family. lines.txt holds git filter-repo --replace-text expressions, each blanking one line and keeping its newline: a raw run file's line matched by its leading {\"rid\":\"<rid>\" field, the rid and the rids under it for a whole forget and the rid with its \"v\" for a version, so a kept reply whose thread names the rid, curate locators, cursor ids and a held rid's released cut version never match; a doc line dropped for a rid forgotten whole, matched by its own [r: token on that rid or its pinned [d:...=<hash>] ref to a dropped line, so a dependent goes too, since that rid never comes back. Every other dropped doc line, a version forget's (a held rid, a folder file) and a time anchor on a kept recording whose transcript went, is blanked only in the blobs that held it: scoped.txt lists the blob ids recorded when the lines were dropped, each with the sha256 of each line to blank, and scoped.py is the --blob-callback that reads it, so a note written after a release on the cut version at the same utterance times, another blob, stays. blobs.txt holds, for --strip-blobs-with-ids, the blob of every rev of each removed doc and each removed media file's pointer, not their paths, so a doc rebuilt later at a removed path survives. When the files are written, HEAD's tree holds no line they match. The printed lines say, in order: run docket forget --check-rewrite on the folder, read-only, which applies the files to HEAD's tree, the expressions as filter-repo's Python reads them, and refuses, naming each path and line number it would change, unless HEAD stays as it is; back the repo up; clone it with git clone --no-local into a fresh folder and run git filter-repo there, never in the working repo, which filter-repo refuses as not fresh and whose --force would risk the owner's uncommitted work; force-push its branches from the fresh clone, then re-clone every machine, this one too; the remote keeps commits a force-push left behind, reachable by their ids, on GitHub until its support purges them, and in forks and pull request refs; other branches keep the text, with no list line to keep it out of their trees; and git filter-repo isn't Docket's dependency. A repo of its own gets the same until #58."
    binds:
      - Docket never runs the history rewrite.
      - The rewrite's files hold no text from the family, and leave HEAD's tree as it is when written.
      - Only a rid forgotten whole is matched by its token; every other dropped doc line is blanked only in the blobs that held it.
      - The printed lines start with the read-only check, which refuses unless HEAD stays as it is.
    not_chosen:
      - "An expression on the rid anywhere in a blob: it blanks a kept reply whose thread names the rid, curate locators, cursor ids, a held rid's released cut version and lines outside the vault."
      - "Removing docs by path with --invert-paths: a doc rebuilt later at that path goes from history too."
      - "Running filter-repo on the working repo: it refuses a clone that isn't fresh, and --force there risks the owner's uncommitted work."
      - "Matching a dropped doc line by its whole text: the file would hold the text the forget took out."
      - "A version forget's doc lines matched by their token: a note written later on the released cut version at the same utterance times holds the same token, and HEAD would lose it."
