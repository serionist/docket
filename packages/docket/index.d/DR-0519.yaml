decisions:
  - id: DR-0519
    title: A loosening's question shows the change without never-store values, is asked outside the vault lock, and writes nothing if vault.yaml or its last commit changed meanwhile
    status: superseded
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#134"]
    superseded_by: [DR-0601]
    description: "The screen shows, each only when it loosens, the uncommitted edit against HEAD's vault.yaml, taken in first, and then the command's own change: each change on a line of its own by its full path, such as sources.calls.sensitivity: mixed -> work, a source added with its keys under it, and each never-store list as never_store.people: 1 taken off, 1 added, never a value, so a swap reads as one off and one added and no value reaches a terminal or its scrollback (DR-0505). The arrow is ASCII. Then the command's warnings, given to rewrite as a named parameter, warnings, a list the command knows from its own arguments, such as set_rule's credentials-off note; then Type <code> to make this change, or n to leave vault.yaml as it is. One code covers both parts. A file not in Docket's form gets its line printed and no code, as before. The question is asked outside the vault lock, as the release asks, so the service's ingest and captures never wait on a person; on the code the file and HEAD's vault.yaml text are read again under the lock, and anything is written only when both are the ones asked about, the file by its sha256 as a page's stale write is refused (DR-0507). HEAD's text is compared, never its commit id: Docket's own ingest commits while the owner reads, and a commit of another file doesn't stop the question. Otherwise nothing is written and the command says to run it again. edit runs once, so the change written is the change shown. Each commit the owner confirmed, the take-in's and the change's, keeps its subject and gains confirmed at the console in its body. A no, a wrong code or the end of input writes and commits nothing and exits 1; docket source new then removes the folder it wrote."
    binds:
      - rewrite's parameters include warnings, and none answers the question; a test pins them.
    not_chosen:
      - "Asking under the vault lock: the service's writes wait on a person for as long as they take."
      - "A unified diff of the file: a swap in a list hides as two moved lines, and its context lines carry never-store values."
      - "A bare count per list: a swap reads as no change."
      - "HEAD's commit id compared again: Docket's own ingest commits while the owner reads, and would stop the question."
      - "edit returning its notes: its type changes for every caller, for one command's note."
      - "Two questions when the edit and the command both loosen: two codes for one command, and a no to the second leaves the first committed."
      - "No mark in the commit: git log can't tell which of Docket's config commits the owner confirmed at the console."
