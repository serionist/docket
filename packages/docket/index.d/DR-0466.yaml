decisions:
  - id: DR-0466
    title: Proposals are mined from the index alone, from spellings trusted by who wrote them, joined only where they meet, and matched to entities first
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "The miner reads the index, never the vault's files. A spelling's place sets its trust, highest first: a transcript's speaker label (not a generic one), which the user typed in the recorder's app; the user's docs (old notes, minutes, notes); mail, chat and other records people typed, a mail's subject included; vendor text, a vendor summary or the title of a recording or a transcript, which a vendor's model wrote from what it heard; transcript text, each line's label prefix left out. The first three are written, vendor text and transcripts are heard. A card's name is the run a single word joined, when there is one (Cleo Test over the label Cleo); between spellings of the same shape, the most trusted, ties broken by containers. A spelling is a capitalised word or a run of two or three, an all-caps word of 2 to 6 letters, or a mixed-case word; a single word counts away from a sentence's start (a chunk's or line's start, after . ! or ?), a run wherever it starts once DR-0465 trims a common first word, and a spelling that qualifies is then counted everywhere it is. Spellings group when they fold the same, and when two words are seen in both orders. A heard spelling within matching's fuzzy distance (none under 5 letters) of a written or label spelling, and a Hungarian case form (Language.cases) or an English 's form of any spelling, written or heard, join it only when the two meet in at least two recordings, a recording counting with the docs that cover it; a case form never joins when it is itself a label or the head of a written run of its own, so Anna stays its own name beside Ann. A single word joins the run it starts as a plain alias when it starts only one group's run and the two meet in at least two places, so two people who share a first name stay apart. Only every label and the 300 spellings capitalised most often go on to be found and grouped, so a round's time stays bounded; the rest wait for a later round. A group that reaches an entity's name or alias the same ways, seen where the entity is mentioned, or a word that starts one entity's name of several words where that entity is mentioned, or a label whose first word is one person's name or alias, becomes an alias card for that entity, made only when accepting it would add a mention, and never a new-entity card; a label or a written run's first word reaches no entity as a case form. The rest become new-entity cards. A new card is guessed a person when a label or an author backs it or both name orders are seen, and a term otherwise; its id is the name's slug; its name goes under the owner's first language and the other order of a two-word name is a plain alias, since the miner doesn't tell a text's language: the edit moves it under hu. That order is the one written anywhere, however rarely; for a person in a vault whose owner writes Hungarian, which puts the family name first, it is added even unwritten, so a question in that order names them."
    binds:
      - The miner never reads a model or Claude, so a round runs without a session.
      - Only a fuzzy join needs a written anchor; case and 's forms join their base whatever its trust, under the meeting rule.
    not_chosen:
      - "A Claude pass over the transcripts: the service has no Claude before phase 3; the skill adds judgement on top of the cards."
      - "A named-entity model: a dependency for two languages, and speech recognition's text defeats it."
      - "Lower-case words as candidates: every word would be one."
      - "Near spellings or case forms joined without meeting: Hungarian's case forms of Ann, Jane, Jess, Éva and Leo fold to Anna, Janet, Jesse, Evan and Leon, and two people with close names would become one."
      - "Vendor summaries and titles as written: they spell a name as the vendor's model heard it, and would anchor joins to a misheard name."
      - "Telling a text's language from its record: docs and many records carry none."
