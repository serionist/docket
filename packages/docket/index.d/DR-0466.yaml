decisions:
  - id: DR-0466
    title: Proposals are mined from the index alone, from spellings trusted by who wrote them, joined only where they meet, and matched to entities first
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "The miner reads the index, never the vault's files. A spelling's place sets its trust, highest first: a transcript's speaker label (not a generic one), which the user typed in the recorder's app; the user's docs (old notes, minutes, notes); mail, chat and other records people typed, a mail's subject included; vendor text, a vendor summary or the title of a recording or a transcript, which a vendor's model wrote from what it heard; transcript text, each line's label prefix left out. The first three are written, vendor text and transcripts are heard. A card's name is the run a single word joined, when there is one (Cleo Test over the label Cleo); between spellings of the same shape, the most trusted, ties broken by containers. A spelling is a capitalised word or a run of two or three, an all-caps word of 2 to 6 letters, or a mixed-case word; a single word counts away from a sentence's start (a chunk's or line's start, after . ! or ?), a run wherever it starts once DR-0465 trims a common first word, and a spelling that qualifies is then counted everywhere it is. Spellings group when they fold the same, and when two words are seen in both orders. A heard spelling within matching's fuzzy distance (none under 5 letters) of a written or label spelling, and a Hungarian case form (Language.cases) or an English 's form of any spelling, written or heard, join it only when the two meet in at least two recordings, a recording counting with the docs that cover it; a case form never joins when it is itself a label or the head of a written run of its own, so Anna stays its own name beside Ann. A single word joins the run it starts as a plain alias when it starts only one group's run and the two meet in at least two places, so two people who share a first name stay apart. Only every label, every spelling that reaches an entity by its text, and the 300 other spellings capitalised most often that no rejection stoplists as a new name go on to be found and grouped, so a round's time stays bounded and a later round reaches past what earlier ones rejected; the rest wait for a later round. A group reaches an entity, seen where the entity is mentioned, by a case form of one of its names or aliases (not one matching judged a common word for it, as Janet is for Jane where Janet is everywhere, and never a label or a written run's first word), by a heard spelling, never a written or label one, within the fuzzy distance of one, or by a word that starts one entity's name of several words; a label reaches the one person whose name or alias its first word starts. It becomes that entity's alias card, one card per entity in a round whatever groups reach it, its case forms adding nothing (matching counts them, or judged them common on purpose), made only when accepting it would add a mention, and then never a new-entity card. When the entity's alias stoplist holds every spelling the group would add, the group goes on to the next entity it reaches, or a new card, so a rejected alias stays a candidate elsewhere. The rest become new-entity cards. A new card is guessed a person when a label or an author backs it or both name orders are seen, and a term otherwise; its id is the name's slug; its name goes under the owner's first language and the other order of a two-word name is a plain alias, since the miner doesn't tell a text's language: the edit moves it under hu. That order is the one written anywhere, however rarely; for a person in a vault whose owner writes Hungarian, which puts the family name first, it is added even unwritten, so a question in that order names them: shown on the card as the other order, not seen, with no chunks, and ticked, since Hungarian has given names that are family names too and the user may untick it. Neither order is added when another entity holds it, a spelling of this round is it, or a rejection stoplists it as a new name."
    binds:
      - The miner never reads a model or Claude, so a round runs without a session.
      - Only a fuzzy join needs a written anchor; case and 's forms join their base whatever its trust, under the meeting rule.
    not_chosen:
      - "A Claude pass over the transcripts: the service has no Claude before phase 3; the skill adds judgement on top of the cards."
      - "A named-entity model: a dependency for two languages, and speech recognition's text defeats it."
      - "Lower-case words as candidates: every word would be one."
      - "Near spellings or case forms joined without meeting: Hungarian's case forms of Ann, Jane, Jess, Éva and Leo fold to Anna, Janet, Jesse, Evan and Leon, and two people with close names would become one."
      - "Vendor summaries and titles as written: they spell a name as the vendor's model heard it, and would anchor joins to a misheard name."
      - "Telling a text's language from its record: docs and many records carry none."
