decisions:
  - id: DR-0613
    title: An item's id is its add op's ULID; its A- number is held by the add, one past the highest any item has held, and the claim that sorts first keeps it
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#198"]
    description: "An item's id is its add op's ULID, for good. Its number is in the add op: one past the highest number any item has held, renumbered ones included, shown as A- and at least four digits. todo.py numbers the same way from meta.next_id, so imported items keep their numbers and new ones carry on. The add an item stands on claims its number, and each renumber after it claims another; a second add with the item's id, idle, claims none. Two clones apart can give out one number. The claim, an add or a renumber, that sorts first keeps it, and the next write on any machine that sees the clash writes a renumber op for each later claimant, which docket vault check names until then. The number then finds the item that holds it and says which items held it before, so a number written in a note or a chat is never quietly another item's; the writer refuses a write that names an item by a number more than one item has held, until the item is named by its id. No clone gives out a number it has seen held. Meetings' M- numbers take the same rule in #199. This replaces the design's numbers handed out when the ops are folded."
    binds:
      - "Item ids and numbers are stored in ops, notes and chats: their shapes never change."
      - No clone gives out a number it has seen held, to a new item or by a renumber.
      - A write that names an item by a number more than one item has held is refused until it names the item by id.
    not_chosen:
      - "Numbers handed out by the fold, the design's first line: a merge would move a number already written somewhere to another item."
      - "Number blocks or prefixes per machine: gaps or two shapes, and a list of machines to keep."
      - "Numbers given out only by the primary machine: a laptop apart couldn't add an item."
