decisions:
  - id: DR-0694
    title: A forget masks the ops that anchor on its family or link to it; an item or meeting whose making op is listed is a shell, and the from chain is followed only from a point masked for its own words
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#212"]
    description: "The rule follows the docs' (DR-0580). An op whose text holds an [r: anchor on the family, judged where it reads, or a [d: ref to a line the docs' rule drops or a doc it removes, is masked. A material whose ref reads on the family by read's rules (DR-0131), a rid, a doc or a legacy note's old path the forget takes, is masked: a recording linked to a meeting goes as its link, and the meeting stays. An item's add is masked when its source, in the add or a set, reads on the family, and a meeting's adds are masked when the forget takes its event, a calendar record, which DR-0650 left for the forget. Shells come from the list: an item or a meeting whose making op, any add of a meeting, is listed, one an anchor matched included, is a shell, and every op of it is masked, a meeting's points too. So a clone knows a shell after its locators are masked, and every clone's re-match masks the ops of a shell that still hold text. The from chain is followed only from a point masked for its own words: one raised on a shell, one an anchor matched, or a shell's copy whose text a point_set set on the shell. Its copies, and an item point_item made from it or from a copy, are masked, to a fixed point. Any other copy rolled into a shell goes as that meeting's op, and the chain beyond it, and an item made from it, keep their words: a weekly point rolled across ten meetings loses only the copy on the meeting whose record was forgotten. An item only linked to a shell meeting keeps its words, and text naming a record with no anchor is among what forget can't reach, as for docs. The forget matches against the ledger as its plan reads it; every clone's apply matches again, every op line once the list's digest moved and the lines a pull brought otherwise, so a clone's own op from before its pull is found, and one no list line names goes on an ops-only line committed with the rest, as DR-0595's keys-only line. The dry run and the --now screen count the ops and name by number only: each shell, each open one to drop; each object that lost a material or a link to the family and kept its text, an item whose source names a shell meeting among them; and each live point whose open head ends on a shell, such as M-0015#1, rolled in from M-0014, open, so the owner can raise it again. As built (forget/ledger.py): a point masked for its own words takes the point_sets naming it, an answer to it among them, as each of its copies does. An unlisted meeting add whose event digests as a shell's adds' do, another clone's add of that event from before its pull, is the shell's too. Only an op whose line a mask changes goes on the list: one with no text has nothing to hide. A stream's ops on the family are counted on the screens, never named, a stream's name being a word. On a clone whose list hasn't moved, the apply judges the lines an op file gained by the list alone, an op on a listed object, point or copy, or an anchor or a locator on a rid or an old path the list holds, and reads and matches the whole ledger again only then; a [d: ref there waits for the clone that wrote it, whose own list moved. A meeting made a shell by an anchor in its own add, its calendar record kept, comes back from that record as a new meeting, the shell's event reading masked."
    binds:
      - "An item or a meeting whose making op, any add of a meeting, is listed is a shell: every op of it is masked, on every clone."
      - The from chain is followed only from a point masked for its own words, raised on a shell, matched by an anchor, or a shell's copy whose text a point_set set there; any other copy rolled into a shell is masked as that meeting's op, and what follows it keeps its words.
      - Only anchors and locators find an op; a record named in plain words is out of reach, and the dry run says so.
    not_chosen:
      - "Shells found from their locators: once a shell's source or event is masked, another clone can't tell it is one."
      - "Following from through every copy: a weekly point rolled through a forgotten meeting would lose its words in every later meeting."
      - "A meeting from a forgotten calendar record keeping the owner's points and notes: its subject, people and place go anyway, and its points are about that meeting."
      - "Hiding a shell from the day's lists in the fold: the screen names each open shell, to drop."
      - "Matching never-store values in op text: docs aren't matched that way, and the writer refuses them when written (DR-0618)."
