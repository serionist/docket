decisions:
  - id: DR-0469
    title: Tier 1 applies four kinds of fact, each to one entity or none, and never creates an entity
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "An address: a record's author written Name <address> gives ids.email to the one person or org whose name or plain alias the name folds to. A chat id: an author written Name <id>, the id not an address, gives ids.<source> the same way. A shown name: the name a system shows for an address or id an entity already lists, when it isn't one of its names or aliases, becomes a plain alias, a trailing (...) dropped. Two engines: one spelling, capitalised, in two engines' transcripts on overlapping utterances of a recording becomes an asr alias of the one entity it is within matching's fuzzy distance of, when the recording mentions that entity. Recipients aren't read: the index keeps authors only. A fact that matches two entities becomes a tier 2 card; one that matches none waits for the miner; one the store refuses (DR-0463, DR-0464) is skipped and listed with the round. A recorder's polished transcript is a rewrite of its raw one, not a second engine. A fact that matches two entities becomes a card for each: an id card, a kind of its own that is accepted or rejected as it is, or its alias on that entity's alias card when the round has one, so a round keeps one card per entity. Two engines are two transcripts of one recording whose records name different engines, an utterance of each overlapping the other in time. Tier 1 reads the index only, as the miner does."
    not_chosen:
      - "A new person from every sender: newsletters and one-off senders would fill the entities."
      - "Speaker labels as tier 1: a label names no entity until one exists, and a near match is a judgement."
      - "Recipients from the raw log: tier 1 would read the vault's files beside the index, for facts the recipients' own mail gives as authors."
