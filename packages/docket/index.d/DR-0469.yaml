decisions:
  - id: DR-0469
    title: Tier 1 applies four kinds of fact, each to one entity or none, and never creates an entity
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "An address: a record's author written Name <address> gives ids.email to the one person or org whose full name or plain alias, two words or more, the name folds to; a one-word name, which two people may share, is a card. A chat id: an author written Name <id>, the id not an address, gives ids.<source> the same way. A shown name: the name a system shows for an address or id an entity already lists, when it isn't one of its names or aliases nor another entity's, and is one of its own shortened (each of its words a word of it, its initial or a start of three letters or more, never one longer than the word it stands for, so Gáborné is no alias of Gábor), becomes a plain alias, a trailing (...) dropped. An address or id shown with names that can't all be one person's is a shared sender, a service's notification address or a team's, and gives nothing; the index keeps every chunk, so it stays shared at every later round. Two names are one person's only when every word of the shorter is a word of the other or an initial of one, in any order (Example, Ada and A. Example are Ada Example's); Ann and Anna, or Dan and Dániel, make a shared sender, a miss rather than a wrong fact. An address or id tier 1 gave while its sender looked like one person's, and no one undid, it takes back once the sender looks shared: an undo line by tier1, with the fact's rule and why: now shared, which stoplists it, listed with the round as taken back, a never-store value hidden; one the store refuses is skipped and listed. Two engines: one spelling, capitalised, in two engines' transcripts on overlapping utterances of a recording becomes an asr alias of the one entity it is within matching's fuzzy distance of, when the recording mentions that entity. A spelling the miner's own screens catch is a card, never a fact: a common word or one capitalised only at a sentence's start (DR-0465's lower-case rule over the chunks that hold it), a case form of the name it is near or one matching judged common, or a word of another entity's name. Recipients aren't read: the index keeps authors only. A fact that matches two entities becomes a tier 2 card; one that matches none waits for the miner; one the store refuses (DR-0463, DR-0464) is skipped and listed with the round. A recorder's polished transcript is a rewrite of its raw one, not a second engine. A fact that matches two entities becomes a card for each: an id card, a kind of its own that is accepted or rejected as it is, or its alias on that entity's alias card when the round has one, so a round keeps one card per entity. Two engines are two transcripts of one recording whose records name different engines, an utterance of each overlapping the other in time. Tier 1 reads the index only, as the miner does. A card whose value a never-store list holds is left out, counted with what tier 3 left out, so neither show nor its JSON prints it."
    not_chosen:
      - "A new person from every sender: newsletters and one-off senders would fill the entities."
      - "Speaker labels as tier 1: a label names no entity until one exists, and a near match is a judgement."
      - "Recipients from the raw log: tier 1 would read the vault's files beside the index, for facts the recipients' own mail gives as authors."
