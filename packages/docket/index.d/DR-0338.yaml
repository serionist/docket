decisions:
  - id: DR-0338
    title: The vector list's top 200 is a third list in the reciprocal-rank fusion at weight 0.5, checked against chunks, never above an all-words hit, and skipped with its reason when it can't run
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#67"]
    description: "The query is the embedder's query prefix and its words and phrases without its time words. The scan's top 200 is checked against chunks on the search's own connection, by id and input hash, and a mismatch dropped, since the scan's connection may see a moment the search's doesn't. It fuses with the FTS cascade (all words, any word, prefixes, each ordered as DR-0231, DR-0232 and DR-0282 order them) and the entity list by reciprocal rank, k 60, at weight 0.5 against their 1 (DR-0117), and a chunk only it found has found_by vector. A chunk only the vectors found never ranks above an all-words hit, at any k: past the 62nd all-words place the vector list's first place (0.5/61) outscores one in the fusion alone, so those it passed move to just after the last all-words hit, in their order; an any-word or prefix hit may still fall behind one. On the invented set weight 0.5 kept the whole paraphrase and typo lift of weight 1 and no kind's MRR fell by more than 0.01, where weight 1 cost inflection 0.04 and time-bound 0.08; the all-words rule changed no kind's numbers there. Facets and the candidate count take the FTS and entity candidates and the vector candidates that reach the fused top k. The stage is skipped when models are off or their block doesn't read, the worker is down or doesn't answer within 2 s, sqlite-vec or extension loading is missing, the query is only time words or filters, or the index has no table for the model yet. SearchResult gains a models field (on or off, the model, why); the CLI, the MCP text and the Search page say it in one line only when models are on and the stage was skipped, the Search page marks a vector-only hit \"by meaning\", and docket eval prints the vectors' coverage and how many questions ran without the stage. A reranker (#88) may set its own weight: weight 1 fed it better."
    binds:
      - Every keyword stage answers as it does today when the vector stage is skipped.
      - No id reaches the fused ranking unless chunks holds it with the input its vector was made from.
      - A chunk only the vectors found ranks after every all-words hit.
    not_chosen:
      - "Weight 1: it cost inflection's and time-bound's MRR without a reranker."
      - "Vector-only chunks after the all-words hits only when that stage found k or more: below that a chunk sharing none of the words could still sit above one holding every word, and on the invented set the two rules gave the same numbers."
      - "Vectors replacing the FTS order: names and inflections fall."
      - "Facets over every fused candidate: the vector top 200 would swamp them."
