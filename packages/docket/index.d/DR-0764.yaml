decisions:
  - id: DR-0764
    title: A Docket commit is the add and the commit; git's identity is kept for the process, and the staged check asked only after a commit that failed
    status: proposed
    at: "2026-10-21"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#266", DR-0753]
    supersedes: [DR-0530]
    description: "A commit of Docket's is the add and `git commit --only`, with nothing asked between them. Whether git has an identity (user.name and user.email, at any level, as has_identity answers) is asked once per repo and process, and kept while every config file git reads keeps its size and time and the GIT_AUTHOR_ and GIT_COMMITTER_ variables are the same, as DR-0767 keeps a repo's config answers. With none, the commit carries the owner's identity from vault.yaml, as before, so a name with an empty address, or an identity given in part, still commits as the owner. With one, the commit passes user.useConfigOnly=true, so git takes its identity from its config and environment only, never one it guesses from the host's name: where a config file the kept answer doesn't follow (the system's, an included one) lost it, the commit fails, git is asked again, and the owner's goes in. A change there that gives git an identity is seen when the process starts again. The staged check (`diff --cached`) runs only when the commit fails, since a commit with nothing new fails and is None as before; a failure that isn't the identity's raises git's own error, as before. With the unmerged paths read from the index (DR-0765), a commit makes three git calls where it made six: the run files' status, the add and the commit. A process's first commit in a repo asks the identity too: each command of the CLI once, as before, and the service once while git's config stands. A ledger write asks its op files' state in one status where it asked a diff against HEAD and a status: each code whose path the diff lists the same way (changed in the index or the working tree, deleted from the index, added, added and changed) or the status alone lists (untracked, ignored, added and deleted), and the two calls as before for any code the status can't settle (a file staged and changed again, which may be back to HEAD's bytes; one deleted from the working tree, which may only have been added with -N; a rename or copy, whose pairing weighs the working tree; an unmerged path). Before it refuses a write for a lost op line, the diff against HEAD says which files changed, as before: the status also marks a file whose bytes changed and whose content git reads the same, as a CRLF save under eol=lf leaves it. A crash leaves what it left before: the add's index, never a commit."
    binds:
      - "A commit holds what it held before: its paths, its message, no hooks, git's identity where git has one and the owner's where it has none."
    not_chosen:
      - "Asking git only after a failed commit, the commit taking git's identity first: a name with an empty address, or part of an identity given by the environment, would commit with git's half where the owner's went in before."
      - "Asking for git's identity once per opened vault, as DR-0530 did: a service asks on every call, about 2,000 calls in the suite."
      - "Keeping the answer in the vault's own folder, so each command of the CLI skips it too: one more file for one call a command."
      - "Reading a failed commit's message for a missing identity instead of asking: git translates its messages, and a wrong guess would commit with the owner's over a user's own."
      - "Keeping the ledger's two calls: one more git start on every ledger write, for states the status settles the same way."
