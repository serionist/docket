decisions:
  - id: DR-0764
    title: Meetings reads the snapshot 14 days either side of today and takes q, stream and its own suggest, never the items' kind, who and k
    status: proposed
    at: "2026-10-21"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#205", "#252"]
    description: "The Meetings page's list reads the snapshot from 14 days before today to 14 days after, as DR-0666 says, so a meeting from before the window with an open point still shows on its day and no archived meeting does. It goes by day: today and the days after in order, then the earlier days, newest first, under a line that says so; each day by start. A meeting is dimmed when cancelled or declined, with its badge (tentative's in ochre), and when it has no standing point, rolled ones aside, and no open item. Its line says now while it is under way and shows its time in muted ink once it is over, by the read's own clock. The shared q finds a meeting by DR-0665's text, its attendees and points included, and stream keeps the meetings of that stream; kind, who and k are the items' filters and are left out of its canonical URL, never refused, as the Queue leaves the Ledger's own out. suggest=1, with a meeting open, asks the panel for the items worth raising in it. text keeps a material in the viewer for an open meeting as for an item. The counts say how many meetings, the window and how many points are open."
    binds: ["Meetings lists no archived meeting, and the items' filters never narrow it."]
    not_chosen:
      - "The meetings view: it lists archived meetings and leaves out an older meeting whose point is still open."
      - "who over the organiser and attendees: q finds a meeting by them already, and who matches one person on an item."
      - "k and Show more: four weeks of meetings fit one list."
