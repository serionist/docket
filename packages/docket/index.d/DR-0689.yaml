decisions:
  - id: DR-0689
    title: The sync writes what its agents found into the ledger in one ledger_batch by sync, dry run first, in a fixed order, with no proposal queue, and ends with the old summary in chat
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#210"]
    description: "After the agents the skill reads a fresh snapshot with ledger, an item's old source that read can't open searched by its words around its day, and writes one batch, by sync, in this order. Closes: done or drop, only on a CLOSES line, its locator in note; nothing closes for being old. Asks, from OWED, INVITES and WAITING: one item per real ask, an open one getting a log with the new locator and a set of a moved due; an item a CLOSES line closes getting a log for an ask made before the evidence, an add only for one after; a new one an add, untriaged, who the name the ledger already uses for that person (ledger's list, who=), its source where the answer goes, the other locators in note, opened the ask's day, due only a real date, a stream the ledger holds. Meetings: a set of each MEETINGS line's fields. Links by time (DR-0651). Minutes: a point_set per MINUTES line by point id, then OUTCOME as the meeting's outcome, the vendor summary's guessed owners and dates left out. Rollover. Prep: proposed points for the next 5 working days' meetings the owner presents in or owns a part of, customer meetings and new series, from suggest, each a question for that call, none for dailies and none the dry run shows rolled in; a prep item only for real work before the call. Streams: a set only from STREAMS lines. Archive last, with no item. The dry run lists every refusal; each is fixed, a look-alike becoming a log on the item it names unless it is really another ask, and the batch is written; a write refused after a clean dry run takes a fresh snapshot and another dry run. New items land untriaged, which is the Inbox. Then the summary, read from the ledger after the write: Meetings and prep (each meeting the owner has something to do for, with its open items and open points, those proposed this run marked, and the outcomes written), Today, This week, Whenever, Invites and Waiting on others, a line each; then what changed and what the sync closed by itself, the sources that didn't run and why, how many records wait on the Staging page, the meetings rollover left with nowhere to go, the LEARNED lines written and where, the batch to undo whole, and the stale briefs and proposed decisions, said once. The owner answers in free text, written as one batch by user, or hands over to /docket:tasks. Nothing is drafted before that. A message is a draft and follows the project's drafting notes: a chat's draft tool, never its send; a mail left as a draft and sent only on the owner's word for that one mail, never where the owner's own rules say drafts only. The agents stay read-only on every source."
    binds:
      - Nothing is closed without a locator that shows it.
      - The sync writes straight into the ledger, by sync, and keeps no proposal queue.
      - Rollover comes before the proposed points, so a point it carries isn't proposed again.
      - No message is sent without the owner's word for it, and none where their rules say drafts only.
    not_chosen:
      - "A proposal queue the owner approves: an owner's old sync wrote straight in, every op is undoable, and the Inbox is where new items wait."
      - "A batch per agent: one ask seen in two sources would dedupe only by luck, and one dry run shows the whole sync."
      - "Points before rollover, as when setting an outcome rolled points at once: rollover is an op now, so its copies show only after it."
      - "Harvest files or digests as a sync's record: the raw holds what was read, and the summary says what it meant."
