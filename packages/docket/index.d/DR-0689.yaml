decisions:
  - id: DR-0689
    title: The sync writes what its agents found into the ledger in one ledger_batch by sync, dry run first, in a fixed order, with no proposal queue
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#210"]
    description: "After the agents the skill reads a fresh snapshot with ledger and writes one batch, by sync, in this order. Closes: done or drop, only on a CLOSES line, its rid in note; nothing closes for being old. Asks, from OWED, INVITES and WAITING: one item per real ask, an open one getting a log with the new rid and a set of a moved due, a new one an add, untriaged, its source the rid the answer goes to, the other rids in note, opened the ask's day, due only a real date, a stream the ledger holds. Meetings: a set per MEETINGS line. Links by time (DR-0651). Minutes: a point_set per MINUTES line by point id, then OUTCOME as the meeting's outcome, the vendor summary's guessed owners and dates left out. Rollover. Prep: proposed points for the next 5 working days' meetings the owner presents in or owns a part of, customer meetings and new series, from suggest, each a question for that call, none for dailies and none the dry run shows rolled in; a prep item only for real work before the call. Streams: a set only when the news moves where a stream stands or its next step. Archive last, with no item. The dry run lists every refusal; each is fixed, a look-alike becoming a log on the item it names unless it is really another ask, and the batch is written. New items land untriaged, which is the Inbox; every op is undoable, and the summary names the batch so the owner can undo it whole."
    binds:
      - Nothing is closed without a rid that shows it.
      - The sync writes straight into the ledger, by sync, and keeps no proposal queue.
      - Rollover comes before the proposed points, so a point it carries isn't proposed again.
    not_chosen:
      - "A proposal queue the owner approves: an owner's old sync wrote straight in, every op is undoable, and the Inbox is where new items wait."
      - "A batch per agent: one ask seen in two sources would dedupe only by luck, and one dry run shows the whole sync."
      - "Points before rollover, as when setting an outcome rolled points at once: rollover is an op now, so its copies show only after it."
