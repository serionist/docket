decisions:
  - id: DR-0684
    title: docket ledger show --all --json gives each object as show gives it by its ref, stamped and read under the vault lock
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#202"]
    description: "docket ledger show --all --json, the read DR-0659 gives the owner's mirror, is today, stamp, items, meetings and streams: every item, meeting and stream that stands, archived ones too, each exactly what docket ledger show <ref> --json gives, its ref naming it alone, so no other holder of its number comes with it; items by the day each opened, meetings by start, streams by name. The stamp is the op files in name order, each its path from the vault's root, its size and its mtime_ns as os.stat gives them, and lock, the vault lock's file, which the mirror's own filelock.FileLock takes. The stamp is taken under the vault lock and the read runs under it too, from the index's tables brought up to date or the op files folded in memory (DR-0645), so a write lands before both or after both. Every object is read in a few queries for all of them, each result made by the code that makes show's, with the collector paused: the perf ledger, 5,000 items and 2,000 meetings, in under two seconds with its JSON. --all takes no ref and gives JSON only. Its shape only gains fields."
    binds:
      - Each object in show --all --json is what show <ref> --json gives.
      - The stamp is taken under the vault lock, and the read runs under it.
      - Its JSON's shape only gains fields.
    not_chosen:
      - "The stamp alone under the lock, the read after it: a write landing between them would leave a read newer than its stamp, which would no longer say what was read."
      - "Each object with the others that held its number, as show by a number names them: show by the object's ref, which a script can repeat for any one object, names none."
      - "One show per object: a few queries each, seven thousand times on the perf ledger."
      - "A text form of --all: the read is for a script; a person reads one object at a time."
