decisions:
  - id: DR-0461
    title: A proposal's key is its kind, its entity and its folded text; the stoplist is folded from the log, and tier 1 applies a key at most once
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#68"]
    description: "A key is <kind>:<entity or ->:<folded text>: new:-:clio for a new entity's spelling, alias:cleo-test:clio for an alias, id:ada-example:email=ada@example.com for an id, name:<entity>:<lang>=<folded name> for a name. The stoplist is the keys whose latest op is a reject or an undo of an add or a create, and not a lift; it has no file of its own. A rejected new-entity card stoplists every spelling it held, so a regrouping next week can't bring the name back under another spelling, and unticking a spelling in an edit rejects that spelling. Tier 1 never applies a key the log shows it applied before, whatever happened to it since, so a fact the user undid or deleted by hand stays gone."
    binds:
      - Keys are written into the log's lines, so their form is part of the log's format (DR-0460).
      - The miner never shows a card holding a stoplisted key, whatever spelling leads it.
    not_chosen:
      - "A stoplist file beside the log: two places to keep in step across machines."
      - "A key per card: next week's grouping can lead with another spelling and the rejected name comes back."
