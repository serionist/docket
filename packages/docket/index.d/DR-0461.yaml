decisions:
  - id: DR-0461
    title: A proposal's key is its kind, its entity and its text folded as aliases.folded is; the stoplist is folded from what each decision rejects; tier 1 applies a key at most once
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#68"]
    description: "A key is <kind>:<entity or ->:<text>, the text folded as the index folds aliases.folded: the index's fold over words(), joined by one space; an id's value casefolded. new:-:nortwin says a spelling isn't a new entity's name; alias:northwind:nortwin that it isn't that entity's alias, the entity possibly one a card proposed. An add's line names what it added: alias:<entity>:<text>, name:<entity>:<lang>=<text>, id:<entity>:<key>=<value> (id:ada-example:email=ada@example.com), related:<entity>:<type>=<target>; a create's line new:-:<its first name, by language code>. Rejecting a new-entity card stoplists new: keys for its name and for each spelling found only through a join (heard, vendor text, a case form); a label, or a name written in docs, mail or chat, that stands on its own stays a candidate, so a second person behind it isn't hidden for good. Rejecting an alias card stoplists the alias: key of each spelling on it, and unticking a spelling in an edit stoplists the alias: key for that entity, so the spelling stays a candidate elsewhere. Undoing a create from an earlier round stoplists by the same rule; undo's other keys are as DR-0462 says. Lines are ordered by their time, then their id's second, machine and number, the number as a number, so a second's tenth op comes after its ninth. The stoplist is the keys whose latest line is a reject or such an undo, and not a lift; it has no file of its own. Tier 1 never applies a key the log shows it applied before, whatever happened to it since, so a fact the user undid or deleted by hand stays gone."
    binds:
      - Keys are written into the log's lines, so their form is part of the log's format (DR-0460).
      - "The miner never offers a spelling in the role a stoplisted key names: as a new entity's for new:, as that entity's alias for alias:."
    not_chosen:
      - "A stoplist file beside the log: two places to keep in step across machines."
      - "A key per card: next week's grouping can lead with another spelling and the rejected name comes back."
      - "new: keys for every spelling on a rejected card: a label or a written name that is a second person would be hidden for good."
      - "The text as typed or folded whole: a doubled space or a hyphen would make another key than the index's alias."
