decisions:
  - id: DR-0451
    title: The worker runs the reranker as a second ONNX Runtime session when the spec names it, answers rerank by batches of 10 up to a deadline, and keeps the embedder serving when the reranker can't run
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#88"]
    description: "The spec names the reranker only when it is on for the machine: its model and tokenizer files, its token limit (512 on CUDA, 256 on the CPU), its device, and the install's time for a batch of 10 (DR-0455); the question set's floors test passes a spec of its own that names it. The worker loads it after the embedder and scores one pair before its hello, which names the reranker and the provider its session got. A reranker that fails to load, or whose session gets a provider other than its device's (a CUDA session that fell back to the CPU runs bge's fp16 file at about 4.3 s for 10 pairs), is off in that worker: the hello says so and why, docket models status shows it, rerank answers RerankerOff, and the embedder keeps serving; a failure to load the reranker never ends the worker. A request is {id, op: rerank, query, texts, deadline}, the deadline a wall-clock time in seconds; the answer is the scores as base64 float32, one per text in order, or an error by its type only (DR-0155): PastBudget when the deadline came first. Each pair is the query and a chunk's input without the passage prefix, which the core caps at 4,096 characters and the tokenizer truncates longest-first, so a long query never fails. Pairs go in batches of 10, and the worker starts no batch, the first included, that it expects to end past the deadline, by the last batch's time or, before the first, the install's. The CPU session takes ONNX Runtime's default threads, one per physical core; the pass's threads(), half the logical cores, is the same 16 on the 32-thread desktop, so the two differ only on a CPU without SMT. The CUDA session's arena grows by what it asks for. Measured on the desktop: batches of 10 took the same time as one of 50 on the GPU (124 against 134 ms) with 2.3 GB of VRAM against 4.8 GB, and less on the CPU (0.87 against 0.92 s on 4 threads); 32 threads on the CPU took 0.86 s against 0.42 s on 16. The client counts a rerank as a query, so the pass's batches wait behind it, and stops waiting at the deadline plus 0.2 s."
    binds:
      - No text of a rerank reaches a log or an error message.
      - A reranker that can't load, or gets another provider than its device's, leaves the embedder serving.
    not_chosen:
      - "A worker process of its own for the reranker: a second start, check and restart path for a model the same environment runs."
      - "Ending the worker when the reranker fails to load, as for the embedder: vectors would go down with it."
      - "One batch of every pair: twice the VRAM on the GPU, slower on the CPU, and no point to stop at the deadline."
      - "The pass's threads() for the reranker: the same 16 on the desktop, but half the threads on a CPU without SMT (865 ms for 30 pairs on 4 threads against 563 on 8 here)."
      - "Answering the scores done by the deadline: a top half reranked is harder to read and to test, and the issue keeps the fused order past the budget."
