decisions:
  - id: DR-0488
    title: A promotion writes each source's records in run files of at most 16 MiB
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: When a source's ready records pass 16 MiB of JSON lines, the promotion writes them in order into several run files, each named as a run of its own by DR-0014's rule (the minute, the machine, a counter), and commits them together. A record is never split. The names and the layout of raw don't change, so an older Docket reads them; this refines DR-0014's one file per run for large promotions.
    binds: ["No run file Docket writes passes 16 MiB, unless one record alone does."]
    not_chosen:
      - "One file per promotion: a first scan of a large folder writes a file past GitHub's 100 MB limit."
      - "Splitting in the scan: promotion is the user's, and one promote would still join every batch in one file."
