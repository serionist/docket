decisions:
  - id: DR-0488
    title: A promotion writes each source's records in the order they were staged, in run files of at most 16 MiB
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69", "#107"]
    description: Promotion writes a source's ready records in staged_at order, so the last version staged of a record is the last in raw, which the index takes as current. Intake gives each record it stages a time after everything staging holds, so the order holds when the clock hasn't moved (Windows' moves every 15.6 ms); records staged by an older Docket with one time break the tie by their own time, then by key. When a source's records pass 16 MiB of JSON lines, promotion writes them in that order into several run files, each named as a run of its own by DR-0014's rule (the minute, the machine, a counter), and commits them together. A new run's counter comes after the highest its minute has, never in a gap a deleted run file left, so a later run always sorts later. A record is never split. The names and the layout of raw don't change, so an older Docket reads them; this refines DR-0014's one file per run for large promotions.
    binds:
      - No run file Docket writes passes 16 MiB, unless one record alone does.
      - Of two staged versions of one record, the one staged later is written later.
      - A new run file sorts after every run file of its minute and machine.
    not_chosen:
      - "The staging key's order, a sha256 of rid and version (DR-0024): the older version can land last in raw."
      - "One file per promotion: a first scan of a large folder writes a file past GitHub's 100 MB limit."
      - "Splitting in the scan: promotion is the user's, and one promote would still join every batch in one file."
