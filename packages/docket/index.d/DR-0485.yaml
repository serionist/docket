decisions:
  - id: DR-0485
    title: Document text is extracted in a child process with limits, and a file is stored whole or not at all
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: "The scan starts python -I -X utf8 -m docket.documents.child in a temp folder with the mapper runner's stripped environment, a fresh one every 100 files, and hands it one file at a time. The child caps its own memory before it says ready, at 2 GiB where the system enforces a cap: RLIMIT_AS on Linux, and on Windows a job object of its own with JOB_OBJECT_LIMIT_PROCESS_MEMORY, since a venv's python.exe is a launcher that can start the interpreter before the parent's job catches it. Its hello gives its own pid and the cap it got, and the parent stops a child whose cap isn't the one asked; a cap the system refuses ends the child before its hello. The parent also puts the child in a job with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE, so a stop takes the interpreter with the launcher. The child keeps numpy out of its own process, which openpyxl would import and whose BLAS reserves memory per core. It reads the file once, hashes those bytes, extracts from them and sends a part a line; the scan keeps a file's parts only once the child says the file is done. Limits: 120 s a file; 64 MiB a file; 2,000 pages counted by the page tree, never a pdf's own /Count, 1,000 slides, 100 sheets, and 10,000 rows and 256 columns a sheet; 1 MiB of text a part and 4 MiB a file; in a zip, 10,000 members, stored or deflated only, none sharing or overlapping another's bytes, each counted by what its deflate stream really holds, inflated a MiB at a time and never past what is left of the package's cap, at most 64 MiB each and 256 MiB together, and 100 to 1 for a member over 1 MiB; a DTD refused at the parser in every part we or openpyxl parse: our readers call defusedxml with forbid_dtd, and before openpyxl reads a workbook its parse functions are rebound to defusedxml with forbid_dtd, with lxml kept out of the child; a part nothing parses, such as an SVG image, is never judged. A file past a cap, damaged or protected gets one record saying why, with no parts and no text, and is read again only when its bytes change; an exception's type is named, never its message. A file stopped at the time limit, or whose child crashed, keeps its last version and gets no record; it is tried once more on the same bytes, and a second stop or crash makes the record. A file the system won't let the scan read now is skipped without a record."
    binds:
      - "No document is parsed in the service's or the CLI's own process. md and txt are the one exception: their decoding is plain UTF-8, or UTF-16 by its BOM, else Windows-1252, with no parser, so the scan may read one itself to compare it."
      - A file is stored whole or not at all, so the never-store check covers all the text it has.
    not_chosen:
      - "Extraction in the scan's own process with a timer: a thread can't be stopped, and a crash or a memory blow-up takes the service with it."
      - "Text kept up to a cap: the never-store check would miss what lies past it."
      - "The parent's job alone as the memory cap: a venv's launcher often starts the interpreter before the parent can put the launcher in a job, and the interpreter then runs uncapped."
      - "zipfile's own read as the bound on a part: it inflates a whole deflate stream before it cuts it to the declared size, and bzip2 and lzma inflate a whole chunk at once."
      - "A pre-scan of every part for a DTD, with images exempted by content type or name: the file chooses both, so a hostile workbook could type or name its shared strings as an image and have openpyxl parse the DTD."
