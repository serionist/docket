decisions:
  - id: DR-0554
    title: A rendered file is written only over Docket's own unedited text, never into a public repo, and never committed
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#163"]
    description: "A file is rewritten only when its first line is Docket's and the rest still hashes to it, or it is absent; otherwise (a hand edit, a hand-kept file at the path, or one that isn't UTF-8 text, as a UTF-16 one isn't) it is left and reported, and the owner moves its content into the entities and deletes it. A folder at the path is refused. Whenever a file Docket wrote sits at a path or one would be written, the consuming repo's remotes are probed anonymously, each once per process while its answer is sure: one anyone can read stops the file and is reported even when nothing changes; one that asks for a sign-in, as a private repo answers, doesn't stop it, since the owner named the path in a committed vault.yaml or at the console; one that couldn't be reached keeps the file from being written this time (\"couldn't check the remote; not written\") and is asked again next time. remote_visibility, which setup and the convert read, still answers unknown for both, so the owner confirms. The file is written through a temp file and a rename and never committed: Docket's commits hold only the vault's paths. It renders on docket render, which exits 1 when a file was left or refused, and after every curate write that committed something (apply, reject, lift, undo, a tier 1 round), once the store has let go of its lock; a Curate page decision holds the vault's lock around its own write, so its render runs under it. A render that fails is said in the write's result and never fails the write: a Docket or OS error by its message, anything else by its type only."
    not_chosen:
      - "Merging a hand edit: the entities are the source, and a merge would decide between the two for the owner."
      - "Asking at every render whether a remote that can't be checked is private: a curate write after every card would ask again."
