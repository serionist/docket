decisions:
  - id: DR-0579
    title: state/forgotten.jsonl lists what was forgotten by hash, merged by union, and every clone obeys it
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#182"]
    description: "state/forgotten.jsonl holds one JSON line per forget: schema_version 1; rids, the 32-hex rid hashes (staging's rid_hash) of the rids forgotten whole, each covering itself and every rid under it, every version, now and later; versions, objects {rid, key} with a rid's hash and staging's 32-hex key of one version, forgotten alone (a held rid's uncut copies, a folder file's and its parts' versions), which a release's keep of that exact version beats, being the owner's later word at the console; files, a folder file's identity as native holds it, its key and value (sha256:<64 hex> for its bytes, redacted_sha256:<64 hex> for its redacted text, DR-0483), so a file record with that identity stays out at any path and the parts under it with it; media, the rid hashes no media is stored on again, each rid forgotten whole and every rid it sits under; keys, the 64-hex media key ids (DR-0549) every clone deletes; old_paths, the 32-hex hashes of the old paths of the legacy notes a forget removed; import_hashes, each removed legacy note's import_hash (sha256:<64 hex> of its redacted body, which its frontmatter holds already, so nothing new enters git); at, in UTC; machine. Every field but at and machine may be empty: a line with only keys is an apply's (DR-0595) and, later, retention's. Hashes only: never a rid, a path, a key or a wrapped key, so a later history rewrite leaves nothing readable in it. It is written through a temp file and a rename, committed alone before the forget changes anything else, and merged by the vault's own *.jsonl merge=union (DR-0142), so no attribute line is added and an older Docket's cursor reader skips it by its name. In force are HEAD's lines and the disk's together, read as inforce reads vault.yaml (DR-0521), HEAD's cached by its commit id: a line on disk that HEAD lacks acts at once and is committed by the next gate call; a line HEAD has and the disk lacks still acts and is named as a problem, and Docket never commits the file while it lacks one. It fails closed as a release log does: a line that isn't one, or the file or state/ a link, stops every ingest and every gate call, named by its line number. Every reader of run files skips a listed line: RawLog, RawLookup's load, the index build, vault.status, the gate's cut scan and the notes import, their caches keyed by a run file's path, size and modification time; the index is built under the list's digest (DR-0593). Intake drops a listed record in memory before every other rule, by its rid, its version or a folder file's identity, its parts with it, counted as forgotten, a whole rid's media dropped and withheld as for never-store; the sweep drops a listed staged version and its media; media's screen and reader refuse a listed or a media rid, the reader's state forgotten; docket import notes refuses a note whose old path's hash is listed or whose redacted body hashes to a listed import_hash, so a note renamed, moved or copied stays out too, --take note included; read and verify say a listed rid was forgotten. Every gate call on every clone applies the list first (DR-0581)."
    binds:
      - No key, wrapped key, plain rid or path enters the list.
      - Every reader of run files skips a listed line; a scan holds it.
      - Docket never commits the list while it lacks a line HEAD has.
      - A later Docket reads every earlier schema_version of the list.
    not_chosen:
      - "Plain rids: they stay in history after a rewrite, and a rid can name a channel or a host."
      - "A list per source, as hold lists: a never-store forget spans sources, and the hash hides which already."
      - "A .txt list with a union line of its own: every existing vault would need a .gitattributes edit."
      - "A separate file for key ids: each forget writes both, and one line keeps a forget's parts together."
      - "The disk's list alone: an edit that deletes a line would bring a record back at once, a loosening by edit DR-0521 never allows."
      - "HEAD's list alone: the line a failed commit left on disk must act already."
      - "Old paths alone for a removed legacy note: the import keys a note by its path, so a note renamed, moved or copied would come back."
