decisions:
  - id: DR-0564
    title: A decision's status changes only by the user's click on the Briefs page
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#162"]
    description: "The user confirms or rejects with a click on the Briefs page: a same-origin form post with the browser's session, checked by the Guard, on the writer thread, refused when the decision changed since the page showed it, written as the decision's next rev by the owner (by: <owner>, Briefs page). A skill round recommends and ends with the page's link. doc_put, through MCP or the CLI, refuses any status but proposed and refuses supersedes; the take-in, doc_put's and docket doc redact's, refuses a hand edit that changes status, supersedes, replaces or contradicts, and any change at all to a confirmed or rejected decision, and leaves it on disk; a decision's status and links are read from its last commit, and a confirmed or rejected one is read whole from it (HEAD:<path>) by every read, the index, recall, the page, read and verify, so an edit no commit holds changes nothing. The index indexes a final decision's committed text and records one whose file differs as edited on disk, not taken in: this amends the index's rule of reading the working tree and never git objects (build.py's contract) for final decisions only, since their status is read from git already and their text has to agree with it. A confirmed or rejected decision is final: the one rev Docket still writes there is the redact pass's, which changes only what a redaction rule now covers. Claude could still drive the page in a browser, post its form with a session got from the token, or commit with git itself: each a deliberate step outside every door, the floor DR-0382 accepts. A browser agent the user tells to click is the user acting. DocStore.decide is that click's writer, the only one: a scan over the package pins that only the Briefs page's route calls it, and only it calls the next rev's builder."
    not_chosen:
      - "A console-only command with a code typed back (DR-0202): a stronger floor, but a code per batch for a weekly routine, read without the sources; a decision lets nothing private in."
      - "A token the page shows and the user types into the skill round: reading the page for it is the same act as clicking (DR-0382), with a token store on top."
      - "An MCP or CLI confirm that isn't pre-approved: auto mode and allow rules remove Claude Code's prompt."
