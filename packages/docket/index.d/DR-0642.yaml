decisions:
  - id: DR-0642
    title: add refuses an item that looks like an open one, as todo.py does, unless force is true
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#201"]
    description: "An open or snoozed item, or one an earlier add of the batch made, with the same source, or the same who (case aside) and at least 60% of the shorter title's words of four letters or more in the other, refuses the add, naming it and its title; force: true adds it anyway. Other open items with the same source are named in the result. The sync's dedupe leans on it today."
    not_chosen:
      - "No check: dedupe is the sync's judgement, but this is the net it has today."
      - "A warning only: a batch that doesn't read it adds the duplicate."
