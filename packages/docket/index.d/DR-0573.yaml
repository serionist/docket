decisions:
  - id: DR-0573
    title: Windows Hello through ctypes, LocalAuthentication through rubicon-objc, and polkit through pkcheck with one action file
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#143"]
    description: "docket.osprompt has one backend per system; each finds, without showing anything, whether a prompt is set up, and asks it. Windows 10 1709 and later: UserConsentVerifier through combase.dll with ctypes and no package. RoGetActivationFactory for Windows.Security.Credentials.UI.UserConsentVerifier gives IUserConsentVerifierStatics (af4f3f91-564c-4ddc-b8b5-973447627c65), whose CheckAvailabilityAsync finds it, and IUserConsentVerifierInterop (39E050C3-4E74-441A-8DC0-B81104DF949C), whose RequestVerificationForWindowAsync is the desktop's way to ask, with the terminal's window; each IAsyncOperation is polled through IAsyncInfo. The IIDs are the SDK headers' (UserConsentVerifierInterop.idl, windows.security.credentials.ui.h). macOS: LAContext's evaluatePolicy with LAPolicyDeviceOwnerAuthentication, so Touch ID, an Apple Watch or the login password, through rubicon-objc (BSD-3-Clause, pure Python, no dependencies, darwin only), a fresh context each time so no answer is reused. Linux: /usr/bin/pkcheck by its absolute path, for Docket's own process as pid,start-time,uid, with --allow-user-interaction and --enable-internal-agent, so the desktop's agent asks, or with none, as over SSH, a text agent at the console. The action is io.github.serionist.docket.confirm, auth_self for any, inactive and active sessions, never auth_self_keep, which passes again for five minutes; its message is fixed in the file, as polkit refuses details from a caller that isn't root. The file ships in the package and the owner installs it once with sudo; docket vault status prints the line."
    binds:
      - "The action id io.github.serionist.docket.confirm and the file's defaults are a contract with what owners installed: a later act uses the same action, so no owner installs the file again."
      - rubicon-objc is pinned, only on macOS, and a new version comes in by its own reviewed bump.
      - Each backend's calls into the system sit behind one function per call, which the tests fake; CI runs the real availability check on each system, and never a real prompt.
    not_chosen:
      - "pywinrt's packages: winrt-runtime and one per namespace, compiled, and the projection lacks the interop interface a desktop process needs."
      - "pyobjc: pyobjc-core, Cocoa and Security, compiled and several MB, for one call."
      - "A Swift or C helper: a build per system, and signing on macOS."
      - "Polkit over D-Bus with jeepney, already installed on Linux: it brings no text agent, so nothing asks over SSH; pkcheck does."
      - "pkexec's own action: it asks for an admin, and its message says a program runs as root."
      - "One action per act: each later act would need every owner to install the file again, and until then it would ask the code."
      - "LAPolicyDeviceOwnerAuthenticationWithBiometrics: a Mac without Touch ID would get the code, where the login password is a factor only the owner knows."
