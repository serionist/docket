decisions:
  - id: DR-0655
    title: Old meetings come in keyless, and the calendar catch-up (DR-0652) joins them after the import; the import sets no key
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#202"]
    description: "As DR-0652 decides. The import, as the export, gives no meeting an event or a series. After it, docket ledger calendar --since <the calendar's first day> joins each old meeting a calendar record matches, through a meeting add with continues (DR-0621), on the same start to the minute and the same subject with case and spaces folded (DR-0649). A join keeps the continued meeting's id and number, so the old M- number holds whichever ran first, the import or the calendar step's meeting for that event. One function builds keys, #200's, for its step and its catch-up. The import's dry run gives the joins by calling the catch-up's dry run, read-only, over the ledger as the import would leave it (DR-0654): the report the roadmap asks to spot-check, a renamed series named as a near miss."
    binds:
      - The import writes no event and no series; old meetings get their keys only through the catch-up's joins.
    not_chosen:
      - "The import setting the key of the one record matching a meeting's start and subject: in the live clone the calendar step makes keyed meetings at each promotion, before the import runs, so an imported add carrying the same key would be a later add that loses, and its old M- number would survive only as a number the meeting held; a join through continues keeps the old meeting's id and number."
      - "The export script setting it, as #199's plan said: a second builder of keys outside Docket, with the same loss."
