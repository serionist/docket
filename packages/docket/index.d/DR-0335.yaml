decisions:
  - id: DR-0335
    title: The provider and the device are chosen per machine in the user's config, not in vault.yaml
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#67"]
    description: "The user's config.yaml gains a models block: provider (local or none; api is refused as not yet), device (cpu or cuda, written by docket models install) and embedder. A block that doesn't read (an unknown key or value, or api), or a config.yaml that isn't YAML, turns models off and says why in docket models status, the service's status and search's models field; it never stops the service or keyword search. vault.yaml is committed and shared by every machine of a vault and refuses unknown keys (DR-0021), so a machine not yet upgraded would refuse the vault, and a per-machine map in it would change the vault whenever a machine is added. The index is per machine (DR-0115), so each machine embeds with what it has. The block is not a door before the first release, as the REST API isn't (DR-0151). Whether a vault's text may leave the machine does belong to the vault: the API provider's opt-in (#89)."
    not_chosen:
      - "vault.yaml, keyed by machine: a door, refused by machines not yet upgraded, changed whenever a machine is added."
      - "Refusing a bad block, as the service's keys are: a typo in an optional feature would stop keyword search too."
