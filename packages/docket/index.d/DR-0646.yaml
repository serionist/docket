decisions:
  - id: DR-0646
    title: "An event record makes a meeting: the core reads its rid, thread, ts, title, author, to and fidelity, the first Where, Response and Cancelled lines of its text's header, and native's end and all_day"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#200"]
    description: "DR-0105 has the core turn the calendar's records into meetings; this says what of a record it reads, so any calendar source's mapper can make them. A record of kind event is one occurrence, and its rid is the meeting's event, compared exactly (DR-0622's key): a move or a rename must keep it, so a mapper builds an occurrence's rid from an id that holds its series and its original slot, as Exchange's immutable occurrence id does, or from the series' id and the original start. thread is the series; ts is the start; title is the subject; author is the organiser, Name <address>; to holds the attendees. Every calendar mapper writes two native keys: end, the end as a moment with its zone, and all_day, true or false. The text's header is its lines before the first blank line: the first line there starting Where: gives the place, the first starting Response: the owner's response (accepted, tentative, declined, none or organiser), and a line Cancelled a cancellation. A body a later mapper adds goes after the blank line and is never read, nor is any other header line. fidelity derived marks a rid built from the record's content. The reference calendar source writes all of it today; nothing else of a record is read."
    binds:
      - A record of kind event is one occurrence, and its rid, which a move or a rename keeps, is its meeting's event.
      - Every calendar mapper writes native.end and native.all_day.
      - "Only the text's header is read, its lines before the first blank line, and in it only the first Where: line, the first Response: line and a Cancelled line."
      - The core reads rid, thread, ts, title, author, to, fidelity, those header lines, native.end and native.all_day, and nothing else of the record.
    not_chosen:
      - "Reading the reference mapper's own native keys (its raw response, its label): every other calendar source would copy one provider's shapes."
      - "event built by the core from the series' id and the original start: the record is already one per occurrence, and only its mapper knows the provider's ids."
      - "A new record field for the end: the raw record's version is a door of its own (DR-0020), and native already carries it."
      - "Reading Where:, Response: and Cancelled anywhere in the text: a body quoting an invite would be read as the event's own place or response."
