decisions:
  - id: DR-0574
    title: The system's answer chooses the prompt; the one way back to the code where a prompt is set up is a marker only an admin or root makes
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#143"]
    description: "At each question docket.osprompt looks for the marker first, then asks the system whether a prompt is set up. The marker sends this machine to the console code: console-code in a Docket folder under ProgramData on Windows, the folder SHGetKnownFolderPath(FOLDERID_ProgramData) gives and never the environment, made from an elevated shell, so UAC's secure desktop puts the step in front of the owner; /Library/Application Support/Docket/console-code on macOS and /etc/docket/console-code on Linux, made with sudo. It counts only when no process of the owner's could have put it there or can replace it. Every entry on its path, each folder from the drive or / down and the file itself, is owned by root, or on Windows by Administrators, SYSTEM or TrustedInstaller, and none is a symlink or a reparse point. The owner can replace none of them: on Windows the owner's token lacks DELETE, WRITE_DAC and WRITE_OWNER on each entry and FILE_DELETE_CHILD on each entry's folder; on macOS and Linux no folder on the path is writable by the owner unless it is sticky. The marker's own folder gives the owner no right to add a file either, which the README's icacls line takes off on Windows, and the file has one link. Rights are judged by AccessCheck against the owner's token on Windows, the linked unelevated token when Docket runs elevated, and by access(2) on macOS and Linux, so groups, ACLs and deny entries count; never by reading entries by hand. What an ancestor lets the owner add beside the path doesn't matter: stock C:\\ and C:\\ProgramData let users make folders, but not replace these. With UAC off, or as root, every process of the owner is an admin, so only the owner and link checks apply: the root floor. A user can make the Docket folder under ProgramData first, as CREATOR OWNER lets them; it fails the owner check, docket vault status names the check that failed, and the README's elevated lines remove and remake a folder the Administrators don't own. Without a marker, Windows: Available is the prompt; DisabledByPolicy, which only an admin sets since the user can't write HKCU's policy keys, and a Windows without the interop interface are the code; NotConfiguredForUser and DeviceNotPresent are the code only on a machine with neither a TPM nor a biometric device, and otherwise refuse with set up Windows Hello, or see the README for the console code, since certutil -DeleteHelloContainer, which Microsoft documents as deleting the current user's Hello container, likely without elevation, would otherwise turn Hello into the code for a process running as the owner. A TPM is found by Tbsi_GetDeviceInfo (tbs.dll) and a fingerprint or face unit by WinBioEnumBiometricUnits (winbio.dll), neither needing elevation; an error from either counts as a device, so breaking the call never gives the code, and changing either answer otherwise takes an admin: turning the TPM off, disabling the device or stopping the biometric service. macOS: canEvaluatePolicy true is the prompt; passcodeNotSet is the code; any other answer refuses and names the marker (DR-0573). Linux: Docket's action file in one of polkit's actions folders (/usr/share, /etc, /run or /usr/local/share, under polkit-1/actions) with /usr/bin/pkcheck is the prompt; either missing is the code. Anything else the check meets, such as DeviceBusy or an error, refuses. Once a prompt is set up the code is never asked: a cancel, a failure, a timeout or no desktop to show it on is a no that names the reason. No flag, environment variable, config key or token chooses the code, for the owner's scripts either: whatever an owner's switch reads, an agent running as the owner flips (DR-0520). Root is the floor: passwordless sudo, UAC set to never notify, or a UAC bypass when the owner is an admin, makes the marker or removes the factor; accepted, since root is past every check Docket has."
    binds:
      - A test per system maps each availability answer, with and without a TPM or a biometric device and with and without the marker, to the prompt, the code or a refusal as listed, and a failed prompt to a no with no code asked.
      - "A test per system holds the marker's checks: an owner-made file or folder, an entry the owner can replace, a marker folder the owner can add a file to, a second link, a symlink and a reparse point each leave the prompt in place. On the Windows runner it runs on the real ProgramData path, judged with a token filtered as UAC filters an admin's."
      - "docket vault status says which yes this machine asks and why: the marker's path when it counts, the check it failed when it doesn't, without showing a prompt."
      - The README gives each system's commands to make the marker and to remove it; Windows' check the Docket folder's owner, remove and remake one the Administrators don't own, and take Users' inherited create right off it with icacls.
      - "The marker's paths are a contract with what owners made: kept, so a marker made once keeps counting."
    not_chosen:
      - "NotConfiguredForUser as the code on every machine: certutil -DeleteHelloContainer, run as the owner, would turn Hello into the code."
      - "The marker by its existence, or by its owner alone: an owner who can write a folder on its path moves in a file an elevated installer left behind."
      - "Every folder on the path held to giving the owner no right to add: stock C:\\ and C:\\ProgramData let users make folders, so no marker would ever count, and a Windows owner with a TPM and no Hello would have no exit."
      - "Reading the entries of each ACL by hand: groups, inheritance, deny entries and the token's filtering are AccessCheck's job."
      - "ProgramData from the environment: an agent running as the owner sets it."
      - "An owner's switch for the code (a flag, a variable, a config key): an agent running as the owner sets it."
      - "The code when the prompt fails: an agent makes it fail, over ssh localhost or by asking where no desktop is, and types the code."
      - "A per-machine record that the prompt was used, refusing the code after it: a file in the owner's folders, which the agent edits."
