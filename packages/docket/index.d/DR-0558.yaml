decisions:
  - id: DR-0558
    title: A brief never exists for a listed entity and never names a listed person in any shape
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#161"]
    description: "doc_put refuses a brief whose entity a never-store list holds by its id (slug_listed) or a name (listed), or that the people list names by any of its names, aliases or contact ids (neverstore.person_listed, the rule the people page drops a whole row by, DR-0553): a person listed by an address alone or by a nickname is still that person. It refuses one whose entities list holds an id slug_listed flags or an entity held so. It screens the brief's every line, its title among them, and every ref's doc id with phrases built from each people-list value: the value without its <address> and each address in it, as _forms reads a value, each name in both word orders, as _orders does; and the names, aliases and contact ids of every entity person_listed holds or whose name or alias listed() flags, so a nickname or handle the store knows is caught. A ref's doc id is also held to slug_listed. The refusal names the line, never the value, on top of the keywords list every doc is screened with. A brief edited by hand is held to the same checks, its form aside, before the next put takes it in or the redact pass commits it: one that names a listed person stays on disk, as one that says a keyword does. A list that gains a value later: docket brief stale and the briefs tool leave out a brief whose entity is now held, by the same rule, or whose entity is gone and any entity now holding its name is held, so orphaned never names a held entity, and count it as hidden; the Briefs page hides it, and hides a line a list now names, by URL too."
    not_chosen:
      - "The people list read as keywords as written: it reads a phrase in written order only, and a Name <address> value never matches as one string."
