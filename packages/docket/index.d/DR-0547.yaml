decisions:
  - id: DR-0547
    title: media_put stores one media file per rid, staged beside its record and committed to media/ once the record is in raw
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#42"]
    description: "The MCP tool media_put(rid, path, url), exactly one of path and url, and docket media put take a record staged or in raw. Checks in order: a version of the rid is staged or in raw; its source is in force, on and not private, and its latest version matches no never-store value; no hold covers it and no release with cuts does (a release with no cuts goes on; a hold beats a release); no media for it is in media/. The file waits as staging/_media/<source>/<rid hash>.<ext>.age, never committed, and replaces staged media for the same rid. Media has no state of its own: it is committed to media/<source>/<yyyy>/<mm>/<rid hash>.<ext>.age (the record's ts in UTC) after its record's run commit, waits while a version is staged or git-lfs is missing, and is deleted with its key at the sweep once no version of its record is staged or in raw, or a release with cuts covers it. The rid hash is staging's 32 hex of sha256; the extension comes from the bytes, else bin."
    binds:
      - Nothing commits from staging/_media/.
      - An attachment whose bytes matter is a record of its own under its message, and its rid gets the media.
    not_chosen:
      - "The native id in the file name: Plaud's has a slash, a mail's an @ and brackets."
      - "Media written to media/ at once for a record already in raw: one path through the gate's sweep and promotion for both."
