decisions:
  - id: DR-0547
    title: media_put stores one media file per rid, staged beside its record, screened at every gate call and committed to media/ once the record is in raw
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#42"]
    description: "The MCP tool media_put(rid, path, url), exactly one of path and url, and docket media put take a record staged or in raw. Four checks, under the settings in force: a version of the rid is staged or in raw; its source is in force, on and not private, no version of it staged or in raw matches a never-store value, and the gate dropped no version of it since the put (classified private, swept private or never-store, left out by a release); no hold covers it and no release with cuts does (a release with no cuts passes; a hold beats a release); no media for it is in media/. They run at the put before the fetch and again under the vault lock after it, at every sweep and at promotion; media failing one at a sweep or promotion is deleted with its sidecar and its key, counted and never named. The file waits as staging/_media/<source>/<rid hash>.<ext>.age with a sidecar <rid hash>.json (the rid, the key id, the type, the size, when; no content), never committed, and replaces staged media for the same rid. At a promotion with every check passing it moves to media/<source>/<yyyy>/<mm>/<rid hash>.<ext>.age, the month the UTC ts of the version in raw then and never moved after, and is committed after its record's run commit; a failed commit moves it back to staging, and the next promotion commits media/ files git doesn't track yet, after the checks read through their sidecars. Stored media is found by media/<source>/*/*/<rid hash>.*.age. The rid hash is staging's 32 hex of sha256; the extension comes from the first bytes, else bin."
    binds:
      - Nothing commits from staging/_media/.
      - An attachment whose bytes matter is a record of its own under its message, and its rid gets the media.
    not_chosen:
      - "The native id in the file name: Plaud's has a slash, a mail's an @ and brackets."
      - "Checking media only at the put: a version in raw kept media alive that the gate since refused, and promotion committed it."
      - "The month computed from the latest version's ts at each read: a ts changed between versions points at a month the file isn't in."
