decisions:
  - id: DR-0547
    title: media_put stores one media file per rid, staged beside its record, screened at every gate call and committed to media/ once the record is in raw
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#42"]
    description: "The MCP tool media_put(rid, path, url), exactly one of path and url, and docket media put take a record staged or in raw. Four checks, each reading only what is durable (vault.yaml in force, the raw log, staging's files and its decided keys, the hold lists, the release logs): a version of the rid is staged or in raw; its source is in force, on and not private, no version of it staged or in raw matches a never-store value, and no version of it was decided by hand (its rid hash in staging's decided keys, from a private classification or a promotion with cuts; a version staged with cuts; a version in raw cut); no hold covers it, no release with cuts does, and no release leaves a version of it out (a release with no cuts that keeps it passes; a hold beats a release); no media for it is in media/. They run at the put before the fetch and again under the vault lock after it, at every sweep and at promotion; media failing one at a sweep or promotion is deleted with its sidecar and its key, counted and never named. Any drop of a version of the rid (classify private, the sweep, a record intake drops in memory) deletes the rid's staged media, key and sidecar first and the version after, in the same lock. The sweep also deletes orphans in staging/_media/: a media file with no sidecar, a sidecar with no media file, and their keys, deleting what it can't read. The file waits as staging/_media/<source>/<rid hash>.<ext>.age with a sidecar <rid hash>.json (the rid, the key id, the type, the size, when; no content), never committed, and replaces staged media for the same rid. At a promotion with every check passing it moves to media/<source>/<yyyy>/<mm>/<rid hash>.<ext>.age, the month the UTC ts of the version in raw then and never moved after, and is committed after its record's run commit; a failed commit moves it back to staging, and the next promotion commits media/ files git doesn't track yet, after the checks read through their sidecars. Stored media is found by media/<source>/*/*/<rid hash>.*.age. The rid hash is staging's 32 hex of sha256; the extension comes from the first bytes, else bin."
    binds:
      - Nothing commits from staging/_media/.
      - An attachment whose bytes matter is a record of its own under its message, and its rid gets the media.
      - "#157 revisits deleting media on a hold or a hand cut: a release with cuts needs the audio, cut, so it would be put again."
    not_chosen:
      - "The native id in the file name: Plaud's has a slash, a mail's an @ and brackets."
      - "Checking media only at the put: a version in raw kept media alive that the gate since refused, and promotion committed it."
      - "The month computed from the latest version's ts at each read: a ts changed between versions points at a month the file isn't in."
      - "The sweep remembering in memory which rids it dropped a version of: lost when a sweep is killed, and blind to classify and intake, which drop outside it."
