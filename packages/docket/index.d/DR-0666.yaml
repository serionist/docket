decisions:
  - id: DR-0666
    title: What each day page lists and in what order; a snoozed item whose day has come counts as open and untriaged
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#203", "#204", "#205", "#206"]
    description: "The Ledger reads list over every state and shows open (the default), snoozed, closed or all: open grouped by due (overdue, today, this week, later, none) or by stream, kind, who or meeting as group says; snoozed by the day it comes back; closed by its closed day, newest first; archived items only with archived=1 (DR-0615). The Queue reads queue: the untriaged first, then discuss, claude, me and chase, each by due, none last. The Meetings page reads snapshot over since and until, 14 days back and ahead by default: by day from today, then earlier days, newest first, each day by start; cancelled and declined ones dimmed with their badge, and one with no points and no open items dimmed. Today reads snapshot from today to the end of the next working day, Monday to Friday in the owner's zone: the meetings left today, then that day's, cancelled and declined ones left out, each with its open points and open items; the awake items due today or before, by due; the last sync per source. Within a group rows go by due, opened and number. A list shows k rows, 100, and Show more adds 100; counts are over all. A snoozed item whose until is today or before counts as open and untriaged wherever a page lists items, as todo.py's visible_by_default and the old tasks app's inbox did: the fold never reads the clock, so the read does, and the queue view takes such items among the untriaged."
    binds:
      - No page lists an archived item by default (DR-0615).
      - A snoozed item whose until has come is open and untriaged on every page that lists items.
    not_chosen:
      - "The old tasks app's seven tabs as pages: the Queue holds its inbox and queue, the Ledger's states its open, snoozed and closed tabs."
      - "A wake op the sync writes for each snooze that ends: a write per item per day for what a read can say."
