decisions:
  - id: DR-0585
    title: The reconciled reading is the recorder's transcript with its applied fixes, rendered by the core from raw, the fixes doc and the screen in force
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#183"]
    description: "A fix applies when its state is sure or confirmed; its recorder text still stands once in the anchored line and Whisper's stands in the anchored Whisper segments, in the latest versions in raw; neither the anchored line nor a Whisper segment its text touches is in a cut, by their own times (DR-0582); the family screen passes, a source only off aside; its chosen text is left as it is by redaction in force; and its line, rendered with every fix of it that passes the other rules, holds no keyword and no person a never-store list holds, in the brief screen's shapes (DR-0558). A line that fails that last rule gets none of its fixes. Every other fix is listed with why: waiting, rejected, no longer matching, cut or hidden, a cut or hidden one without its texts. The reading is the recorder's lines, times and speakers as raw has them; in each line the applied fixes' places are found in its raw text first and then all replaced at once by their chosen texts, the fixed line written in NFC, so no fix moves another's place and no other word of the line changes, and two rebuilds give the same text. One module renders it for three readers: the index chunks it as a transcript is chunked, kind reconciled, with the recorder's rid, the recording's group and owner x <rid>, and search collapses a reconciled chunk with the raw chunks of the same stretch into one hit, the reconciled one leading and the others under also; read and verify give a raw span of a transcript with applied fixes its reconciled text and fixes, the cite tokens of the fixes in it; the Recording page marks each fixed word. The index re-renders a recording's reading when its fixes doc changes, when either transcript gains a version, and when the screen's inputs move: the never-store lists; the people shapes with the names, aliases and contact ids of every entity a list holds (brief_form.phrases), so an alias curate adds to a listed person counts; redaction in force; the sources' sensitivity; and this machine's withheld marks and private decisions; all kept as one fingerprint in the index's meta. It renders only recordings with a fixes doc; schema 11 adds the reconciled kind and a readings table of each recording's counts. This adds the settings in force, the listed entities' forms and those marks to what the index reads, for readings only, and reads the fixes doc from its last commit: two amendments to the working-tree rule (DR-0115), as DR-0564 made one for final decisions. On a machine that doesn't ingest the source the screen reads no withheld marks or private decisions of the ingesting clone, as the media reader there doesn't; the lists and cuts, which are in git, hold everywhere."
    binds:
      - "The reading lives in the index and in reads, never in the vault: raw and the fixes doc are what it is rebuilt from."
      - A cut stretch, and a value a never-store list holds now, never enter it.
    not_chosen:
      - "The reading as a doc of its own: a second copy of the transcript to keep in step, and a hand edit would become a rewrite."
      - "The reading in place of the recorder's chunks: a wrong fix would hide the raw from search."
      - "A read view named reconciled: a span's added fields show the reading wherever raw is read, without a new value to ask for."
      - "Screening readings at query time: search would drop hits after ranking, and k would shrink."
