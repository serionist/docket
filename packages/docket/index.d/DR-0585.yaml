decisions:
  - id: DR-0585
    title: The reconciled reading is the recorder's transcript with its applied fixes, rendered by the core from raw, the fixes doc and the screen in force
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#183"]
    description: "A fix applies when its state is sure or confirmed; its recorder text still stands whole in the anchored segment and Whisper's in its anchored segments, in the latest versions in raw; neither anchor overlaps a [cut] of either transcript's latest version; the family screen passes, a source only off aside; and its chosen text says nothing a never-store list holds now, in the brief screen's shapes (DR-0558), and is left as it is by redaction in force. Every other fix is listed with why: waiting, rejected, no longer matching, cut or hidden. The reading is the recorder's segments, times and speakers as raw has them, each text with every applied fix's recorder text replaced by its chosen text wherever it stands whole in that segment, in line order, so two rebuilds give the same text. One module renders it for three readers: the index chunks it as a transcript is chunked, kind reconciled, with the recorder's rid, the recording's group and owner x <rid>, and search collapses a reconciled chunk with the raw chunks of the same stretch into one hit, the reconciled one leading and the others under also; read and verify give a raw span of a transcript with applied fixes its reconciled text and fixes, the cite tokens of the fixes in it; the Recording page marks each fixed word. The index re-renders a recording's reading when its fixes doc changes, when either transcript gains a version, and when the screen's inputs move (the never-store lists, redaction in force, the sources' sensitivity, and this machine's withheld marks and private decisions, kept as one fingerprint in the index's meta), and renders only recordings with a fixes doc; schema 11 adds the reconciled kind and a readings table of each recording's counts. This adds the settings in force and those marks to what the index reads, for readings only, and reads the fixes doc from its last commit: two amendments to the working-tree rule (DR-0115), as DR-0564 made one for final decisions."
    binds:
      - "The reading lives in the index and in reads, never in the vault: raw and the fixes doc are what it is rebuilt from."
      - A cut stretch, and a value a never-store list holds now, never enter it.
    not_chosen:
      - "The reading as a doc of its own: a second copy of the transcript to keep in step, and a hand edit would become a rewrite."
      - "The reading in place of the recorder's chunks: a wrong fix would hide the raw from search."
      - "A read view named reconciled: a span's added fields show the reading wherever raw is read, without a new value to ask for."
      - "Screening readings at query time: search would drop hits after ranking, and k would shrink."
