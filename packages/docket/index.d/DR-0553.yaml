decisions:
  - id: DR-0553
    title: A rendered file is a sorted markdown table whose first line names the entities' last commit and hashes the rest
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#163"]
    description: "The first line is <!-- Rendered by Docket from the vault's entities at <commit>; a hand edit is reported, never kept. sha256:<16 hex> -->: the last commit that changed an entity file (the curate log left out), and the hash of everything after the line. The people directory is a table of each active person: a name column per owner language, then Role, Chat (each ids key but email, as key: value), Mail and Aliases (an ASR form marked (asr)), sorted by name then id. The glossary is a table of each active entity of any other type: Term (its name in the first owner language that has one), Type, Other names and Spellings, sorted by type, term and id. A cell writes | as \\| and line breaks as spaces; archived entities are left out. An entity whose id or a name a never-store list holds now is left out whole, and a listed alias, id or role is left out of its row, as Curate and curate show hide them. The same entities give the same bytes. The columns are defaults until the maintainer chooses them."
    not_chosen:
      - "A record of what Docket last wrote in its private folder, to tell a hand edit apart: another machine that pulls the file has no record and would report it forever."
