decisions:
  - id: DR-0623
    title: "A talking point is ops on its meeting: point adds one, its id the point's, and point_set changes it; from and to name the other point of a roll"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#199"]
    description: point names the meeting by item; its id is the point's id, and its fields are text, required, and item, from and proposed (true), optional. point_set carries point, the point's id, and fields, any of text, state (open, answered, dropped, rolled), answer, item, to and proposed, null clearing one. One op per change; the writer writes what todo.py inferred, so an answer to an open point also sets state answered, and an answer or a keep clears proposed. A point's n is its place among its meeting's standing points by its point op's id, todo.py's list order, shown as M-0040#2 and never stored; ops name a point by id. Removing a point is an undo of its point op; dropping one keeps it. A rolled point changes only by an undo; any other point_set on it is idle. from names the point a copy came from and to the copy (DR-0624). The import pairs them in todo.py's order; one it can't pair names the meeting instead, which the index tells apart, both being ULIDs. On one meeting a second copy from one source is idle, so two clones rolling one point leave one copy; on the source the first roll wins.
    binds: [Ops name a point by its id; n is never stored., A rolled point changes only by an undo.]
    not_chosen:
      - "from and to naming meetings, todo.py's: a point couldn't be followed through a series once its text changed, and two clones' copies couldn't be told from two points."
      - "A point that moves to the next meeting: the old meeting would lose what was on it."
      - "Stored point numbers: two clones adding a point to one meeting would clash, and todo.py's numbers already shift on a removal."
