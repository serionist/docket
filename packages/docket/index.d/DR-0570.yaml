decisions:
  - id: DR-0570
    title: A Whisper transcript is <recording rid>/whisper, carries the recording's people and is cut where its family is cut
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#158"]
    description: "The record: rid <recording rid>/whisper; kind transcript; the recording's source; container and thread the recording's rid; ts and author the recording's; to the recording's recipients and the speakers of its family's transcripts at their latest versions, sorted, in to and not native, since a cut clears native (DR-0126); segments without speakers, since there is no diarization, and text rendered from them; lang the language used; engine whisper-<model>@<first 7 of the revision> faster-whisper-<version>; fidelity derived; via `docket transcribe <the stored file's key id>`. A segment overlapping a range the stored file was cut by is dropped and a [cut] segment spans each range; a segment of punctuation alone is dropped. fidelity derived now reads \"made by machine from the source's own data, or its id built from its content\". A version of the Whisper transcript, staged or in raw, whose via names this stored file and whose engine is this one means the job stages nothing; a new model revision, or a new stored file after a recut, can make a new version. It goes through Gate.stage like any record: redaction, never-store, holds, the release's cuts and the source's sensitivity. Its people are fixed when it is made, so at every sweep the gate runs Screen.family on each staged machine transcript, a record whose via starts `docket transcribe` (Plaud's own transcripts carry an engine too), and drops it when its family is withheld, when a version of the family's records matches a never-store value, when a private decision covers one of them, or when the source is out of force or private. A source only turned off keeps it, and a hold keeps it as holds keep any record. A Whisper transcript that hears a never-store word the recorder's missed is dropped at intake and withholds the family; the reader then plays no stored file of a family the screen keeps out (withheld, a never-store match, a private decision, the source out of force or private), reading raw at its places as it reads the cuts, and the Recording page says why without the value. A source only off still plays. The Staging page calls a transcript's to its speakers."
    binds:
      - "The rid suffix /whisper and the engine string's shape are the vault's format: changing either is a door."
      - A via starting docket transcribe marks a machine transcript; nothing else writes a via that starts so.
      - No stored file plays while media's screen keeps its family out, except when its source is only off.
    not_chosen:
      - "The people in native: a cut clears it."
      - "A fidelity value of its own: every reader of fidelity would have to learn it."
