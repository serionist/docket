decisions:
  - id: DR-0506
    title: "Pages make only these vault.yaml changes: a never-store value added, a redaction rule or pattern turned on, a source made stricter or turned off; every other change is named"
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#73"]
    description: "The Settings page, and any later page, route or MCP tool, makes only the changes on this list, each of which keeps more out: a value added to a never-store list; credentials or phone turned on; one of the user's patterns turned on with nothing else of it changed; a source's sensitivity made stricter (work to mixed to private); a source turned off. Every other vault.yaml change is a loosening and is named, never made: docket redaction set <rule> off with the warning it prints, docket source new for a new source, a folder source too, or the line to change by hand. A key added to vault.yaml later is named too until a decision moves it onto the list. A typed confirmation stops no agent: Claude reaches a session through docket open or the token (DR-0152), and a browser agent reads and types what a page asks, with no prompt of Claude Code's in between. In Claude Code's shell the command or the edit passes the user's own prompts and allow rules. It is not a wall, as DR-0202 isn't: Claude can still run the command or edit the file, and the skills forbid it; #134 gives the CLI's loosening commands the release's console check. What a loosening lets in reaches raw, every clone and git history, as a release does."
    binds:
      - vault/settings.py's loosens(before, after) is the list as an allowlist, and every write with via page passes it inside the writer.
      - "A test scans the whole package: write_config is called only in vault/settings.py; the writer's general entry only there, in set_rule and in _register; set_rule, new_source and new_folder_source only by cli.py; docket.web and docket.service import from vault.settings only the stricter operations and the read-only helpers."
      - A one-way door on AGENTS.md's list, beside the release's yes.
      - The same scan finds, in docket.web and docket.service, no settings object dumped whole (.dump()) and no file written by code that names CONFIG_FILE or vault.yaml.
      - loosens() copies before's value back only into the fields on the list and compares whole models, so a key a later schema adds, anywhere, is a change until a decision moves it onto the list.
      - "Amended knowingly by #134 (DR-0521): loosens() is effective(before, after) != after, so it no longer calls a pattern added, an exclude entry added, a tool removed or a source removed a loosening. Pages gain no action from it: they call only their own writers (add_listed, rule_on, stricter and turn_off), which the scan's general-entry row and FOR_PAGES hold."
      - "The OS prompt this left to an issue of its own is #143's (DR-0572 to DR-0575)."
    not_chosen:
      - "A looser change behind a typed confirmation: Claude in Chrome or Playwright types it in normal use."
      - "Every change in the page: the browser is the one path Claude Code's prompts don't see."
      - "An OS prompt (Windows Hello, Touch ID, polkit): a human-only factor, for the release too; an issue of its own."
      - "A list of what loosens: a key added later would be made by default."
