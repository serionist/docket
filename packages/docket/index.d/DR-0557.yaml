decisions:
  - id: DR-0557
    title: The Briefs page lists briefs by entity type and opens one beside the raw its lines cite, as the Recording page does
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#161"]
    description: "The Briefs page, built in #161's second PR, follows the Recording page (#164, DR-0544): GET only, a whole page per state, plain links, the facts read through the stale report (DR-0556) and recall, after the index is up to date. /briefs lists the briefs grouped by entity type, in the order entity types are known, orphans last, each with its entity's name, state, rev, age since that rev, flagged lines and new records, and an orphan with the entity that holds its name now; chips narrow it to one type with their counts. /briefs?brief=<id> shows the brief's lines, flagged ones marked, beside the raw a chosen line cites: line=<n> shows that line's spans as verify gives them, and the doc lines it cites followed one level with their own spans. A time anchor links to the Recording page at that time, any other anchor to the Search page, and a ref to the cited doc on the Search page at its line; a stale brief's newest new records link to the Search page. The URL holds brief, line and type (an entity type, or orphaned), in that order, defaults left out, unknown parameters ignored; line is read only with a brief, and a link that sets it ends in #raw. A brief whose entity a never-store list now holds, as doc_put holds it (an id, a name, or any name, alias or contact id the people list names), or whose id names a listed person, answers \"A hidden brief\" and names nothing of it, brief or no brief, so the page never tells whether a brief about a listed person exists; a line a list now names, and a cited line a list now names, is shown as hidden and opens nothing (DR-0558)."
    binds: [The page's URL only gains optional parameters whose default keeps today's meaning.]
