decisions:
  - id: DR-0453
    title: The reranker's top N is today's top k, then the weight-1 order; past it, and for a skipped rerank, the order is today's
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#88"]
    description: "Today's order is the fusion at vector weight 0.5 (DR-0338), what the search returns with no reranker. The top N starts with today's top k, so the reranker can reorder today's hits but never drops one unseen: today's order is walked with the search's own collapsing until it has kept k hits, and the top N takes those k hits' own chunks first, then the chunks folded into their also, so every one of today's hits is scored whenever k is N or less (the MCP search tool's k 20 against the CPU's 30 pairs, over threads whose hits fold many chunks). It then fills by walking the fusion at weight 1, which fed the reranker better, from its top, skipping chunks already in, until it holds N; when today's chunks are N or more the top N is today's alone. Past the top N the order is today's, and a skipped rerank gives today's result exactly. On the invented set at k 10: the GPU's numbers are the same as with the top 50 from weight 1 alone (paraphrase 0.78 and 0.58); the CPU's paraphrase is 0.61 and 0.32 against 0.67 and 0.35, one question whose answer weight 1 alone brought into the 30. Fusing at both weights costs nothing beside a rerank. DR-0338's all-words rule applies to both orders, and to the final one again as a guard: a chunk only the vectors found that sits in the top N, as one folded into a hit can, never passes an all-words hit left outside it."
    binds:
      - Every one of today's k hits is among the reranker's pairs when k is N or less, and the chunks folded into them come after them.
      - A chunk only the vectors found never passes an all-words hit in the final order.
    not_chosen:
      - "The top N from weight 1 alone: one more CPU paraphrase on the set, but it could drop one of today's hits unseen."
      - "Weight 1 throughout: a skipped rerank would cost inflection MRR 0.86 to 0.80 and time-bound 0.78 to 0.70."
      - "Weight 0.5 alone: one paraphrase fewer on the GPU (0.72 and 0.53)."
