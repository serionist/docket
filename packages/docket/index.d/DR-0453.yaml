decisions:
  - id: DR-0453
    title: The reranker's top N is today's top k, then the weight-1 order; past it, and for a skipped rerank, the order is today's
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#88"]
    description: "Today's order is the fusion at vector weight 0.5 (DR-0338), what the search returns with no reranker. The reranker sees its top k first, so it can reorder today's hits but never drops one unseen, then the next chunks of the fusion at weight 1 up to N, which fed it better; when k is N or more the top N is today's alone. Past the top N the order is today's, and a skipped rerank gives today's result exactly. On the invented set at k 10: the GPU's numbers are the same as with the top 50 from weight 1 alone (paraphrase 0.78 and 0.58); the CPU's paraphrase is 0.61 and 0.32 against 0.67 and 0.35, one question whose answer weight 1 alone brought into the 30. Fusing at both weights costs nothing beside a rerank. DR-0338's all-words rule applies to both orders."
    binds: ["Every chunk of today's top k is among the reranker's candidates, up to N."]
    not_chosen:
      - "The top N from weight 1 alone: one more CPU paraphrase on the set, but it could drop one of today's hits unseen."
      - "Weight 1 throughout: a skipped rerank would cost inflection MRR 0.86 to 0.80 and time-bound 0.78 to 0.70."
      - "Weight 0.5 alone: one paraphrase fewer on the GPU (0.72 and 0.53)."
