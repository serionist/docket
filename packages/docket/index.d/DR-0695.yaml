decisions:
  - id: DR-0695
    title: The forgotten list's line gains ops, the ids of the ops masked; ops.parse masks a listed id's line for the ledger's readers, and the index is built under it
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#212"]
    description: "state/forgotten.jsonl's line (DR-0579) gains ops, in schema 1: the ULIDs of the ops a forget or an apply masked. Plain ids, not hashes: an op id holds a time and random bits, never words, and the masked line keeps it anyway. ops.parse, given the listed ids, masks each one's line for read_all, the index's rebuild and update, docket ledger show, the fold in memory (DR-0619), the writer and the import, so they read one ledger. The apply, docket vault check and the history rewrite read raw lines, since they find, explain or blank the unmasked text. That is how a line a forget marked is known (DR-0612): by its id on the list. Both texts of a listed id read as its mask, which is idempotent (DR-0693), so a line a union merge brought back folds as one op with it, and the next gate call takes the twin out. ops joins the digest the index is built under (DR-0593), being what the build reads, once one is listed, so an index built before is refused until rebuilt and a list that masks no op keeps its digest. A list that doesn't read stops every reader of the ledger, the writer's fold in memory too, as it stops every reader of raw (DR-0579): with the ids unknown, any read could show what a forget masked. Across clones it goes as run files do (DR-0581): the forget masks every op file in its tree, other machines' too, in its one commit; each clone reads masked after its pull, and its next gate call writes the masks, drops a twin and commits Forget: applied on <machine>, waiting while the owner's git is mid-rebase (DR-0597). A stream it masks has its STATUS.md rendered again after the lock (DR-0675). A Docket from before #212 reads a line with ops as one that isn't a forget and fails closed, which is meant: it can't mask, so it stops until updated, and the CHANGELOG says to update every machine first. The apply renders once its own lock is let go; a gate call holds its lock around the apply, so there the render runs inside that one, as a write's render runs inside an import's."
    binds:
      - ops is part of schema 1 of the forgotten list's line, and of the index's digest.
      - ops.parse masks a listed id's line for every reader of the ledger but the apply, docket vault check and the history rewrite, which read raw lines.
    not_chosen:
      - "Hashes of the op ids: they hold no words, the masked lines keep the ids, and a reader would hash every line it reads."
      - "Masking in read_all alone: the index's update and the import read lines through parse, and would see the text."
      - "A masked line known by a key of its own: an older Docket ignores a key it doesn't know and keeps both texts, and a line merged back would read as it was until the next apply."
      - "Readers judging the rule themselves: each would need raw and the docs' fates; the list names the ops once."
      - "A line of schema 2: an older Docket fails closed on it as well, and schema 1 with ops changes nothing for a line without it."
