decisions:
  - id: DR-0690
    title: The ledger writer refuses an op whose source or a material's ref sits in a never-store container
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#210"]
    description: "Beside the keyword and people screens of the text rules (DR-0618, DR-0627), the writer refuses an op whose source, or a material's ref, points at a record whose container or thread is on vault.yaml's never-store containers list, by neverstore.in_container: the container and thread the index holds for the locator's rid, else the rid's own text up to each slash. The refusal names the field, never the value. A sync agent reports no such record (DR-0686); this holds when one does, and for every writer: the pages, the CLI and the import, whose dry run names an old item it would refuse. It ships in #210's first PR."
    binds: [No ledger op's source or material ref points into a never-store container.]
    not_chosen:
      - "Leaving it to the sync skill: the pages, the CLI and the import write ops too, and the keyword and people screens already sit in the writer."
