decisions:
  - id: DR-0670
    title: "The session start shows the owner's day: todo.py's dashboard from one snapshot read, at most 45 lines with the status lines, cut from the streams up"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#207"]
    description: "docket hook session-start asks the running service's GET /api/day, after its status lines, for the day: ledger/day.py's Day, built from one snapshot read of the ledger's views (DR-0638), today to the next working day, and the Sync page's due rule (DR-0304). Its sections keep todo.py's dashboard order: the day and each live source's last sync, with the ones due; the queue with the untriaged count, discuss and claude rows, me and chase as refs; meetings today not yet ended and on the next working day, not cancelled or declined, each with its open points and open items; overdue or due today, with snoozes whose day has come (until on or before today); replies owed; decisions and tasks due within 7 days; invites; waiting on others over 3 days; streams not closed. Rows are the ledger tool's item and meeting lines. An item is listed once among overdue, replies, decisions and tasks, invites and waiting, in the first of them that has it, as todo.py's shown set does, except that an item past a section's cap stays in that section's count rather than showing again further down; the queue's rows and a meeting's items may repeat it, so an overdue item in the queue or on a meeting still shows under overdue. The whole hook says at most 45 lines; past 45, sections are cut whole from the streams up (streams, waiting, invites, decisions and tasks, replies, queue rows, then each meeting's points and items down to counts on its line, then the next working day's meetings down to a count), as few cuts as fit, each cut section keeping its count and the read that lists it; then rows are given back within the 45, the last cut first: today's meetings' points and items meeting by meeting before the next working day's, then the queue's rows one at a time, then each section's row by row, each keeping how many more there are and where. The status lines, the sync line, overdue and today's meeting lines are never cut, so they pass 45 only on an extreme day. Claude gets every line; the owner sees only the due-sync line and, once #208 lands, a status file a hand edit holds. The Today page (#206) renders the same Day."
    binds:
      - The day reads the ledger through the ledger tool's views, never a query of its own (DR-0638).
      - An item is listed once among overdue, replies, decisions and tasks, invites and waiting; the queue and the meetings may repeat it.
      - "The owner is shown a day line only when it asks something of him: a due sync, a hand-edited status file."
    not_chosen:
      - "Every day line to the owner as well: the old hook showed him none, and a block that is always there stops being read (DR-0163)."
      - "Cutting at line 45 from the bottom, as todo.py did: a cut section said nothing; now each keeps its count."
      - "Whole-section cuts alone: on a busy day they left ten of 42 lines unused and every one of today's meeting points out."
