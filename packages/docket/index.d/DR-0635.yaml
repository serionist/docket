decisions:
  - id: DR-0635
    title: "The ledger's fold gets a second and a half and a full rebuild into the index two, after the fold did less: ops as slotted dataclasses, lines and log entries as tuples, fewer passes per line"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#218", "#228"]
    description: "#218: the ledger's timed tests ran close to DR-0616's second on CI. Measured on a rebuild of 5,000 items and 2,000 meetings, about a third went to reading the ops, a fifth to folding, a tenth to making rows and a third to SQLite's inserts, which no page size, cache size, insert order, multi-row insert or index built afterwards made faster by more than a few percent. So the work got smaller instead. An op is a pydantic dataclass with slots, not a model: it reads the same JSON under the same rules a tenth faster in a third of the memory, a model's dict and its set of the fields given gone. A line and a log entry are named tuples; the reader calls the op's validator itself; the check of an op's fields passes plain text without running a rule; the fold reads an item's undos only when it has one and passes over a meeting's lines fewer times; the rows of an object whose lines were all kept come straight off its log; and the rows' JSON shares one encoder. On the developer's machine the fold of the whole ledger went from about 0.65 s to about 0.45 s, and a rebuild with the meetings in their tables from about 1.05 s to about 0.7 s. CI still timed that rebuild at 1.45 s on its slow Windows shard and 1.10 s on macOS, with the fold at 0.56 to 0.79 s, one op more through an update at 27 to 57 ms and a write on one meeting at 25 to 28 ms. A full rebuild runs only on a schema bump or a forget, never on the daily path, so the maintainer's lead set its budget at two seconds under the autonomy grant: the fold keeps its second, and one op through an update and a write touching one meeting a tenth of a second each. The perf tests read the op files once and run the collector before the clock starts, so a virus scanner's first look at a new file and what the tests before left aren't timed. Timed as the best of three runs (#228), the fold still measured 0.97 to 1.12 s on the macOS runner and 0.86 s on the slow Windows shard, against about 0.45 s on the developer's machine, so the maintainer raised the fold's budget to a second and a half: the owner's real ledger is about a twentieth of the test's size, and the fold runs only on a rebuild or a cold read, never on each write."
    binds:
      - The perf tests hold the fold of 5,000 items and 2,000 meetings to a second and a half, the full rebuild into the index, meetings included, to two, and one op more through an update and a write touching one meeting to a tenth of a second each, each measure asserted on its own as the best of three runs.
    not_chosen:
      - "A larger SQLite page size: measured no faster, and every index would rebuild for it."
      - "The rebuild held to a second on every runner: CI's slow Windows shard takes about 1.45 s, for work that runs only on a schema bump or a forget."
      - "Each op's text kept out of the logs and read again from its file by offset: the index would halve, but a refold would read files a pull may be moving."
      - "The fold held to a second on every runner: the macOS runner's best of three sits at 0.97 to 1.12 s, for work a twentieth of the size in daily use."
