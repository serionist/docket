decisions:
  - id: DR-0635
    title: "The ledger's fold keeps its one-second budget by doing less: ops as slotted dataclasses, lines and log entries as tuples, fewer passes per line"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#218"]
    description: "#218: the ledger's timed tests ran close to DR-0616's second on CI. Measured on a rebuild of 5,000 items and 2,000 meetings, about a third went to reading the ops, a fifth to folding, a tenth to making rows and a third to SQLite's inserts, which no page size, cache size, insert order, multi-row insert or index built afterwards made faster by more than a few percent. So the work got smaller instead. An op is a pydantic dataclass with slots, not a model: it reads the same JSON under the same rules a tenth faster in a third of the memory, a model's dict and its set of the fields given gone. A line and a log entry are named tuples; the reader calls the op's validator itself; the check of an op's fields passes plain text without running a rule; the fold reads an item's undos only when it has one and passes over a meeting's lines fewer times; the rows of an object whose lines were all kept come straight off its log; and the rows' JSON shares one encoder. On the developer's machine the fold of the whole ledger went from about 0.65 s to about 0.45 s, and a rebuild with the meetings in their tables from about 1.05 s to about 0.7 s. The perf tests read the op files once and run the collector before the clock starts, so a virus scanner's first look at a new file and what the tests before left aren't timed."
    binds:
      - The perf tests keep DR-0616's second for the fold and for the rebuild into the index, meetings included.
    not_chosen:
      - "A larger SQLite page size: measured no faster, and every index would rebuild for it."
      - "A larger budget: the issue asks for cheaper work, not a looser test."
      - "Each op's text kept out of the logs and read again from its file by offset: the index would halve, but a refold would read files a pull may be moving."
