decisions:
  - id: DR-0607
    title: A run's window is the furthest mark less the source's lookback, and the mark moves only on a whole close
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#41", "#194"]
    supersedes: [DR-0246]
    description: A run's window runs from the latest mark any machine's cursor file holds for its source, leaving out a mark later than this machine's clock and naming it in run_open's notes, less the source's lookback, to the moment it opened; with no mark, from now less the lookback; run_open's since starts it elsewhere. The lookback is the source's lookback_days in vault.yaml when set (DR-0606), else this machine's cursor file's lookback_days, 7 when Docket writes it; the Sync page's next window and each machine's row take the same (DR-0304). A close that takes the run and kept at least one capture moves this machine's mark to the run's open time, but only when its window started no later than the default. A dropped run, a failed close, a close with no captures, a narrower since or any final close leaves the mark; a final run has no window. A source skill closes a run only after its listing reached the window's start; one that can't finish stops without closing. A run's open time is taken in whole seconds, as the mark is written.
    not_chosen:
      - "Moving the mark on partial progress: a listing paged newest first reaches the old end last, so a stop partway would skip it for good."
      - "The newest item's time as the mark: it rests on the vendor's clock, and a run that finds nothing new never moves it."
      - "The cursor file's lookback winning over vault.yaml's: Docket writes one into every cursor, so the vault's would never hold."
