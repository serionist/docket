decisions:
  - id: DR-0616
    title: The index folds the ledger into items, item_log and item_numbers, each item from its own ops; a file that only grew is read from where it stopped
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#198"]
    description: "items holds each item's current state: every field, state, archived, its number, the add's by and its last op. item_log holds every op: item, id, after, day, at, by, via, kind, its keys as JSON, its log line and the undo that left it out, for the history and #201's counts. item_numbers holds each number and the items that held it, now or before. ledger_files keeps each op file's size, modification time and sha256, as run_files and doc_files do. An update reads a file that only grew, its old bytes unchanged, from where it stopped, and folds again from their item_log rows the items its new lines name, together with every item that holds or held a number a new add or renumber claims, so a clash shows the same after an update as after a rebuild. Anything else folds the whole ledger, through ledger.load, which pauses the cyclic collector while it reads and folds, since none of the objects it makes are in a cycle: the review measured 50,000 ops in about a third of a second. rebuild and update both fold, so two rebuilds give one database; the schema goes to 11. The writer brings the index up to date from ledger_files before it mints an id or a number, and checks a write against it."
    binds:
      - A perf test holds 5,000 items and 50,000 ops, with 2,000 meetings, to a whole fold in under a second and a half and a full rebuild into the index in under two, and one op more read by an update in under a tenth of a second (DR-0635).
      - The rebuild-equals-update test includes a number clash.
    not_chosen:
      - "A fold of every op on every write: about a second for each click on the Queue page."
      - "A snapshot of the ledger committed beside the ops: two truths to keep in step, and a merge conflict on every change."
