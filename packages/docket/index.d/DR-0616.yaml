decisions:
  - id: DR-0616
    title: The index folds the ledger into items, item_log and item_numbers, each item from its own ops; a file that only grew is read from where it stopped
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#198"]
    description: "items holds each item's current state: every field, state, archived, its number, the add's by and its last op. item_log holds every op: item, id, day, at, by, via, kind, its keys as JSON, its log line and the undo that left it out, for the history and #201's counts. item_numbers holds each number and the items that held it, now or before. ledger_files keeps each op file's size, modification time and sha256, as run_files and doc_files do. An update reads a file that only grew, its old bytes unchanged, from where it stopped, and folds again the items its new lines name from their item_log rows; anything else folds the whole ledger, which for a few thousand items and tens of thousands of ops takes well under a second. rebuild and update both fold, so two rebuilds give one database; the schema goes to 11. The writer checks a write against the index."
    binds: ["A perf test holds 5,000 items and 50,000 ops to a whole fold in under a second."]
    not_chosen:
      - "A fold of every op on every write: about a second for each click on the Queue page."
      - "A snapshot of the ledger committed beside the ops: two truths to keep in step, and a merge conflict on every change."
