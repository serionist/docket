decisions:
  - id: DR-0693
    title: "A forget masks a ledger op in place: its id, keys and structure kept, its words [forgotten], a locator [forgotten:<32 hex>]; an object built on the family stays a shell with its number"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#212"]
    description: "When a forget takes what an op quotes or is built on (DR-0694), the op's line is rewritten in place through ledger/store.py, the one writer (DR-0618), and keeps its id and every key. Ids, numbers, days, times, kinds, verdicts, states, responses, streams, by, via and booleans stay as they were. Every other string, at any depth, becomes [forgotten], and a list of them, such as attendees, becomes empty. A locator, source, ref, event or series, becomes [forgotten:<32 hex>], staging's digest of its value, which no rid reads as. So a masked op still reads as its kind with its required fields filled, the adds of one event key still make one meeting (DR-0621), a material's remove still finds its add, and read says such a locator was forgotten. An item or a meeting built on the family has every op masked: a shell, which keeps its number, its state, its dates and the shape of its history, so an A- or M- number written in a chat or a point never names another object. This closes the opening DR-0610 kept: a committed op line changes only to its mask, its id on the forgotten list (DR-0695)."
    binds:
      - A committed op line changes only to its mask, with its id on the forgotten list.
      - "The mask keeps every key and every value but strings: a string is [forgotten], a locator [forgotten:<32 hex>], a list of strings empty."
    not_chosen:
      - "The item forgotten with it: DR-0613 never frees a number, so a hidden item is a shell anyway, and the points, items and chats naming it would name nothing."
      - "Only the matching text blanked: op text has no anchored lines as a doc has, and notes are set whole, so every later set repeats the quote."
      - "A new op that masks: the text would stay in every tree and in HEAD, so the history rewrite would have to change HEAD, and a Docket from before folds an op kind it doesn't know as nothing (DR-0611)."
      - "A locator written as [forgotten]: the adds of two forgotten events would fold as one meeting, and a material's remove would lose its add."
