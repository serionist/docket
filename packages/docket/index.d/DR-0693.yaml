decisions:
  - id: DR-0693
    title: "A forget masks a ledger op in place: its id, keys and structure kept, its text fields [forgotten], its locators [forgotten:<32 hex>]; an object whose making op is masked stays a shell with its number"
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#212"]
    description: "When a forget takes what an op quotes or is built on (DR-0694), the op's line is rewritten in place through ledger/store.py, the one writer (DR-0618), and keeps its id and every key. The mask takes the text fields, title, who, description, notes, outcome, subject, organiser, where, text, answer, next, note and label, and any string under a name this Docket doesn't know, at any depth, to [forgotten], every key nested under such a name to [forgotten:<32 hex>], since a later Docket's key may hold words too and two keys must stay two; it empties attendees; and it writes the four locators, source, ref, event and series, as [forgotten:<32 hex>], staging's digest of the value, which no rid reads as. Every other key and value stays as it was: ids, numbers, days, times, kinds, verdicts, states, responses, streams, a stream's status, by, via, machine and booleans. The mask is idempotent: a value or a nested key already [forgotten] or [forgotten:<32 hex>] stays, so masking a masked line gives it back unchanged. So a masked op still reads as its kind with its required fields filled, the adds of one event key still make one meeting (DR-0621), a material's remove still finds its add, and read says such a locator was forgotten. An item or a meeting whose making op is masked is a shell (DR-0694): every op of it masked, its number, state, dates and the shape of its history kept, so an A- or M- number written in a chat or a point never names another object. This closes the opening DR-0610 kept: a committed op line changes only to its mask, its id on the forgotten list (DR-0695)."
    binds:
      - A committed op line changes only to its mask, with its id on the forgotten list.
      - The mask takes the text fields (title, who, description, notes, outcome, subject, organiser, where, text, answer, next, note, label) and any string under a name this Docket doesn't know to [forgotten], empties attendees, and digests source, ref, event and series, and any key nested under an unknown name, as [forgotten:<32 hex>]; every other key and value stays, machine and a stream's status among them.
      - "The mask is idempotent: mask(mask(x)) == mask(x), a value or a nested key already [forgotten] or [forgotten:<32 hex>] kept as it is."
    not_chosen:
      - "The item forgotten with it: DR-0613 never frees a number, so a hidden item is a shell anyway, and the points, items and chats naming it would name nothing."
      - "Only the matching text blanked: op text has no anchored lines as a doc has, and notes are set whole, so every later set repeats the quote."
      - "A new op that masks: the text would stay in every tree and in HEAD, so the history rewrite would have to change HEAD, and a Docket from before folds an op kind it doesn't know as nothing (DR-0611)."
      - "A locator written as [forgotten]: the adds of two forgotten events would fold as one meeting, and a material's remove would lose its add."
