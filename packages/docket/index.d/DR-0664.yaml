decisions:
  - id: DR-0664
    title: One item panel and one meeting panel serve every day page, the source and materials one click away
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#203", "#205"]
    description: "open takes an A- or M- number or an id on all four day pages and opens its panel beside the list, built from the show read. The item panel: its number, kind, state and stream; its call (the verdicts, done, drop, snooze, reopen); its fields to edit; the meeting it hangs on with that meeting's points; its description, notes, materials and outcome; where it came from; its counts (chased, snoozes, due moves, reopens); its history, newest first, each line with who, via and day. A line carries Undo, an undo by of, only while no undo has left it out (undone_by is none), and never on the add, whose undo would hide the item, or on a renumber, which the writer doesn't undo; an undone line names its undo, and that undo's own line carries Redo, an undo of the undo (DR-0614). The meeting panel: its subject, time, organiser, where, response, and attendees each linked to its brief when an entity names it; its points with their buttons, a carried point's from and to each linking its meeting; Suggest with each item's why; its outcome and notes; its linked items; its recording and materials; its history. A URL opens as a link; a locator of a record of one of the vault's sources opens the Search page's panel on its raw (/search?hit=), one with a time the Recording page; any other text locator links to Search with its text as the query; each has Copy. A path from the host repo's top opens as the old tasks app opened it: a file with its app and a folder in the file manager, through POST /ledger/open, each with Show in folder; a text file (.md, .txt, .json, .yaml, .yml) shows in the panel's viewer through GET /ledger/text, the old app's scope: never under .git/, and at most its first 256 KB, said so when cut. Both take only a material the item or meeting names, and check its ref as text before any filesystem call: an absolute, drive-relative (C:x) or UNC (\\\\host, //host) ref, a .. or . part, an empty part, a colon, a part ending in a dot or a space, or a .git part is refused, and the panel shows such a ref as text and never stats it. The ref then resolves under the host repo's top, links and junctions followed; the target must lie inside the top, outside .git, and be a folder or a file whose lowercased suffix is on OPENABLE, the documents, images and media day.py names (the text files, .csv, .pdf, .docx, .xlsx, .pptx, common images, audio and video, .drawio, .vsdx), none that runs or carries macros. os.startfile, open or xdg-open launches it, and Show in folder is explorer /select, open -R, or xdg-open on the folder. A service running with no display can't open apps, and the answer says so."
    binds:
      - "/ledger/open and /ledger/text take only a material the item or meeting names, check its ref as text before any filesystem call, and open only a resolved target inside the host repo: a folder, or a file of a type that doesn't run."
      - Undo shows only on a history line no undo has left out, never on an add or a renumber.
    not_chosen:
      - "A panel per page: four copies of one view of one item."
      - "The record's text in the panel: Search's panel shows it, its summary first."
      - "Any path the post names, or one outside the host repo: only what a material names, where the owner keeps their work."
