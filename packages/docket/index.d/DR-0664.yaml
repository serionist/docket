decisions:
  - id: DR-0664
    title: One item panel and one meeting panel serve every day page, the source and materials one click away
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#203", "#205"]
    description: "open takes an A- or M- number or an id on all four day pages and opens its panel beside the list, built from the show read. The item panel: its number, kind, state and stream; its call (the verdicts, done, drop, snooze, reopen); its fields to edit; the meeting it hangs on with that meeting's points; its description, notes, materials and outcome; where it came from; its counts (chased, snoozes, due moves, reopens); its history, newest first, each line with who, via and day and an Undo by of, but on the add, whose undo would hide the item. The meeting panel: its subject, time, organiser, where, response, and attendees each linked to its brief when an entity names it; its points with their buttons; Suggest with each item's why; its outcome and notes; its linked items; its recording and materials; its history. A URL opens as a link; a locator opens the Search page's panel on its raw (/search?hit=), a recording the Recording page; a text locator that names no record links to Search with its text as the query; each has Copy. A path from the host repo's top opens with its app through POST /ledger/open, as the old tasks app did: only a material the item or meeting names, inside the host repo, a document, image or media type, never one that runs or carries macros."
    binds:
      - /ledger/open opens only a material the item or meeting names, inside the host repo, of a type that doesn't run.
    not_chosen:
      - "A panel per page: four copies of one view of one item."
      - "The record's text in the panel: Search's panel shows it, its summary first."
      - "Any path the post names, or one outside the host repo: only what a material names, where the owner keeps their work."
