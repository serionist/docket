decisions:
  - id: DR-0610
    title: "The ledger's ops are ledger/ops/<yyyy-mm>-<machine>.jsonl, committed: a JSON line per change, written once, merged by union"
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#198"]
    description: "Every change to the ledger is one JSON line of ledger/ops/<yyyy-mm>-<machine>.jsonl: the month of the op's day, and the machine that wrote it, as DR-0141's layout and the curate log (DR-0460) have it. A write's ops fall in one month, and a live write has one day, so a write touches one month file: it replaces that file through a temp file in the private folder and a rename (write_replacing), so it lands whole or not at all, and commits it as Ledger: <verbs and numbers> on <machine>, numbers only and never a title, signed by console.who() (DR-0599). A write that would span month files is refused. The import (#202) writes one month at a time and skips every op whose id the ledger already holds, and the export derives each op's id from the item's A- number and the log entry's place, so the same export gives the same ids and an import that stopped part way is run again and adds nothing twice. Lines a crash left uncommitted are ops already, and go in with the next write's commit. Two clones write their own files; when a merge or a rebase meets one file from two sides, the vault's *.jsonl merge=union (DR-0142) keeps both. The fold orders every op by its id (DR-0612), so any order gives one ledger, and a line twice, as a union can leave it, is one op. A file in ledger/ops/ is UTF-8 and never a link. A committed line changes only to its mask (DR-0693): the line keeps its id and keys, its text is [forgotten] and its locators [forgotten:<32 hex>], written in place through ledger/store.py by a forget's apply, with its op id on state/forgotten.jsonl's ops (DR-0695); a twin of it that masking made is dropped."
    binds:
      - The folder and the file names are part of the vault's layout (DR-0141).
      - A write touches one month file; one that would span more is refused.
      - A committed line changes only to its mask, by a forget's apply, its op id on the forgotten list's ops (DR-0693, DR-0695); docket vault check reports any other change.
    not_chosen:
      - "A file per day: a thousand files a few years on, for nothing a month file can't do."
      - "One shared file: two machines append to it at once, and every merge meets it from both sides."
      - "Appending in place: a crash part way through a batch would leave half of it."
      - "Several month files renamed in one write: a failure between two renames would leave the first month's ops for the next write to commit, and a rerun would add them twice."
