decisions:
  - id: DR-0536
    title: The API provider is Voyage AI, voyage-4 at 512 dimensions and rerank-2.5-lite, run in process behind the Runner interface
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#89"]
    description: "The API provider is Voyage AI: voyage-4 as the embedder, at output_dimension 512 with input_type query or document instead of prefixes, and rerank-2.5-lite as the reranker at 50 pairs. They run through VoyageRunner in models/api.py, an in-process implementation of provider.Runner over HTTPS to https://api.voyageai.com/v1/ with a bearer key, the OS trust store and the environment's proxies; one function, send, is the only network path, its opener without a redirect handler, so a 3xx is an error naming its status, and a reason or a log line carries only the status and fixed words, never a response body or the request. There is no worker process: DR-0330's reason, ONNX's environment, doesn't apply, and provider.Models (the budget, the counts, the pause) wraps it unchanged. A machine chooses it as provider: api in the user config's models block, which docket models install --api writes at the owner's console, so DR-0335's block takes api where it refused it; the vectors go to chunk_vec_voyage_4_d512 (DR-0336), apart from any local model's. It sends only when the vault allows it (DR-0537), the machine chose it and the key is in the keychain (DR-0539), and only what passes the screen (DR-0538). Restates DR-0335 with api allowed, and supersedes DR-0340, when built."
    not_chosen:
      - "Cohere: zero data retention only for approved enterprise customers, prompts logged 30 days, no published price in the pages read."
      - "Jina AI: now under Elastic data terms, per-token prices unpublished, its v4 embedder non-commercial."
      - "Google Vertex AI: cloud IAM and a project, not a key a user pastes once."
      - "OpenAI or Mistral: embeddings with no reranker."
      - "1024 dimensions: twice the table and the scan, against the 384 the vector stage is measured at."
