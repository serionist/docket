decisions:
  - id: DR-0612
    title: An op's id is a ULID ordered as a hybrid logical clock, and the ledger's order is the ids' order
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#198"]
    description: "A hybrid logical clock in ULID form. A new op's id is a fresh ULID from the clock; when that isn't above the highest op id the ledger holds, it is a ULID at the millisecond after that id's, with fresh random bits. Within one batch each op is the one before it plus one, the ULID read as a 128-bit number. So an op written after a pull sorts after every op it pulled, whatever the two clocks say, and two clones on one host with one machine name, which can both pull an op from a clock running ahead and write before they pull each other, still mint different ids: their random bits differ. The fold orders every op by id. One id on two texts, which a fault or a forget's apply met by a union merge can leave, keeps both lines, ordered by their text, for docket vault check to name; a line a forget marked (#212 says how one is known) wins over any other text with that id, and two adds with one id fold as one item, the first add by text being the item. at keeps the wall time, for showing. The import (#202) is the one writer whose ids may sort before ops already there: its items are new, and each of their ops sorts after its own add."
    binds: [Every op of an item sorts after its add; one that doesn't is a problem and is left out.]
    not_chosen:
      - "The highest id plus one when the clock is behind: two clones that pulled one op from a clock running ahead would both mint that id plus one."
      - "The curate log's <yyyymmddThhmmss>-<machine>-<n>: two clones on one host share a machine name and could mint one id, and a clock behind would order an edit before the one it followed."
      - "Wall time alone: a machine whose clock is behind would lose every edit it makes after a pull."
      - "Dropping both lines of one id on two texts: an add's item would disappear."
