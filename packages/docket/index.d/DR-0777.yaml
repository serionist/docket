decisions:
  - id: DR-0777
    title: The Recording page plays stored audio by byte range from /api/web/recording/audio, the player's source fixed for the recording, and shows Whisper's transcript beside the recorder's
    status: proposed
    at: "2026-10-21"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#252", "#159"]
    supersedes: [DR-0576]
    description: "DR-0576's player and route, in the app (#252, DR-0709). The Recording page shows the browser's own audio player when the recording's stored audio reads ok through the one reader (DR-0551), with preload none and its source /api/web/recording/audio?rid=<recording rid>, plus #t=<start> for the first line the URL marks, so the player starts at that line. The source is fixed for the recording once the page has it, so marking another line never loads the player again. A line's time sets the player there and plays, keeps the URL on the line by replacing the history entry, and marks the line as playing; a [cut] line has no start and never plays; without a player a line's time is a link to the line. Every other state of the reader shows its reason, and the route refuses it. /api/web/recording/audio takes the browser's session only, as every /api/web route: a request carrying Authorization is refused with 403, so the token, Claude's too, never fetches decrypted audio, and minting a session from the token stays DR-0564's floor. It reads the reader's state again on every request and refuses anything but ok (and a file that isn't audio) with 404 and the reason; then it takes the stored file's decrypted bytes from a keep of one file at most, keyed by its path and modification time and dropped a minute after its last request, decrypting through reader.read only on a miss, in memory only, since pyrage decrypts a whole stream or nothing and the 64 KiB chunks a range needs can't be decrypted alone. HEAD answers the size from the file's age framing, nothing decrypted. A range is a view of the bytes, never a copy. It answers a Range of one stretch (a-b, a-, -n, each field at most 20 digits) with 206 and exactly those bytes, one past the end or -0 with 416 and Content-Range bytes */<size>, and no Range, several ranges or one that doesn't parse with 200 and the whole file, as RFC 9110 lets a server; every answer is Cache-Control: no-store. Nothing of it is logged but the request log's route template and status. The document's CSP keeps media-src 'self' and nothing looser. When raw holds a Whisper transcript of the recording (its via starting docket transcribe), the page shows it beside the recorder's transcript in a table, a row per line of the recorder's with Whisper's lines whose middle falls in it, a Whisper line in a gap of the recorder's in a row of its own; Whisper's lines name no speaker; at phone width a row stacks, Whisper's lines under the recorder's. A cut stretch is one row, cut in both, as Whisper's [cut] spans the stretch the recorder's was cut at. A Whisper transcript still staged isn't shown, as the page reads raw only."
    binds:
      - The audio route answers only what the reader says is ok, never caches, and logs nothing of the audio.
      - The page CSP's media-src stays 'self'.
      - "The token never fetches the audio: /api/web refuses Authorization."
    not_chosen:
      - "Decrypting the file once into a plain temp file to serve: plain audio would sit on disk."
      - "Aligning by bands of overlapping lines: two transcripts that tile the call overlap end to end, so one band would swallow it."
      - "The audio at /recording/audio, a page route of its own: the app's reads are /api/web's, which already take the session only (DR-0709)."
