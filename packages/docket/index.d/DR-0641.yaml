decisions:
  - id: DR-0641
    title: archive with no item archives what is due, and rollover names the meetings it couldn't roll
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#201"]
    description: The writer archives each item closed 14 days or more before the write's day and each meeting started 14 days or more before it with no open point, as todo.py did on every write, skipping one whose archive was undone (DR-0615, DR-0624). The sync writes it last in its batch (#210); no write archives by itself. A rollover change also names each meeting that is over, not archived, with open points and no next meeting to roll them to, as todo.py's meeting rollover listed them, for the sync to tell the owner.
    not_chosen:
      - "Archiving on every write, as todo.py: a write would change what it wasn't asked to, and the sync's dry run wouldn't say what its batch does."
      - "A read listing what is due, for the sync to archive one by one: the writer already holds the ledger as the batch leaves it."
