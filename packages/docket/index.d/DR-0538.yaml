decisions:
  - id: DR-0538
    title: Only index chunks that pass the vault's settings in force are sent; queries are screened too, and reranks send only chunks screened under the current settings
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#89"]
    description: "Only the index's chunks are sent, and the index never reads staging/. Before a chunk's input (its title and text) leaves, the embedding pass screens it with the vault's settings in force (#134). It is held back unless every record it comes from belongs to a source that is in those settings and isn't private: raw is written once, so a source made private later still has its records in the index, and a removed source's records are held back since their sensitivity is unknown now; a source that is there but off is a pause, not a judgement, and its records may go. It is held back when a record it comes from matches the never-store lists as intake reads a record (neverstore.match, the records read by place), when its text says a listed keyword, or when the redactor of those settings would change its input, its title alone or its text alone, as intake redacts each field on its own. A doc's chunk is held to its text and to the records its doc covers, their sources and never-store match. The input is never rewritten, so its hash and vector stay stable. A chunk gets an API vector only when it passed, and the vector table's meta row keeps the sha256 fingerprint it was screened under: the never-store lists, the redaction settings, and each source's presence, sensitivity and enabled. The pass reads the fingerprint before each request and screens the batch again when it has moved. A query is held back when it holds a value from any never-store list (listed() on the whole query and, for people, on each word and pair of neighbouring words; in_container() on each word) or the redactor would change it: search then has no vector stage and no rerank through the API, and says why without naming what matched. A rerank sends only candidates holding a vector, while the fingerprint is the current one, else it is skipped with its reason; candidates not sent keep their fused positions and the sent ones are reranked among the positions they held. When the settings change, the next pass screens every chunk again without sending, drops the vectors of those now held back and stores the new fingerprint. Held-back chunks are skipped for the rest of a pass and counted in docket models status."
    binds:
      - Nothing staged, never-store, from a source now private or gone, or that a rule in force would redact reaches the provider.
    not_chosen:
      - "Redacting at send: the input and its hash would depend on the settings, and the vector with them."
      - "Trusting what was stored: a value added to a never-store list later would still be sent."
      - "Reading each rerank candidate records at search time: 50 reads by place do not fit 0.75 s."
