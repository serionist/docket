decisions:
  - id: DR-0460
    title: "The curate log is entities/_log/<yyyy-mm>-<machine>.jsonl, committed: a line per change Docket makes to entities, rejection, undo or lift"
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#68"]
    description: "Every change Docket makes to an entity file, by tier 1 or by the user, and every rejection, undo and lift is one JSON line of entities/_log/<yyyy-mm>-<machine>.jsonl, committed with the change it records. A line holds schema_version (1), id (<yyyymmddThhmmss>-<machine>-<n>), op (create, add, reject, undo, lift), at (UTC), machine, by (user or tier1), via (cli or page), rule (tier 1's rule, or null), round and card (or null), key (DR-0461's form, one a line, so a card's rejection is a line per spelling), entity, change (for create the entity's fields as written, for add the alias, name, id or link added), of (the op an undo or lift names) and evidence (chunk and container counts, at most five locators). Names and ids as the entity files hold them, never a snippet, a transcript line or a summary. A line is its change's intent: it is written before the entity file and committed with it, and a line HEAD doesn't have, left by a crash, is finished by the next curate write (DR-0463). One file per machine and month, as the ledger's ops: the vault's *.jsonl merge=union covers it, and the entity loader skips _log/ as it skips every name starting with _. Read leniently: a field the reader doesn't know is ignored, so a later writer of schema 1 can add one, while what a change holds is read strictly, since an entity's file is written from it; a list of more than five locators keeps its first five; a line that doesn't read is a problem and is skipped, and tier 1 doesn't run while one fails, since a lost undo would let it apply again what the user undid."
    binds:
      - The folder and the file names are part of the vault's layout (DR-0141).
      - A later format writes schema_version 2, which this Docket skips with a problem.
      - No line holds content beyond the change's own names and ids, counts and locators.
    not_chosen:
      - "The design's committed entities/_proposals-<machine>.jsonl: a batch is one machine's view of its index and changes weekly; only decisions need to reach the other machines."
      - "Git history as the log: a hand commit can't be told from a curate one, and an undo as a revert conflicts with any later edit of the file."
      - "The vault's private folder: a rejection or an undo wouldn't hold on the other machines, and tier 1 there would apply again what was undone."
