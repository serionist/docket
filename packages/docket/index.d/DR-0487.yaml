decisions:
  - id: DR-0487
    title: A file gone from a folder source gets a gone version of its record and parts, and read shows its last text
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: "When a file the vault holds is deleted, moved or newly excluded, the scan writes a new version of its record and of every part it had: the title kept, the text one line saying when it went, native.gone set, and moved_to when the same bytes reached another path in the same scan. A part a file no longer has (a page, a slide, a sheet) gets the same. Search then finds the file by its name with that line, and none of its old text. read of a folder source's record whose newest version is gone also shows the last version with text. Raw keeps every version; only docket forget removes one."
    not_chosen:
      - "Nothing on delete: a moved file is found twice, and a deleted draft reads as current."
      - "A gone version that keeps the whole text: raw doubles whenever the folder is reorganized."
