decisions:
  - id: DR-0487
    title: A file gone from a folder source gets a gone version of its record and parts, and comes back as a new version
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: "When a file the vault holds is deleted, moved, newly excluded, or its new bytes are kept out by the never-store lists, the scan writes a new version of its record and of every part it had, when the newest version isn't gone already: the title kept, the text one line (Not read from the folder since <date>, or from the file for a part), native.gone set, ts the scan's time, and moved_to when the same identity reached another path in the same scan. A part a file no longer has (a page, a slide, a sheet) gets the same, and so does every part of a file now not read (past a cap, damaged, protected), whose record says why. A passing reason (locked, a permission error, a placeholder, a held id, a stopped or crashed read) never makes a file gone. A file or part whose newest version is gone and that comes back is a new version with the scan's time as its ts, even with the same bytes and modification time: otherwise its version would equal one raw already holds, and the gate would skip it. Search finds a gone file by its name with its one line. read of a folder source's record whose newest version is gone also shows the last version with text, and anchors on it resolve there (DR-0491). Raw keeps every version; only docket forget removes one. The same holds for any file or part whose version raw already holds while it isn't the newest: the folder back at an earlier state, or new bytes whose text and modification time didn't change. It takes the scan's time, so the gate doesn't skip it as a version raw holds. A path that holds a never-store keyword is never read or named, and never turns gone: its gone version's title would say the keyword. A folder inside it that can't be listed now (a permission, a share gone) is a passing reason too: the files the vault holds under it stay current, and the report names the folder by its path inside the folder, unless that path holds a never-store keyword. exclude's patterns also leave out folders, so a folder that can't be read can be left out, and its files then go as excluded files do."
    binds: ["A file stays gone with one gone version, never one a scan."]
    not_chosen:
      - "Nothing on delete: a moved file is found twice, and a deleted draft reads as current."
      - "A gone version that keeps the whole text: raw doubles whenever the folder is reorganized."
      - "A returning file at its own modification time: its version could equal the old one, and it would stay gone."
