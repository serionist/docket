decisions:
  - id: DR-0675
    title: A STATUS.md renders after each write that changes its stream and on docket render; the ledger wins, and a hand edit is left and reported until the two agree
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#208"]
    description: "A ledger write that changed a stream (its add, a set, an undo of either, an import's) renders that stream's file at the end of store.write, once its lock is let go, from the write's own fold while the op files are as its commit left them and else from the ledger as it stands, so every writer renders: the ledger tool, docket ledger batch, the pages and the import; BatchResult gains rendered, saying what was written, left or refused, and a failed render never fails the write (DR-0554). docket render renders every rendered entry and exits 1 when one was left or refused. Nothing renders on a read, at the session start or in docket vault check. By the file at the path: absent with its folder there, or without frontmatter, the frontmatter is written above the body; with Docket's hash holding, it is rewritten when the stream moved; with no hash or a failing one, no line but the field lines and the comment line, and the five fields the owner sets (stream, status, where, next, deadline) equal to the ledger's as the writer would store them, one_line applied, it is rewritten with the hash, which takes over todo.py's files after the import; updated is left out of that comparison, since the ledger derives it. With a field differing, or any other key or line (DR-0674), the file is left and each field reported, file against ledger; a frontmatter that doesn't close or doesn't parse as YAML is left and reported; a stream the ledger doesn't hold leaves the file and is reported; a folder, a file not UTF-8, or a public or unreached remote is refused as DR-0554 says. The file is read again just before the rename and left when it changed since, unless it now carries Docket's own valid hash: another render got there first, so the stream is read again and rendered once more, and the last writer's state lands, with no new lock. A hand edit never reaches the ledger: Claude, on the owner's word, sets the stream to it or puts the ledger's value back, and the next render takes the file back. docket vault check reads the files, writes nothing and probes no remote, and names a status entry whose stream the ledger doesn't hold, a frontmatter a hand edit holds, and a file whose hash holds but whose fields lag the ledger, as stale; docket render (an editor saving a copy opened before a render puts such a frontmatter back, and the next render rewrites it); a file the render would write that holds no frontmatter of Docket's yet, absent, without one or one it would take over, as not rendered yet; docket render; what the render refuses it leaves to the render to report. The day shows the owner one line per hand-edited file."
    binds:
      - "The ledger is a stream's only source: a STATUS.md frontmatter is never read into it."
      - A hand-edited frontmatter is never overwritten; it is reported in the write's result, by docket render, by docket vault check and at the session start.
    not_chosen:
      - "Overwriting a hand edit: DR-0106 says it is reported, and the owner's edit would be gone."
      - "Merging a hand edit into the ledger: it would decide for the owner which value holds."
      - "A command to force the ledger's values over a hand edit: putting the value back, or setting the stream, already settles it."
