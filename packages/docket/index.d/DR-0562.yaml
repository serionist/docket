decisions:
  - id: DR-0562
    title: Each stored media file's cuts are committed with it, in state/media-cuts/<source>.jsonl
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#157"]
    description: "Each media commit appends to state/media-cuts/<source>.jsonl, in the same commit, one line per file it stores: schema_version 2, the rid's 32-hex hash, the file's key id (the sha256 of its age header), cuts (start and end in milliseconds, none for audio stored as it was put), at (UTC) and machine. Times and hashes only, never content, as the release log. It merges by union through the vault's *.jsonl merge=union, is written through a temp file in Docket's private folder and a rename, never through a link, and a line that doesn't read stops its reader, named by its number. A media commit that is known not to have landed puts the log back as it was. A file stored without a line counts as cut by none. What a stored file was cut by is the latest line for its rid's hash and its own key id, so two machines' lines for one rid never vouch for each other's file; a schema 1 line names no key and matches no file, and a file whose key doesn't read (an LFS pointer) or that no line names reads as cut by none. A stored file whose family needs more now (the release's cuts and the [cut] segments of its transcripts, staged ones with their cuts made, as the screen reckons them, against that line) is recut: the reader plays nothing, run_open's media line names it, and a put goes in beside it, the screen calling it stored already only while the line holds every range needed; a stored file a record cut by characters stands beside reads cut-by-characters, its own reason on the Recording page and in docket media status: no cut of the audio can match, so it stays unplayed and is never named. A stored file a hold covers is held, and plays nothing. At promotion the replacement takes the stored file's place: the old file's key is read first and written into the replacement's sidecar (schema 3, replaces_keys), a file at another name leaves the tree and its removal goes in the same commit as the replacement and its log line, and the old key is deleted only once that commit returns. When HEAD is where it was after a commit that raised, the replacement goes back to staging and the files it replaced come back from HEAD; one that landed and then raised keeps the old key until the next promotion sees HEAD hold the file the sidecar names, and deletes the keys it lists; when git can't say where HEAD is, everything stays for the next promotion. A replacement a crash left in media/, untracked or changed in place, with its sidecar in staging, is committed by the next promotion with the removal of the files gone from the tree under its hash, and the keys its sidecar lists are then deleted."
    binds:
      - Changing a line's shape needs a new schema_version and a reader for every earlier one.
      - "No key of a file HEAD holds is deleted unless its replacement is committed (#169's rule): a key outlives every swap that may not have landed."
    not_chosen:
      - "The cuts inside the encrypted file: the gate couldn't read them without the key."
      - "Working out a stored file's cuts from the state at its commit: the release logs and raw at that commit would have to be read again from history."
