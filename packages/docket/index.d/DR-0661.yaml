decisions:
  - id: DR-0661
    title: A day page writes one batch per form post, by user via page, and its Undo undoes that batch
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#203", "#204", "#205", "#206"]
    description: "The four day pages share one post route, /ledger/write. A form names its page and carries the page's state as hidden fields, as the Staging page's do, then one op of the batch's (DR-0639) and that op's keys, an item's fields as fields.<name>, the batch's own key, so an item's who, stream or kind never reads as the page's filter of that name; item, of or point repeats for a bulk, each value making one change, and a button may carry its op with its one value, such as triage:chase. A button carries what it writes, decided before the post: a verdict's clears it when every row it acts on holds that verdict and sets it on all of them otherwise, as the owner's old tasks app's bulk did, so no write toggles, and a form posted twice changes nothing the second time, which the page says as a notice, Nothing changed, with no Undo. A bulk gives each op only the rows it takes, closed ones to reopen and open ones to the rest: a dry run of the batch names the rows the writer refuses as they stand, the rest are written as one batch unless it refuses them all, and the notice names the rows it skipped. The route writes the changes through store.write as one batch, by user, via page, on the service's writer thread (DR-0381), and asks no index update: the next read's ledger_tables reads the grown op file (DR-0616). It answers a 303 to the page with done naming the batch, its first op id; the page shows the batch's log lines and an Undo, a post of undo with that batch, and after an undo a Redo, the undo's own undo (DR-0614). A text field, an item's title, who, due, description, notes or outcome and a meeting's outcome or notes, and the stream and kind too, saves on change, as the old app saved on click-away: htmx posts it to /ledger/save, a route of its own (DR-0170), which writes the same way and answers out of band the item's row, the panel's title and history and the page's version, taken under the vault lock with the write, so the page's own save brings no reload and typing in another field survives; a changed select counts as unsaved until its save answers. Without the script, the field's Save button posts it to /ledger/write. docket.js disables a form's buttons once it posts. A refusal writes nothing and answers the page the form names with the writer's words, 400, its text fields as typed and no poll, so nothing reloads them away; a refused save answers its field the same way, marked unsaved, so the poll's hold and the leave guard cover it. An add the writer refuses as a look-alike (DR-0642) shows the open items it looks like, which RefusedError gains as refs, and Add anyway, which posts it again with force true. An item added on a page gets the source page:<day>T<hh:mm>, a text locator naming no record, as the owner's old tasks app did, unless the owner gives one."
    binds:
      - "A page writes only through store.write: one batch per form post, by user, via page."
      - "A click is the owner acting: no confirmation and no guard beyond the writer's own checks."
      - "A post carries what it writes: no write toggles, so a form posted twice changes nothing the second time."
    not_chosen:
      - "A route per verb with a snapshot to restore on undo, as the owner's old tasks app had: the ledger's undo already does it and keeps the history."
      - "htmx posts for the buttons too: a plain post and a 303 keep every state a URL and work without JavaScript (DR-0170); only a text field, which the old app saved on click-away, saves in place."
      - "A check that the item is as the page showed it, as Curate's hash: the writer refuses what no longer applies, and the history keeps a text set over a newer one."
      - "A toggle decided when the write runs: a double click or a key held down would set the verdict and then clear it."
      - "Refusing a bulk whole for one row its op doesn't take: a tick over the Ledger's all state could never write."
