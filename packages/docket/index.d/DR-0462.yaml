decisions:
  - id: DR-0462
    title: Undo applies the inverse of one logged op to the entity file as it stands, logs it and stoplists its key; the index follows the file
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "Undoing an add removes that alias, name, id or link when the file still holds it, and only logs when it doesn't. Undoing a create deletes the file when it is as the create wrote it, and otherwise refuses, naming the changes since. Undoing a reject lifts its keys. Every undo of an add or a create puts its key on the stoplist. The index holds no curate state: the file's new hash makes the next index update reload the entity tables and recompute alias_terms, the misspellings and every mention, the rows a rebuild gives (DR-0115), and a round's batch drops a card the undo made stale."
    not_chosen:
      - "A git revert of the change's commit: it conflicts with any later edit of the file."
      - "Archiving a created entity instead of deleting it: archived entities still match."
