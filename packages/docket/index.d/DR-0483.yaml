decisions:
  - id: DR-0483
    title: "The core sets each format's text: a sheet's row n is its paragraph n, and ts is the file's modification time"
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: "pdf: each page's text layer, and a page without one says so. pptx: each slide's shapes, groups and tables in order, then its speaker notes. xlsx: each sheet's saved cell values, dates as ISO dates, one line per row from 1 to the last with a value, starting with its own row number (41: a | b), an empty row as 41:, a cell's line breaks as spaces, rows numbered by the sheet's r attribute; so paragraph n is row n, and #41-80 is Costs!41:80. docx: body paragraphs and tables in order, content controls, text boxes, field results, tracked insertions in and deletions out, then headers and footers, footnotes, endnotes and comments. md and txt: as written, read as UTF-8, UTF-16 by its BOM, else Windows-1252, which the record says. All text is NFC with LF line ends and no control characters but the tab; a table row is one line, its cells joined by ' | '. ts is the file's modification time; engine names the reader and its version; native holds the bytes' sha256 and size, the format, the part count, and capped, problem, gone, moved_to and moved_from when they apply."
    binds:
      - "A later reader keeps a sheet's row n as its paragraph n: anchors into sheets lean on it."
    not_chosen:
      - "A docx cut at its headings: rids that change whenever a heading does."
      - "A sheet without its empty rows: rows and paragraphs would differ."
