decisions:
  - id: DR-0468
    title: A round's batch is at most 15 cards, kept per machine in the private folder and disposable; snippets are cut when shown
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#68"]
    description: "A round starts from the Curate page, docket curate round or the skill. In order: the index is brought up to date; on the primary machine tier 1 commits its facts; the index is updated again, so the miner sees them; the miner reads the index beside the writer; the batch is written. In the service only tier 1's commit and the batch's write run on the writer thread. The batch, at most 15 cards, one per entity or new name, is <private>/curate/batch.json: the round's id and, per card, its id, number, keys, spellings, counts and locators; per machine and never committed. A card's id is the first six hex characters of its key's sha256, and a card's number is at most two digits, so a six-character reference is always an id. A decision names its card by id, or by the round and the card's number; one naming a round that isn't this machine's current one is refused with the current round's id, so a number read off an old list never decides another card. A card's state is folded from the log by its keys, so the page, the CLI and the skill on one machine show one batch and a decision synced from another machine closes the card; a card whose change a hand edit already made shows as done. A round is due 7 days after the last on any machine, from the log, and another starts whenever asked. Snippets, up to three a card, are cut from the index's chunk text when the card is shown: one per container, newest first, the first where the name is written too; about 160 characters around the marked spelling, with the chunk's locator."
    binds:
      - Deleting the batch loses only the open round's view; decisions live in the log.
      - No snippet is stored anywhere by curation.
      - A decision for a round that isn't this machine's current one is refused.
    not_chosen:
      - "A batch built every Monday: the service has no scheduler before phase 3, and a batch nobody opens goes stale."
      - "Snippets in the batch: a second copy of raw text, which forgetting a record wouldn't reach."
      - "The miner on the writer thread: every write would wait while it reads."
