decisions:
  - id: DR-0549
    title: Each media file is encrypted with age to a key of its own, kept sealed in the clone's private folder
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#42"]
    description: "pyrage, exact-pinned, with sqlite-vec's platform marker. Each file gets a fresh X25519 identity and is encrypted to it alone: no machine key, no master key, so deleting the identity forgets the file. A key's id is the sha256 of the file's age header through its MAC line. Keys live in the clone's private folder in its git dir: media/store.json (an id and which store) and media/keys/<key id>.age, each sealed with age to a store identity kept in the OS keychain as docket / media-store:<id>, or, when the owner chooses docket media keys init --store file, in <state dir>/media-stores/<id>, readable by the user only. The keychain is chosen at the first put when a write and a read-back work; when they don't, the put is refused naming the command, never a silent fallback. Nothing key-related enters the vault. A put writes the encrypted file to a temp name, then its key, then renames it into staging. docket vault convert moves the store with the private folder."
    not_chosen:
      - "A keychain entry per file: thousands, with no listing to export from."
      - "Keys derived from one secret: deleting one would forget nothing."
      - "Files also encrypted to each machine, or wrapped keys in git: a key in a folder vault's history stays for good."
      - "Our own age on cryptography: rolling our own crypto for a format pyrage covers."
