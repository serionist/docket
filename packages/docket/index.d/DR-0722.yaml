decisions:
  - id: DR-0722
    title: "Each sync agent writes its block to blocks/<source>.txt: DR-0687's labels, OWED, WAITING and INVITES gaining fields at their ends"
    status: proposed
    at: "2026-10-20"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#258"]
    supersedes: [DR-0687]
    description: "DR-0687's eleven labels and their fields, written by each agent to blocks/<source>.txt in its sync folder (DR-0720), the block and nothing else, and read back by docket.sync.block, which ships beside agent.md. Three lines gain fields at their end, which the reconcile drafts from: OWED gains its kind (reply, decision or task), its stream (one context.md lists, else -), the A- ref of the open item whose work it continues (else -) and a due day (YYYY-MM-DD, else -); WAITING gains the stream, the ref and the due; INVITES gains the stream. No field holds \" | \": OUTCOME's two to four lines are joined by \" / \", MEETINGS' and STREAMS' pairs by \"; \", attendees' names by \", \". NOTES names the note to write: the doc id, the rid, start, end, the M- ref when its content names one. A line of DR-0687's shape still reads, since fields are gained only at the end; a line with too few or too many fields for its label, or a field starting or ending with a bar that moved a field along, is read and said, never dropped unseen. Every locator is one read opens, and a line whose locator doesn't open is dropped."
    binds:
      - "The labels are a one-way door (AGENTS.md): never renamed or removed, and a line gains fields only at its end."
      - Every locator in the block is one read opens, never a subject and a time.
      - No field holds ' | '.
    not_chosen:
      - "The block as the agent's answer: the main thread retypes it into a batch."
      - "JSON blocks: a new door, for a format agents write well today."
      - "The old text locators, a mail's subject and time or a chat's name and time: read can't open them, so a close would rest on words."
