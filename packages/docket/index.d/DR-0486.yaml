decisions:
  - id: DR-0486
    title: A scan stats every file, hashes the ones that may have changed, and extracts only bytes the vault doesn't hold, on the primary machine
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: "Each machine keeps a cache in the vault's private folder, never committed and keyed by id: size, mtime_ns and sha256, the never-store lists' hash, and the sha256 of a try that stopped or crashed. A file is done when its stat matches the cache and the vault's newest version of it still carries the cached sha256. Otherwise its bytes are hashed and compared with its newest version in raw or staging; a gone version carries no sha256, so a file that comes back is never the same; the same bytes move the cache and make no version. Different bytes are extracted: the file record gets a new version, and a part only when its text_sha256 differs from its newest version's, never compared with raw's redacted text. The cache keeps the stat taken before the read, and drops the entry when the stat after the read differs, so the next scan looks again. What the vault holds is read from the source's run files, only the new ones after the first scan, and from staging. A scan runs only on the vault's primary machine. A folder that isn't there scans nothing, and a scan that would mark more than half the files it knew as gone, and at least 20, stages nothing until docket scan --accept-gone. One scan runs at a time, and the cache is saved after each batch."
    binds: ["The cache names no file: it is keyed by id."]
    not_chosen:
      - "Hashing every file on each scan: a large folder is gigabytes to read."
      - "The stat alone: a touch, a checkout or a version from another machine would be missed or make versions."
      - "Comparing a part with raw's text: redaction makes it differ on every scan."
      - "Scans on any machine: two checkouts at different commits would turn each other's edits back."
