decisions:
  - id: DR-0486
    title: A scan stats every file, hashes the ones whose stat moved, and extracts only bytes the vault doesn't hold, on the primary machine
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#69"]
    description: "Each machine keeps a cache in the vault's private folder, never committed and keyed by id: size, mtime_ns, sha256 and the never-store lists' hash. A file whose size and mtime_ns match is done. Otherwise its bytes are hashed and compared with its newest version in raw or staging; the same bytes move the cache and make no version. Different bytes are extracted: the file record gets a new version, and a part only when its text changed. What the vault holds is read from the source's run files, only the new ones after the first scan, and from staging. A scan runs only on the vault's primary machine. A folder that isn't there scans nothing, and a scan that would mark more than half the files it knew as gone, and at least 20, stages nothing until docket scan --accept-gone. One scan runs at a time, and the cache is saved after each batch."
    binds: ["The cache names no file: it is keyed by id."]
    not_chosen:
      - "Hashing every file on each scan: a large folder is gigabytes to read."
      - "The stat alone: a touch, a checkout or a copy on another machine would make versions."
      - "Scans on any machine: two checkouts at different commits would turn each other's edits back."
