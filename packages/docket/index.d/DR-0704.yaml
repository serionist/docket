decisions:
  - id: DR-0704
    title: Each page path answers the app's one document, data comes only from /api/web as JSON, and no route reads a header to choose its answer
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#252"]
    description: "The service answers each of the app's paths, the routes its build lists in routes.json, with index.html and 200, and any other page path with the same document and 404, which the app shows as not found; /api and /mcp keep JSON 404s. A page's state is its URL: the router keeps today's paths and parameter names (Search's are the search tool's, DR-0174; the day pages' only gain optional ones, DR-0669), so a reload, a bookmark, back, Claude's links and the tasks skill open the same state. The app sends the URL's parameters to the page's read as they are; the server's state parsers (state.py, day_state.py and the other pages') stay the one parser and answer the canonical state, which the app writes back to the URL by replace. No route reads HX-Request, Accept or a header of its own to choose between a page and data: a path is a page or JSON, never both. Pages need JavaScript. A browser without a session gets the document with the sign-in command in a meta element and 401, a used link the same, so a stranger's page names neither the vault nor the machine; static files need no session (as DR-0177)."
    binds:
      - A path answers the document or JSON, never one or the other by a header.
      - A page's URL keeps its parameter names and only gains optional ones.
    not_chosen:
      - "One URL answering a page or JSON by a header: a reload or back can get data."
      - "Hash routing: Claude's links and the tasks skill name real paths."
      - "A parser of the URL in the app beside the server's: two copies of one rule."
