decisions:
  - id: DR-0464
    title: An entity change or a rejection that names something on a never-store list is refused, and so is a value a redaction rule would change
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "Every name, alias, id, role and note a change writes is held to the never-store lists: against the people list as a record's author is (its forms, folded, failing closed), a name or alias of two words in both orders, since the list may write Minta Dóra for Dóra Minta; and against the keywords list as text. A match refuses the change, naming the list, never the value. A reject is held to the same check, and a spelling on a list writes no log line: its key would commit the name, and tier 3 leaves it out anyway (DR-0465). A value a redaction rule would change is refused too, naming the rule, rather than stored with a marker. Names themselves are never redacted (DR-0194)."
    not_chosen:
      - "Redacting the value: an alias holding [redacted:phone] matches nothing, and the entity looks complete."
      - "One order only: the people list matches a name whole, so Minta Dóra wouldn't match Dóra Minta."
