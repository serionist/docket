decisions:
  - id: DR-0528
    title: A write reads HEAD's branch and commit id from the git dir's files, and asks for unmerged paths right before each commit's add
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#132"]
    description: "A write reads from the git dir's files what they hold, with no git call: whether HEAD is on a branch (its HEAD file names a ref, or holds a commit id when detached), and HEAD's commit id (the ref's file under refs/, else its line in packed-refs). It reads only a plain checkout's git dir, the top's .git that passes home.is_git_dir, as home.discover keeps only a plain checkout's answer (#152); a git dir with a commondir file is unknown. It answers that a branch has no commit yet only when the ref has no file and packed-refs is absent or read cleanly without it; any read error, a git dir whose refs aren't files (reftable), or a file that doesn't read as git writes it is unknown, and the git call runs as before. The recovery check's branch test, a HEAD-exists test before a diff against HEAD, and the new commit's id after Git.commit use it. The recovery check reads the marker files (a rebase, merge, cherry-pick or revert in progress) and the branch at every check, as file reads, and asks git for unmerged paths, vault-wide as today, right before each commit's add, no longer at writing()'s entry: git add marks an unmerged path resolved and stages its conflict markers, and commit --only re-reads the paths it names and resolves an unmerged one too, so the question sits as close to the commit as it can, whatever happened earlier in the lock hold. A conflict that lands after the check and before the commit is still committed, in a window of three git starts where main has about six; the lead accepted it. The reader is one module the vault's git layer and #134's committed-settings cache can share; neither waits for the other."
    binds:
      - Every commit, its message and what it holds stay as they were; only questions git needn't answer go.
    not_chosen:
      - "Reading git's index for the unmerged paths: a second reader of a format with four versions, split and sparse indexes, for one call per commit."
      - "One unmerged-paths check per lock hold: a conflict a user's stash pop leaves after it, on a vault file, is added and committed with its markers, and git reports nothing (probed on git 2.47)."
      - "A second unmerged-paths check right before each commit: one more call per commit, and the window only moves; or a private index built from Docket's own bytes: a second staging of every commit."
