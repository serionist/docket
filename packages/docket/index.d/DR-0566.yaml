decisions:
  - id: DR-0566
    title: The Briefs page shows an entity's decisions, newest first, and is where the user confirms, rejects or picks
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#162"]
    description: "A brief's page for a project, topic or stream entity shows its decisions newest first: Waiting for you, the proposed ones, those that contradict a decision first, each beside the decision it contradicts or would replace; Decided, each current one with what it superseded folded under it and a rejected candidate that contradicted it; Rejected, folded. A proposed decision is never among the decided. An entity with decisions and no brief opens at its brief URL with them (No brief yet); one with neither stays a 404, unless DR-0557's rule answers it hidden. The list names each entity with decisions waiting. Each candidate has plain form buttons that post to /briefs/decision with its id, the rev the page showed and the page's brief: Confirm and Reject, or for one that contradicts a decision the three picks, the new one replaces it (confirmed, its contradicts and replaces moved into supersedes), the old one stands (rejected, the contradiction kept on record) or not a contradiction (confirmed, both stand). The post is the Guard's same-origin write with the browser's session (DR-0152); one that carries the token is refused, so no client of the API reaches it. It runs on the writer thread through DocStore.decide, which writes only the candidate's next rev, by the owner on the Briefs page, after checking again that the decision is proposed, on the page's entity, unedited on disk, at the rev shown, and that every replaces and contradicts target is still confirmed and current; a moved decision or target writes nothing and answers 409 with the page as it stands (the decision it replaces was replaced meanwhile; the candidate needs a new rev), so of two candidates replacing one decision the first click wins. It answers 303 to the page with done, which the page says once and no link carries."
    binds:
      - The route POST /briefs/decision, its fields and the URL parameter done join the page's door (DR-0557).
