decisions:
  - id: DR-0566
    title: The Briefs page shows an entity's decisions, newest first, and is where the user confirms, rejects or picks
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#162"]
    description: "A brief's page for a project, topic or stream entity shows its decisions newest first: each current one with the ones it superseded folded under it, the proposed ones waiting, contradictions first and each beside the decision it contradicts or replaces, and the rejected ones folded. An entity with decisions and no brief opens at its brief URL with its decisions. Confirm and Reject post to /briefs/decision with the id and the rev shown; a candidate that contradicts gets three picks: the new one replaces it, the old one stands (the candidate is rejected and the contradiction stays recorded), or not a contradiction. Each writes only the candidate's next rev. The URL gains done, saying what the last post did."
    binds:
      - The route POST /briefs/decision and the URL parameter done join the page's door (DR-0557).
