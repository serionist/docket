decisions:
  - id: DR-0691
    title: /docket:tasks opens the Queue page and works the queue in chat one item at a time, each outcome one ledger_batch
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#209"]
    description: "It opens the Queue page with docket open /queue (the Ledger page while #204 waits), says once when the session start names a sync due, and waits while the owner triages on the page or in chat, as a batch by user. On go it reads the queue with ledger: the me items in one line, then discuss, claude and chase, each by due. For each item: show; its source and its log's locators read only as far as the facts need, a recording's summary and the transcript around the moment; whether it already happened; three to five lines and the next step. Discuss: talk it through, one short question round for a crisp choice. Claude: draft or do it; a draft only the owner can send stays open, logged, a material labelled draft, not sent, and triaged me. Chase: draft the nudge, log it, clear the triage. A prep item: points on its meeting, keep for the proposed ones, done with the count. A point that is work: point_item. Each item's outcome is one ledger_batch before the next, by claude for what Claude did and by user for what the owner decided. The page and chat share only the ledger: the page reloads within 5 seconds of an op file changing (#203), and Claude reads the queue and the item again before it writes. Without the service it works through docket ledger queue, show and batch. Messages are drafts and follow the project's drafting notes, as DR-0689 says."
    binds:
      - "Nothing is closed without evidence: it was sent, answered or done, and Claude saw it or the owner said so."
    not_chosen:
      - "Claude moving the page's selection: a second writer of the page's state, while its poll already shows Claude's writes."
      - "One batch at the end of the session: each outcome would wait, and a session that stops would lose them."
