decisions:
  - id: DR-0555
    title: A brief is brief:<entity id> with three fixed sections, every line cited, checked by doc_put
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#161"]
    description: "A brief is the processed doc brief:<entity id>, for an entity in entities/ (any type, since ids are unique across types), with that entity in its entities list. Its body is a # <title>, then ## What changed, ## Last conversations and ## Decisions, in that order, each once, all required; a section may be empty. A further ## section after the three is kept with a warning in the put's result, not refused, until the maintainer's trial week settles the form; open items wait for the ledger. Every content line ends with raw anchors, refs (#166, DR-0540), or both; from #162 on, each line of ## Decisions cites a current decision with a [d:decision:…] ref (the decisions tool's cite) and nothing else, so the section stays empty until a decision is confirmed (DR-0565), and covers may be empty when no line has a raw anchor. The form is checked only for the brief type, on top of every doc's rules, on put and put_many; a hand edit's take-in doesn't check it. Writing a brief is Claude's judgement (DR-0104): the plugin's brief skill rebuilds one, or the stale ones after a sync when the user asks, through doc_put."
    binds:
      - The plugin's skill name brief and its read-only pre-approvals are a door, as recall's are.
    not_chosen:
      - "Refusing a section after the three: the trial week would need a code change to try one."
      - "Briefs for people, projects and topics only: a customer is as much a brief's subject, and ids are unique across types."
