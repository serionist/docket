decisions:
  - id: DR-0576
    title: The Recording page plays stored audio by byte range through the reader, and shows Whisper's transcript beside the recorder's
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#159"]
    description: "The Recording page shows the browser's own audio player when the recording's stored audio reads ok through the one reader (DR-0551), with preload none and its source /recording/audio?rid=<recording rid>, plus #t=<start> for the first line the URL marks, so playing starts at that line without JavaScript. With the script a line's time sets the player there and plays, keeps the URL on the line, and marks the line as playing; a [cut] line has no start. Every other state of the reader shows its reason, and the player's route refuses it. /recording/audio is a page route that takes the browser's session only: a request carrying Authorization is refused with 403, as /briefs/decision refuses it, so the token, Claude's too, never fetches decrypted audio, and minting a session from the token stays DR-0564's floor. It reads the reader's state again on every request and refuses anything but ok (and a file that isn't audio) with 404 and the reason; then it takes the stored file's decrypted bytes from a keep of one file at most, keyed by its path and modification time and dropped a minute after its last request, decrypting through reader.read only on a miss, in memory only, since pyrage decrypts a whole stream or nothing and the 64 KiB chunks a range needs can't be decrypted alone. HEAD answers the size from the file's age framing, nothing decrypted. A range is a view of the bytes, never a copy. It and answers a Range of one stretch (a-b, a-, -n, each field at most 20 digits) with 206 and exactly those bytes, one past the end or -0 with 416 and Content-Range bytes */<size>, and no Range, several ranges or one that doesn't parse with 200 and the whole file, as RFC 9110 lets a server; every answer is Cache-Control: no-store. Nothing of it is logged but the request log's route template and status. The page CSP gains media-src 'self' and nothing looser. When raw holds a Whisper transcript of the recording (its via starting docket transcribe), the page shows it beside the recorder's transcript in a table, a row per line of the recorder's with Whisper's lines whose middle falls in it, a Whisper line in a gap of the recorder's in a row of its own; Whisper's lines name no speaker. A cut stretch is one row, cut in both, as Whisper's [cut] spans the stretch the recorder's was cut at. A Whisper transcript still staged isn't shown, as the page reads raw only."
    binds:
      - The audio route answers only what the reader says is ok, never caches, and logs nothing of the audio.
      - The page CSP's media-src stays 'self'.
      - "The token never fetches the audio: the route refuses Authorization."
    not_chosen:
      - "Decrypting the file once into a plain temp file to serve: plain audio would sit on disk."
      - "Aligning by bands of overlapping lines: two transcripts that tile the call overlap end to end, so one band would swallow it."
