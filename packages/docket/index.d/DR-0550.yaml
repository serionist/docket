decisions:
  - id: DR-0550
    title: A second machine gets media keys from an export the owner makes and moves, at their own console
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#42"]
    description: "docket media keys export <file> and import <file> run only at the owner's console (refused in Claude Code's shell, a pipe or a redirect). Export refuses a target inside any git work tree, where a commit could take it, and writes to a new file only, never over one: through a temp file beside it, synced, then put in place by a hard link, or on a drive with none by taking the name first and replacing it, a failure leaving nothing under the name. It draws a passphrase of six groups of four letters with no look-alikes, shows it once the file is synced, with every key of the clone in the file sealed with age's scrypt passphrase mode: schema_version 1, and each key's id, identity, path and time. The owner types the passphrase's last four letters back; anything else deletes the file, since nothing could open it. Import asks for the passphrase without echo, keeps only its letters and groups them in fours, so a spaced or unseparated form opens the file, and adds the keys it lacks, counting those it has. The export is the backup; the newest holds every key. Where it goes is the owner's choice at each export; the README names a password manager, a USB stick and a synced folder. docket media status, docket vault status and the session-start dashboard count keys no export has held, from a list of key ids in the private folder that a kept export and an import both add to, since the file imported brings them back too. A run of a source with a media host or folder gains a media step after its close. A key reaches every clone that imported an export, so forget, when it comes, must reach those clones too, by key id, never by a key in git."
    binds:
      - A later Docket reads every earlier bundle's schema_version.
      - "Amended by #143 (DR-0575): the export asks the OS prompt, or the code, before it writes the file; the import's passphrase stays its factor."
      - "Amended by #191 (DR-0599): the export asks no OS prompt or code; both stay at the owner's console, for the passphrase shown or typed there."
    not_chosen:
      - "Machines syncing keys over the network: both online at once, and a new listening surface."
      - "A passphrase the owner types: drawn letters are stronger, and Claude never sees them."
      - "A count of keys since the last export alone: a clone that only imported would ask for a backup it already has."
