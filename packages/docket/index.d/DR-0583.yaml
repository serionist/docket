decisions:
  - id: DR-0583
    title: Docket finds a recording's doubtful spots by aligning its two transcripts per recorder line; Whisper's confidence stays out of the record
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#183"]
    description: "Spots are worked out when asked, never stored, from the latest versions in raw of a recording's two transcripts, the recorder's being the one its summary covers, else the first under it by rid; a staged version isn't read. They are worked out only on a machine that ingests the recording's source, as docket transcribe asks, since withheld marks and private decisions are each clone's own; elsewhere there are none and why says so. The family screen media's reader asks (media.screen.refusal) must pass, a source only off aside, or there are none. Cuts are every [cut] span of either transcript's latest version, merged; a recorder line or a Whisper segment that overlaps one by its own times, as cuts.py takes a segment, is skipped whole, so a cut made after Whisper ran still holds and no estimated time decides. Words are plaintext.WORD's matches with their places in raw, compared after NFC and casefold with accents kept, as docket eval speech scores (DR-0571), the filler sounds of the transcript's language left out. Each of Whisper's words is timed by its share of its segment's characters and given to the recorder line its time falls in, or the nearer one across a gap of at most a second; each line's words are aligned to those it was given with difflib's SequenceMatcher, autojunk off. Every replace, insert and delete is a candidate; an insert or delete at either end of a line is dropped only when its words stand at the touching edge of the neighbouring line (an insert's words are that line's first or last words, a delete's the first or last Whisper words given to it), and a line given no Whisper words makes none. A candidate's texts, raw's own substrings, widen by the agreeing word on each side, where there is one, both transcripts alike, until neither is empty and the recorder's stands once in its line; past six words on either side it is counted as heard differently and not listed; candidates whose places would overlap are one spot. Kinds: name, when a word of either text is within matching's edit distance (max_distance) of a word of a name or alias of the meeting's entities (the family's people resolved to entities, their related projects and the entities its records name, as the Whisper prompt picks them, DR-0569) or of a glossary term, or is capitalised mid-sentence; also a capitalised word both engines spell alike that is within that distance of a meeting name and none of its forms, or is one of its asr aliases; an entity or term a list holds by any name, alias, contact id or its id is left out whole, as speech/prompt.py's _listed leaves it. Number, when either text holds a digit or a word that splits wholly into its language's number words, egy and one alone left out, and the two sides' values differ: equal values make no spot. Word, the rest. Ranked names, numbers, words, by time within each, at most 40 a recording, the rest counted by kind; a spot a fix line decides is shown with that line, not again; a place whose every fix line is rejected comes back with the picks the owner turned down, after the undecided spots of its kind. A spot whose texts or line name a person a never-store list holds, in the shapes the brief screen reads (DR-0558), or that touches a redaction marker, is left out and counted, never named. A spot's id is the first 8 hex digits of the sha256 of the recorder rid, its line's start and the two texts. Numbers are digits and number words only until the typed extractors come. Whisper's per-segment log probability, which the worker sends, is not stored."
    binds:
      - "A transcript's segments stay as DR-0111 has them: start_ms, end_ms, speaker and text, nothing else."
      - No spot is ever listed inside a [cut], and none names a value a never-store list holds.
      - A spot's recorder text stands once in its line, so a fix names one place.
    not_chosen:
      - "Whisper's log probability in each segment: Segment forbids other fields, so every machine would need updating before a record carried one, and an average over a segment of several seconds marks a sentence, not a word."
      - "One alignment over the whole call: it drifts across stretches one engine skipped; a recorder segment bounds each comparison."
      - "Spots kept in the index: they change with the entities and the never-store lists, and a call costs milliseconds."
