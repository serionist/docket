decisions:
  - id: DR-0583
    title: Docket finds a recording's doubtful spots by aligning its two transcripts per recorder line; Whisper's confidence stays out of the record
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#183"]
    description: "Spots are worked out when asked, never stored, from the latest versions in raw of a recording's two transcripts, the recorder's being the one its summary covers, else the first under it by rid; a staged version isn't read. The family screen media's reader asks (media.screen.refusal) must pass, a source only off aside, or there are none. Every [cut] span of either transcript's latest version is merged, and no segment or word inside one is compared, so a cut made after Whisper ran still holds. Tokens are a segment's words as plaintext.words gives them, compared casefolded with accents kept, as docket eval speech scores (DR-0571), with the filler sounds of the transcript's language left out. Each of Whisper's words is timed by its share of its segment's characters; the words timed inside a recorder segment, one second either side, are aligned to that segment's words with difflib's SequenceMatcher, autojunk off. Every replace, insert and delete is a candidate, except an insert or delete at either end of the window, and a segment Whisper has no words for gives none; an insert or delete takes the agreeing word before it (after it, at a segment's start), so neither text is empty; a run over six words on either side is counted as heard differently and not listed. Kinds: name, when a word of either run is within matching's edit distance (max_distance) of a word of a name or alias of the meeting's entities (the family's people resolved to entities, their related projects and the entities its records name, as the Whisper prompt picks them, DR-0569, minus any a list holds) or of a glossary term, or is capitalised mid-sentence; also a capitalised word both engines spell alike that is within that distance of a meeting name and none of its forms, or is one of its asr aliases; number, when either run holds a digit or a word that splits wholly into its language's number words, egy and one alone left out; word, the rest. Ranked names, numbers, words, by time within each, at most 40 a recording, the rest counted by kind; the same two texts in one segment are one spot with a count; a spot a fix line decides is shown with that line, not again. A spot whose texts or line name a person a never-store list holds, in the shapes the brief screen reads (DR-0558), or that touches a redaction marker, is left out and counted, never named. A spot's id is the first 8 hex digits of the sha256 of the recorder rid, its segment's start and the two texts. Numbers are digits and number words only until the typed extractors come. Whisper's per-segment log probability, which the worker sends, is not stored."
    binds:
      - "A transcript's segments stay as DR-0111 has them: start_ms, end_ms, speaker and text, nothing else."
      - No spot is ever listed inside a [cut], and none names a value a never-store list holds.
    not_chosen:
      - "Whisper's log probability in each segment: Segment forbids other fields, so every machine would need updating before a record carried one, and an average over a segment of several seconds marks a sentence, not a word."
      - "One alignment over the whole call: it drifts across stretches one engine skipped; a recorder segment bounds each comparison."
      - "Spots kept in the index: they change with the entities and the never-store lists, and a call costs milliseconds."
