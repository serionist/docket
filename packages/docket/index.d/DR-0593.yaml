decisions:
  - id: DR-0593
    title: The index is built under the forgotten list's digest, and an index built under another is rebuilt and refused until it is
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "The index's freshness can't see a forget through run files' sizes and modification times alone: the list moves while no run file does after a crash past the list's commit, or when a clone pulls a line while the record sits in its own unpushed run file; a rebuild can fail (on Windows the file's replace gives up after 5 s while the embedding pass holds it, and the service's updater keeps the old index); and docket search --no-update reads what is there. So index/schema.py's expected_meta gains forgotten, the sha256 of the list's entries in force (DR-0579), sorted, so a merge that only reorders lines changes nothing, and empty with no list. update finds an index built under another digest stale and rebuilds, as for another schema; open_index and lookup.open_read refuse it, so a search refuses with the rebuild's message rather than answer from it, and read takes the load route, which skips listed lines. The build leaves out listed records with their chunks, segments, mentions and vectors, and every doc line the docs' rule drops (DR-0580), with its dependents through derived_from; read and a final decision's HEAD read drop the same lines. A rebuild gives the same rows as a vault that never held the family."
    binds:
      - No search answers from an index built under another list.
      - A rebuild leaves out every listed record and every doc line the docs' rule drops.
    not_chosen:
      - "Trusting run files' sizes and times alone: the list moves without a run file moving, and a failed rebuild keeps the old index answering."
      - "The list file's bytes as the digest: a union merge that only reorders lines would rebuild every clone's index for nothing."
