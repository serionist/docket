decisions:
  - id: DR-0593
    title: The index is built under the forgotten list's digest, and an index built under another is rebuilt and refused until it is
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "The index's freshness can't see a forget through run files' sizes and modification times alone: the list moves while no run file does after a crash past the list's commit, or when a clone pulls a line while the record sits in its own unpushed run file; a rebuild can fail (on Windows the file's replace gives up after 5 s while the embedding pass holds it, and the service's updater keeps the old index); and docket search --no-update reads what is there. So index/schema.py's expected_meta gains forgotten, the sha256 of what the build reads from the list in force (DR-0579), sorted: its rids, versions, files, media, old_paths and import_hashes, never its keys, at or machine, so a keys-only line, an apply's now or retention's expiry later, rebuilds no index, and a merge that only reorders lines changes nothing; empty with no list, and an index from before the list, with no digest in its meta, reads as built under none, so no index rebuilds before a first forget. update finds an index built under another digest stale and rebuilds, as for another schema; open_index and lookup.open_read refuse it, so a search refuses (the index can't be used: it was built before a forget; run docket index rebuild) rather than answer from it, and read takes the load route, which skips listed lines. The build leaves out listed records with their chunks, segments, mentions and vectors, every doc line the docs' rule drops (DR-0580), with its dependents through derived_from, and a legacy note whose old path or body hash is listed, as the apply removes it; The build runs the docs' rule (vault/forgetdocs.py, which the apply and read use too) once the records are in, on the docs it indexes as every read takes them, reading only what their refs lead to, a round at a time, decisions through one listing of HEAD and each earlier rev once a process, so an update that indexes one doc reads that doc and what it cites: a doc the rule changes is indexed as Docket writes it, so its lines are numbered as the rewritten file will number them, and a doc it removes keeps its file's row, so a read still finds the docs current and asks the index. read and a final decision's HEAD read drop the same lines. What the build took from raw, each rid whose lines it skipped and the folder files whose parts it takes, is kept in the index's skipped table, which an update starts from, so it judges as the rebuild before it did. A rebuild gives the same rows as a vault that never held the family."
    binds:
      - No search answers from an index built under another list.
      - A rebuild leaves out every listed record and every doc line the docs' rule drops.
    not_chosen:
      - "Trusting run files' sizes and times alone: the list moves without a run file moving, and a failed rebuild keeps the old index answering."
      - "The list file's bytes as the digest: a union merge that only reorders lines would rebuild every clone's index for nothing."
      - "Every entry in the digest, keys included: a keys-only line changes no row, yet would rebuild every clone's index and refuse its searches meanwhile."
