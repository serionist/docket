decisions:
  - id: DR-0696
    title: After a forget, vault check and the writer accept a committed op line changed to its mask; the writer refuses text on the family or a shell, and the import writes listed ops masked
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#212"]
    description: "docket vault check and the writer's pending() explain a committed op line changed or gone when its id is listed and the file holds its mask (DR-0610, DR-0617), so a write after a stopped apply commits it, as it commits any op file a stopped write left. A listed id's line not masked yet is named as a forget not finished, which the next gate call finishes, as a run file changed only by listed lines gone is (DR-0581). The writer refuses an op whose source, a material's ref or an [r: anchor in its text names a rid forgotten whole or a removed legacy note's old path the list holds, naming the op and the field, never the value: a hash check, which keeps new ops from needing a mask. On a shell (DR-0694) it refuses a text field or a log, naming the shell's number, and writes any op's note as [forgotten]: a drop's required note, an archive's, the note a sync's batch gives its due archives (DR-0641), so an open shell can still be closed and a sync's batch never fails on one. The import (DR-0653) cleans a listed op of its file as the writer does, masks it before the text rules screen it, so what a forget took, its person put on the never-store list since, can't stop it, and compares and writes it masked, so an import run again after a forget, whose ids the export derives the same, brings no text back; it refuses an unlisted line holding text on a shell, naming the line. As built: the rollover leaves a shell's open points where they are, the screen having named each to raise again; no meeting continues a shell; and a shell's point makes no item."
    binds:
      - A committed op line that changed is explained only by its id on the list and its mask in the file.
      - On a shell the writer refuses a text field or a log and writes any op's note as [forgotten]; the import never writes text on a shell or a listed op's text.
    not_chosen:
      - "The writer running the apply first: a click on a page would wait on a walk of the docs after a pull, and every gate call runs it already."
      - "Refusing any note on a shell: a drop needs one, and a sync's batch archiving what is due would fail on a closed shell."
      - "A drop on a shell refused for want of a note: an open shell could never be closed."
