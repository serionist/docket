decisions:
  - id: DR-0696
    title: After a forget, vault check and the writer accept a committed op line changed to its mask; the writer refuses text on the family or a shell, and the import writes listed ops masked
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#212"]
    description: "docket vault check and the writer's pending() explain a committed op line changed or gone when its id is listed and the file holds its mask (DR-0610, DR-0617), so a write after a stopped apply commits it, as it commits any op file a stopped write left. A listed id's line not masked yet is named as a forget not finished, which the next gate call finishes, as a run file changed only by listed lines gone is (DR-0581). The writer refuses an op whose source, a material's ref or an [r: anchor in its text names a rid forgotten whole or a removed legacy note's old path the list holds, naming the op and the field, never the value: a hash check, which keeps new ops from needing a mask. On a shell (DR-0694) it refuses a text field or a log, naming the shell's number, and writes any op's note as [forgotten]: a drop's required note, an archive's, the note a sync's batch gives its due archives (DR-0641), so an open shell can still be closed and a sync's batch never fails on one. An outcome there, a close's in a sync's batch among them, is written as [forgotten] too. The import (DR-0653) cleans a listed op of its file as the writer does, masks it before the text rules screen it, so what a forget took, its person put on the never-store list since, can't stop it, and compares and writes it masked, so an import run again after a forget, whose ids the export derives the same, brings no text back; it refuses an unlisted line holding text on a shell, naming the line. As built: the rollover leaves a shell's open points where they are, the screen having named each to raise again; no meeting continues a shell; and a shell's point makes no item. A point the list holds on a meeting that isn't a shell (DR-0694) is a small shell: the writer refuses text on it, naming the point as M-0040#2, and a point_item from it, since a later match would take what it wrote; an answer there is written as [forgotten] and its state goes, as an outcome on a shell does, so a batch answering a meeting's points never stops on it; a point_set of its state alone, such as dropped, still goes, its note [forgotten], so the owner can close it; and the rollover leaves it where it is, copying it nowhere, so no unlisted copy carrying the marker is made for a later match to mask, the dry run and the screen naming it among those to drop. The import refuses an unlisted line holding text on such a point, naming the line and the point."
    binds:
      - A committed op line that changed is explained only by its id on the list and its mask in the file.
      - On a shell the writer refuses a text field or a log and writes any op's note and outcome as [forgotten]; the import never writes text on a shell or a listed op's text.
      - A point the list holds on a meeting that isn't a shell takes no text from the writer or the import, an answer only as [forgotten], and makes no item; its state still changes, and the rollover leaves it where it is.
    not_chosen:
      - "The writer running the apply first: a click on a page would wait on a walk of the docs after a pull, and every gate call runs it already."
      - "Refusing any note on a shell: a drop needs one, and a sync's batch archiving what is due would fail on a closed shell."
      - "A drop on a shell refused for want of a note: an open shell could never be closed."
      - "A close with an outcome on a shell refused for its outcome: a sync's batch closing it beside other items would fail whole."
      - "Refusing an answer on a point a forget left: a batch answering a meeting's points would stop on it."
      - "Rolling a point a forget left on with its marker: a copy no list line names, which a later match would mask unseen."
