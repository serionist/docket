decisions:
  - id: DR-0656
    title: docket ledger import --revert deletes every op file with git rm in one commit, until the old ledger retires, and every clone pulls it before writing again
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#202"]
    description: "docket ledger import --revert [--dry-run] deletes every op file in ledger/ops/ with git rm, the import's ops and any written since, in one commit through store.py, refolds the index's ledger tables and says how many of each via went. It is for the trial imports and a rollback before the old ledger retires: CLI only, never a tool or a page. Every clone pulls the revert before it writes again: a clone that wrote to a deleted file meanwhile meets a modify/delete conflict on its next merge, which stops it, and a file written after the revert is a new one. Two clones on one host with one machine name, as the live clone and the owner's checkout are, write the same file names, so at cut-over a dry run after the merge lists the ops not from the file (DR-0654) and nothing but the calendar step's meetings may stand there. A catch-up that joined imported meetings needs no undo of its batch first: its joins go with the rest, and so do the calendar step's own meetings; after the rerun, docket ledger calendar --since <the calendar's first day> makes them and the joins again from raw (#200, DR-0655). A rerun is revert, import, catch-up. Git keeps the lines, and reverting that commit, which only adds files, brings them back. docket vault check compares the working tree with HEAD (DR-0617), so a commit that removes files is no problem; besides a forget's apply, this is the one way committed op lines go."
    binds:
      - The revert deletes the op files; it never leaves an emptied one.
      - A clone writes again only after it has pulled the revert.
    not_chosen:
      - "Emptying the op files: a clone that hadn't pulled the revert and wrote meanwhile takes every line back through the union merge (DR-0142) without a word, which a two-clone probe in the plan's review showed."
      - "git revert of the import's commits: under the same union merge a revert's removed lines that meet a later append are kept without a word, and an import is a commit per month plus what was written on top."
      - "Undoing the catch-up's batch, then taking out the import's ops alone: the undone joins' lines would still name the removed meetings through continues, and the step's later sets name a join's add, so the ledger would keep lines naming nothing for good."
