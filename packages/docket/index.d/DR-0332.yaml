decisions:
  - id: DR-0332
    title: The worker's environment is a uv virtualenv per device that docket models install builds from hashed requirements in the wheel
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#67"]
    description: "docket models install [--device auto|cpu|cuda] makes models/env-<device> under the user's data folder on Docket's own Python and installs requirements-<device>.txt, shipped in the wheel, with --require-hashes; a devkit command compiles the files with pins at least a week old (DR-0157), and Dependabot watches them. auto takes cuda when nvidia-smi answers. The CUDA environment takes onnxruntime-gpu from PyPI (Windows x86_64, Linux x86_64 and aarch64) with its cuda and cudnn extras, which bring NVIDIA's CUDA 13 runtime, cuBLAS, cuFFT, cuRAND, NVRTC, nvJitLink and cuDNN wheels under NVIDIA's proprietary licences: installed only into that environment, when the user asks for it, and never a dependency of Docket. The install refuses a system sqlite-vec has no build for, starts the worker once, checks a vector's size and, on cuda, that ONNX Runtime runs on the GPU rather than falling back to the CPU, and times a batch for the token budget. docket models status says the environment, the device, the files, the worker and each model's vectors; docket models remove deletes the environment, the files and the config block. The core install gains only sqlite-vec, so keyword search works with no model installed."
    not_chosen:
      - "An extra, docket[models]: onnxruntime and onnxruntime-gpu are two packages for one module, so an extra can't pick the GPU build per machine, and it puts the models' packages in the service's environment."
