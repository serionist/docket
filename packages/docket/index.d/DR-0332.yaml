decisions:
  - id: DR-0332
    title: The worker's environment is a uv virtualenv per device that docket models install builds from hashed requirements in the wheel
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#67", "#109"]
    description: "docket models install [--device auto|cpu|cuda] makes models/env-<device> under the user's data folder on Docket's own Python and installs requirements-<device>.txt, shipped in the wheel, with --require-hashes; a devkit command compiles the files with pins at least a week old (DR-0157), Dependabot watches them, and the gate holds their onnxruntime, tokenizers and numpy to the dev group's pins, and each pin to a wheel for every system its marker names, read from tools/devkit/models-wheels.json, the pins' files by sha256, which devkit models-lock writes from the same resolution and where it leaves out a release that lacks one (nvidia-cublas 13.8.1.7 came for Linux only, #109). auto takes cuda when nvidia-smi answers. The CUDA environment takes onnxruntime-gpu from PyPI (Windows x86_64, Linux x86_64 and aarch64) with its cuda and cudnn extras, which bring NVIDIA's CUDA 13 runtime, cuBLAS, cuFFT, cuRAND, NVRTC, nvJitLink and cuDNN wheels under NVIDIA's proprietary licences: installed only into that environment, when the user asks for it, and never a dependency of Docket. The install refuses a Mac ONNX Runtime 1.31 has no build for (an Intel Mac, or macOS before 14), a system sqlite-vec has no build for, and a Python whose SQLite can't load it (macOS CI's own can't; uv's own Pythons can, and the refusal says so), starts the worker once, checks a vector's size and, on cuda, that ONNX Runtime runs on the GPU rather than falling back to the CPU, and times a batch for the budget; an environment whose marker holds but whose check fails is built again once. A download that stops keeps its part and says to run the install again, which resumes it. docket models status says the choice, the environments, the files, each model's vectors in the vault's index and the running service's worker with the last lines of its stderr; --check starts a worker once. docket models remove forgets the choice and each environment's marker first, then deletes the environments and the files: on Windows the service's worker holds its environment's files, so models are off at once and the remove says to stop the service and run it again. The core install gains only sqlite-vec, so keyword search works with no model installed."
    not_chosen:
      - "An extra, docket[models]: onnxruntime and onnxruntime-gpu are two packages for one module, so an extra can't pick the GPU build per machine, and it puts the models' packages in the service's environment."
