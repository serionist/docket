decisions:
  - id: DR-0456
    title: docket models install fetches the device's reranker with the embedder, and --no-reranker leaves it out
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#88"]
    description: "One reranker per device: the CPU environment gets mmarco (0.49 GB with its tokenizer, 0.98 GB of model files in all), the CUDA one bge-reranker-v2-m3 (1.15 GB, 1.64 GB in all); no new packages, since both environments hold ONNX Runtime and tokenizers. The user config's models block gains reranker, a catalogue name or none, which the install writes. A block written before it has no reranker key: no reranker, and docket models status says that docket models install adds it. An unknown name turns models off with the reason, as any value that doesn't read does (DR-0335). --no-reranker writes none, fetches nothing for it and removes its files if an earlier install fetched them; docket models remove removes them with the rest. The worker on a CPU holds 1.8 GB with both models against 0.9 GB; the reranker's CUDA session holds about 2.3 GB of VRAM."
    not_chosen:
      - "The reranker off by default behind a flag: the paraphrase lift is most of what the models give, and the install already decides per machine whether it runs (DR-0455)."
      - "Both rerankers on a CUDA machine, so docket search could rerank on its CPU worker: 0.49 GB more, and the command would rank differently from the service."
