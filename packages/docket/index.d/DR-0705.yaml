decisions:
  - id: DR-0705
    title: The built app is committed in the package under docket/web/app, and CI builds it again and fails on any difference, so an install needs no Node
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#252"]
    description: "npm run build writes the app to packages/docket/src/docket/web/app/: index.html, its scripts, styles and fonts under fixed names, licences.txt with the licence of every bundled package, routes.json, and build.json with a hash of the sources it was built from. uv_build packs the folder into the wheel with the rest of docket/web, so uv tool install git+https://github.com/serionist/docket@<sha>#subdirectory=packages/docket installs a working app with no Node, no npm and nothing fetched at runtime. The service reads the files at start into the asset table and serves them under /static/app/, no-cache with a strong ETag, which is why the names need no content hash; index.html goes out only through the page routes, with its nonce (DR-0706). The web CI job runs npm ci, the build and git diff --exit-code over the folder, so what is committed is what the sources build; the quick gate checks build.json's hash against the sources in Python, so a source change without a build fails before a push. A conflict in the folder is settled by building again, never by hand. The front end's sources and node_modules stay out of the wheel and the sdist, and the lockfile's integrity hashes pin each package as assets.py pins a vendored file."
    binds:
      - The committed build is byte for byte what npm run build makes from the committed sources.
      - Every bundled package's licence is in licences.txt, and each is compatible with Apache-2.0.
    not_chosen:
      - "A build hook in the wheel build that runs npm: every install from git would need Node."
      - "A wheel CI builds and publishes: installs come from a git sha, and there is no release yet."
      - "Content-hashed file names: each build renames files, and the diffs and conflicts grow with them."
