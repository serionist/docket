decisions:
  - id: DR-0723
    title: docket sync reconcile drafts the sync's batch into the sync folder by fixed rules, each op the rules can't settle marked unsure for Claude to settle
    status: proposed
    at: "2026-10-20"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#258"]
    supersedes: [DR-0689]
    description: "DR-0689 as it stands, but the batch is drafted by docket sync reconcile <sync>. It reads sync.json, every block file and the ledger fresh through ledger_tables, and resolves every locator as read does through one index: a line whose locator doesn't open is dropped and listed, and a line whose shape is wrong stays, drafted unsure. It writes draft.jsonl in the sync folder, JSON lines with # comments, in DR-0689's order: closes, asks, meetings, links, the points' minutes then the outcomes, rollover, a # prep line naming the next five working days' meetings, streams, archive. It prints the RUN lines, the draft's ops and unsure lines by number, every merge with its block lines, the lines dropped, the closes skipped, the LEARNED lines whole and the prep meetings, and writes nothing else. A CLOSES line is a done, or a drop when moot, sure on an item open or snoozed now; one closed already is skipped and said. An OWED or WAITING line whose continues ref names an open item is a log there, the locator in note, and a set of due when its due differs; unsure when the ref isn't open or names nothing (the add first, the log its alternative) or the item's thread holds another of the person's open items. Else an add: kind (waiting for WAITING), title, who, stream, source the locator, opened the day asked, due the line's or today for today, the why in note, and meeting the one someone in it asked during or up to 120 minutes after (DR-0651), never a cancelled one or the owner's own block; unsure for a thread match, a DR-0642 look-alike, a locator whose rid is already any item's source, two meetings, a kind, stream or day missing, unheld or unread, and a look-alike of an add drafted above it, which the writer refuses unless forced. A thread is the index's records.thread of the locator's rid; an open item's trail is its source, its materials' refs and the locators in its ops' notes, read by views.trails; a thread match counts only for the same who, case aside, on the same side, and never where the record's thread is its container, as in a chat or a recording. Two lines are one ask only with the same who, side and look-alike title and the same continues ref or none, on one side of a close of the item they continue: surely so only when the op is a log on that item, else the add is unsure with the other lines' adds as alternatives; never by a shared locator alone; every merge is reported. An ask on an item a CLOSES line closes is a log when asked before the evidence, an add after, unsure when the times can't tell. An INVITES line is a log on an open invite with its rid, else an add of kind invite titled from its meeting's subject for an event (DR-0646), else the record's title; unsure with no title or an unheld stream. MEETINGS and STREAMS lines are a set of their fields, unsure when the meeting or stream doesn't stand or a field isn't one it takes. A NOTES line is a material, label recording, on the meeting 10 minutes either side of the recording's start, or the line's M- ref of two; unsure for two with no ref or a ref not at its start; none, or a meeting that has it already, is said with no op. A MINUTES line is a point_set by point id, sure on a point open on that meeting; an OUTCOME line a set of outcome, its / made line breaks, sure on a meeting with none yet. An unsure op carries an unsure key, the why and the choice, which the writer refuses, so it can't be written unsettled: above it # ? lines quote its block line with its file and line and each candidate's context.md line, with its state where it is the source rule's; below it a # line per alternative. The skill reads the draft once, settles each unsure line by taking the key out, swapping in an alternative or deleting it, by the continuing-work rule, adds the prep points at # prep, and writes the file with ledger_batch by file, by sync, dry run first (DR-0724); without the service, docket ledger batch <file> --by sync."
    binds:
      - "DR-0689's binds: nothing closes without a locator that shows it, no proposal queue, rollover before the proposed points, no message sent without the owner's word."
      - "Nothing in the draft is written without Claude's batch: the command writes only the sync folder."
      - An op the rules can't settle is drafted unsure, with its block line, its candidates and its alternatives, never sure.
    not_chosen:
      - "Claude drafting every op: the rehearsal spent 7.5 minutes on it, retyping what the blocks already said."
      - "The reconcile writing the ledger itself: the batch is Claude's, by sync, under the owner's eye."
      - "A proposal queue: DR-0689's reason, every op undoable and new items untriaged."
      - "A shared locator or a shared thread as a sure match: one mail, Slack thread, chat or recording holds several people's asks."
