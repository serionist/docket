decisions:
  - id: DR-0521
    title: The gate and every job that decides what gets in obey HEAD's vault.yaml plus every part of an uncommitted edit that only keeps more out
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#134"]
    description: "The settings in force are effective(committed, file): HEAD's vault.yaml with every part of the working file that only keeps more out put in, field by field, each checked against what the gate and the jobs do with it. A never-store list takes the values added and keeps those taken off; credentials and phone are on if either has them on; a pattern of HEAD's, matched by its name and which of that name it is, is on when the file turned it on and changed nothing else of it; a new pattern, on or off, setting nothing beyond name, pattern and enabled, is taken wherever the file puts it (one with any other key waits whole), since every rule reads the text as given and their spans merge (DR-0525); a source's sensitivity is the stricter of the two, and it is off if either has it off; a source's exclude takes the entries added and keeps those dropped, fnmatch with no negation; a source's tools are HEAD's that the file still lists, since a run takes its tools when it opens and a capture from another marks it short; a source removed is gone, refused at intake, held at promote and refused by ingest, scan and sync, and a rename is a removal and an addition. Everything else is HEAD's and applies once committed: by the owner's own git commit, or by a CLI write at the owner's console (DR-0517). media_hosts waits even for a removal, since nothing reads it until media_put. loosens(before, after) is effective(before, after) != after, one rule with no second list. doc_put, docket doc redact and a doc's hand-edit take-in screen never-store on the doc as written as well as redacted, so a rule turned on can't hide a keyword from them, as intake, docket scan and docket import notes already match before they redact. Gate._config() on every call and Vault.open, and so vault.config for ingest, the runner, docket scan, doc_put, docket doc redact, docket import notes, the service's sync, curate and docket redaction, read the settings in force through one loader; rewrite, the Settings page, the session-start hook and docket vault convert read the file. docket vault status, the Settings page, the refusals that send the owner to vault.yaml (sync's no tools, the runner's missing source or mapper, the gate's unknown source, the scan's missing source) and #141's take-in refusal say: vault.yaml has an edit that isn't in force until you commit it, naming no value and never saying it lets more in. HEAD with no vault.yaml, or one that doesn't parse, stops Docket as a broken vault.yaml does; an uncommitted change of storage does too, since the git dir to read HEAD from depends on it. The committed settings are cached in the vault's private folder, keyed by HEAD's commit id read from files (HEAD, its ref under refs/ or in packed-refs, through commondir in a linked worktree), so no git call is made while HEAD stays; Docket's own commit, which never takes vault.yaml unless it names it, moves the key forward when its parent is the cached commit, read in the call that already reads the new id; a miss costs one git show <id>:./vault.yaml with the id just read, never HEAD:, and a repo on reftable reads the id with git rev-parse. The cache is disposable, like the run history."
    binds:
      - DR-0025's every call re-reads vault.yaml reads the settings in force.
      - Only the loader calls effective() for Vault and the gate; a test scans for it.
      - No git call per gate run while HEAD stays; a test counts them.
      - Every never-store screen reads the text as written, before any redaction, so a rule turned on only keeps more out.
      - "A one-way door on AGENTS.md's list, in the gate's loosening line: what a loosening lets in reaches raw, every clone and git history."
      - A rule turned on or a pattern added only ever redacts more, wherever it stands, as DR-0525 has every rule read the text as given and their spans merge.
    not_chosen:
      - "The file as it stands, as before: an uncommitted edit, Claude's under auto mode too, lets records into raw at the next ingest before anyone confirms it."
      - "Refusing every write while the file holds an uncommitted loosening edit: every sync stops on a stray edit, and nothing tells the owner's editor from Claude's."
      - "Only DR-0506's page list applied at once: a pattern or an exclude added by hand would wait for a commit, though the gate applied each at once before."
      - "A separate, larger set for effective() beside loosens(): two rules drift, and the notice and the take-in would call a new pattern a loosening."
      - "New patterns left waiting instead of the doc screen fixed: rules turned on keep the hole, and a hand-added pattern lets the codes it names into raw until committed."
      - "A git call per read for HEAD's vault.yaml: the service opens the vault on every call, and #132 is removing calls."
      - "git show HEAD:./vault.yaml on a miss: a commit landing between the two reads keys one commit's text under another's id."
      - "Patterns matched by position: a reorder, which since DR-0525 changes only which marker names a tie, would read as a loosening."
