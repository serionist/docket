decisions:
  - id: DR-0521
    title: The gate and every job that decides what gets in obey HEAD's vault.yaml plus only the stricter part of an uncommitted edit
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#134"]
    description: "The settings in force are effective(committed, file): HEAD's vault.yaml with the working file's stricter part put in, field by field on DR-0506's list. A never-store list is HEAD's values plus those the file added; credentials and phone are on if either has them on; a pattern is on when the file turned it on and changed nothing else of it; a source's sensitivity is the stricter of the two, and it is off if either has it off. Everything else is HEAD's, so a loosening applies only once committed: by the owner's own git commit, or by a CLI write at the owner's console (DR-0517). loosens(before, after) is effective(before, after) != after, one rule with no second list. Gate._config() on every call and Vault.open, and so vault.config for ingest, the runner, docket scan, doc_put, docket doc redact, docket import notes, the service's sync, curate and docket redaction, read the settings in force through one loader. rewrite, the Settings page, the session-start hook and docket vault convert read the file: they change it, show it, or only check it loads. Settings that aren't about the gate, primary_machine, the owner's time zone and languages, a source's tools, mapper or folder, are loosenings under the allowlist and also apply once committed; docket vault status and the Settings page say: vault.yaml has an edit that isn't committed and lets more in; it applies once you commit it, naming no value. HEAD with no vault.yaml, or one that doesn't parse, stops Docket as a broken vault.yaml does, with the message to commit it yourself; an uncommitted change of storage does too, since the git dir to read HEAD from depends on it. The committed settings are cached in the vault's private folder, keyed by HEAD's commit id read from files (HEAD, its ref under refs/ or in packed-refs, through commondir in a linked worktree), so no git call is made while HEAD stays; Docket's own commit, which never takes vault.yaml unless it names it, moves the key forward when its parent is the cached commit, read in the call that already reads the new id; a miss costs one git show HEAD:./vault.yaml, and a repo on reftable reads HEAD with git rev-parse. The cache is disposable, like the run history."
    binds:
      - DR-0025's every call re-reads vault.yaml reads the settings in force.
      - Only the loader calls effective() for Vault and the gate; a test scans for it.
      - No git call per gate run while HEAD stays; a test counts them.
      - "A one-way door on AGENTS.md's list, in the gate's loosening line: what a loosening lets in reaches raw, every clone and git history."
    not_chosen:
      - "The file as it stands, as before: an uncommitted edit, Claude's under auto mode too, lets records into raw at the next ingest before anyone confirms it."
      - "Refusing every write while the file holds an uncommitted loosening edit: every sync stops on a stray edit, and nothing tells the owner's editor from Claude's."
      - "A second list of fields that apply at once: a key added later would apply uncommitted."
      - "A git call per read for HEAD's vault.yaml: the service opens the vault on every call, and #132 is removing calls."
