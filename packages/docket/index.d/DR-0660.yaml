decisions:
  - id: DR-0660
    title: The ledger tool's result, LedgerRead, keeps its fields for good, its refs are what a batch takes, and a view refuses a parameter it doesn't take
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#201"]
    description: "LedgerRead holds view, today (the owner's day its counts and lines are made from), since and until (the window it read, as times in the owner's zone), counts, items, meetings, points, streams, and detail for show's object; ItemRow, MeetingRow, PointRow, StreamRow, Counts, Change, MaterialRow and Detail hold the fields mcp-tools.json pins. A row's ref is what a batch takes for it: an A- or M- number, or its id while that number names nothing alone, during a clash and for good once a second item or meeting that stands has claimed it, since the writer refuses such a number (DR-0613); a point's ref is M-0040#n, beside its id. A row's title, subject, point text and stream next are cut at 72 characters as its line says them, but in show, which gives its object whole. k applies to list alone. A view given a parameter it doesn't take (a ref, a filter, a window, a k) refuses it. since alone reads the view's span from it, seven days for meetings and eight for a snapshot, and an until at or before since refuses. Every count is of the ops that stand, applied or idle: a chase the import repeats on an item already marked chase is a chase (DR-0644). docket ledger list takes -k for its text as the tool takes k; its --json gives every row (DR-0645)."
    binds:
      - "LedgerRead and the models under it only gain fields: none is renamed, retyped or removed (DR-0637)."
      - A row's ref is one a batch takes unchanged.
    not_chosen:
      - "Rows with every field, notes and history among them: only show gives those (DR-0643)."
      - "A parameter a view doesn't take, ignored: a filter dropped unseen answers another question than the one asked."
      - "Only the chases that changed the triage counted: the import writes each old chase as an op, and every one after the first is idle."
      - "k on every view: the sync and the tasks skill read a snapshot and a queue whole; list is the narrow read."
