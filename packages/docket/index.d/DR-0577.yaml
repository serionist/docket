decisions:
  - id: DR-0577
    title: docket forget shows what it would take by default, and forgets only with --now at the owner's console, with a code typed back
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#182"]
    description: "docket forget <rid>..., --never-store (each rid with a version in raw that a never-store list in force matches now) and --held (each rid in raw under a held id not released), one kind per call, --source narrowing the two lists, --vault as every command takes it. Without --now it is a dry run in any shell, Claude Code's too: it brings the index up to date, as a search does, and prints counts and line numbers, docs by type and never by id, since a legacy note's id carries its old file's stem and a decision's id its words; with --never-store the matched records are counted by source, not named. It never prints a line's text, a title, a note's old path or a listed value, and every time it names what forget can't reach. With --now it refuses before reading anything in Claude Code's shell, without a console on stdin and stdout, or through a pipe or a redirect (console.problem, act console.FORGET), then shows the screen: the dry run's lines with ids, the docs by id, the matched rids, and the entities no other record mentions with the curate log ops whose locators all lie in the family, each with its docket curate undo <op>; a doc id or rid a never-store list names is counted there instead, in every line, a stop or a note included, and a group whose every id it names shows its counts alone (DR-0558). It asks once for the whole forget: a code typed back (console.typed_back) until #143 merges, then console.confirm. Under the vault lock it works the plan out again and stops, writing nothing, when anything differs from the screen. A rid must be staged, in raw or have records under it; one already forgotten says so. docket forget --check-rewrite <folder> is read-only and needs no console: it applies the rewrite files a forget wrote (DR-0594) to HEAD's tree and each branch tip's and refuses, naming each branch, path and line number it would change, unless every branch stays as it is now (DR-0598); the printed rewrite lines start with it. No flag, variable, page, route or MCP tool forgets or answers the question, and only cli.py calls forget(), held by a scan as release() is (DR-0202). The Staging, Sync and Settings pages, and the CLI lines that said a record waits for docket forget, show the command, its arguments filled in only when every shell reads them as plain text, as the Staging page shows a release's (DR-0382). So does the dry run's next line: each rid in double quotes, as the vault path is, and one a shell reads more into left as its placeholder, its value said below it."
    binds:
      - Only cli.py calls forget(); a test scans for it.
      - No page, route or MCP tool forgets or answers its question; the pages show the command.
      - The dry run never prints a record's text, a doc line's or a doc's id; ids show only on the --now screen at the console.
    not_chosen:
      - "--yes, or a confirm parameter: Claude passes a flag as easily as the owner (DR-0202)."
      - "The question by default, the dry run only on n: Claude Code's shell would get a refusal instead of the counts it shows the owner."
      - "--dry-run, forgetting by default as docket doc redact does: a deleted key can't come back, so the short command is the safe one."
      - "An MCP tool: nothing over MCP can give the owner's yes."
