decisions:
  - id: DR-0591
    title: Only a clone that ingests the source cuts a Whisper transcript, and never one whose family its checks keep out
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#186"]
    description: "The gate cuts a Whisper transcript (DR-0590) only for a source this machine's cursor file names, as docket transcribe needs it (DR-0569), since the withheld marks the family checks read are this clone's alone (DR-0547). Screen.family runs first: the family withheld, a version of a record of it matching a never-store value, a private decision on one, or the source out of force or private writes nothing, and a staged Whisper transcript is dropped by the sweep already (DR-0570); a source only off doesn't stop it, as it keeps a staged one; a hold on the recording writes nothing, and a staged one waits with the hold. A clone that ingests the source writes the version whether or not the audio is downloaded or its key is here, with no Whisper installed. A clone that doesn't ingest it writes nothing, and reads the earlier version until it pulls the one a clone that ingests the source wrote. A clone that ingests it and pulls a cut it didn't promote writes the version at its next promotion touching the family, at the latest the one that stores the audio put again, which reads recut until then (DR-0562). The version is a function of the Whisper version it cuts, the ranges and the rules in force, so two clones that ingest the source write the same version, with the same v, from the same raw; after a merge every reader's latest is that version, and the index counts it once. Two clones that each promote a different cut before pulling write a version each, neither holding what its own clone cut, and the next promotion touching the family cuts by both. When one clone's ranges hold the other's, the merged cut can equal a version already in raw, which the raw log doesn't write again, so the version with fewer cuts can stay latest by run order: accepted, since a later cut, or docket transcribe on the audio put again, makes a new latest."
    binds:
      - No clone writes a Whisper version for a source it doesn't ingest, or for a family its checks keep out.
    not_chosen:
      - "Every clone writing it: one that doesn't ingest the source has none of the withheld marks its records' drops made."
      - "The clone that made the Whisper transcript as its only writer: a cut promoted on another clone would wait for it."
      - "Looking at every family with a Whisper transcript at each promotion: every promotion would read them all, for what the next put of the audio covers."
