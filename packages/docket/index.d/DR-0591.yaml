decisions:
  - id: DR-0591
    title: Only a clone that runs the source cuts a Whisper transcript, and only a source out of force or private, a hold or a never-store match stops it
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#186"]
    description: "The gate cuts a Whisper transcript (DR-0590) only for a source this machine's cursor file names, as docket transcribe needs it (DR-0569): that keeps a source's run files to the clones that run it, so a clone used only for search never writes one or spends the comparison, and two clones can race on a version only where both run the source, as they already can on the recorder's transcript. A version that only removes text already in raw is the safe side, so only what would make writing it wrong stops it: the source out of force or private, a hold on the recording (a staged one waits with the hold), or the cut version matching a never-store value. A withheld family or a private decision on a record of it doesn't stop it, and neither does a source only off; a staged Whisper transcript is still dropped by the sweep when its family is kept out (DR-0570), since it holds text raw doesn't. A clone that runs the source writes the version whether or not the audio is downloaded or its key is here, with no Whisper installed. A clone that doesn't run it writes nothing, and reads the earlier version until it pulls the one a clone that runs the source wrote. A clone that runs it and pulls a cut it didn't promote writes the version at its next promotion, the cut scan finding the family. The version is a function of the Whisper version it cuts, the ranges and the rules in force, so two clones that run the source write the same version, with the same v, from the same raw; after a merge every reader's latest is that version, and the index counts it once. Two clones that each promote a different cut before pulling write a version each, and the next promotion cuts by both, with one exception, accepted: version() hashes content only, so when one clone's cut lies inside another's, or a run file sorts before the version it cut (a clock behind, or a follow in the same minute by a machine whose name sorts first), the cut both need equals a version already in raw, the raw log doesn't write it again, and the less-cut version stays latest. Nothing fixes that by itself; a later cut, or docket transcribe on the audio put again, makes a new latest. The recorder's transcript has the same race."
    binds:
      - No clone writes a Whisper version for a source it doesn't run, a source out of force or private, a held recording, or a version a never-store value matches.
    not_chosen:
      - "Every clone writing it: a clone used only for search would write run files of a source it never runs, and race the clones that do."
      - "Stopping on every refusal Screen.family gives: a private decision or a withheld mark would leave the cut stretch in raw's latest version, where writing removes it."
      - "The clone that made the Whisper transcript as its only writer: a cut promoted on another clone would wait for it."
