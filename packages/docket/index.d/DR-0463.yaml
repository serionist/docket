decisions:
  - id: DR-0463
    title: Docket writes an entity file whole in one canonical form, only when the file reads without a problem, and commits it with its log line under the vault lock
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#68"]
    description: "An entity change is written as the whole file in one canonical form: DR-0113's keys in its order, name, related and ids as flow maps, each alias a flow map on its own line, a value quoted only when YAML would read it otherwise. The written text is read back through the entity loader and must give the entity intended, or nothing is written. A file whose own read reports any problem (an unknown key, an alias or a name left out, a kind, a status or a value read otherwise, a key given twice) is refused, naming the problem, since the rewrite would drop or change what the loader didn't read; so is a file holding a comment, naming the line to add by hand, and an id two files hold, naming both, since the loader reads one and skips the other. Under the vault lock the work goes in order: log lines HEAD doesn't have, left by a crash, are finished first (an add applied where the file lacks it, an undo's removal made where the file holds it) and committed with the entity file each names when that file differs from HEAD, since a write killed after its file's rename left the change in the tree; an uncommitted hand edit of an entity file is committed on its own, as a doc's is taken in; then the new log line is appended, the file written through a temp file and a rename, and both committed in one commit (Entity: <id> <op>, the op ids in its body). A failure puts the file and the log back and unstages them. In tier 1's commit a refused fact is skipped and listed with the round, and the rest go in; a changes file from the user goes in whole or not at all."
    binds:
      - No entity write keeps a value the loader would read otherwise.
      - "Entity writes go through the vault lock, never the staging gate: entities aren't records."
      - A log line HEAD doesn't have is finished before any new curate write.
    not_chosen:
      - "ruamel.yaml's round trip: a dependency for the comments few entity files hold."
      - "Editing lines in place: each of YAML's styles for a list or a map needs its own edit."
      - "The file before its log line: a crash would leave a change no line explains, which undo can't reach."
      - "Rewriting a file the loader read with problems: the unknown key, the alias left out or the value read otherwise would be gone without a word."
