decisions:
  - id: DR-0765
    title: A write reads HEAD's branch, its commit id and the index's unmerged paths from the git dir's files, the unmerged paths right before each commit's add
    status: proposed
    at: "2026-10-21"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#132", "#266"]
    supersedes: [DR-0528]
    description: "A write reads from the git dir's files what they hold, with no git call: whether HEAD is on a branch (its HEAD file names a ref, or holds a commit id when detached), HEAD's commit id (the ref's file under refs/, else its line in packed-refs), and the unmerged paths, from the index. It reads only a plain checkout's git dir, the top's .git that passes home.is_git_dir, as home.discover keeps only a plain checkout's answer (DR-0532); a git dir with a commondir file is unknown. It answers that a branch has no commit yet only when the ref has no file and packed-refs is absent or read cleanly without it; any read error, a git dir whose refs aren't files (reftable), or a file that doesn't read as git writes it is unknown, and the git call runs as before. The index is read in versions 2, 3 and 4, its trailing hash checked (or all zeros, as index.skipHash writes it), the length of its object ids taken from HEAD's id, each entry's stage from its flags and each name whole, version 4's against the one before it; an entry above stage 0 under the vault's path is unmerged, as `git ls-files -u` lists it from the vault's folder. It reads past the optional extensions, the ones whose signature starts with a capital letter as git's own rule has it (TREE, REUC, UNTR, FSMN, EOIE, IEOT), and asks git for any other, a split index's `link` or a sparse one's `sdir`, as for another version, an index over 4 MB (version 4 means reading every entry: about 0.8 µs each here, against 56 ms for git's call on a 20,000-entry index), GIT_INDEX_FILE set, a repo with no commit yet, or any read error. The recovery check reads the marker files (a rebase, merge, cherry-pick or revert in progress) and the branch at every check, and the unmerged paths, vault-wide as before, right before each commit's add, not at writing()'s entry: git add marks an unmerged path resolved and stages its conflict markers, and commit --only re-reads the paths it names and resolves an unmerged one too, so the question sits as close to the commit as it can. A conflict that lands after the check and before the commit is still committed, in a window of two git starts where main had about six before #132; the lead accepted it. A refusal there is an UnmergedError, and a write's cleanup puts its files back without the git reset that would clear the user's conflict. A writer that asks the owner something before its first commit, as a release does, reads the unmerged paths first too, so a conflict refuses before the question and nothing is written. A name in the refusal is the path as it is, where git's call quoted a name with other than ASCII in it."
    binds:
      - Every commit, its message and what it holds stay as they were; only questions git needn't answer go, and git answers whatever the files can't vouch for.
    not_chosen:
      - "Asking git for the unmerged paths at every commit, as DR-0528 did: 3,661 calls in the suite and one a write for every user, where the index file answers below its cap."
      - "One unmerged-paths check per lock hold: a conflict a user's stash pop leaves after it, on a vault file, is added and committed with its markers, and git reports nothing (probed on git 2.47)."
      - "Reading a split or sparse index: the shared index's entries or a sparse folder's would need reading too, for a setting a vault hardly has; git answers those."
      - "No size cap: a version 4 index is read entry by entry, so past some tens of thousands of entries the read costs more than git's call."
