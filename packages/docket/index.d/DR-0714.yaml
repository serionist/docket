decisions:
  - id: DR-0714
    title: A who field suggests the names the ledger uses, the most used first, in shadcn's combobox over a read of its own
    status: proposed
    at: "2026-10-20"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#252", "#204"]
    description: "Wherever who is typed on a day page, the panel's Who, the new item's and the Ledger's who filter, the field stays a text field and opens a list of names under it: shadcn's combobox pattern, a Popover with a Command list on cmdk 1.1.1 (MIT, its Radix parts the ones radix-ui already brings, a few KB gzipped), its own input inside cmdk's root so cmdk's keys move through the list from the field. GET /api/web/ledger/who answers the names as People: every who the ledger's items name, by how many items name it, then the newest item's day, then the name; then the vault's people from the index's entity tables (type person, not archived) that no item names yet, by name; a person an item names takes their entity's other names and plain aliases, never speech recognition's, which a typed word finds them by too. The ledger folded in memory, when the index can't be had, holds no entities, so its list has the ledger's names alone. The names are read only while a list is open and kept with the page's reads, so a write, a save that sets who or the poll brings them up to date. Typing narrows them, case and accents aside, keeping the server's order within each tier: the name the text is, then a name or a word of it that starts with the text, then one an other name finds so, then any that holds the text. The first is marked as the list opens on text; with none, nothing is marked and Enter is the field's own, so a cleared field clears the filter or is sent cleared, never the top name. The arrows move the mark, which stays on its name when a refetch reorders them, Enter takes it, and the text as typed is always the last choice, so a new name is never refused. A name taken saves the panel's field at once, sets the new item's, or applies the filter. Esc closes the list alone, its default taken, so neither the field's Esc nor the page's acts on it; with the list closed the field's own keys are as before: Enter saves the panel's field or applies the filter and submits the new item's form, Esc leaves the field. The field names the marked choice by aria-activedescendant and the list it controls."
    binds:
      - "A who field never refuses a name it doesn't suggest: the text as typed is always a choice."
      - No key typed in a who field reaches the page's keys, and Esc on its list closes only the list.
    not_chosen:
      - "A field on each page's read: the Queue's read holds open items only, and the names come from every item."
      - "The browser's datalist, as the stream has: no order of its own, no aliases, and its look and keys are the browser's."
      - "A combobox button that opens a search box, as shadcn's example: the panel's field would no longer be typed in and saved on leaving, as every other one is."
      - "People from the entity files read on each request: hundreds of YAML files, where the index already holds them."
