decisions:
  - id: DR-0618
    title: An op's text passes the gate's rules for derived text before it is written
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#198"]
    description: "title, who, note, notes, description, outcome and a material's label go through vault.yaml's redaction rules, a match written as its marker, and through the never-store lists: a keyword in the text, or who naming someone on the people list, refuses the whole write, naming the op and the field and never the value, as a doc is held (DR-0195). A source and a material's ref are locators and are left alone, as a record's ids are. The import (#202) goes through the same writer, so the old ledger's text gets the same rules."
    binds: ["Every op goes through one writer, ledger/store.py; a scan holds it."]
    not_chosen:
      - "Text as given: the ledger quotes chats and mail, and would be the one place a credential got past the gate."
