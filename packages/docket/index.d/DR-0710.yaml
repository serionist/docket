decisions:
  - id: DR-0710
    title: A day page's button writes one batch, a field saves on change, a bulk goes through a dry run, and the notice undoes or redoes by batch
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#252"]
    supersedes: [DR-0661]
    description: "DR-0661's rules, in JSON. POST /api/web/ledger/write takes the page, one op of a batch's (DR-0639), the items, meetings or points it acts on and its keys, and writes it through store.write as one batch, by user, via page, on the writer thread, asking no index update (DR-0616). A button carries what it writes, decided before the post by the old bulk rule: a verdict clears when every row it acts on holds it and sets it on all of them otherwise, so no write toggles, and a post that changes nothing says Nothing changed. Each open item's row carries the old app's quick buttons, the four verdicts, done and drop, the drop opening its form with the why focused, and a group's Select all ticks its rows. A bulk goes through a dry run: the rows the writer refuses as they stand are skipped and named, and the rest are one batch unless it refuses them all; one ticked row is a bulk too. The answer holds the batch's id and log lines, the skipped rows, the row after the acted ones and the version after the write, taken under the vault lock; the app refetches the page's reads, and the notice at the list's foot shows the lines with Undo, an undo of the batch, then Redo, the undo's own undo (DR-0614). A text field, the stream and kind, and the due save on change: POST /api/web/ledger/save answers the row, the panel and the versions just before and just after its write, both taken under the vault lock. When the one before is the version the page read, the page's own save refetches nothing else and typing elsewhere survives; when it isn't, a write from the CLI, Claude or a sync landed while the poll held for the field, and the page refetches its reads in place, as the poll would, so that write never hides behind the save's version. Enter in a one-line field saves it, as leaving it does; Enter in the act bar's why drops. A day is picked in a date picker, never the browser's date field, whose mm/dd/yyyy follows the browser's language: a button showing the day as the app writes it, Mon 26 Oct, opens a month with weeks from Monday and a box that takes a day typed as 2026-10-23, in a popover no taller than the room the window leaves it, or below 768 px in a sheet from the screen's foot, where a popover would run off the top; the due saves the day picked or typed, and the snooze's own day, beside its choices, snoozes to it, as Enter in its date did. A field is unsaved from its first change until its save answers, and a refused one stays unsaved with the writer's words beside it. Leaving the page or the panel with unsaved text asks first, through the router's blocker and beforeunload. A button is disabled while its post is in flight. A refusal writes nothing: 400 and the writer's words; an add refused as a look-alike answers the items it looks like, and Add anyway posts it again with force. An item added on a page gets the source page:<day>T<hh:mm>, a text locator naming no record, unless the owner gives one. /api/web/ledger/open and /api/web/ledger/text keep DR-0664's checks."
    binds:
      - "A page writes only through store.write: one batch per button, by user, via page."
      - "No write toggles: a post carries what it writes."
      - Unsaved text is never dropped without asking.
    not_chosen:
      - "An optimistic update before the write answers: the writer refuses what the page can't foresee, and a row would flip back."
      - "A toast for the notice: it times out, and u needs it there."
