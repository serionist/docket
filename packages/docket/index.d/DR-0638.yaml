decisions:
  - id: DR-0638
    title: ledger's views are snapshot, show, queue, list, meetings and suggest, over a ref, a window and filters
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#201"]
    description: "view, snapshot by default: snapshot gives the open and snoozed items, the meetings in the window or with an open point with their points and open items, and the streams; show gives one item, meeting or stream whole by ref, with its notes, materials, points, linked items, history and counts; queue gives the untriaged open items, then the rest by verdict in todo.py's order (discuss, claude, me, chase), each by due; list gives the items matching who (a part of it, case aside), stream, kind, state and opened in the window, counts over all of them and the first k; meetings gives the meetings overlapping the window, so todo.py's meeting match is a window around a time; suggest gives DR-0629's read for the meeting ref names. A point shows its id wherever it shows, the snapshot too. ref is an A- or M- number, an id, or a stream's name. since and until are a date, the owner's whole day, or a time, as search's (DR-0150); snapshot's window is yesterday to six days after today, meetings' today to six days after. state is open (open and snoozed, the default), snoozed, done, dropped or all; k is 1 to 500, 50 by default, on the tool only: the CLI's --json gives every row (DR-0645). The perf test holds a snapshot of 5,000 open items, read from the index's tables with its lines, to 0.2 s as the best of three runs: the macOS runner took 46 to 124 ms for the same code across a day's runs, about one run in six over 0.1 s, against about 50 ms on the developer's machine, so the maintainer chose 0.2 s, which still catches a real doubling."
    binds:
      - The view names, state's values and every default are part of the tools' door (DR-0637).
    not_chosen:
      - "list --json for the untriaged, as the tasks skill reads them today: the queue gives them first, as the Queue page will."
      - "A view for meeting match: a window over meetings answers it, and #200 links recordings and asks by time itself."
