decisions:
  - id: DR-0617
    title: docket vault check checks the ledger's files, lines, ids, numbers and attributes, and what changed against HEAD
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#198"]
    description: "It names: a file in ledger/ops/ not named <yyyy-mm>-<machine>.jsonl, a link, or not UTF-8; a line that doesn't read, or sits in another month's or machine's file, by its line number; one op id on two texts, a listed op's texts read as its mask, so a twin a merge brought back beside its mask is one op (DR-0695); an op on an item with no add, or sorting before its add; an undo naming another item's op, a later op, a renumber or a bad undo, even one a later undo undid; a number two items hold, which the next write fixes; a committed line changed or gone, the working tree against HEAD, since ops are written once, but a line changed to its mask with its op id listed, or gone as a twin of it, which it names as a forget not committed yet; a listed op's line not masked yet, by its number, as a forget the next gate call finishes (DR-0696); and attributes on ledger/ops/ other than merge=union and eol=lf. Comparing against HEAD alone, a commit that removes lines, such as #202's revert before it runs again, is no problem. The fold leaves out the lines the check names, except one id on two texts, whose lines it keeps, ordered by their text (DR-0612)."
    not_chosen:
      - "Every field held to todo.py's rules when read: the writer holds those, and a later Docket may add a value."
