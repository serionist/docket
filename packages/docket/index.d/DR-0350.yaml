decisions:
  - id: DR-0350
    title: Chunks are cut per kind, and aliases match as written and in the case forms of languages that give them, each beside a stem form it is cut to, common words left out
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#77", "#91", "#94"]
    supersedes: [DR-0310]
    description: "Transcripts are cut into windows that grow to 60 s and stop before 90 s or 350 words, sharing one utterance; a message is a chunk alone and its thread gets windows of the parent and up to 10 replies, sharing one; other records carry their title on top and split above 500 words between paragraphs; processed docs split per section, their anchors cut from the text and kept. An alias matches its words as written, or in its case forms in the languages that give them (Hungarian, not English), matched folded: its last word followed by each of Hungarian's case endings, back or front by the word's vowels and both for a word holding both (Acménél, Acmét, Markkal). A word with back vowels only that ends in a consonant also takes the front endings that start with one, as a foreign name read by its sound does (Sammel, Ryannel, Jasonnek, and Andyvel with its y read as a vowel), and not -et, -en, -öt or -ön, since Mark with -et is the English market. A final y takes the endings after a vowel as well (Tonyval), and an old spelling or a foreign letter keeps its letters before the doubled sound (Babitscsal, Kossuthtal, Maxszal, Nimishsel). A case form counts beside a stem form the stemmer cuts it to, with or without its accents, one of the alias's stem forms (its stem, its dative's stem, itself), in that language's column, while any of them is kept, since a stem form alone meets ordinary words that stem the same (same for Sam) and a case form alone words that fold the same and stem elsewhere (benne, patrol and Robert fold like Ben's benné, Pat's patról and Rob's robért). Chat often drops accents, and Snowball cuts the two spellings apart: zoltánnak to zolt, zoltannak to zoltan. The stem form it is cut to may be one a common word crowds out: Markkal, cut to mar, counts while már floods mar and Mark's own mark is kept. A case form the stemmer cuts to none of the alias's stem forms (Nimishsel) counts on its own while one of them is kept. A stem form under three letters, or in over ten times as many chunks as the alias as written (counting that as at least five), is dropped, and with every one dropped the case forms don't count, so robot, Rob with -ot, isn't Rob while it is everywhere; no stem form is dropped for its share of the chunks. A case form is judged the same way, folded, since a word it equals stems as it does: one a kept stem form checks is a common word and doesn't count in over ten times as many chunks as the alias as written (counting that as at least five), as a stem form; one no kept stem form checks, since every stem form it is cut to is short or common or it is cut to none, in over twice as many, since nothing else tells it from the word. So when the word is in more than twice as many chunks as the name, annál isn't Ann, évet and even aren't Eve, edit isn't Edi, adat isn't Ada and Evan isn't Éva, all cut to a stem form under three letters; a colleague named more than half as often as such a word still collides with it. A case form a kept stem form checks counts however often the name is written bare (Lacinak, Péternek, Bálintnak never bare, the place Győrben), and collides as on main until the word passes ten times the name: belát with Béla, the name Anna with Ann (Anná without its accent), Jesse with Jess, ellát with Ella, Janet with Jane, lent with Len. A query word names an entity on the same terms. So Sammal and Sammel count as Sam and the English same doesn't, marked and market don't count as Mark, Markkal and Bélával count while már and bele crowd out mar and bel, Évával, Evével and Edivel count though the stem form each is cut to is under three letters, Zoltannak counts as Zoltán, a customer named in most chunks keeps its inflected mentions, and Nimishsel counts as Nimish. On 1,000 invented chunks, same gave Sam 71 wrong mentions and marked and market gave Mark 100 before, none after; the mention pass on the perf test's 100,000 chunks takes about 0.6 s, and the test holds it under 2 s. An asr alias also matches vocabulary words within one edit of a word of 5 to 7 letters, two of 8 or more; an alias with needs counts only beside an unconditional mention. Speakers, authors (by ids) and a doc's entities are mentions too. The index's schema version went up with it, so an existing index rebuilds at its next update (DR-0115)."
    binds:
      - No entity name enters chunk text, so editing an entity never re-chunks.
      - A chunk or a query names an alias only as written or, while one of its stem forms is kept, in a case form beside a stem form the stemmer cuts it to with or without its accents, or in one the stemmer leaves whole; never in a case form in over ten times as many chunks as the alias as written, or over twice as many when no kept stem form checks it.
    not_chosen:
      - "English stems for aliases: Mark would match every marking."
      - "A minimum alias length instead of judging stem forms: Kata would lose Katának."
      - "The case forms checked only for a form in over a fifth of the chunks, as DR-0310 had it: below that share, same gave Sam 71 wrong mentions and marked and market gave Mark 100 on 1,000 invented chunks."
      - "DR-0310's check for every form, dropping one when over a tenth of its chunks hold none of the name's forms: Sam lost every Sammal, 60 of 80 found."
      - "The share rule kept beside the case forms: már in 38% of the chunks still cost Mark his Marknak, 50 of 60 found."
      - "Every case form only beside a stem form, as first built: Nimishsel, which the stemmer leaves whole, met no stem form."
      - "Every case form on its own, as the first review fix had it: benné folds to the Hungarian benne, patról to patrol, robért to Robert."
      - "Front endings that start with a vowel for a name with back vowels only: Mark with -et is the English market."
      - "Any word starting with the alias as the explanation: same starts with sam, market and marked with mark."
      - "Possessives among the case forms: Hungarian's Samé folds to the English same."
      - "Today's rule for a language without case forms: the leak again."
      - "A capital letter as the sign of a name: chat is often written in lower case."
      - "A case form beside the alias's kept stem forms only, as #77 built it: every case form of Mark is cut to mar, so while már crowds out mar Markkal met none of them, and Bélával none of Béla's while bele crowds out bel (#91)."
      - "A case form beside the stem form its accented spelling is cut to only: Snowball cuts zoltannak, written without accents, to zoltan and zoltánnak to zolt, so Zoltannak named no one (#91's review)."
      - "Leaving the short and ratio rules' drops to hide a case form that is also a word: they hid the name's own inflections too (Évával, Bélával), and the AND with a stem form under three letters checks nothing, since annál stems to an as Ann's Annál does (#94)."
      - "Ten times the name as written for every case form, the stem forms' ratio: a case form no kept stem form checks has nothing else telling it from its word, so a short name people mention often collided with it until the word was ten times as common; on 1,000 invented chunks, Ann bare in 40 got 120 wrong mentions from annál, Edi 161 from edit (#91's second review)."
      - "Twice the name as written for every case form: a name written mostly inflected or never bare lost the case forms a kept stem form already checked; on invented chunks Laci kept 5 of 21 mentions, Péter 20 of 66, Bálint 0 of 13, Tamás 25 of 50 and the place Győr 20 of 50, and lacinak, péternek, bálintnak, tamásnak and győrben read as words (#91's third review)."
