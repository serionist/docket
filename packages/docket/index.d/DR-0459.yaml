decisions:
  - id: DR-0459
    title: SearchResult gains a rerank field, and the CLI, the MCP text, the Search page and docket eval say when a rerank was skipped
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#88"]
    description: "rerank holds the state (off: no reranker here or off on this machine; on; skipped), the model, the pairs it reranked, and why it was skipped. The CLI, the MCP text and the Search page add one line only when the reranker is on and was skipped, as they do for the vector stage (DR-0338). docket eval prints the reranker and its pairs above its table, and how many questions ran without it. found_by and the hits' fields don't change, and a hit's rank is its place after the rerank. The MCP search tool keeps its parameters (DR-0150); the field is additive."
    not_chosen:
      - "A flag on every hit saying it was reranked: the field says it once for the top N."
