decisions:
  - id: DR-0565
    title: No read shows a proposed decision as decided, and a brief cites only current ones
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#162"]
    description: "A search hit on a decision names its state before its title; read, the CLI and MCP give status, current and superseded_by; the read-only MCP tool decisions(entities, status) and docket decision list give each decision's id, subject, title, status, current, rev, rev_time, by, replaces, contradicts, supersedes, superseded_by, contradicted_by, flagged, cite (its title line's token, only when current) and note (edited on disk, not taken in, for a final decision whose file says otherwise), and hidden for the whole. A brief cites only a current decision (confirmed and not superseded): doc_put refuses a ref to any other, and a later supersede flags the line. Each line of a brief's ## Decisions reads exactly as a current decision's title with its cite, and nothing else, so Claude can't write a decision there that the log doesn't hold; a brief stored before #162 with Decisions lines citing raw or notes shows them marked \"not a confirmed decision\" on the page until its next rev, and the briefs tool reports it stale, why saying a Decisions line cites no confirmed decision. The newer decision's supersedes and the index's superseded_by link history both ways; contradicts is Claude's call, and Docket checks only that its target is a confirmed, current decision on the same subject, stores the link and derives contradicted_by."
    binds:
      - The MCP tool's name decisions and its parameters entities and status are a door (DR-0150).
    not_chosen:
      - "Docket inferring contradictions: it can't tell a wish from a decision, which is judgement (DR-0104)."
