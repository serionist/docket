decisions:
  - id: DR-0582
    title: A recording's transcript fixes are one processed doc, transcript-fixes, each line a fix anchored to both transcripts
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#183"]
    description: "A recording with a Whisper transcript gets at most one doc of fixes: id transcript-fixes:<yyyy-mm-dd>-<the first 12 hex digits of the sha256 of the recording's rid>, the date the recording's in the owner's time zone, so no name sits in a path; type transcript-fixes; covers the recorder's transcript it reconciles, the Whisper transcript <recording rid>/whisper, and the records its evidence anchors; no frontmatter key beyond every doc's. Its title is # Transcript fixes: <the recording's title, else its rid>. Each content line is one fix: - \"<the recorder's text>\" / \"<Whisper's text>\" -> \"<the chosen text>\", <state>: <why>, then a time anchor on the recorder's transcript spanning the one segment the fix is in (its start rounded down, its end up), one on Whisper's spanning the segments its text came from, then its evidence as anchors on other covered records and [d:] refs. A state is sure or unsure, written by Claude, or confirmed or rejected, written only by the owner's click (DR-0586); a chosen text equal to the recorder's says the recorder was right. doc_put checks, on top of every doc's rules: the id's hash is the covered Whisper rid's recording, and covers holds one recorder transcript of it; the family screen media's reader asks (media.screen.refusal) passes, a source only off aside; each line parses and has both transcripts' anchors; on a line new or changed in the put, the recorder's text stands whole in the anchored segment and Whisper's in the anchored segments, as the latest versions in raw hold them; neither anchor overlaps a [cut] of either transcript's latest version; each quoted text is at most six words, the chosen text at most two words longer than the longer of them, none holding a quote or a line break; no two lines on one segment share or overlap their recorder texts; no line, why or ref names a person a never-store list holds in the shapes the brief screen reads (DR-0558), and entities holds no held entity; a chosen text redaction would change is refused rather than stored with a marker; and every committed line that isn't sure stands in the put as committed, so a put adds no confirmed or rejected line and changes or drops no unsure one. A hand edit is taken in only under the same owner-line rule, and every read takes the doc as its last commit holds it, as a final decision is read (DR-0564), noting one edited on disk. Unchanged committed lines aren't checked against raw again, so a transcript's new version never blocks a put. The doc isn't chunked for search, its reading is (DR-0585), and its lines are citable with [d:...] like any doc's (DR-0540)."
    binds:
      - "The type name, the id's shape and the line's grammar and states are the vault's format: changing one is a door."
      - "Raw never changes: a fix is a doc line, and the doc's next rev undoes it."
    not_chosen:
      - "correction, the type a doc line's fix already has: one type with two meanings and two sets of rules."
      - "The fixes in a record of their own: raw is what a source gave, written once, and Claude's judgement isn't a source."
      - "A new anchor kind naming a spot: the grammar is a door, and an older Docket's redaction damages a kind it doesn't read (DR-0541)."
      - "A word offset in each line: it moves with any new version of a transcript, while the quoted texts say when a fix no longer matches."
