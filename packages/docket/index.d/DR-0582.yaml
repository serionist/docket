decisions:
  - id: DR-0582
    title: A recording's transcript fixes are one processed doc, transcript-fixes, each line a fix anchored to both transcripts
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#183"]
    description: "A recording with a Whisper transcript gets at most one doc of fixes: id transcript-fixes:<yyyy-mm-dd>-<the first 12 hex digits of the sha256 of the recording's rid>, the date the recording's in the owner's time zone, so no name sits in a path; the spots tool gives it (DR-0584), the existing doc's id when the recording has one; the hash names the recording and the date is checked only for a new doc, so an existing doc keeps its id when the owner's time zone changes; type transcript-fixes; covers the recorder's transcript it reconciles, the Whisper transcript <recording rid>/whisper, and the records its evidence anchors; no frontmatter key beyond every doc's. Its title is # Transcript fixes: <the recording's title, else its rid>. Each content line is one fix: - \"<the recorder's text>\" / \"<Whisper's text>\" -> \"<the chosen text>\", <state>: <why>, then a time anchor on the recorder's transcript spanning the one line the fix is in (its start rounded down, its end up), one on Whisper's spanning the segments its text came from, then its evidence as anchors on other covered records and [d:] refs. A text is raw's own substring from its first word's first character to its last word's last character, case and inner punctuation as written, a word being a match of plaintext.WORD at its place; it stands once when it occurs exactly once in its segment's raw text at word boundaries, a text and its line compared after NFC. The anchored recorder line is the one whose rounded span is the anchor, the one its text stands in when two round alike; the anchored Whisper segments are those other than [cut] inside the anchor's span, in time order, joined by a space. Cuts are every [cut] span of either transcript's latest version, merged, and a segment is in a cut when it overlaps one by its own times, as cuts.py takes a segment. A state is sure or unsure, written by Claude, or confirmed or rejected, written only by the owner's click (DR-0586); a chosen text equal to the recorder's says the recorder was right. doc_put checks, on top of every doc's rules: this machine ingests the recording's source, as docket transcribe asks; covers holds one recorder transcript of the Whisper rid's recording; the id's hash is that recording's, no fixes doc of it stands under another id, and for a new doc the id's date is the recording's in the owner's time zone; the family screen media's reader asks (media.screen.refusal) passes, a source only off aside; each line parses and has both transcripts' anchors; on a line new or changed in the put, the recorder's text stands once in the anchored line and Whisper's stands in the anchored Whisper segments, as the latest versions in raw hold them; on every line, neither the anchored line nor a Whisper segment its text touches is in a cut; each quoted text is at most six words, the chosen text at most two words longer than the longer of them, none holding a quote or a line break; no two lines' places overlap, except that a place whose every line is rejected, settled with the recorder's text standing (DR-0583), takes one new line, unsure, with a chosen text none of them had, which the skill offers only with new evidence; a line that no longer matches (its recorder text doesn't stand once in its line, or Whisper's isn't in its segments, in the latest versions) has no place and blocks no new line; on every line, no text, why or ref names a person a never-store list holds in the shapes the brief screen reads (DR-0558); each line a line of the put changes, rendered with that fix applied beside its other fixes, holds no keyword and no listed person in those shapes, so a name can't form across a fix's edge; entities holds no held entity; a chosen text redaction would change is refused rather than stored with a marker; and every committed line that isn't sure stands in the put as committed, unless it is now cut, hidden or no longer matching, so a put adds no confirmed or rejected line and changes no unsure one. Dropping is the one change a put or a take-in may make to a committed line that isn't sure, and only for such a line; a line now cut or hidden is refused until it is dropped, so a later cut or list never leaves the doc stuck, while one no longer matching may stay, harmless. A hand edit is taken in only under the same owner-line rule, and every read takes the doc as its last commit holds it, as a final decision is read (DR-0564), noting one edited on disk. Unchanged committed lines aren't checked against raw's texts again, so a transcript's new version never blocks a put. The doc isn't chunked for search, its reading is (DR-0585), and its lines are citable with [d:...] like any doc's (DR-0540)."
    binds:
      - "The type name, the id's shape and the line's grammar and states are the vault's format: changing one is a door."
      - "Raw never changes: a fix is a doc line, and the doc's next rev undoes it."
    not_chosen:
      - "correction, the type a doc line's fix already has: one type with two meanings and two sets of rules."
      - "The fixes in a record of their own: raw is what a source gave, written once, and Claude's judgement isn't a source."
      - "A new anchor kind naming a spot: the grammar is a door, and an older Docket's redaction damages a kind it doesn't read (DR-0541)."
      - "A word offset in each line: it moves with any new version of a transcript, while a text that stands once names its place and says when it no longer matches."
      - "A fix's text replaced wherever it stands in its line: a short text, the word \"the\" say, would change right words elsewhere in the line."
