decisions:
  - id: DR-0454
    title: A rerank has 0.75 s from when the search asks; past it the fused order stands and the result says why
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#88"]
    description: "The core sends the deadline with the request (DR-0451): the worker stops between batches when the next would end past it, and the client stops waiting at the deadline plus 0.2 s, so a rerank adds at most 0.75 s to a search, 0.95 s if the worker is stuck in a batch, and the worker is free again within a batch. A batch of the embedding pass in the worker's hands (about 0.3 s, DR-0330) counts against the budget. Past the budget, with the worker down, on an error, or when the query has no words to compare (only time words or filters), the search returns its weight-0.5 order, exactly as with no reranker, and SearchResult.rerank says skipped and why (DR-0459). docket eval and the question set's floors rerank with no budget, waiting up to 30 s a question, so their numbers don't move with how busy the machine is. One budget for both devices: the GPU needs 0.13 s for 50 pairs on the desktop. When the search's own query vector just passed its 2 s on the same worker, the rerank is skipped without asking. After three budget skips in a row the provider stops asking for five minutes and says so, then asks again; it counts reranks done and skipped for the budget, which docket models status, the service's status and /api/models show."
    binds: [A search never waits on the reranker past its budget plus 0.2 s.]
    not_chosen:
      - "A budget counted from when the worker starts the rerank: a search behind a long pass batch would wait for both."
      - "A budget per device: one number to explain, and the GPU is far inside it."
      - "Asking every search however often the budget passes: a busy machine would pay the wait each time."
