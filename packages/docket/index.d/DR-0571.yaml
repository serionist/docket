decisions:
  - id: DR-0571
    title: The transcribe tool queues a recording in the service, one job at a time; docket eval speech scores each engine
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#158"]
    description: "The MCP tool `transcribe(rid)` and the REST route POST /api/transcribe?rid=, which takes the bearer token only, queue a recording in the service and answer at once with the job: its rid, its state (queued, running, staged, not staged), how many jobs run or wait before it, its percent while it runs, and once it ended its outcome in Docket's words; a rid a job would refuse (not a rid, a Whisper transcript's) is refused at once, and with speech off in the service the answer says why. One thread runs the jobs one at a time, each through `docket transcribe`'s own job with wait on, so the machine's speech lock (DR-0569) makes a job a terminal runs wait its turn, and the other way round. A recording asked for while its job waits or runs keeps its job; asked for again once it ended, it runs again. The service's status, GET /api/speech and the Recording page show the job: the page as \"Whisper:\" and the job's line. After each index update, on CUDA only, the thread queues by itself the 20 newest recordings, from the sources this machine ingests, whose stored audio reads ok and that have no Whisper transcript staged or in raw, each at most once while the service runs, raw read at its places and a recording with no stored file costing no read; on a CPU nothing is queued by itself. The speech choice is read when the service starts. A job's failure never stops the queue: its type is the outcome, never its message. The log holds counts, never a rid or a text. `docket transcribe <rid>` asks the service when it runs for the vault and answers with speech on, and otherwise, or with --here, runs the job in the terminal. `docket eval speech <file>` reads a speech file kept outside the repo like the question file (DR-0290): YAML, schema_version 1, stretches, each with at (a recording's stretch as an anchor, r:<rid>@mm:ss-mm:ss), text (the stretch as it was said) and names, and an optional note. For each stretch every transcript of the recording is read by its engine (the recorder's, which names none, as the recorder), the segments whose middle falls in the stretch and no [cut]; it prints per engine the word and character error rates after lowercasing and stripping punctuation, keeping diacritics, the share of the listed names missing from its text, accents and case folded, and the entities' names it added that the corrected text lacks, with --json for the numbers. The vault is only read."
    binds:
      - "transcribe(rid) is an MCP tool: its name and parameter only gain optional ones, and its result only gains fields (DR-0018)."
      - "The speech file is the owner's, kept outside the repo: schema_version 1 reads as it does now in every later Docket."
    not_chosen:
      - "Queuing on a CPU by itself: an hour of audio takes about an hour there."
      - "A queue kept on disk: a job lost with a stopped service is asked for again, or queued again by the next update on CUDA."
