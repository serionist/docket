decisions:
  - id: DR-0501
    title: curate show and its JSON hide what a never-store list gains after a round, in tier 1's lines and on the cards, as the Curate page does, and keep every field
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#130", "#140"]
    description: "A never-store list can gain a value after a round started, which neither tier 1 nor the miner takes while a list holds it (DR-0469). docket curate show and its --json then show what the Curate page shows, with (on a never-store list) in place of each value a list holds now. In a line tier 1 applied: the value in its key, and in its change an alias's or a name's text, an id's value, or a created entity's names, aliases, ids, role and note. On a card: its name, its fact's value and its spellings, its entity id when a list holds it as written or the name its slug spells (a trailing -<n> taken off and its hyphens read as spaces, so rita-sample-2 spells Rita Sample) or it is a new card's listed name's slug, and in the fields only the JSON shows, its key (the entity in it too when that is hidden) and the spelling beside each locator. A snippet that names a listed value, the name an id spells among them, is left out, by the page's own test, which moves to curate/batch.py with the id's, so both use one. Every field stays, so the JSON reads as before. The copies are only shown; the log and the round's batch keep what they wrote. Taken-back lines already hid their key's value. The id rule holds every entity id a log line prints too: its entity on the page's log rows and in show's applied and taken-back lines, the entity in a key, and a related link's other end. docket curate log and its --json, and the lines a curate write prints, hold to the same rule (#140); a stopped write a write finishes first is named by its op id, and op ids stay as written, so undo takes them."
    not_chosen:
      - "Applied lines as text, as taken_back is: the JSON's applied would change shape under a reader of its fields."
      - "Leave out a line whose value a list holds: the round would no longer say tier 1 changed that entity; the page shows the line with the value hidden."
      - "Leave out a card whose value a list holds: the round's numbering and what the user decides would no longer match the page."
