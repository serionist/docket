decisions:
  - id: DR-0590
    title: "A Whisper transcript follows its family's cuts at promotion: the gate writes its next version, cut by text, in the same run"
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#186"]
    description: "The promotion that brings a cut to a recording's family cuts the family's Whisper transcript too. A family is touched, for a source this machine ingests (DR-0591), when a transcript of it promoted now has [cut] segments, when its Whisper transcript is staged and promoted now, when its audio waits in staging, and once per clone and source after the update for every family with a Whisper transcript in raw, a stamp in Docket's private folder, whisper-follow, naming the sources done. The ranges are the family's, as media's screen reads them (DR-0561) and docket transcribe cuts by (DR-0569): the release's cuts and the [cut] segments of every transcript of the family, staged ones with their time cuts made and those in raw, the Whisper transcript's own among them; a record cut by characters, or a staged cut that doesn't fit yet, adds nothing instead of refusing, so the times known are cut. The Whisper transcript's latest version, or the staged one the promotion takes, loses every segment overlapping a range, [cut] ones included, and a [cut] segment sits at each range, merged, through cuts.place, which speech.job._record uses too: not widened over Whisper's own segments, since every transcript's [cut] segments widen the audio's cut (DR-0561), and never refused for a range after its last segment. Its text is rendered from the segments; everything else is kept from the version it cuts, its via still naming the stored file it was heard from; it is redacted with the rules in force. When the segments come out the same, nothing is written. A version from raw goes at the end of the source's run in that promotion, or in a run of its own, in one commit, before the media commit; a staged one is promoted cut, in its place. It goes in at promotion without staging: it holds nothing its earlier version didn't, and staged it would wait for the owner, as everything from a mixed source does and a version of a cut record does on any source. It needs no Whisper, audio or key on the machine."
    binds:
      - After the promotion that brings a cut to a family, on a clone that ingests its source, the latest version of the family's Whisper transcript holds nothing of the cut stretch.
      - A followed version's [cut] segments sit at the family's ranges, never widened, so a cut of the transcript never widens the audio's.
    not_chosen:
      - "Staging the cut version: it would wait for the owner, as everything from a mixed source does and a version of a cut record does on any source, and search would show the stretch until they classified it."
      - "The cut log's ranges for the new stored file: the audio is put again only at the source's next run, and search would show the stretch until then."
      - "The recorder version's own cuts alone: a release's cuts, and a cut on another transcript of the family, would be missed where the audio has them."
      - "A commit of its own after the run's: a crash between the two would leave the recorder's text cut and Whisper's not."
