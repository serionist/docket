decisions:
  - id: DR-0590
    title: "A Whisper transcript follows its family's cuts at promotion: the gate writes its next version, cut by text, in the same run"
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#186"]
    description: "The promotion that brings a cut to a recording's family cuts the family's Whisper transcript too. For a source this clone runs (DR-0591), the follow looks at every family with a [cut] segment in raw that has a Whisper transcript in raw, as the gate's cut scan finds them on every call; every family with a transcript promoted now holding [cut] segments; and every family whose Whisper transcript is staged and promoted now. The cut scan keeps each rid's [cut] spans over its versions in raw and each machine transcript's latest marks, by run order, parsing a machine transcript's line by its via whether or not it holds a [cut]. The ranges are the family's, as media's screen reads them (DR-0561) and docket transcribe cuts by (DR-0569): the release's cuts and the [cut] segments of every transcript of the family, staged ones with their time cuts made and those in raw, the Whisper transcript's own among them; a record cut by characters, or a staged cut that doesn't fit yet, adds nothing instead of refusing, so the times known are cut. They are worked out in memory, and a family whose Whisper transcript's latest marks hold every range is passed over without a read; only one with a range not held has its Whisper transcript's latest version read from raw. That version, or the staged one the promotion takes, loses every segment overlapping a range, [cut] ones included, each end of a range that lies outside its own [cut] segments padded by cutter.PAD_MS, since the audio is silenced that far (DR-0560) and the version was heard before it was; an end inside its own marks was silent already, so a range that grew on one side is padded on that side only. A [cut] segment sits at each range, unpadded and merged, through cuts.place, which speech.job._record calls with no pad. The marks are not widened over Whisper's own segments, since every transcript's [cut] segments widen the audio's cut (DR-0561), and a range after the last segment is marked, never refused. Its text is rendered from the segments; everything else is kept from the version it cuts, its via still naming the stored file it was heard from; it is redacted with the rules in force. When the segments come out the same, nothing is written. A version from raw goes at the end of the source's run in that promotion, or in a run of its own, in one commit, before the media commit; a staged one is promoted cut, in its place, and is then the family's only Whisper version in that promotion. It goes in at promotion without staging (DR-0596): it holds nothing its earlier version didn't, and staged it would wait for the owner, as everything from a mixed source does and a version of a cut record does on any source. It needs no Whisper, audio or key on the machine."
    binds:
      - After a promotion on a clone that runs the source, a family's Whisper transcript holds at its latest version nothing of what the family's ranges cut, but in the race DR-0591 accepts.
      - A followed version's [cut] segments sit at the family's ranges, never widened or padded, so a cut of the transcript never widens the audio's.
      - Only a cut of a version already in raw, or of a staged version promoted in the same call, goes in without staging; nothing new from a source does.
    not_chosen:
      - "Staging the cut version: it would wait for the owner, as everything from a mixed source does and a version of a cut record does on any source, and search would show the stretch until they classified it."
      - "The cut log's ranges for the new stored file: the audio is put again only at the source's next run, and search would show the stretch until then."
      - "The recorder version's own cuts alone: a release's cuts, and a cut on another transcript of the family, would be missed where the audio has them."
      - "A commit of its own after the run's: a crash between the two would leave the recorder's text cut and Whisper's not."
      - "Following only at the cut's own promotion and when the audio is put again: a cut the follow missed would stay searchable until then, for good if the audio is never put again."
