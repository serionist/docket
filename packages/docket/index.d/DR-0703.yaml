decisions:
  - id: DR-0703
    title: The web app is a React single-page app with shadcn/ui on Tailwind v4, built by Vite, and the service is its only server
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#252"]
    supersedes: [DR-0016]
    description: "The pages are one React 19 app in TypeScript under packages/docket/web: TanStack Router keeps each page's state in its URL, TanStack Query fetches, shadcn/ui components (copied into the source as its CLI writes them) sit on Radix and Tailwind CSS 4, icons come from lucide-react, and Vite 8 builds it. The service hosts the built app: FastAPI serves its files and its index.html for every client route on the same origin and port as /api and /mcp, 127.0.0.1:8741 by default (DR-0151). No other server serves it and no Node runs at runtime; Vite's dev server, proxying to a throwaway service, is for development only. Versions are exact pins in package-lock.json, each at least a week old when taken; Node 24 LTS is pinned in .nvmrc and engines, npm in packageManager, and .npmrc turns install scripts off. TypeScript stays on 6.0 while typescript-eslint's range stops below 6.1. No form library (fields save one at a time), no key library (DR-0711), no virtual list (a list shows k rows, DR-0666) and no toast library (the notice is a bar)."
    binds:
      - "The service is the app's only server: same origin and port as the API, no Node at runtime."
      - A runtime package lands with its licence in the build's licence file and its reason in the PR.
    not_chosen:
      - "Jinja and htmx kept, styled to look like shadcn: the maintainer chose the real components and a product's feel (#252)."
      - "Next.js or another server-rendering framework: a Node server at runtime."
      - "React Router: TanStack Router types the search parameters every page keeps its state in."
      - "pnpm: one more tool to install, where npm comes with Node."
      - "TypeScript 7: typescript-eslint doesn't take it yet."
