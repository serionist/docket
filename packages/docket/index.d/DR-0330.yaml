decisions:
  - id: DR-0330
    title: Models run in a worker process that speaks JSON lines on pipes; the service keeps it loaded and the CLI starts one per command
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#67"]
    description: "The embedder, and the reranker after it, runs in a process of its own: the environment's Python with -I -X utf8 and Docket's models/worker.py, an environment holding only what Python needs, the model folder and the device, as a mapper runs (DR-0123), and no console window on Windows. It answers hello and embed as JSON lines on stdin and stdout, vectors as base64 float32; the core builds each input, prefixes included, and the worker only embeds. What it prints goes to stderr, kept for docket models status and never logged, and an error names its type only (DR-0155). It takes one request at a time: the core's queue puts a search's query ahead of the embedding pass's batches, each sorted by length and cut by a budget worth about 0.3 s that the install measures on the machine; the core has no tokenizer, so a text costs its length in characters, at most what the model's 512 tokens let through (20,651 characters a batch on 8 threads of the maintainer's desktop). The pass's ONNX Runtime threads are capped at half the cores. A query not answered in 2 s skips the vector stage for that search and the worker goes on; the worker is started again only when the request it is running passes its own timeout (30 s for hello, 60 s for a batch), at most once a minute. The service starts one when models are installed and keeps it; a command that only asks queries (docket search, docket eval) starts one on the CPU for itself, since CUDA takes about 8 s to start against the CPU's under 2 and both give the same vectors, and the embedding pass runs on the chosen device; --no-models skips it."
    binds: ["Search never waits on the worker past its timeout: the keyword stages answer alone."]
    not_chosen:
      - "A socket or a port: a token to guard, for a process only Docket talks to."
      - "Models in the service's own process: their memory, and a crash, would take the service."
      - "Restarting the worker when a query is slow: a query waits behind one batch at most, and a restart throws the batch away."
      - "Batches of a fixed number of chunks: a batch pads to its longest chunk, so one of transcript windows at 512 tokens runs far past the budget."
      - "Counting tokens in the core: a tokenizer, a dependency the core would carry for a budget the install already times in characters."
