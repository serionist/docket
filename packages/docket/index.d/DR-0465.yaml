decisions:
  - id: DR-0465
    title: Tier 3 is the miner's filter, never shown, its counts in one line
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#68"]
    description: "Before anything is ranked, the miner leaves out: a spelling found in one container only; a run of words seen under three times; a common word, written lower case in over a fifth of its mid-sentence uses, whether alone, as a run's first word at a sentence's start (the run keeps the rest) or as every word of a run; a language's time words and language names, and the words of generic speaker labels (Speaker, Beszélő, Unknown); a spelling under three letters or of digits only; a spelling an alias covers, which means its written form or an asr misspelling in alias_terms, never a case form or a stem form, so Anna stays a candidate beside an entity Ann whose Anná folds to it; a spelling a never-store list matches, counted without its value; a key on the stoplist, in the role it names. The round shows how many it left out by reason. The thresholds are constants, the first thing raised when the review minutes climb (the design's Risks)."
    not_chosen:
      - "A filter nobody sees: what it costs in missed names would never show."
      - "Case forms and stem forms counted as covered: a second person named like another's case form (Anna beside Ann) would never be proposed."
