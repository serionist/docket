decisions:
  - id: DR-0551
    title: "One reader decrypts media in memory, or says why it can't: not stored, held, not downloaded, no key"
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#42"]
    description: "docket.media.reader.read(vault, rid) is the one way to media's bytes, for the service and the models' worker, which opens the vault itself: it decrypts into memory, bounded by the cap, and writes nothing plain to disk. When it can't, its state says why: not-fetched (no media staged or stored), staged (it waits at the gate with its record), held (a hold covers the rid; since DR-0561 a release with cuts no longer holds media back), not-downloaded (an LFS pointer is in place of the file), no-key (the file is here, its key isn't, or this machine can't open the key's seal). reader.state_of answers without decrypting, from the header and the key file. The Recording page's NO_AUDIO list gains staged, held, not-downloaded and no-key, each with its sentence and its test, and stored, which says the file is here while the page has no player."
    not_chosen:
      - "Decrypting to a temp file for each reader: plain audio on disk, for as long as a reader forgets to remove it."
