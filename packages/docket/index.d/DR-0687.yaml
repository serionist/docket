decisions:
  - id: DR-0687
    title: Each sync agent returns one block, RUN, OWED, INVITES, WAITING, CLOSES, MEETINGS, NOTES, MINUTES, OUTCOME and LEARNED, every locator a rid
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#210"]
    description: "An owner's old fork contract, adapted to Docket. Each agent returns the block and nothing else long, about 800 words, a line per finding. RUN: the source, the run, captures, ready and pending, skipped, whether the mark moved, a note; or the source, none and why. OWED: who, the rid, the day asked, the ask, why still open, today, this week or whenever. INVITES: the organiser, the event's rid, when, clashes. WAITING: who, the rid, since, what the owner waits for. CLOSES: the A- ref, done or moot, the evidence's rid, how. MEETINGS: the M- ref, a response of declined or cancelled, the evidence's rid: only what the calendar can't show, since its records make and move meetings at promotion (DR-0647). NOTES: the doc id, the recording's rid, start, end, an M- ref its content names. MINUTES: the M- ref, the point id, answered, dropped or open, the answer, the rid with its anchor. OUTCOME: the M- ref, two to four lines on what was decided and who does what, the rid. LEARNED: SKILL.md or sync.md, and what differs from it. A locator is a rid as the source's SKILL.md builds it under What it makes, with its anchor, which read opens. The old FILE line goes with the harvest files, and its DOCKET line becomes RUN."
    binds:
      - "The labels are a one-way door (AGENTS.md): never renamed or removed, and a line gains fields only at its end."
      - Every locator in the block is a rid with its anchor, never a subject and a time.
    not_chosen:
      - "The old text locators, a mail's subject and time or a chat's name and time: read can't open them, so a close would rest on words."
      - "MEETINGS lines that make meetings: the calendar's records do, keyed by event, and a move or a rename updates the same meeting."
