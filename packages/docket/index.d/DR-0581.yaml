decisions:
  - id: DR-0581
    title: A forget commits its list first, then applies it, and every gate call on every clone applies it again
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "Under the vault lock, after the question and the plan worked out again: the list's line, through a temp file and a rename, fsynced, in force from then on; its commit alone (Forget: the list from <machine>); then the apply. This clone's listed keys deleted; staging's listed versions and media dropped with their keys, a whole rid's family withheld. Then the tree, which waits while the owner's git is in the middle of something (DR-0597): listed lines out of the run files, split at LFs alone as every reader splits them, a file left with none staying, empty, so another clone's rewrite of it merges by union instead of a modify/delete conflict; the stored media the forget takes, gathered with every key of theirs, a file's key read from its header and kept by its stamp, and an LFS pointer, whose key can't be read, taken when every key the cut log names for its rid is listed, as a version forget lists them; doc lines dropped (DR-0580), a hand edit taken in first and only that doc, with the docs citing it, judged again; this machine's cursor entries under listed rids dropped. The paths and the docs' revs are recorded before anything in the tree changes; then a keys-only line for any key it deletes that no line names (DR-0595), before that key goes; each file whole through a temp file and a rename; the media files and their keys deleted; one commit naming counts only, with the Doc: line of each doc rev it wrote, a failed commit's included, so every rev it writes is in a history (DR-0112). The lock is let go, then the index is rebuilt under its own lock, vectors carried by hash (DR-0115), since the vault lock's waiters give up after 60 s; until the rebuild lands the index is refused by its digest (DR-0593). Every gate call on every clone runs the apply first, so a crash at any step, a pull, a line a union merge brought back, or a clone's own run of the record before its pull is finished there, with one commit (Forget: applied on <machine>); until then every reader skips listed lines. The apply costs one stat with no list, and otherwise reads only what moved since <private>/forget/applied.json: the list it applied, its keys too, which the digest leaves out but the key store follows; the HEAD it last walked the docs and stored media at, since both arrive by a commit or a pull, so with HEAD and the list where they were it walks neither; the size and modification time each run file, doc, media file and this machine's cursor file had when it was read, taken before the read, so a file a pull changes meanwhile is read again, with each media file's key; the docs it left for their owner, watched on every call; and the paths it wrote and hasn't committed, with the docs' revs among them. Staging is read again only when the list moved, since intake keeps a listed version out meanwhile. A keys-only line waits while the list lacks a line HEAD has, which Docket never commits; docket vault check names that list. docket vault check names a run file changed only by listed lines gone as a forget not finished. A repo of its own is forgotten the same way until #58. Every dry run names what forget can't reach: key exports made before, the LFS copies, chunks sent to an API provider, the source itself, git history, other clones until their next gate call, and files outside the vault."
    binds:
      - "The apply is idempotent: the tree, staging and the key store follow the list."
      - The index is never rebuilt under the vault lock by a forget.
    not_chosen:
      - "A targeted delete in the index: every line after a removed one moves its byte offset (DR-0445), and a reply in a thread window re-chunks its thread."
      - "The rebuild under the vault lock: the service's syncs would wait past the lock's 60 s."
      - "Deleting a run file left empty: a modify/delete conflict in the owner's pull."
      - "Applying on another clone only by a command: its keys would outlive the forget until the owner remembered."
