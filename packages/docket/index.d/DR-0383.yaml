decisions:
  - id: DR-0383
    title: A staged record shows in the page as promotion would write it, and is cut by its utterances, its lines or typed ranges
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#71"]
    description: "The panel runs the staged record through the redactor with the current rules, as intake_view does for docket hold show, and says so when that changes it; the staged file stays as it is. A transcript is cut by checking utterances, each cut from its segment's start to its end in milliseconds and at least one millisecond long, as cuts reads a segment with no length; a text by checking lines, each the staged text's characters, lines next to each other one cut; either takes typed ranges as --cut does, a time with milliseconds where it needs them (0:30.400). A record opened with nothing chosen starts from the cuts its file holds: each utterance or line a stored cut covers whole is checked and what it leaves is typed exactly, so Work keeps an earlier cut, Claude's or the CLI's, unless it is unchecked. Utterances its recording's release cuts are marked as going, can't be checked and show no text, since classification and promotion cut them whatever is checked (DR-0201). The preview cuts by the chosen cuts and the release's, then redacts, promotion's order (DR-0025), and names the utterances that go, those an overlapping one takes along included. A text the current rules would join lines in takes no line cut in the page, and one whose redacted view changed length takes no typed character cut: the panel names docket staging show and classify --cut. A typed cut that doesn't read is the panel's problem, with the record and its checks kept."
    not_chosen:
      - "The staged text as docket staging show prints it: a rule turned on since intake wouldn't apply in the page."
      - "Times read off the screen to the second: a cut would take the neighbouring utterance."
      - "A mouse selection in the text: it needs JavaScript, and offsets the redacted view doesn't keep."
      - "A record opened with nothing checked whatever its file holds: Work would make a cut record ready with none, and promotion would write the stretch."
