decisions:
  - id: DR-0383
    title: A staged record shows in the page as promotion would write it, and is cut by its utterances, its lines or typed ranges
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#71"]
    description: The panel runs the staged record through the redactor with the current rules, as intake_view does for docket hold show, and says so when that changes it; the staged file stays as it is. A transcript is cut by checking utterances, each cut at its segment's start and end in milliseconds; a text by checking lines, each the staged text's characters, lines next to each other one cut; either takes typed ranges as --cut does. The preview cuts, then redacts, promotion's order (DR-0025), and names the utterances that go, those an overlapping one takes along included. A text the current rules would join lines in takes no character cut in the page, and the panel names docket staging show and classify --cut.
    not_chosen:
      - "The staged text as docket staging show prints it: a rule turned on since intake wouldn't apply in the page."
      - "Times read off the screen to the second: a cut would take the neighbouring utterance."
      - "A mouse selection in the text: it needs JavaScript, and offsets the redacted view doesn't keep."
