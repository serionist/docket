decisions:
  - id: DR-0559
    title: Audio is cut in a child process through PyAV's FFmpeg, with limits, and nowhere else
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#157"]
    description: "A put whose media must be cut runs python -I -X utf8 -m docket.media.child, fresh for each put, with the mapper runner's stripped environment, as the documents' reader runs (DR-0485). The child caps its own memory at 512 MiB before it says ready (RLIMIT_AS on Linux, a job object of its own on Windows, none on macOS), and the parent stops one whose cap isn't the one asked; on Windows the parent also puts it in a job that kills it, launcher and all, when its handle closes. The child keeps numpy out and refuses Python's own socket.connect and getaddrinfo through an audit hook. It takes one JSON line naming the input file, its demuxer from the sniffed type (mp3, mov for m4a, aac, ogg for ogg and opus, wav, flac, matroska for webm; never FFmpeg's own probe, and bin refused), the output file and the ranges, and answers one: done with the duration, the onset and the input's codec, rate, channels and bit rate, or not_read with a reason in Docket's words (no audio, damaged, longer than 12 hours, over media.max_bytes). FFmpeg opens the one file through protocol_whitelist=file, so a playlist or reference inside it opens nothing else: that, and the forced demuxer, keep FFmpeg off the network. The parent waits 30 s for the hello and 15 minutes for the answer, then kills it. Uncut audio is plain only in <private tmp>/media-cut-<pid>/, one folder per process in Docket's private folder: the put deletes its files on every path, and every sweep removes the folders of processes no longer running, whatever their age, asking os.kill(pid, 0) on Linux and macOS and OpenProcess with GetExitCodeProcess on Windows. The child's stderr is read and dropped, never logged. The dependency is av==18.1.0, pinned, with pyrage's platform markers; media is off where either has no wheel."
    binds:
      - No audio is decoded in the service's or the CLI's own process.
      - "av's wheels bundle libx264 and libx265 (GPL-2.0-or-later) though their FFmpeg reports LGPL v3: an installer that ships them needs an FFmpeg built LGPL-only or the GPL's terms."
    not_chosen:
      - "soundfile (libsndfile): no M4A or AAC, numpy in the child, and Opus's bit rate only through a compression level."
      - "An ffmpeg binary on PATH: absent on stock Windows and macOS, its version and codecs unknown."
      - "miniaudio: it decodes only, and has no Windows-on-Arm or Linux aarch64 wheels."
      - "Plain temp files by name and age, as the encrypted ones are: a long cut outlives any age, and a folder per pid has an owner to ask."
