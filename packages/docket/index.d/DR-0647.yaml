decisions:
  - id: DR-0647
    title: The core makes meetings after each promotion from the latest version of each event record it wrote, in one write by sync that never refuses; a stopped step is replayed first, and docket ledger calendar catches up by adding and joining
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#200"]
    description: "Gate.promote, the one way a record reaches raw, notes the rids of the event records it writes as pending, in a file of the vault's private folder, per clone and never committed, before it writes the run file, so a crash after the run file loses no set; a pending rid whose version never reached raw reads raw's latest and changes nothing. Then the core's calendar step makes one ledger write by sync through the caller's via (cli for docket staging promote, page for the Staging page) and clears them once that write commits or has nothing to write. The next promotion or docket ledger calendar replays what is pending first, sets included, as DR-0463 finishes a stopped write before a new one, so a step that stopped never loses its sets. The step takes one version per rid, raw's latest by line order, so an event moved twice before one promotion lands at its last time, and a pending rid is read at raw's latest version too: one left over a full revert (#202) applies as any record would to the ledger it meets, never an older version over a newer. The adds then go in start order, then rid. Each version's ops are written once, by the machine that promoted it: a clone that pulls the run gets its ops with it and promotes nothing. Two clones that promote the same version write the same ops in the same order, so they make one meeting per key (DR-0621), renumbered (DR-0613) only when their ledgers differed. Two harvests minutes apart on two clones, the event changed between, can let the older version's set sort last and win until the next version corrects it: rare, and accepted. The step is a change inside the writer that the batch's ops don't take, so its reads and its ops are one plan under the vault lock and a dry run shows them. The step takes the lock before it reads: each rid that drives a set is read at raw's latest version under it, so a newer version another promotion wrote meanwhile is never overwritten by one read before. A crash in the milliseconds between the step's commit and the clearing of its pending rids replays that version once at the next step, over a hand edit made before it: rare, and accepted. It never refuses: a record it can't take is left out and named with why, and the rest is written. docket ledger calendar [--since DAY] [--dry-run] replays what is pending, then takes the latest version of each event record in raw starting on or after DAY, 14 days back by default, and only adds and joins: a key the ledger holds gets no set from it, its join of an imported meeting carrying the held meeting's values, so a version the sync has since corrected by hand, such as a decline the week view no longer shows, is never applied again. The catch-up writes in chunks of about 200 records in start order, each cut at a day's end and its own write by sync, so the vault lock is let go between them: a write folds again what it has read after each meeting it writes, and one write of a few thousand records held the lock for minutes, past the service's wait. It runs when #200 lands, after an import or a reset (DR-0652) and after a split (DR-0649)."
    binds:
      - One version per rid, raw's latest by line order; the adds in start order, then rid.
      - A promotion's event rids are pending until the step's write commits, and a promotion or a catch-up replays them first, sets included, each at raw's latest version.
      - Only a promotion's own or pending event records drive sets, each read under the vault lock; the catch-up's own pass adds and joins only.
      - "The calendar step never refuses a write: what it can't take is left out and named."
      - The catch-up writes chunks of about 200 records in start order, each cut at a day's end and its own write.
    not_chosen:
      - "The step on index update: it runs on every clone and on every rebuild, writing from a reader's path and applying stale versions over the sync's own sets."
      - "The sync skill writing meetings through ledger_batch: a fixed mapping needs no judgement, DR-0105 gives it to the core, and every machine's copy of the skill would have to agree."
      - "Applying every record of a window again on each run: a stale version would undo a response or a place set by hand, each time."
      - "Each version in start order: an event moved earlier between two harvests would end at its old time."
      - "Carrying each version's fetch time on its set and folding the newest: a new op field for a rare race between clones that the next version corrects."
      - "The catch-up in one write: each meeting it writes folds again all it has read, so 3,000 records held the vault lock for one to five minutes."
