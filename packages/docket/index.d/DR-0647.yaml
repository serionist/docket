decisions:
  - id: DR-0647
    title: The core makes meetings after each promotion, from the event records it wrote, in one write by sync that never refuses; docket ledger calendar catches up by adding and joining only
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#200"]
    description: "Gate.promote, the one way a record reaches raw, keeps the event records it wrote, and once its lock is released the core's calendar step takes them in start order, then rid, as one ledger write by sync through the caller's via: cli for docket staging promote, page for the Staging page. Each version's ops are written once, by the machine that promoted it: a clone that pulls the run gets its ops with it and promotes nothing. Two clones that promote the same version write the same ops in the same order, so they make one meeting per key (DR-0621), with the same numbers when their ledgers agreed and DR-0613's renumber when not. The step is a change inside the writer that the batch's ops don't take, so its reads and its ops are one plan under the vault lock and a dry run shows them. It never refuses: a record it can't take is left out and named with why, and the rest is written. If the write itself fails, the promotion stands and its output names the catch-up. docket ledger calendar [--since DAY] [--dry-run] takes the latest version of each event record in raw starting on or after DAY, 14 days back by default, and only adds and joins: a key the ledger holds gets no set from it, so a version the sync has since corrected by hand, such as a decline the week view no longer shows, is never applied again. It runs once when #200 lands, after an import (DR-0652), after a split (DR-0649) and after a failed step."
    binds:
      - Only a promotion's own event records drive sets; the catch-up adds and joins only.
      - "The calendar step never refuses a write: what it can't take is left out and named."
    not_chosen:
      - "The step on index update: it runs on every clone and on every rebuild, writing from a reader's path and applying stale versions over the sync's own sets."
      - "The sync skill writing meetings through ledger_batch: a fixed mapping needs no judgement, DR-0105 gives it to the core, and every machine's copy of the skill would have to agree."
      - "Applying every record of a window again on each run: a stale version would undo a response or a place set by hand, each time."
