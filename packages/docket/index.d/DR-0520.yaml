decisions:
  - id: DR-0520
    title: Nothing skips a loosening's question, for the owner's scripts either; a hand edit of vault.yaml stays the owner's
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#134"]
    description: "No flag, environment variable, token or MCP tool answers the question. The owner's scripts need none: loosening is a setup-time change, and whatever a script running as the owner reads, a key in the keychain, a file or a variable, an agent running as the owner reads too, so a path for scripts would be the agent's path. The human-only factor is an OS prompt (Windows Hello, Touch ID, polkit), deferred with the release's (DR-0382, DR-0506). A hand edit of vault.yaml stays possible and is the owner's own console edit: the gate obeys the file as it stands and never refuses one because it loosens, and the take-in commits an uncommitted edit on its own as Config: vault.yaml as edited, unasked (DR-0507). Claude's edit of the file passes Claude Code's permission prompt with its diff; the skills forbid a loosening edit and give the owner the line, as the Settings page does."
    binds:
      - "Not a wall against a process running as the user: a pseudo-terminal of its own with CLAUDECODE cleared passes, as for the release (DR-0202); the skills forbid it."
      - The README says the owner's scripts have no way around the question, and that a hand edit is theirs.
    not_chosen:
      - "A token in the keychain or an environment variable for scripts: Claude reads what a script reads."
      - "Asking about a hand edit at the next command: the owner is asked about their own edit, and one of Claude's blocks every later change, stricter ones too."
      - "Refusing a vault.yaml that loosened at the gate: every write stops, and nothing tells the owner's editor from Claude's."
