decisions:
  - id: DR-0622
    title: A meeting is made by a meeting op with an M- number and its fields, and changed by set, material, archive, log, undo and renumber
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#199"]
    description: "meeting carries number, an M- number under the A- number's rule in a sequence of its own (DR-0613), and fields: subject, start and end required; event, series, organiser, where, response, attendees, stream, notes and outcome optional. start and end are local times, YYYY-MM-DDTHH:MM in vault.yaml's zone, as day is the owner's day; todo.py's HH:MM end becomes a time on the start's day or the next. response is accepted, tentative, declined, none, organiser or cancelled; attendees is a list of names; event and series are the calendar's keys as text, compared exactly, which #200 sets; stream is a slug; the rest is text. Responses are read as text and checked when written, as DR-0611 has kinds. set changes any field but event, null clearing an optional one. material links a recording, a chat or a mail as an item's does (todo.py's recordings and links). archive takes a meeting with no open point out of the day's lists and keeps its history; it meets a meeting with an open point idle, and only its undo brings the meeting back. log, undo (DR-0614) and renumber are an item's."
    binds:
      - M- numbers follow DR-0613 in a sequence of their own.
      - start and end are local times in vault.yaml's zone.
    not_chosen:
      - "start as UTC: the day, the pages and todo.py all work in the owner's zone, and every read of a meeting's day would need it."
      - "end as HH:MM, todo.py's: a meeting past midnight or over days needs a rule."
      - "A link op of its own for recordings and chats: material already says it."
      - "attendees as one comma-separated text, todo.py's: briefs need each name."
