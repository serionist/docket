decisions:
  - id: DR-0561
    title: A release's cuts and a transcript cut by time are the ranges media is cut by; decisions keep their kind
    status: proposed
    at: "2026-10-17"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#157"]
    description: "The ranges a rid's media needs are the union of the covering release's cuts (DR-0200), the [cut] segments of each version in raw of a transcript in its family, and those of each staged version once its own cuts are made, as promotion will make them; the family is DR-0547's. These no longer refuse media. Still refused: a record without segments cut by characters, or to be cut so, since it gives no time; a hold; a release leaving a record out; the withheld marks and never-store; and a family rid with a decision in staging/_decided.jsonl that is private or has no kind. Each _decided.jsonl line now carries kind: cut for a promotion with hand cuts, or private for a private classification; an older Docket reads only rid and key, and a line without a kind counts as private for media, as every decision did under DR-0547. docket media confirm-cuts <rid>, at the owner's console only, shows for each family rid with kind-less decisions how many it has and which versions in raw each could be, each with its run and cut times: only a version this clone promoted cut by hand counts (its run names this machine), since decided is this clone's alone while raw is shared, less one for each cut decision the rid already has, and a version whose every [cut] span lies inside the release's cuts is left out; it refuses when the kind-less decisions outnumber the versions left, since one was a private classification, and otherwise, on a typed-back code, appends a cut line for each of those keys, the last kind for a key counting. The put cuts by the ranges before it encrypts; finish refuses when the ranges then are not inside those it cut by. The sidecar's schema 2 keeps them as cuts, a list of start and end in milliseconds; schema 1 reads as cut by none. Schema 3 adds replaces_keys, the key ids of the stored files a replacement takes over (DR-0562). At every sweep and promotion a staged file whose family's ranges are not inside its own is deleted with its key and counted. run_open's text gains media    <n>: <ids>: the source's recordings, staged or in raw and newest first, with no media, ranges to cut and every check passing, at most 20 from the newest 200, only where the source has a media host or folder; the media step puts them too, and the Plaud reference skill's Audio row says so."
    binds:
      - "A hold still refuses media and deletes what is staged: a held recording keeps no text either."
      - "Uncut audio is never encrypted into staging when the ranges are known: cut first, then encrypted."
      - "Amended by #143 (DR-0575): docket media confirm-cuts asks the OS prompt, or the code where the machine has none."
    not_chosen:
      - "Counting decisions against cut versions in raw: a release's cuts leave no decision, so an old private classification beside a release-cut version would pass."
      - "Cutting staged audio in place when its cuts grow: it would hold the vault's lock for minutes; a put again costs one download."
      - "Keeping held audio staged until its release: a held recording keeps no text, and the release decides what goes."
