decisions:
  - id: DR-0659
    title: docket ledger show --all --json feeds an owner's mirror, which renders when the old ledger is read and is checked field by field
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#202"]
    description: "docket ledger show --all --json gives every item, meeting and stream whole in show's model (#201), archived ones too, with the op files' stamp, their names, sizes and times, taken under the vault lock before it reads, and the vault lock's file. For the week in step, the owner's mirror, in their own project, renders the old ledger file and its archive from it with todo.py's own dumps, under a lock file of its own and through a temp file with a unique name, since todo.py's save() uses a fixed one and the old app's polling and the session-start dashboard may render at once; its header line carries the read's stamp. It renders whenever todo.py loads the file under that header and the op files' stamp has moved; todo.py's writer verbs refuse under it. Its --rollback, with the service stopped, reads, takes Docket's own vault lock, a filelock.FileLock on the path the read gives, the primitive Docket's writers use, and, while the stamp still matches, writes the file without the header, so no write lands between the render and the header's removal. Its --check, at cut-over against todo.py's own files and each day of the week against the mirror: todo.py check says ok, and show --all --json equals todo.py snapshot --all plus the archive's items and meetings, by number, field by field, but for a log entry's by where the old one had none or another name, log lines Docket wrote, closed where the old one isn't its close line's day, attendees' spacing, redaction markers and cleaned text, the next numbers, event and series; a joined meeting's start, end, subject, organiser, where and response, each only where its value is the one its calendar add wrote (#200); and meetings only the calendar step made. STATUS.md is Docket's, rendered from the ledger (#208): the mirror leaves it, and under the header nothing of todo.py writes it."
    not_chosen:
      - "A post-commit hook: Docket's own commits run no hook (they point core.hooksPath at a file)."
      - "The service running the mirror after each write: the service would run owner code."
      - "The sync skill: what the pages and the tasks skill write between syncs would wait for it."
      - "A stamp taken by the mirror after the read: a write landing between them would leave the mirror stale under a current stamp."
      - "Any field of a joined meeting allowed to differ: a wrong value the calendar never wrote would pass."
