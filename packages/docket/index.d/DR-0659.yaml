decisions:
  - id: DR-0659
    title: docket ledger show --all --json feeds an owner's mirror, which renders when the old ledger is read and is checked field by field
    status: proposed
    at: "2026-10-19"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#202"]
    description: "docket ledger show --all --json gives every item, meeting and stream whole in show's model (#201), archived ones too. For the week in step, the owner's mirror, in their own project, renders the old ledger file and its archive from it with todo.py's own save() and dumps, under a header line of its own stamped with the op files' names, sizes and times. It renders whenever todo.py loads the file under that header and the stamp moved, and once more at its --rollback, which writes the file without the header; todo.py's writer verbs refuse under it. Its --check, at cut-over against todo.py's own files and each day of the week against the mirror: todo.py check says ok, and show --all --json equals todo.py snapshot --all plus the archive's items and meetings, by number, field by field, but for a log entry's by where the old one had none or another name, log lines Docket wrote, closed where the old one isn't its close line's day, attendees' spacing, redaction markers and cleaned text, the next numbers, and event and series. STATUS.md is #208's, or the mirror's through todo.py's own writer if #208 isn't live."
    not_chosen:
      - "A post-commit hook: Docket's own commits run no hook (they point core.hooksPath at a file)."
      - "The service running the mirror after each write: the service would run owner code."
      - "The sync skill: what the pages and the tasks skill write between syncs would wait for it."
