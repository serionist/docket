decisions:
  - id: DR-0611
    title: An op line holds schema_version 1, id, item, after, op, day, at, machine, by, via, batch and note, and each kind's own keys
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#198"]
    description: "One op per change, and every op names one item, so an item folds from its own ops. Its keys: schema_version 1; id, the op's ULID (DR-0612); item, the item's id, its add op's id (DR-0613); after, the id of the item's latest op the writer saw, absent on an add, which can't be worked out later and tells two edits made apart from one made after the other; op, its kind; day, the owner's day in vault.yaml's time zone, always; at, the UTC second, absent when only the day is known, as for an imported log entry; machine, as the file name says; by, user, claude or sync (todo.py's me is user); via, cli, page, tool or import; batch, the first op id of the write it came in, so a write can be undone whole; note, the why or the evidence, on any op. The kinds and their own keys: add (number, and fields: kind, title, who, stream and source, with opened, due, description, notes and outcome optional; opened is the add's day unless set); set (fields, any of add's, null clearing an optional one; notes and outcome as whole text); log (note required, nothing else); triage (verdict discuss, claude, me or chase, or null to clear; an open or snoozed item is open with it); snooze (until, a day; triage cleared); done and drop (drop's note required; closed on the op's day, triage and until cleared); reopen (closed, until and archived cleared); material (ref and label to add or relabel, or ref and remove true; a path ref is written with forward slashes, relative to the host repo's top in a folder vault and to the vault's root in a repo of its own); archive (DR-0615); undo (of, DR-0614); renumber (number, DR-0613). An op that doesn't apply to the state it meets changes nothing and stays in the history; the writer refuses one up front, as todo.py does. todo.py's notes --append and done --outcome are the writer's: it writes the notes whole, and a set of the outcome before the close. The item's log is every op in order: its note, or a line rendered from it; an op via import other than log shows no line, since the import brings the old log as log ops. Reading: a line that doesn't read is a problem and is skipped. A key this Docket doesn't know, a name in fields it doesn't know, and an op kind it doesn't know are kept, change nothing and are no problem, so a later Docket can add one in schema 1. Kinds, verdicts and streams are checked when written; a stream is a slug until #199 makes streams objects. Other objects (meetings, points, streams) come with #199, which sets how their ops name them and which add wins for a meeting keyed by its event (DR-0105)."
    binds:
      - A later format writes schema_version 2, which this Docket skips with a problem.
      - "The fold never reads the clock: opened, closed and the log's dates come from day."
      - A key, a name in fields or an op kind this Docket doesn't know changes nothing and is no problem.
    not_chosen:
      - "Notes and outcome as ops of their own, with an append op: more shapes in the door; the writer writes the text whole."
      - "An outcome on done and drop: the writer writes a set before the close, so an outcome has one op."
      - "The log as stored lines, todo.py's way: the history would hold words, not changes, and counting it would mean parsing them."
      - "A free-text by: history counts need the three writers todo.py has, named the same way every time."
