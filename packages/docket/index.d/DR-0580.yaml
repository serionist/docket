decisions:
  - id: DR-0580
    title: A forget drops every doc line built on the family, by its anchors and by its refs, and keeps a final decision's title
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "In each doc's next rev, a content line with a raw anchor on a forgotten rid ([r:<rid>...], or @ on a doc covering that one rid) is dropped whatever else it cites, since its words carry what was said. So is a line with a ref to a dropped line, the ref followed to the rev it names, read from git when it isn't the current one as pinning reads it (DR-0540), to a fixed point: a brief or decision line built on a note line goes with it, and the forget leaves nothing flagged. The family's rids leave covers. A held rid's lines are dropped at the forget, and by a later apply only while no version of the rid is in raw, so lines on a released cut version stay. A doc left with no content line is removed, except a confirmed or rejected decision: it keeps its frontmatter, title and links, so what it superseded stays superseded, and with no evidence line left reads its evidence was forgotten in the decisions tool's note, the Briefs page and read. Forget's rev, which only drops lines and never changes a status or a link, is the second rev Docket writes to a final decision, after the redact pass's (DR-0564). A legacy note covering only the family is removed, and docket import notes refuses --take note for a doc a forget removed; one covering other records too keeps its text, having no anchors to tell its lines apart, loses the family from covers, and is named in the dry run, to edit by hand. A hand edit is taken in first, as every put does. A doc whose anchor run this Docket can't read and whose text holds a forgotten rid stops the forget, named by id and line (DR-0541). The forget's commit carries a Doc: <id> rev <n> line for each doc it rewrote."
    binds:
      - A forget leaves no line whose anchors or refs lead to a forgotten record.
      - A forget never changes a decision's status or links.
    not_chosen:
      - "Flagging the lines built on a dropped line and leaving them (DR-0542): their words stay in the tree, the index and search until each brief is rebuilt."
      - "Hiding them in reads until the next rev: the text stays in the tree and reaches every clone's pull."
      - "Removing a final decision left with no evidence: what it superseded would read as current again."
