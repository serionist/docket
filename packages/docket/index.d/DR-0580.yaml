decisions:
  - id: DR-0580
    title: A forget drops every doc line built on the family, by its anchors and by its refs, and keeps a final decision's title
    status: proposed
    at: "2026-10-18"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#182"]
    description: "An anchor is judged by where it reads, not by the rid it names: [r:<recording>@<time>], and a bare @<time> on a doc covering the recording, read on the transcript under it (DR-0370), so a forgotten transcript takes the lines whose times land on it; at a later apply, where that transcript is gone, a time anchor on a rid the list's media holds that no longer lands on a transcript counts as on the family. In each doc's next rev, a content line with a raw anchor that reads on the family is dropped whatever else it cites, since its words carry what was said. So is a line with a ref to a dropped line, the ref followed to the rev it names, read from git when it isn't the current one as pinning reads it (DR-0540), to a fixed point: a brief or decision line built on a note line goes with it, and the forget leaves nothing flagged (DR-0542). The family's rids leave covers. A version forget's lines (a held rid, a folder file) are dropped at the forget, and by a later apply only while no version of the rid is in raw, so lines on a released cut version or a new file at the path stay. A doc left with no content line is removed, except a confirmed or rejected decision: it keeps its frontmatter, title and links, so what it superseded stays superseded, and with no evidence line left reads its evidence was forgotten in the decisions tool's note, the Briefs page and read, with empty covers and no content line, which the strict read accepts for a final decision alone (DR-0109). Forget's rev, which only drops lines and never changes a status or a link, is the second rev Docket writes to a final decision, after the redact pass's (DR-0564). A legacy note whose every covered rid is in the family, or is a recording whose times land on a family transcript (an imported .transcript.md is such a note), is removed and its old paths' hashes and its import_hash go on the list, which docket import notes refuses for good, the note renamed, moved or copied, and after a history rewrite too; one covering other records keeps its text, having no anchors to tell its lines apart, loses the family from covers, and is counted in the dry run and named on the screen, to edit by hand. A hand edit is taken in first, as every put does. A doc whose anchor run this Docket can't read and whose text holds a forgotten rid stops the forget, named by id and line on the screen, by type and line in the dry run (DR-0541); so does a confirmed or rejected decision edited on disk, whose edit is never taken in and which the forget's rev would write over. On a later gate call, such a decision and a hand edit the take-in refuses are left as they are and named, every read dropping their lines. The index build, read and verify (a doc at any rev they read) and a final decision's HEAD read drop the same lines, so a doc the apply hasn't rewritten yet reads as it will, and one the rule removes reads as forgotten. The forget's commit carries a Doc: <id> rev <n> line for each doc it rewrote."
    binds:
      - A forget leaves no line whose anchors or refs lead to a forgotten record.
      - An anchor is judged by where it reads (DR-0370), not by the rid it names.
      - A forget never changes a decision's status or links.
    not_chosen:
      - "Flagging the lines built on a dropped line and leaving them (DR-0542): their words stay in the tree, the index and search until each brief is rebuilt."
      - "Hiding them in reads until the next rev: the text stays in the tree and reaches every clone's pull."
      - "Judging an anchor by the rid it names: a forgotten transcript would leave every note line on its recording's times, and the next put of that note would be refused."
      - "Removing a final decision left with no evidence: what it superseded would read as current again."
