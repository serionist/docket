# The glossary: the words this repo uses with one meaning, one entry per term in alphabetical order. Entries change
# only through `uv run docs`; docs/docs-regime.md explains the schema.

terms:
  - term: alias
    definition: "Another way an entity is written or said: a nickname, a handle, a former name, or (kind asr) how speech recognition mangles it. Matched into every chunk."
    see: [packages/docket/src/docket/vault/entities.py]
  - term: anchor
    definition: "What ends a line of a processed doc and points at the raw it came from: @mm:ss in a doc covering one record, [r:<rid>@mm:ss], [r:<rid>#n] or [r:<rid>] across records."
    see: [packages/docket/src/docket/vault/anchors.py]
  - term: autonomy grant
    definition: "The maintainer's word that an agent runs a piece of work to its merge without asking. Every choice it would have asked about is recorded: as a proposed decision, and in the PR's Decided without asking."
    see: [.claude/skills/start-work/SKILL.md]
  - term: boost
    definition: "A person or entity a search favours: chunks that mention it rank higher, and none are dropped for not mentioning it, since a speaker without a label would otherwise hide the answer. The people and entities parameters of search, and the Search page's person and entity facets."
    see: [packages/docket/src/docket/index/query.py]
    close_terms: [facet]
  - term: capture
    definition: "One thing a run brought in: a source tool's result exactly as the tool gave it, posted by the capture hook, or a file from an import folder. A mapper reads captures; Claude never retypes them."
    see: [packages/docket/src/docket/sources/contract.py]
  - term: chunk
    definition: "The unit search finds: a stretch of a transcript, a message, a thread window, part of a record, or a section of a processed doc, with the locator read takes."
    see: [packages/docket/src/docket/index/chunks.py]
  - term: deny list
    definition: The private list of names this public repo must never carry, kept outside it (~/.config/docket-dev/denylist.txt, and a secret in CI). A name matches as whole words, across a line break too.
    see: [tools/devkit/src/devkit/content.py]
  - term: door
    definition: "What `uv run docs door <path>` prints: the reading list from the root down to a path, and how many decisions and conventions bind it. Read it before planning, changing or reviewing the path."
    see: [AGENTS.md]
  - term: entity
    definition: "A person, customer, project, site or term Docket knows by name: one YAML file under entities/, with its names, aliases and ids."
    see: [packages/docket/src/docket/vault/entities.py]
    close_terms: [entry (a structured doc)]
  - term: entry
    definition: A decision, convention, term or reading line, kept as YAML and changed only through the docs tool.
    see: [docs/docs-regime.md]
    close_terms: [record (a dated plan or review)]
  - term: facet
    definition: "A list beside the Search page's results that narrows or favours the search by one of its parameters: sources and time narrow, people and entities favour. Its counts are over the candidates search ranked."
    see: [packages/docket/src/docket/web/views.py]
    close_terms: [boost]
  - term: gate
    definition: The one set of checks every change passes, `uv run gate`. The quick lane runs in seconds before every push; `gate full` is the merge rule.
    see: [tools/devkit/src/devkit/gate.py]
    close_terms: [staging gate (the vault's)]
  - term: hold list
    definition: "state/holds/<source>.txt in the vault: ids of records Docket must not stage yet, such as recordings with stretches the owner left out. Every ingest and the gate read it, failing closed."
    see: [packages/docket/src/docket/vault/holds.py]
  - term: host repo
    definition: "The user's own git repo a folder vault lives in: Docket commits only the vault's paths there, locally, and the user's own git moves it. Docket's private files sit under its git dir, in docket/<vault path>/."
    see: [packages/docket/src/docket/vault/home.py]
    close_terms:
      - consuming project (the repo the plugin and source skills run in; often the same repo)
  - term: legacy note
    definition: "A processed doc of type legacy-note made from a note that existed before Docket: its body is the note's text, it may cover no record, and it keeps the note's old paths so references to them still resolve."
    see: [old path]
  - term: locator
    definition: "What read takes: a doc's id or path, or a record part such as r:<rid>@12:08, the same in brackets, or a bare rid."
    see: [packages/docket/src/docket/vault/anchors.py]
  - term: mapper
    definition: "A source's code in the consuming project, map_run(run) in .claude/skills/sources/<source>/mapper.py: a run's captures and manifest in, records in the core's shape out, as plain JSON. Docket runs it in its own process and checks what it returns."
    see: [packages/docket/src/docket/sources/contract.py]
  - term: mention
    definition: "A chunk naming an entity: by an alias in its text, its speaker or author, or its doc's entities. Mentions lift search results; they never filter them."
    see: [packages/docket/src/docket/index/matching.py]
  - term: old path
    definition: The path other files cite a legacy note by, from the root of the repo its folder was in, such as notes/calls/x.md; read takes it, with an optional @mm:ss.
    see: [legacy note, locator]
  - term: one-way door
    definition: Something users or their stored data depend on, such as a name, the vault's format or an MCP tool. It changes only with the maintainer's agreement, in a PR that names it.
    see: [AGENTS.md]
  - term: processed doc
    definition: "A summary, note, digest, brief or minutes in the vault: markdown with frontmatter naming the raw records it covers, every line ending with its anchors, written through doc_put."
    see: [packages/docket/src/docket/vault/processed.py]
    close_terms: [raw record (what it is built from)]
  - term: proposals file
    definition: "What the cuts skill writes for docket hold release, in a temp folder outside any repo: per held id, the time ranges to cut and the records to keep, or why it stays held. A proposal, never a confirmation."
    see: [plugin/skills/cuts/SKILL.md]
  - term: reference source
    definition: "A source Docket keeps working and tested in CI as an example to copy, never a dependency: Plaud, under examples/sources/plaud. docket source new --example copies it."
    see: [examples/sources/plaud/SKILL.md]
  - term: release
    definition: "Letting a held recording into the vault with the cuts its owner confirmed: they type back a code at their own console for each recording, the release line is committed, then the id leaves the hold list."
    see: [packages/docket/src/docket/sources/release.py]
  - term: release log
    definition: "state/releases/<source>.jsonl in the vault: each released id with its cuts in milliseconds and the records kept as they read, merged by union. The gate cuts a released recording by it wherever it is staged."
    see: [packages/docket/src/docket/vault/releaselog.py]
  - term: run manifest
    definition: "What a source skill sends when its run ends: the run's id, how many captures it made, its window and what it skipped. A run closes only when Docket holds every capture it counts."
    see: [packages/docket/src/docket/sources/contract.py]
  - term: scaffold
    definition: "What docket source new writes into the consuming project for a source: its skill, its mapper and their tests under .claude/skills/sources/<source>/, from Docket's blank template or a reference source."
    see: [packages/docket/src/docket/sources/scaffold.py]
  - term: segment
    definition: "One utterance of a transcript: where it starts and ends in milliseconds from the record's start, who spoke, and what was said."
    see: [packages/docket/src/docket/vault/segments.py]
  - term: service
    definition: The one Docket process per user, started at logon, that serves the MCP endpoint, the REST API and the web app on one 127.0.0.1 port and runs its writes one at a time. docket serve runs it; docket service install registers it.
    see: [packages/docket/src/docket/service/__init__.py]
  - term: session link
    definition: "The one-time link docket open asks the service for: good once and for a minute, it starts a browser session that lasts 12 hours at most and ends when the service stops."
    see: [packages/docket/src/docket/service/sessions.py]
  - term: staging gate
    definition: "The checks every record passes on its way from a connector to the raw log: the never-store lists, the source rules, classification, cuts and redaction. Records wait in the vault's staging/ folder, never committed."
    see: [packages/docket/src/docket/vault/gate.py]
    close_terms: [gate (the development checks)]
  - term: status hook
    definition: "The plugin's SessionStart hook: docket hook session-start tells Claude the service's state, the vault's and the port at each session's start, and the user only what needs them."
    see: [packages/docket/src/docket/hooks.py]
  - term: vault
    definition: "Where Docket keeps a user's data, private and in git: by default a folder of the repo the user already works in, or a repo of its own. It holds raw records written once, encrypted media, processed docs, entities and the ledger, and is never part of this repo."
