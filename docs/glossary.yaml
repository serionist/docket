# The glossary: the words this repo uses with one meaning, one entry per term in alphabetical order. Entries change
# only through `uv run docs`; docs/docs-regime.md explains the schema.

terms:
  - term: alias
    definition: "Another way an entity is written or said: a nickname, a handle, a former name, or (kind asr) how speech recognition mangles it. Matched into every chunk."
    see: [packages/docket/src/docket/vault/entities.py]
  - term: anchor
    definition: "What ends a line of a processed doc and points at the raw it came from: @mm:ss in a doc covering one record, [r:<rid>@mm:ss], [r:<rid>#n] or [r:<rid>] across records."
    see: [packages/docket/src/docket/vault/anchors.py]
  - term: autonomy grant
    definition: "The maintainer's word that an agent runs a piece of work to its merge without asking. Every choice it would have asked about is recorded: as a proposed decision, and in the PR's Decided without asking."
    see: [.claude/skills/start-work/SKILL.md]
  - term: chunk
    definition: "The unit search finds: a stretch of a transcript, a message, a thread window, part of a record, or a section of a processed doc, with the locator read takes."
    see: [packages/docket/src/docket/index/chunks.py]
  - term: deny list
    definition: The private list of names this public repo must never carry, kept outside it (~/.config/docket-dev/denylist.txt, and a secret in CI). A name matches as whole words, across a line break too.
    see: [tools/devkit/src/devkit/content.py]
  - term: door
    definition: "What `uv run docs door <path>` prints: the reading list from the root down to a path, and how many decisions and conventions bind it. Read it before planning, changing or reviewing the path."
    see: [AGENTS.md]
  - term: entity
    definition: "A person, customer, project, site or term Docket knows by name: one YAML file under entities/, with its names, aliases and ids."
    see: [packages/docket/src/docket/vault/entities.py]
    close_terms: [entry (a structured doc)]
  - term: entry
    definition: A decision, convention, term or reading line, kept as YAML and changed only through the docs tool.
    see: [docs/docs-regime.md]
    close_terms: [record (a dated plan or review)]
  - term: gate
    definition: The one set of checks every change passes, `uv run gate`. The quick lane runs in seconds before every push; `gate full` is the merge rule.
    see: [tools/devkit/src/devkit/gate.py]
    close_terms: [staging gate (the vault's)]
  - term: legacy note
    definition: "A processed doc of type legacy-note made from a note that existed before Docket: its body is the note's text, it may cover no record, and it keeps the note's old paths so references to them still resolve."
    see: [old path]
  - term: locator
    definition: "What read takes: a doc's id or path, or a record part such as r:<rid>@12:08, the same in brackets, or a bare rid."
    see: [packages/docket/src/docket/vault/anchors.py]
  - term: mention
    definition: "A chunk naming an entity: by an alias in its text, its speaker or author, or its doc's entities. Mentions lift search results; they never filter them."
    see: [packages/docket/src/docket/index/matching.py]
  - term: old path
    definition: The path other files cite a legacy note by, from the root of the repo its folder was in, such as notes/calls/x.md; read takes it, with an optional @mm:ss.
    see: [legacy note, locator]
  - term: one-way door
    definition: Something users or their stored data depend on, such as a name, the vault's format or an MCP tool. It changes only with the maintainer's agreement, in a PR that names it.
    see: [AGENTS.md]
  - term: processed doc
    definition: "A summary, note, digest, brief or minutes in the vault: markdown with frontmatter naming the raw records it covers, every line ending with its anchors, written through doc_put."
    see: [packages/docket/src/docket/vault/processed.py]
    close_terms: [raw record (what it is built from)]
  - term: segment
    definition: "One utterance of a transcript: where it starts and ends in milliseconds from the record's start, who spoke, and what was said."
    see: [packages/docket/src/docket/vault/segments.py]
  - term: staging gate
    definition: "The checks every record passes on its way from a connector to the raw log: the never-store lists, the source rules, classification, cuts and redaction. Records wait in the vault's staging/ folder, never committed."
    see: [packages/docket/src/docket/vault/gate.py]
    close_terms: [gate (the development checks)]
  - term: vault
    definition: "Where Docket keeps a user's data, private and in git: by default a folder of the repo the user already works in, or a repo of its own. It holds raw records written once, encrypted media, processed docs, entities and the ledger, and is never part of this repo."
