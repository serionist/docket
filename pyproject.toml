# The uv workspace: the app's packages, the connector packages and the development kit. The root is not a package;
# `uv sync` installs every member into one .venv for development. AGENTS.md says how to build and test.
[tool.uv]
package = false
required-version = ">=0.12"

[tool.uv.workspace]
members = ["packages/*", "tools/devkit"]

[tool.uv.sources]
docket = { workspace = true }
docket-devkit = { workspace = true }

[dependency-groups]
dev = [
  "docket",
  "docket-devkit",
  "ruff==0.16.10",
  # The web app's browser smoke test; it drives the system's Chrome or Edge and never downloads a browser.
  "playwright==1.63.0",
  "pyright[nodejs]==1.1.414",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  # The history rewrite a forget writes is run by the tests in a fresh clone (DR-0594); never the app's dependency.
  "git-filter-repo==2.47.0",
  # The models' worker runs in an environment of its own (DR-0332); its backend is type-checked and tested here on the
  # CPU builds, pinned at least a week old (DR-0157). ONNX Runtime 1.30 ships no Intel Mac build.
  "onnxruntime==1.31.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
  "tokenizers==0.23.2",
  "numpy==2.5.3",
  "types-defusedxml==0.7.0.20260504",
  "types-openpyxl==3.1.5.20260827",
  "types-PyYAML==6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "C4", "PTH", "PL", "N", "RET", "TID"]
ignore = [
  "PLR0911", # too many returns: a dispatcher reads better with them
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic values: the regime's limits are named where they are read
]

[tool.ruff.lint.per-file-ignores]
# The dev kit's whole job is running git, uv and the checkers.
"tools/devkit/src/**" = ["S603", "S607"]
# The app runs git (and gh in the setup wizard) with argument lists, never a shell.
"packages/docket/src/docket/vault/**" = ["S603", "S607"]
"**/tests/**" = ["S101", "S603", "S607", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["docket", "devkit"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["packages", "tools/devkit", "examples"]
exclude = ["**/.venv", "**/__pycache__", "tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["packages/*/src", "tools/devkit/src"]
reportMissingTypeStubs = false
# The Plaud example's tests import their payload builders by name, as they do once copied into a project.
extraPaths = ["packages/docket/tests", "examples/sources/plaud/tests"]

[tool.pytest.ini_options]
# The reference sources' tests run in CI like the app's (DR-0101): an example nobody runs drifts from the contract.
testpaths = ["packages", "tools/devkit/tests", "examples"]
# The app tests' shared builders (docket_testkit) import by name; test folders are not packages.
pythonpath = ["packages/docket/tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
  "perf: asserts an elapsed time; a lane without coverage runs it after the rest, alone (DR-0430)",
  "osprompt: calls the system's own prompt checks; skipped unless DOCKET_TEST_OSPROMPT is set, as only CI sets it",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
# Lines through sys.monitoring, which on Python 3.12 measures no branches: the floors are line coverage, and the C
# tracer that branches need made CPU-bound tests 75% slower (DR-0698).
branch = false
core = "sysmon"
source_pkgs = ["docket", "devkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
