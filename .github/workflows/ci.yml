# The gate on every pull request and every push to main. Linux runs `gate full`, which is the merge rule: lint, format,
# types, the docs, commit messages and the PR title, private names, secrets over the whole history, the harness and the
# plugin validated by Claude Code, and the tests with their coverage floors. Windows and macOS run the types and the
# tests (`gate os`), so a change that only works on one system fails here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-message and secret steps read the branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      # The full gate validates the plugin and the marketplace with Claude Code itself.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.285
      - name: Install
        run: uv sync --locked
      # The private names the repo must never carry live in a secret, not in the repo. Pull requests from forks and
      # Dependabot don't get it, and the gate then says it skipped the check.
      - name: The private deny list
        env:
          DENYLIST: ${{ secrets.DOCKET_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            echo "DOCKET_DENYLIST=$RUNNER_TEMP/denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: Gate
        run: uv run gate full

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Types and tests
        run: uv run gate os
