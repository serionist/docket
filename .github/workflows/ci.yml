# The gate on every pull request and every push to main. Linux runs `gate full`, which is the merge rule: lint, format,
# types, the docs, commit messages, private names, secrets over the whole history, the harness and the
# plugin validated by Claude Code, and the tests with their coverage floors. Windows and macOS run the types and the
# tests (`gate os`), Windows in two halves, so a change that only works on one system fails here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-message and secret steps read the branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      # The full gate validates the plugin and the marketplace with Claude Code itself.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.285
      - name: Install
        run: uv sync --locked
      # The private names the repo must never carry live in a secret, not in the repo. Pull requests from forks and
      # Dependabot don't get it, and the gate then says it skipped the check.
      - name: The private deny list
        env:
          DENYLIST: ${{ secrets.DOCKET_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            echo "DOCKET_DENYLIST=$RUNNER_TEMP/denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: Gate
        run: uv run gate full

  # Windows runs the tests in two halves, each on a runner of its own: the runner's four vCPUs are busy for the whole
  # parallel run, so more workers on one don't help, and each of its git calls costs about 40 ms (DR-0495). The first
  # half runs the types too. A half keeps its test files whole, so its timed tests run alone after its own parallel run.
  windows-halves:
    name: Tests (Windows, ${{ matrix.half }} of 2)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { half: 1, gate: "--shard 1/2" }
          - { half: 2, gate: "--only tests --shard 2/2" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # The tests' temp folders on the Windows runner's D:, its local disk: the tests write thousands of small git repos,
      # and on C:, its OS disk, the same parallel run took 24 to 44% longer (DR-0493).
      - name: Temp on the local disk
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # The runner's Storage Service off: toward the end of the parallel run it took a whole vCPU of four for about a
      # minute, beside the timed tests on some runs (DR-0494).
      - name: No Storage Service beside the timed tests
        shell: pwsh
        run: |
          Set-Service StorSvc -StartupType Disabled
          Stop-Service StorSvc -Force
      - name: Types and tests
        run: uv run gate os ${{ matrix.gate }}

  # The check the merge rule names: Windows passes when both its halves pass, and fails when either fails or is
  # skipped.
  windows:
    name: Tests (Windows)
    needs: windows-halves
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          HALVES: ${{ needs.windows-halves.result }}
        run: test "$HALVES" = success

  tests:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Types and tests
        run: uv run gate os

  # The models for real: `docket models install --device cpu` builds the worker's environment and fetches the
  # embedder's pinned files, which come from the cache when they can; a miss downloads them, so an outage of the hub
  # holds merges until it ends. Linux runs the question set with the embedder, and with the CPU reranker, against floors
  # of their own (`gate models`, DR-0339, DR-0458); Windows and macOS start the worker and check what it says, and the
  # install's timing is what runs the real reranker there, since those runners time it off. Required for merge.
  models:
    name: Models (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux, floors: true }
          - { os: windows-latest, name: Windows, floors: false }
          - { os: macos-latest, name: macOS, floors: false }
    # uv's own Python, whose SQLite loads extensions on every system: some runners' own Pythons can't, and search goes
    # without vectors there (DR-0337). The install refuses such a Python, so this job checks the README's advice.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # The CUDA environment's hashed requirements resolve on the systems that run it, reading the index's metadata and
      # downloading no wheel: a universal compile once pinned nvidia-cublas 13.8.1.7, which has no Windows wheel
      # (#109). The gate's pins check catches that offline from tools/devkit/models-wheels.json; this asks the index.
      - name: The CUDA environment resolves
        if: matrix.name != 'macOS'
        run: >-
          uv pip install --dry-run --require-hashes --python 3.12 --target "${{ runner.temp }}/cuda-resolve"
          -r packages/docket/src/docket/models/requirements-cuda.txt
      # Only the model files: the environment is rebuilt each run, since it points at the runner's own Python.
      - name: The model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docket-models/files
          key: docket-models-${{ hashFiles('packages/docket/src/docket/models/catalogue.py') }}
      # The runner context, which names the temp folder, reaches steps only.
      - name: The models
        env:
          DOCKET_MODELS_DIR: ${{ runner.temp }}/docket-models
          DOCKET_CONFIG_DIR: ${{ runner.temp }}/docket-config
        run: uv run docket models install --device cpu
      - name: The question set with the embedder and the reranker
        if: matrix.floors
        env:
          DOCKET_TEST_MODELS: ${{ runner.temp }}/docket-models
        run: uv run gate models
      - name: The worker
        if: ${{ !matrix.floors }}
        env:
          DOCKET_MODELS_DIR: ${{ runner.temp }}/docket-models
          DOCKET_CONFIG_DIR: ${{ runner.temp }}/docket-config
        run: uv run docket models status --check
      # The vector stage and the index's vectors with the fake embedder, never skipped here.
      - name: Vectors in search
        env:
          DOCKET_TEST_VECTORS: "1"
        run: >-
          uv run pytest -q -p no:cacheprovider packages/docket/tests/test_search_vectors.py
          packages/docket/tests/test_index_vectors.py packages/docket/tests/test_service_models.py

  # The service registered for real on each system, killed, back again, stopped and uninstalled, under a name of its
  # own and on a temp vault. A runner whose user session can't hold the registration skips it, and the PR says which ran.
  service:
    name: Service install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # A systemd user instance needs the user to linger, and its bus to be found.
      - name: A systemd user instance
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install, kill, wait, stop and uninstall
        env:
          DOCKET_TEST_LIVE_SERVICE: "1"
        run: uv run pytest packages/docket/tests/test_service_install_live.py -v -rs -p no:cacheprovider

  # The web app in a real browser: the runner's own Chrome, which Playwright drives without downloading a browser. It
  # sees what render tests can't (a CSP violation, a swap that doesn't happen, a key that does nothing); its
  # screenshots are kept with the run.
  web:
    name: Web app in Chrome (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Search, Sync, Staging, Curate, Settings, the keys and a lapsed session, in Chrome
        env:
          DOCKET_TEST_BROWSER: chrome
          DOCKET_TEST_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: uv run pytest packages/docket/tests/test_web_browser.py -v -rs -p no:cacheprovider
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
