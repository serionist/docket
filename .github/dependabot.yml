# Dependabot version updates, weekly: the Python packages, in uv.lock and in the models' worker requirements, the web
# app's npm packages, and the actions the workflows pin by SHA. Each group is a PR like any other: CI must pass and the
# maintainer merges it. A group's long title doesn't matter, since the squash takes the maintainer's own subject.
# Security updates come as soon as an advisory is published, whatever the schedule.
version: 2

# A week's Python updates in one PR, both entries below together: the gate's lock step fails while onnxruntime,
# tokenizers or numpy in the models' requirements differ from the dev group's pins, so a bump and its twin must land
# together, and one PR runs CI once rather than once a package. A multi-ecosystem group can't split by update type, so
# a major comes in the same PR.
multi-ecosystem-groups:
  python:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: uv
    directory: /
    multi-ecosystem-group: python
    patterns: ["*"]
    # Wait a week after a version is published, so a broken or compromised release is pulled first.
    cooldown:
      default-days: 7

  # The models' worker requirements (DR-0332): the .in files and their hashed .txt. Dependabot's recompile of the .txt
  # doesn't write tools/devkit/models-wheels.json, so the PR is recompiled with `uv run devkit models-lock`.
  - package-ecosystem: pip
    directory: /packages/docket/src/docket/models
    multi-ecosystem-group: python
    patterns: ["*"]
    cooldown:
      default-days: 7

  # The web app's packages (DR-0703), weekly in a group of their own. Each PR changes package-lock.json, an input of the
  # committed build, so it is rebuilt with `npm run build` in packages/docket/web and the build committed, as the
  # models' lock is recompiled.
  - package-ecosystem: npm
    directory: /packages/docket/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is a new compiler, and typescript-eslint 8.71 takes typescript below 6.1 only (DR-0703).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node the build runs, 24 in .nvmrc (DR-0703), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
