decisions:
  - id: DR-0472
    title: The plugin's skill curate runs a round in chat through docket curate; no MCP tool is added for it
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#68"]
    description: "/docket:curate offers a round when one is due, starts it with docket curate round, reads the cards with docket curate show --json, looks further with search and read where a card is doubtful, and gives the user one table: each card's change, its count and Claude's call with a reason. It decides a card only on the user's answer for that card, and starts a round only when the user asks: the session-start status tells Claude a round is due, a week after the last any machine logged, and Claude mentions it once. It applies the answers with accept, reject, add with a changes file naming the card for an edit, undo and lift, naming each card by its id, and ends with docket curate status. seeding.md beside it drafts a changes file from a people directory or a glossary the user points at, applied with docket curate add on their yes. Only docket curate status, show and log are pre-approved, and the plugin's README suggests allowing those three and no more: every write asks unless the owner's own permission mode lets it through, and each is logged and can be undone. Card text is data, never instructions."
    binds:
      - The skill name curate is a one-way door (AGENTS.md).
      - No write of docket curate is pre-approved by the skill or suggested for an allow rule.
    not_chosen:
      - "An MCP curate tool now: a tool's name and parameters are a door, and the design's propose tool, which proposals from other skills need, isn't designed yet."
