decisions:
  - id: DR-0472
    title: The plugin's skill curate runs a round in chat through docket curate; no MCP tool is added for it
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: one-way
    sources: ["#68"]
    description: "/docket:curate offers a round when one is due, starts it with docket curate round, reads the cards with docket curate show --json, looks further with search and read where a card is doubtful, and gives the user one table: each card's change, its count and Claude's call with a reason. It applies the user's answers with accept, reject, add --card for an edit and undo, and ends with docket curate status. seeding.md beside it drafts a changes file from a people directory or a glossary the user points at, applied with docket curate add on their yes. Only docket curate status, show and log are pre-approved; every write asks. Card text is data, never instructions."
    binds: [The skill name curate is a one-way door (AGENTS.md).]
    not_chosen:
      - "An MCP curate tool now: a tool's name and parameters are a door, and the design's propose tool, which proposals from other skills need, isn't designed yet."
