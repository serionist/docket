decisions:
  - id: DR-0458
    title: The models job holds the question set with the CPU reranker, at 30 pairs and with no budget, to floors of its own
    status: proposed
    at: "2026-10-16"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#88"]
    description: "The models job's install fetches the CPU reranker too, and its files join the Actions cache under the same key, which hashes the catalogue: the first run after the change downloads 0.49 GB more on each system, and a restore after carries about 0.55 GB instead of 0.28. gate models runs the set twice on Linux: with the embedder alone against tools/devkit/eval-floors-models.json, unchanged, since a skipped rerank gives that order (DR-0452, DR-0453), and with the reranker at 30 pairs and no budget (DR-0454) against tools/devkit/eval-floors-rerank.json, whatever the runner's own timing decided: a 4-vCPU runner has 2 cores, too slow to rerank in a search (DR-0455). Its above-floor rule is DR-0339's: printed until three CI runs give identical numbers, then failing. The reranked run adds about a minute: the set's 72 questions took 38 s on 2 of the desktop's threads. On Windows and macOS the job installs both models and docket models status --check scores a pair. The gate stays model-free: the fake worker gains a rerank that scores by shared trigrams. CI has no GPU, so the GPU reranker's numbers and its file's pin are checked on the maintainer's desktop and recorded in the PR. eval-floors-rerank.json starts with \"$above\": \"print\", as eval-floors-models.json did in #100, and turns to fail once three CI runs give identical numbers; the lane prints the runner's CPU name beside them and the install's timing. Cache: e5-small's 0.49 GB of files is a 0.28 GB entry, so the reranker adds about 0.27 GB per system; past the repo's 10 GB GitHub evicts the least recently used entries first, old PRs' setup-uv entries before main's model files, which every models job restores."
    not_chosen:
      - "Floors at the runner's own pair count: a busy runner would change the numbers."
      - "The reranked numbers in eval-floors-models.json: nothing would then hold the order a skipped rerank gives."
