decisions:
  - id: DR-0755
    title: "The coverage floors stay per module, and only the owner lowers one: the gate refuses a lower floor without a decided decision"
    status: proposed
    at: "2026-10-20"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#266", DR-0753]
    supersedes: [DR-0011]
    description: "The coverage floors stay per module in tools/devkit/coverage-floors.json, 100% for docket and 90% for devkit, rising with the measure as DR-0011 had them: the cut in #266 keeps every test that is the only runner of a line on Windows or on Linux, so the kept suite measures what today's does, and DR-0753 lets a floor come down only for a cut of 80% or more, which this one isn't. What changes is who can lower one. The gate holds each floor against the merge base's, in gate full on its one run and in gate coverage on CI's shares combined: a floor below the base's fails unless the file's $lowered names, for that module, a decision whose status is decided and whose title, description or binds say the new floor in so many words, as <module> at <n>% or <module>'s floor at or to <n>%: a module and a number apart, as a cut of 80% beside docket's processes, set no floor. The base's own $lowered doesn't cover another lowering, so a gain earned since can't be given back unseen. An agent's decision stays proposed until the owner confirms it, so only the owner lowers a floor. The citation sits in the floors file beside the number: it is in the diff, the gate reads it the same way on a laptop, in a PR's run and on main's push after the squash, and the docs check holds the id to a living entry. A merge base the clone can't read fails, so a shallow checkout can't pass a lowered floor; without a base, as on main itself, there is nothing to hold. The rest of DR-0011 stands: ruff lints and formats at 120 columns, pyright checks every package and runs strict on each src/ folder, pytest runs the tests, and packages build with uv_build."
    binds:
      - A floor below the merge base's fails the gate unless coverage-floors.json's $lowered names, for its module, a decided decision of its own lowering that says the new floor, as <module> at <n>%.
    not_chosen:
      - "One floor of 90% for the whole repo: the cut keeps every line, so it would only loosen the check, and DR-0753 ties a lower floor to a cut of 80% or more."
      - "A floor per file: the same ask of every line, file by file."
      - "The decision cited in the PR body: a local gate full has no PR to read, and an edit of the body doesn't run the tests' gate again."
      - "A commit trailer: main's commit is the squash, written from the PR, so main's own run would lose the trailer and go red."
      - "The decision files the PR changes: one the owner decided in an earlier PR would count for nothing, and which changed entry sets which floor would be a guess."
