decisions:
  - id: DR-0746
    title: Each PR runs the whole suite on Linux, and on Windows and macOS the OS-sensitive files and a smoke set; the whole suite runs on all three nightly, on demand, on a label and before a release
    status: decided
    at: "2026-10-20"
    by: Soma Osvay
    cost: medium
    sources: ["#266", "20 Oct, in chat"]
    supersedes: [DR-0223, DR-0698]
    description: "A PR's CI runs the whole suite on Linux, under coverage, in shares split by recorded file times, and Gate (Linux) holds the coverage floor on every share's data combined (`gate coverage`). Windows and macOS run, on every PR and every push to main, only what can differ by system: each test file marked OS-sensitive (paths, git, the keyring, file locks, the service install, the hooks, the OS prompts, encodings and line endings, case-insensitive file systems, long paths), marked generously, a file in doubt counted in; and a smoke set that touches every surface once on each system: each CLI command group, the service started and answering, each MCP tool, each web page in the browser, a sync run with an ingest, a forget, the ledger's import and a vault with media in git-lfs. A platform break in code that runs the same everywhere still shows on the PR through the smoke set. The whole suite runs on all three systems nightly on main, on demand (workflow_dispatch), on a PR labelled full-matrix and on a release tag, and a release needs it green; a red nightly opens an issue, or adds to the one still open. The shares keep DR-0698's rules: the files split by tools/devkit/test-weights.json, each file whole in one share, both pytest runs of a share on the same files, each check the merge rule names failing when a share it stands for fails or doesn't run, and the floor held on all shares' data together. Before this a run spent 76.7 runner-minutes on tests, 66.2 of them on Windows and macOS (run 39426959882, main at d9acb0f), mostly on code that runs the same on every system. DR-0698's other choices stand too: coverage measures lines through sys.monitoring with branches off (core = \"sysmon\"), since the floor is line coverage and the C tracer branches need made a CPU-bound test 75% slower; each push to main runs in a concurrency group of its own; the live service test asks the Windows task to repeat every minute; and the OS prompt and the service install share one job per system. From DR-0223, what stands: a lane with tests starts them first and runs its other steps beside them, printing each step's line in the usual order, and the tests step prints the 15 slowest tests on every run."
    binds:
      - A test file that can differ by system runs on Windows and macOS on every PR; in doubt, it does.
      - Every CLI command group, MCP tool and web page has a smoke test that runs on all three systems on every PR.
      - A red nightly opens an issue or adds to the open one, and a release needs the full matrix green.
      - A share keeps its test files whole, and both pytest runs of a share keep the same files.
      - Each check the merge rule names fails when a share it stands for fails or doesn't run.
      - The coverage floor is held on every share's data combined, never on one share's.
      - The shard plugin loads from the root conftest.py, never with -p, and gate full runs its tests as one share, 1/1.
    not_chosen:
      - "The whole suite on every system on every PR, as before: 66 of a run's 77 test runner-minutes went to Windows and macOS, 55% of them on files that run the same code everywhere."
      - "Windows and macOS only nightly: a platform break would merge and show the next morning."
      - "Fewer shares on a PR and the rest on main, DR-0698's open option: a PR would merge untested on part of a system, where the smoke set runs every surface on each."
