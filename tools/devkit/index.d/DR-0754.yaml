decisions:
  - id: DR-0754
    title: Each PR runs the whole suite on Linux, and on Windows and macOS the OS-sensitive files and a smoke set; the whole suite runs on all three nightly, on demand, on a label and before a release
    status: proposed
    at: "2026-10-20"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#266", DR-0753]
    description: "How the owner's \"make sure it works across OSes\" (DR-0753) runs in CI. A PR's CI runs the whole suite on Linux, under coverage, in shares split by recorded file times, and Gate (Linux) holds the coverage floors on every share's data combined (`gate coverage`). Windows and macOS run, on every PR and every push to main, only what can differ by system: each test file tools/devkit/test-systems.json lists as OS-sensitive (paths, git, the keyring, file locks, the service install, the hooks, the OS prompts, encodings and line endings, case-insensitive file systems, long paths, the index's file times, SQLite's FTS5 build), listed generously, a file in doubt counted in; and a smoke set that touches every surface once on each system: each CLI command group, the service started and answering, each MCP tool, each web page in the browser, a sync run with an ingest, a forget, the ledger's import and a vault with media in git-lfs. The list is per file, so a system-dependent case added to an unlisted file isn't caught by the list itself: the gate fails an unlisted test file that names sys.platform, os.name or platform.system, skips by system, or makes links, file modes or file times, and review-code asks the question for the rest. The whole suite runs on all three systems nightly on main (schedule), on workflow_dispatch, on a PR labelled full-matrix (labeled, and every synchronize while the label is on) and on a v* tag, in a concurrency group of its own so it never cancels a PR's run. A red scheduled run opens one issue per distinct set of failing tests, labelled nightly, or comments on the open issue for the same set; the label is made with the workflow. A release needs the full matrix green on its commit; there is no release workflow yet, so this binds the first one. The shares keep DR-0698's rules: the files split by tools/devkit/test-weights.json, each file whole in one share, both pytest runs of a share on the same files, each check the merge rule names failing when a share it stands for fails or doesn't run, and the floors held on all shares' data together. DR-0698's other choices stand too: coverage measures lines through sys.monitoring with branches off (core = \"sysmon\"), since the floor is line coverage and the C tracer branches need made a CPU-bound test 75% slower; each push to main runs in a concurrency group of its own; the live service test asks the Windows task to repeat every minute; and the OS prompt and the service install share one job per system. From DR-0223, what stands: a lane with tests starts them first and runs its other steps beside them, printing each step's line in the usual order, and the tests step prints the 15 slowest tests on every run. Before this a run spent 76.7 runner-minutes on tests, 66.2 of them on Windows and macOS (run 39426959882, main at d9acb0f), half of that on files that run the same code on every system."
    binds:
      - A test file that can differ by system runs on Windows and macOS on every PR; in doubt, it does.
      - An unlisted test file that names the system, skips by it, or makes links, modes or file times fails the gate.
      - Every CLI command group, MCP tool and web page has a smoke test that runs on all three systems on every PR.
      - A red scheduled run opens an issue per distinct set of failing tests, and a release needs the full matrix green.
      - A share keeps its test files whole, and both pytest runs of a share keep the same files.
      - Each check the merge rule names fails when a share it stands for fails or doesn't run.
      - The coverage floors are held on every share's data combined, never on one share's.
      - The shard plugin loads from the root conftest.py, never with -p, and gate full runs its tests as one share, 1/1.
    not_chosen:
      - "The whole suite on every system on every PR, as before: 66 of a run's 77 test runner-minutes went to Windows and macOS, 55% of them on files that run the same code everywhere."
      - "Windows and macOS only nightly: a platform break would merge and show the next morning."
      - "Fewer shares on a PR and the rest on main, DR-0698's open option: a PR would merge untested on part of a system, where the smoke set runs every surface on each."
