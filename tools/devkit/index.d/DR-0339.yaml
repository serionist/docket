decisions:
  - id: DR-0339
    title: The gate stays model-free; a required models job in CI runs the question set with the embedder on a CPU against floors of its own
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#67"]
    description: "The gate's lanes run the question set keyword-only against eval-floors.json (DR-0295), and test the worker, the vector stage and the fusion with a stdlib-only fake worker that gives deterministic vectors. The worker's ONNX Runtime backend is checked like any module under src: strict pyright and its coverage floor, against a stubbed session, with the CPU builds of onnxruntime, tokenizers and numpy in the dev group. A models job installs the CPU models for real on Linux, Windows and macOS, with the embedder's files cached by the catalogue that pins them and the environment built again each run, since it points at the runner's own Python. On Linux it runs the set with DOCKET_TEST_MODELS through a lane of its own, gate models, against tools/devkit/eval-floors-models.json; on Windows and macOS it starts the worker and checks what it says. The job is required for merge. A kind below its floor fails; a kind above it fails only once the file says \"$above\": \"fail\", which it says when three CI runs have given identical numbers, and until then the lane says which floor to raise. A cache miss downloads the pinned revision, so a Hugging Face outage blocks merges until it ends. On the maintainer's desktop three CPU runs gave identical numbers, and the CPU matched the GPU row for row."
    not_chosen:
      - "A tiny model in the gate: its numbers say nothing about the model users run."
      - "Floors from the maintainer's GPU: not reproducible in CI."
      - "The gate's eval with vectors whenever a model is cached: one commit would pass on one machine and fail on another."
      - "The backend left out of the type and coverage checks: a check loosened."
