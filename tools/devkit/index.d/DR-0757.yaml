decisions:
  - id: DR-0757
    title: A few timed budgets run on every PR; the budgets on big vaults run nightly on all three systems
    status: proposed
    at: "2026-10-20"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#266", DR-0753]
    description: "The timed tests that time small work keep running on every PR on all three systems, alone after the rest in gate os (DR-0430): a redaction's linear time, a helper left holding its output, a write's STATUS.md render, a rerank's budget, the parse route's priority, an hour's call's spots, a recording of 1,500 segments, a worker killed at its timeout, a hostile archive's cap, an update while the worker is busy, a write's wait for its vault. gate os's selection keeps every test marked perf wherever it lives, so the budgets in files that otherwise run on Linux alone per PR hold on Windows and macOS too. Those that build a big vault to time it carry the nightly marker, with the untimed tests that build their vaults (DR-0492): the index's 100,000 chunks, the ledger's 5,000 items, the curate miner, recall on 50 MB of raw, the scan of 5,000 files, the day pages, the service's search, the ledger's import and calendar catch-up at size, a week's hundred events, a report among hundreds of entities. That is seven files whole and one test each in four others: 28 timed tests and 9 untimed ones. gate os and gate full leave the marker out unless --all, which the nightly passes, so they run nightly, on the full-matrix label and on a release tag, on all three systems. The two browser budgets on the perf ledger carry it too, which keeps them out of gate os's selection; the browser jobs run them by file as before, Browser (Linux) on every PR and the nightly's Browser jobs on Windows and macOS. A PR that changes the index, the ledger, search or the scan takes the label. On this PC the timed run took 3.7 of the suite's 9.8 minutes, and their vaults about 400 worker-seconds of the parallel run; under coverage, where the limits are off, they were pure cost. No line runs only in the tests that move: on this PC the covered run with and without them ran the same 44,265 of 44,527 statements, and on Linux CI's covered shares without them hold docket at 100% and devkit's floor. DR-0430's marker, its run alone and its limits stand."
    binds:
      - A timed test that builds a big vault to time it runs nightly, on the full-matrix label and on a release tag; a PR that changes the index, the ledger, search or the scan takes the label.
      - Such a test, and each untimed test that builds its vault, carries the nightly marker, which gate os and gate full leave out unless --all; no line runs only in a test marked nightly.
      - Every other timed test is in gate os's selection, whatever file holds it.
    not_chosen:
      - "The big budgets on Linux only, on every PR: an uncovered Linux run of their own, about 4 runner-minutes a PR."
      - "Dropping the big budgets: the index's and the ledger's speed at size would go unwatched."
      - "The marker on the timed tests alone: every PR's parallel run would still build their vaults, about 400 worker-seconds on this PC."
