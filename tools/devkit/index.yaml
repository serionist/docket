# What binds `tools/devkit`: reading list, decisions, conventions. Entries change only through `uv run docs`;
# docs/docs-regime.md explains the schema.

reading:
  - { path: tools/devkit/src/devkit/gate.py, role: contract, note: "the gate's steps and lanes: what passes here is the merge rule" }
decisions:
  - id: DR-0222
    title: The content step folds each file once and runs a name's pattern only where its first word is
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#43"]
    description: The deny-list scan folds each file's text once the way re.IGNORECASE folds (the simple lowercase, plus the extra equivalences Python's re adds) and runs a name's regex only on a file holding the name's first word folded the same way. A file the fold passes over is one the regex finds nothing in, so the step reports exactly the hits it reported before, by a test that runs both scans. 273 names over 294 files took 17.9 s; the same scan with the fold took 0.5 s in a trial.
    binds:
      - "The step's hits stay those of one pattern per name: whole words, any case, across line breaks (DR-0008)."
    not_chosen:
      - "One pattern of all the names together: 13 s, since the look-behind still blocks a fast search."
  - id: DR-0223
    title: Every lane runs the whole suite on every system, and runs its other steps beside the tests
    status: superseded
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#43"]
    superseded_by: [DR-0754]
    description: "gate os on Windows and macOS runs every test, as gate full does on Linux: the slowest tests are the git- and process-heavy ones, which are the ones that differ between systems, and test_index_perf's time limit is checked only without coverage, so only in gate os. A lane with tests starts them first and runs its other steps meanwhile (in the full lane lock, ruff, format, types, docs, commits, content, secrets and the harness; in the os lane types), printing each step's line in the usual order. The tests step prints the 15 slowest tests on every run, so each system's are in its CI log."
    binds: [A slow test moves or speeds up; it is never skipped on a system to save time.]
    not_chosen:
      - "Only the modules that differ by system on Windows and macOS: little saved, and what those jobs are for lost."
  - id: DR-0295
    title: Each kind's recall at 10 and MRR on the invented question set has a floor in tools/devkit/eval-floors.json at today's number
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#66"]
    description: tools/devkit/eval-floors.json holds, per kind of question, the recall at 10 and MRR that main measures on the invented set, rounded down to two decimals. The set's test fails on every system when a kind falls below its floor. In the full lane the test writes its numbers to the file DOCKET_EVAL_REPORT names, and the gate prints them; it fails a number above its floor, printing the floor to write, so the change that earns a gain raises the floor in its own diff and no later change gives it back unseen. A floor below the base branch's fails unless its kind's entry carries a lowered note (the issue, and what was traded) that the base's didn't, so a lowered kind is said in the diff and read under REVIEW.md's harness rule. A kind with no floor, or a floor with no kind, fails.
    binds: [A floor is never set above what main measures.]
    not_chosen:
      - "One floor for the whole set: a change that helps paraphrases and hurts names would pass."
      - "A margin under today's numbers: a question lost in a kind of 14 would hide in it."
      - "Printing a gain without failing, as coverage does: a floor left behind lets a later change give the gain back unseen."
      - "Floors beside the test fixtures: tools/devkit is the harness, where a loosened check needs its reason."
