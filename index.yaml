# What binds the repo: reading list, decisions, conventions. Entries change only through `uv run docs`;
# docs/docs-regime.md explains the schema.

reading:
  - { path: AGENTS.md, role: contract, note: "the router: docs, layout, build, the work loop, doors, never" }
  - { path: REVIEW.md, role: contract, note: "what a finding is, and the questions every review answers" }
  - { path: docs/docs-regime.md, role: guide, note: how the entries work and how the tool writes them }
  - { path: docs/plans/README.md, role: guide, note: "when a change needs a plan, and the template" }
  - { path: CONTRIBUTING.md, role: guide, note: a first contribution's short path }
  - { path: docs/design.md, role: design, note: "how the vault, the service and the plugin fit, and the phases" }
decisions:
  - id: DR-0001
    title: Docket is open source under Apache-2.0, public on GitHub from day one
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: ["#1"]
    description: |-
      The code is public at serionist/docket from the first commit, under Apache-2.0, so friends can use it and anyone can read how it handles their data. Each user's data lives in their own private vault, a folder of their own repo or a repo of its own (DR-0102), never here.

      On GitHub Free a public repo also gets the rulesets, CodeQL and the macOS CI minutes that a private one would not.
    binds:
      - No private data and no private names in this repo; the content check enforces the names (DR-0008).
      - Tests and fixtures use invented data.
    not_chosen:
      - "Private until friends get it (phase 5): no enforced rulesets, no CodeQL and scarce CI minutes on GitHub Free."
  - id: DR-0002
    title: "The code is one uv workspace: the app, a package per connector, the plugin and the dev kit"
    status: superseded
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#1"]
    superseded_by: [DR-0101]
    description: |-
      packages/docket holds the app (vault, service, web app, CLI); each connector is its own package under packages/, found through an entry point; plugin/ is the Claude Code plugin, and the repo is its own marketplace (.claude-plugin/marketplace.json); tools/devkit is the development kit, never published.

      The connector seam is real from day one, so the core never grows a dependency on one source.
    binds:
      - The core package never imports a connector package.
      - GPU and large model dependencies are optional extras.
    not_chosen: ["One package with extras, split into core and connectors at phase 5."]
  - id: DR-0003
    title: The development kit lives in this repo until a second repo wants it
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#1"]
    description: The gate, the docs tool, the hooks and the work-loop skills live in tools/devkit and .claude/skills. When another repo wants the Python kit, it is extracted then.
    not_chosen:
      - A separate shared kit repo installed with uv tool, built and versioned before Docket starts.
  - id: DR-0004
    title: Work is tracked as GitHub issues, a milestone per phase, on the Docket board
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#1"]
    description: Every change is an issue with an area label and its phase's milestone, on the public Docket project board (Status, Phase, Size). start-work and finish-work keep the cards current through uv run devkit board.
    not_chosen: ["Issues and milestones only, with no board."]
  - id: DR-0005
    title: Structured docs are YAML entries the docs tool manages; prose stays markdown
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#1"]
    description: Decisions, conventions, terms and reading lists are entries in index.yaml files and docs/glossary.yaml, changed only through uv run docs, which checks every edit and writes one canonical form. A session reads the one entry it needs; a fact lives in one place under an id that never changes.
    binds: [The gate checks every entry file and every DR- and CV- citation.]
    not_chosen:
      - One markdown file per decision.
      - Decisions kept only in plans and the design document.
  - id: DR-0006
    title: One gate is the merge rule, and main takes squash-merged PRs only
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#1"]
    description: uv run gate full on Linux and uv run gate os on Windows and macOS, the PR text workflow (the PR's title and body, run again on every edit) and CodeQL are the required checks of the main ruleset; nothing merges with a red check. main accepts pull requests only, squash-merged, so each PR title becomes one commit.
    binds: [A check is never weakened to let a change pass.]
  - id: DR-0007
    title: Nothing on main carries tool attribution
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#1"]
    description: Commits, PR titles and PR bodies carry no AI co-author trailers, Generated-with lines or session links. The history says what changed and why; who typed it is not part of that.
    binds: [The commit-msg hook strips attribution and the gate refuses it.]
  - id: DR-0008
    title: Private names are checked against a deny list kept outside the repo
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#1"]
    description: "Docket is built from its maintainer's working life, so the names of the people, customers and places in it must not reach this public repo. The list is itself private: ~/.config/docket-dev/denylist.txt locally (not ~/.config/docket, the app's own config folder on Linux), a repository secret in CI. A CI log names a hit by its line number, never by the name."
    binds: [Issue and PR texts are checked with gate check-text before they are posted.]
  - id: DR-0009
    title: Reviews report only real, reproducible problems, and iterate only after a blocker or major
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#1"]
    description: A review is not a bug hunt. A finding states a reproducible scenario that causes an actual failure; without one it is left out. Severities are honest and most findings are minor. A review goes to another round only when its last pass confirmed a blocker or a major.
    binds:
      - REVIEW.md, both lens files and the review skills say so, and the deep workflow returns whether another round is needed.
  - id: DR-0010
    title: Python 3.12 and uv
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#1"]
    description: "The app and the kit run on Python 3.12 or later, managed with uv: one lock file for the workspace, uv sync to install, uv run for every command."
  - id: DR-0011
    title: ruff, pyright strict on src, pytest, uv_build, and coverage floors per module
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#1"]
    description: ruff lints and formats at 120 columns; pyright checks every package and runs strict on each src/ folder; pytest runs the tests with coverage, and each top-level module keeps a floor that only rises. Packages build with uv_build, uv's own backend, so the toolchain is one vendor's.
    not_chosen:
      - "mypy: slower, and pyright is what the editor's language server already runs."
      - "hatchling: a second build tool for no gain."
  - id: DR-0012
    title: Under an autonomy grant, a fix on a sensitive area that only makes a check stricter or data safer goes ahead
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: cheap
    sources: ["#1"]
    description: "The review rules asked for the maintainer's yes before any fix on a sensitive area. Under an autonomy grant that would stop the loop on fixes that only tighten a check or protect data, so those are made and recorded in the PR's Decided without asking. A one-way door may change under the grant too: its PR title names it and its decision is recorded as proposed, and the maintainer approves or changes it when he reviews the decisions (his choice, 15 Oct). A fix that loosens a check still waits for the maintainer."
    not_chosen: ["Every sensitive fix waits for the maintainer, even under an autonomy grant."]
  - id: DR-0013
    title: Every user's data lives in their own private git vault; git is the source of truth
    status: superseded
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: [docs/design.md]
    superseded_by: [DR-0102]
    description: Raw records, processed docs, entities and the ledger are files in a private git repo the user owns, committed after the staging gate. Any number of machines work on it; each machine's index is a cache rebuilt from the repo.
    binds:
      - The index database is never committed; a rebuild from the repo gives the same database, vectors aside.
      - Raw text is in plain git, media in LFS encrypted per file.
    not_chosen:
      - "Committing the database: it can't merge between machines and LFS would keep a copy per commit."
      - "Raw text in LFS: it breaks grep, diffs and partial clones."
  - id: DR-0014
    title: Raw records are JSONL, one file per source per sync run per machine, written once
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: [docs/design.md]
    description: "A sync run writes one JSONL file for each source it read and never touches it again; a second run in the same minute gets its own name. Two machines never write the same file, so merges are trivial, and a changed raw file is something a check can see. The one exception is forgetting: docket forget rewrites the file's whole history without the record (git filter-repo), from any machine, and force-pushes."
    not_chosen: [One file per source appended forever., SQLite as the store.]
  - id: DR-0015
    title: Everything reaches the raw log through a staging gate
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: [docs/design.md]
    description: New records land in staging, on the local disk and never committed. The gate applies the never-store lists, the source rules, classification for sources that can be private, cuts and redaction; only then is a record written to the raw log.
    binds: ["A private recording never reaches git, not even in history."]
  - id: DR-0016
    title: The web app is FastAPI with server-rendered HTML and HTMX, with no front-end build
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: [docs/design.md]
    description: "One Python service renders the pages with Jinja templates and uses HTMX for interaction, so a friend installs one package and nothing needs Node. It still has a real structure: routes, templates as components, a small design system, tests over HTTP."
    not_chosen:
      - A single-page app (React or Svelte) with its own build, shipped inside the wheel.
  - id: DR-0017
    title: Search is SQLite FTS5 over three columns, plus vectors and a reranker where a model is available
    status: superseded
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: [docs/design.md]
    superseded_by: [DR-0114]
    description: Each chunk is indexed accent-folded, Hungarian-stemmed and English-stemmed, so names, Hungarian suffixes and loanwords all match. Embeddings and a reranker add recall when a model is available, local or through an API; without one, keyword search works alone.
    binds: [Every model feature is optional.]
  - id: DR-0018
    title: Claude reaches Docket through an MCP endpoint on the local service and a Claude Code plugin
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: [docs/design.md]
    description: The service serves MCP over HTTP on localhost; the plugin configures it and brings the skills and hooks. Headless Claude inside the service, from phase 3, runs only on the user's own API credentials (Anthropic, Bedrock, Vertex or Foundry), never on a claude.ai login.
    binds: [The MCP tools' names and parameters are a one-way door once they land.]
  - id: DR-0100
    title: Sources are harvested by Claude through plugin skills; the core keeps a profile per source
    status: superseded
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#28"]
    superseded_by: [DR-0108]
    description: |-
      Each source (Plaud, Slack, mail, chat, calendar) is a skill in the Claude Code plugin that uses the user's own MCPs and plugins to read it, and hands what it read to the service's MCP write tools: raw records, audio, transcripts, summaries, docs, tasks. A small profile per source in the core fixes what can't be left to a prompt's wording: the record ids, what counts as a new version, the transcript segments. A plugin hook captures the source tools' output verbatim, so a long transcript never passes through Claude's output.

      It needs no tokens or apps per source (Slack has no personal tokens; work mail is reachable only in the browser), and adding a source is a skill plus a profile.
    binds:
      - A source's ids, projection and segment reader live in the core, never in a skill.
      - "A Python connector is written only where a skill can't harvest: scheduled or headless runs."
      - media_put and the service's fetch take a local path only under a folder vault.yaml names (a downloads folder) or the plugin's own drop folder, and a URL only over https to a host the source's profile lists; private, loopback and link-local addresses are refused, at most a few redirects are followed and each is checked again, and a file over the size cap is refused.
    not_chosen:
      - Python connector packages for every source, with their own fetching, tokens and cursors.
      - "Skills only, with Claude mapping every payload: ids and versions would follow a prompt's wording."
  - id: DR-0101
    title: "The code is one uv workspace: the app, the plugin and the dev kit"
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#28"]
    supersedes: [DR-0002]
    description: packages/docket holds the app (vault, service, web app, CLI, the source contract); plugin/ is the Claude Code plugin, and the repo is its own marketplace; examples/ holds the reference sources (Plaud under examples/sources/plaud), tested in CI and never a dependency; tools/devkit is the development kit, never published. A connector package under packages/ appears only for a source a skill can't harvest (DR-0108).
    binds: [GPU and large model dependencies are optional extras.]
  - id: DR-0102
    title: A user's data lives in a folder of their own repo by default, or in a repo of its own
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: ["#28"]
    supersedes: [DR-0013]
    description: By default the vault is a folder inside the repo the user already works in (the consuming repo), committed into that repo's history, with Docket's commits limited to the vault's own paths. The setup wizard also offers a repo of its own, nested in the working folder or anywhere, for those who want a separate history or remote. Either way git is the source of truth, the data stays private, and each machine's index is a cache rebuilt from what's committed.
    binds:
      - Docket commits only the vault's paths, never what the user staged.
      - In folder mode Docket only makes local commits of the vault's paths and never fetches, rebases, pushes or rewrites the host repo; the user's own git flow moves it, and docket sync says so and does nothing else.
      - Forget in folder mode deletes the media keys, so the audio is gone for real, removes the record from the current tree and writes a tombstone so rebuilds skip it; it says plainly that the text stays in the host repo's history and shows the rewrite command for the user to run.
      - History rewriting (DR-0014) and Docket's own fetch, rebase and push (DR-0022) are for a repo of its own only.
      - "Setup checks the host repo's remotes: it refuses folder mode when a remote is public (where the host can be asked), warns when the repo looks shared (other committers), and offers a repo of its own instead."
      - The index database is never committed; a rebuild gives the same database, vectors aside.
      - Raw text is in plain git, media in LFS encrypted per file, in both modes; in folder mode init writes the LFS attributes for the vault's media path into the host repo's .gitattributes and checks that git-lfs is installed.
    not_chosen:
      - Always a repo of its own (two repos to manage for every user).
      - Always a folder of the consuming repo (no separate history or remote for those who want one).
  - id: DR-0103
    title: The plugin's setup asks what the user wants to set up
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#28"]
    description: A setup skill in the plugin looks at the MCPs and plugins the user already has, asks which sources to set up, where the data should live and which languages they work in, and runs the init with the answers. The command-line wizard stays for scripts.
    binds:
      - Setup scaffolds each source the user chooses with docket source new, in the consuming repo.
  - id: DR-0104
    title: The app transcribes; skills translate, reconcile and summarize
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: cheap
    sources: ["#28"]
    description: Speech recognition is compute that is the same for every user and needs a local model (Whisper, optional, a worker behind an MCP tool such as transcribe), so the app does it. Translating, reconciling two transcripts in context and writing summaries are judgement, so they are skills Claude runs, with the app's search, aliases and transcripts as tools.
    not_chosen:
      - "Transcription in the consuming repo's skills: a skill can't run a GPU model by itself."
  - id: DR-0105
    title: Meetings come from the calendar, keyed by the event's own id
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#28"]
    description: The core turns the calendar's records into the ledger's meeting ops, keyed by the event's own id (its iCalUId, or the provider's id where there is none). A meeting that moves, is renamed or is cancelled updates the same meeting, so its prep, points and outcomes stay with it. Recordings and chats still link to meetings by time.
    binds:
      - A meeting's key is its calendar event's id, plus the occurrence's original start when the event recurs (RECURRENCE-ID or originalStartTime); never its start time plus subject.
      - A moved, renamed or cancelled event or occurrence updates the meeting it made, never a new one; cancelling one occurrence cancels only that meeting.
      - Recordings and chats link to meetings by time.
    not_chosen:
      - "Matching meetings on start time plus subject: a moved or renamed meeting would split in two."
  - id: DR-0106
    title: Each stream's status file is rendered from the ledger
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: ["#28"]
    description: Streams live in the ledger. Docket renders a status file per stream into the consuming repo, at a path set per stream in vault.yaml (optional), with frontmatter where, next, deadline and updated. It works the way the people directory and the glossary are rendered from the entities after import, so the ledger stays the one place a stream's state is kept.
    binds:
      - A stream's state is kept in the ledger; its status file is output, rendered only where vault.yaml sets a path for it.
      - A hand edit to a rendered file is reported, not merged.
      - Docket writes the file but commits only the vault's paths (DR-0102), so a status file outside the vault is committed by the user's own git flow.
      - Docket renders only into a repo that passes setup's public-remote check (DR-0102), and asks before the first render; the same holds for the people directory and glossary renders.
  - id: DR-0107
    title: Personal source notes live in the vault; the plugin's source skills stay generic
    status: superseded
    at: "2026-10-14"
    by: Soma Osvay
    cost: one-way
    sources: ["#28"]
    superseded_by: [DR-0108]
    description: "Each source skill reads sources/<source>.md in the vault before it harvests: the user's own route, quirks and gotchas for that source. It appends what it learned there. The plugin's skills stay generic and public, and what is particular to one user stays private with their data."
    binds:
      - A source skill reads sources/<source>.md first and appends what it learned.
      - Nothing particular to one user goes into the plugin's skills.
      - sources/ is part of the vault's layout (DR-0019), in plain git.
  - id: DR-0108
    title: Source skills and mappers live in the consuming project; the core keeps the contract
    status: decided
    at: "2026-10-14"
    by: Soma Osvay
    cost: medium
    sources: ["#35"]
    supersedes: [DR-0100, DR-0107]
    description: |-
      Each source's skill (which tool reads it and how), its mapper (code that turns a run's captures into normalized records) and the route's quirks live in the consuming project, under .claude/skills/sources/<source>/. Docket keeps the contract: the record shapes, the rid rules, the versions, the ingest checks, holds and the gate, the capture hook and the run manifest, the scaffold (docket source new), and Plaud as a reference source.

      Routes are personal: one user reads mail through a browser because of an access policy, another through an API. The know-how already lives in the projects that use it, and a vendor's change lands on the people who use that vendor. The core computes the versions and checks every rid, so a skill kept elsewhere can't break ids or privacy.
    binds:
      - A source's skill, its mapper and its tests live in the consuming project, under .claude/skills/sources/<source>/ (SKILL.md, mapper.py, tests/); Docket's plugin ships none of them.
      - The route's quirks are learned run by run and kept in the skill's own files.
      - "A mapper is code, never a prompt: it turns a run's captures into records in the core's shape."
      - "A transcript record carries its utterances in a segments field, in the core's shape: a list of start_ms, end_ms, speaker and text."
      - The index, the gate's cuts, verify and rebuilds read the segments field, never native.
      - "A record with a cut keeps no native: the core drops it and marks the record fidelity: cut, because native would still hold the cut stretch."
      - A rid is <source>:<native id>, and the core checks every rid a mapper returns.
      - The core computes every version from the normalized fields, never a mapper.
      - Every record a mapper returns goes through the core's ingest checks, holds and the staging gate.
      - The service runs a source's mapper in a separate process, loaded from the path vault.yaml names for that source; the CLI import uses the same mapper.
      - A mapper's path is relative to the consuming repo's root and must resolve, after symlinks, under .claude/skills/sources/<source>/; any other path is refused.
      - A mapper's process has a time limit and an output cap. A timeout fails the run, and its captures are dropped and fetched again, as for a run that never closes.
      - The service runs only the consuming repo's mappers, never code from the vault, a downloads folder or a drop folder.
      - The plugin's PostToolUse hook posts a source tool's output to the service verbatim, and Claude sends only the run manifest.
      - The hook posts only while a run the skill opened is open, and only for the tools vault.yaml lists for that source; each capture is tagged with its run, and nothing outside an open run is posted.
      - docket source new scaffolds a source's skill, mapper and tests in the consuming repo.
      - Plaud is the reference source, under examples/sources/plaud and tested in CI; it is an example, not a dependency.
      - media_put and the service's fetch take a local path only under a folder vault.yaml names (a downloads folder) or the plugin's own drop folder, and a URL only over https to a host vault.yaml lists for that source; private, loopback and link-local addresses are refused, at most a few redirects are followed and each is checked again, and a file over the size cap is refused.
      - "A Python connector is written only where a skill can't harvest: scheduled or headless runs."
    not_chosen:
      - "Per-source skills shipped in Docket's plugin: vendor churn would land in the core's releases, and routes are personal."
      - "Skills only, with Claude mapping payloads: ids would follow a prompt's wording."
      - "A core profile per source (DR-0100): each new source and each vendor change would wait for a Docket release."
  - id: DR-0114
    title: Search is SQLite FTS5 over the text as written and a stemmed column per owner language, plus vectors and a reranker where a model is available
    status: proposed
    at: "2026-10-14"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#7"]
    supersedes: [DR-0017]
    description: "Each chunk is indexed as written (case and accents folded by FTS5's unicode61 remove_diacritics 2) and stemmed with Snowball once per language in vault.yaml's owner.languages: English always, the rest in code order. A language's hook adds the word forms its stemmer needs (Hungarian: the stem of the word's dative, and for a query word the stem of its stem when the index holds that stem as a word, more often than the second cut) and says whether aliases match on its stems; its time words come from a table of its own. Languages written without spaces between words wait for a trigram column. Embeddings and a reranker add recall when a model is available, local or through an API; without one, keyword search works alone."
    binds: [Every model feature is optional., Adding or removing a language rebuilds the index.]
    not_chosen:
      - "Three fixed columns (as written, Hungarian, English): a German user would get Hungarian stems."
  - id: DR-0168
    title: A source's SKILL.md is read by path, not loaded by Claude Code as a skill
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#12"]
    description: "Claude Code (2.1.300) doesn't load a SKILL.md at .claude/skills/sources/<source>/ as a skill: a probe repo with one there and one at .claude/skills/<name>/ listed only the second. The layout DR-0108 and DR-0123 fixed stays, and whatever runs a source (#41's run, then sync) reads its SKILL.md by path, the list of sources coming from vault.yaml. The file keeps its frontmatter, so a later move to the top level is a rename. #41 decides for good before any live run."
    not_chosen:
      - "Source skills at the top level (.claude/skills/source-<name>/): supersedes DR-0108's and DR-0123's path rule and the merged runner, and source names would meet the user's own skill names."
  - id: DR-0251
    title: A source's skill is reached through run_open, and holds only the source's own calls
    status: proposed
    at: "2026-10-15"
    by: Claude (autonomy grant)
    cost: medium
    sources: ["#41"]
    description: "Settles DR-0168 for live runs. A source's skill stays at .claude/skills/sources/<source>/SKILL.md in the consuming repo of the service's vault, read by path. run_open answers with that path and with the run's steps, the same for every source (DR-0252); the MCP server's instructions say to sync a source by calling run_open with its name. A SKILL.md holds only what is the source's own: signing in, listing, fetching one item whole and by its id, what a missing item looks like, page sizes, rate limits, a backfill. The reference and the template carry the marker line <!-- docket: steps from run_open -->, and run_open refuses a SKILL.md without it before any work: copy the reference's SKILL.md and mapper.py over yours, or for a source with no reference the blank template's run sections. The plugin's sync skill comes with the ledger (phase 3) and takes the same route."
    not_chosen:
      - "/docket:sync now: a skill name is a door, and sync's job includes the ledger."
      - "Source skills at the top level of .claude/skills/: DR-0168's reasons stand."
      - "The run's steps in every SKILL.md: each copy goes stale, and docket source new never writes over one."
      - "A note for a SKILL.md without the marker, the run going on: an old copy pages at limit 500, which the hook refuses as too large, so long meetings ride retry until they expire."
conventions:
  - id: CV-0001
    rule: Python code passes ruff's lint rules and its formatter, at 120 columns
    area: python
    enforced_by: "gate: ruff, format"
  - id: CV-0002
    rule: Code under a src/ folder type-checks under pyright strict
    area: python
